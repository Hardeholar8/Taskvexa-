<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa — Payment Verification</title><style>body{margin:0;background:#070b12;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(520px,calc(100% - 30px));background:#101925;border:1px solid #29384b;border-radius:16px;padding:28px;text-align:center}.icon{font-size:42px}.muted{color:#8997aa;line-height:1.7;font-size:13px}a{display:inline-block;margin-top:15px;padding:11px 16px;border-radius:10px;background:#f5f7fb;color:#080d14;text-decoration:none;font-weight:800}</style><link rel="stylesheet" href="/filora-theme.css?v=1">
<script src="/theme.js?v=9"></script>
</head><body><div class="box"><div class="icon" id="icon">⏳</div><h2 id="title">Verifying payment…</h2><p id="msg" class="muted">Please wait while TaskVexa confirms your payment and updates your promoter wallet.</p><a id="back" href="promoter-dashboard.html" style="display:none">Return to Promoter Dashboard</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const sleep=m=>new Promise(r=>setTimeout(r,m));(async()=>{try{const q=new URLSearchParams(location.search),tx=q.get('transaction_id'),ref=q.get('tx_ref'),status=q.get('status');if(status==='cancelled')throw new Error('Payment was cancelled.');if(!tx&&!ref)throw new Error('Payment reference was not returned.');const a=await sb.auth.getUser();if(a.error||!a.data.user)throw new Error('Please sign in to your promoter account again.');let v=null,last='Payment verification failed.';for(let i=0;i<4;i++){const r=await fetch('/api/flutterwave/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transaction_id:tx||undefined,tx_ref:ref||undefined,purpose:'promoter_wallet_funding'})});v=await r.json().catch(()=>({}));if(r.ok&&v.verified)break;last=v.error||last;if(i<3)await sleep(2500)}if(!v?.verified)throw new Error(last);if(v.user_id!==a.data.user.id)throw new Error('Payment account mismatch.');const c=await sb.rpc('complete_promoter_payment',{p_promoter_id:a.data.user.id,p_amount:Number(v.amount),p_reference:String(v.tx_ref||ref||''),p_purpose:'promoter_wallet_funding'});if(c.error)throw c.error;if(!c.data?.success)throw new Error(c.data?.message||'Wallet credit failed.');$('icon').textContent='✓';$('title').textContent=c.data.already_processed?'Payment Already Applied':'Payment Confirmed';$('msg').textContent='Wallet updated successfully. Current balance: ₦'+Number(c.data.balance||0).toLocaleString('en-NG');$('back').style.display='inline-block';}catch(e){console.error(e);$('icon').textContent='!';$('title').textContent='Payment Verification Failed';$('msg').textContent=e.message||'Unable to verify payment.';$('back').style.display='inline-block'}})();function $(id){return document.getElementById(id)}</script></body></html>

<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TaskVexa - Available Tasks</title><link rel="stylesheet" href="style.css"><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: #f8fafc;
  font-family: Arial, sans-serif;
}

header {
  background: #0d111b;
  border-bottom: 1px solid #202b3b;
  padding: 17px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;

}

}

header a {
  color: #cbd5e1;

}

main {

}

.page-header {

.back-link {

.page-header h2 {

}

.page-header p {
  margin: 0;

  line-height: 1.5;
}

/* LOADING */

.loading-box {
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 18px;
  padding: 28px 20px;
  text-align: center;
  color: #94a3b8;
}

.loader {
  width: 28px;
  height: 28px;
  border: 3px solid #273244;
  border-top-color: #f8fafc;
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 13px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* TASK CARD */

.task-card {
  background: linear-gradient(145deg, #121925, #0d121c);
  border: 1px solid #202b3b;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 12px 30px rgba(0,0,0,.22);
}

.task-card h3 {
  margin: 0 0 9px;
  font-size: 19px;
}

.task-description {
  color: #94a3b8;
  font-size: 14px;
  line-height: 1.55;
  margin-bottom: 17px;
}

.task-info {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 17px;
}

.info-box {
  flex: 1;
  min-width: 120px;
  background: #0a0f18;
  border: 1px solid #202b3b;
  border-radius: 13px;
  padding: 11px;
}

.info-label {
  color: #64748b;
  font-size: 11px;
  margin-bottom: 5px;
}

.info-value {
  color: #f8fafc;
  font-size: 14px;
  font-weight: 700;
}

.reward-value {
  font-size: 16px;
}

/* STATUS */

.submission-status {
  border-radius: 12px;
  padding: 11px 12px;
  margin-bottom: 14px;
  font-size: 13px;
  font-weight: 700;
}

.pending-status {
  background: #302815;
  color: #facc15;
  border: 1px solid #51431d;
}

.rejected-status {
  background: #30191d;
  color: #f87171;
  border: 1px solid #51252b;
}

/* BUTTON */

.task-button {
  width: 100%;
  display: block;
  text-align: center;
  padding: 13px;
  border: none;
  border-radius: 12px;
  background: #f8fafc;
  color: #080b12;
  text-decoration: none;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}

.task-button:hover {
  opacity: .9;
}

.task-button.secondary {
  background: #182131;
  color: #f8fafc;
  border: 1px solid #2a3648;
}

/* DETAILS */

.details-card {
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
}

.details-card h2 {
  margin-top: 0;
  font-size: 23px;
}

.detail-description {
  color: #cbd5e1;
  line-height: 1.65;
  font-size: 14px;
  white-space: pre-wrap;
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 18px 0;
}

.detail-box {
  background: #0a0f18;
  border: 1px solid #202b3b;
  border-radius: 13px;
  padding: 13px;
}

.detail-box small {
  display: block;
  color: #64748b;
  font-size: 11px;
  margin-bottom: 6px;
}

.detail-box strong {
  font-size: 15px;
}

/* PROOF */

.proof-section {
  margin-top: 22px;
  padding-top: 20px;
  border-top: 1px solid #202b3b;
}

.proof-section h3 {
  margin: 0 0 7px;
}

.proof-section p {
  color: #64748b;
  font-size: 13px;
  line-height: 1.5;
}

.file-box {
  margin: 15px 0;
  padding: 14px;
  border: 1px dashed #344258;
  border-radius: 13px;
  background: #0a0f18;
}

input[type="file"] {
  width: 100%;
  color: #cbd5e1;
  font-size: 13px;
}

#proofMessage {
  margin-top: 13px;
  font-size: 13px;
  line-height: 1.5;
}

.success {
  color: #4ade80;
}

.error {
  color: #f87171;
}

.warning {
  color: #facc15;
}

/* EMPTY */

.empty-box {
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 18px;
  padding: 30px 20px;
  text-align: center;
}

.empty-icon {
  font-size: 30px;
  margin-bottom: 10px;
}

.empty-box h3 {
  margin: 0 0 7px;
}

.empty-box p {
  margin: 0;
  color: #64748b;
  font-size: 13px;
  line-height: 1.5;
}

/* ERROR */

.error-box {
  background: #241419;
  border: 1px solid #51252b;
  color: #f87171;
  border-radius: 15px;
  padding: 16px;
  font-size: 13px;
  line-height: 1.5;
}

/* MOBILE */

@media (max-width: 480px) {

  main {
    padding-left: 13px;
    padding-right: 13px;
  }

  .page-header h2 {
    font-size: 25px;
  }

  .detail-grid {
    grid-template-columns: 1fr;
  }

}

  </section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   ELEMENTS
========================= */

const taskList =
  document.getElementById("taskList");

const message =
  document.getElementById("message");

const taskListSection =
  document.getElementById(
    "taskListSection"
  );

const taskDetailsSection =
  document.getElementById(
    "taskDetailsSection"
  );

const backButton =
  document.getElementById(
    "backButton"
  );

const submitProofButton =
  document.getElementById(
    "submitProofButton"
  );

const proofMessage =
  document.getElementById(
    "proofMessage"
  );


let currentUser = null;
let selectedTask = null;
let selectedSubmissionStatus = null;


/* =========================
   MONEY
========================= */

function formatMoney(amount) {

  return Number(
    amount || 0
  ).toLocaleString(
    "en-NG",
    {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    }
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   GET LOGGED USER
========================= */

async function getCurrentUser() {

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();


  if (error) {

    throw new Error(
      "Unable to verify your login: " +
      error.message
    );

  }


  if (
    !data ||
    !data.user
  ) {

    window.location.href =
      "login.html";

    return null;

  }


  return data.user;

}


/* =========================
   CHECK WORKER ROLE
========================= */

async function checkWorker() {

  const user =
    await getCurrentUser();


  if (!user) {
    return null;
  }


  const {
    data: profile,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select("role")
    .eq(
      "id",
      user.id
    )
    .maybeSingle();


  if (error) {

    throw new Error(
      "Could not load your profile: " +
      error.message
    );

  }


  if (!profile) {

    throw new Error(
      "Your profile could not be found."
    );

  }


  const role =
    String(
      profile.role || ""
    ).toLowerCase();


  if (
    role === "promoter"
  ) {

    window.location.href =
      "promoter-dashboard.html";

    return null;

  }


  if (
    role === "admin"
  ) {

    window.location.href =
      "admin.html";

    return null;

  }


  if (
    role !== "worker"
  ) {

    throw new Error(
      "Worker account required."
    );

  }


  return user;

}


/* =========================
   LOAD TASKS
========================= */

async function loadTasks() {

  message.innerHTML = `

    <div class="loader"></div>

    Loading tasks...

  `;


  try {

    const user =
      await checkWorker();


    if (!user) {
      return;
    }


    currentUser =
      user;


    /*
      Load active tasks.

      IMPORTANT:
      We only select the columns
      needed by the worker page.
    */

    const {
      data: tasks,
      error: taskError
    } =
    await supabaseClient
      .from("tasks")
      .select(`
        id,
        title,
        description,
        platform,
        reward,
        task_url,
        status,
        created_at
      `)
      .eq(
        "status",
        "active"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (taskError) {

      throw new Error(
        "Could not load tasks: " +
        taskError.message
      );

    }


    /*
      Load this worker's
      submissions.
    */

    const {
      data: submissions,
      error: submissionError
    } =
    await supabaseClient
      .from("task_submissions")
      .select(`
        id,
        task_id,
        status,
        created_at
      `)
      .eq(
        "worker_id",
        user.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (submissionError) {

      throw new Error(
        "Could not load your submissions: " +
        submissionError.message
      );

    }


    /*
      Latest submission per task.
    */

    const submissionMap = {};


    (
      submissions || []
    ).forEach(
      submission => {

        if (
          !submissionMap[
            submission.task_id
          ]
        ) {

          submissionMap[
            submission.task_id
          ] =
            String(
              submission.status || ""
            ).toLowerCase();

        }

      }
    );


    taskList.innerHTML =
      "";


    /*
      Approved tasks disappear.

      Pending stays visible.

      Rejected stays visible.
    */

    const visibleTasks =
      (
        tasks || []
      ).filter(
        task => {

          return (
            submissionMap[
              task.id
            ] !== "approved"
          );

        }
      );


    if (
      visibleTasks.length === 0
    ) {

      message.innerHTML = `

        <div class="empty-box">

          <div class="empty-icon">
            ✓
          </div>

          <h3>
            No tasks available
          </h3>

          <p>
            There are no available tasks for you right now.
          </p>

        </div>

      `;

      return;

    }


    message.innerHTML =
      "";


    /*
      CREATE TASK CARDS
    */

    visibleTasks.forEach(
      task => {

        const submissionStatus =
          submissionMap[
            task.id
          ] || null;


        const card =
          document.createElement(
            "section"
          );


        card.className =
          "task-card";


        let statusHTML =
          "";


        if (
          submissionStatus ===
          "pending"
        ) {

          statusHTML = `

            <div class="submission-status pending-status">

              ⏳ Proof submitted — Pending Review

            </div>

          `;

        }


        if (
          submissionStatus ===
          "rejected"
        ) {

          statusHTML = `

            <div class="submission-status rejected-status">

              ❌ Proof rejected — You can submit again

            </div>

          `;

        }


        card.innerHTML = `

          <h3>
            ${escapeHTML(
              task.title
            )}
          </h3>

          <div class="task-description">

            ${escapeHTML(
              task.description ||
              "Complete the task according to the instructions."
            )}

          </div>


          <div class="task-info">

            <div class="info-box">

              <div class="info-label">
                Platform
              </div>

              <div class="info-value">
                ${escapeHTML(
                  task.platform ||
                  "Not specified"
                )}
              </div>

            </div>


            <div class="info-box">

              <div class="info-label">
                Reward
              </div>

              <div class="info-value reward-value">
                ₦${formatMoney(
                  task.reward
                )}
              </div>

            </div>

          </div>


          ${statusHTML}


          <button
            class="task-button view-task-button"
          >
            View Task
          </button>

        `;


        const viewButton =
          card.querySelector(
            ".view-task-button"
          );


        viewButton.addEventListener(
          "click",
          () => {

            showTaskDetails(
              task,
              submissionStatus
            );

          }
        );


        taskList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      "TASK LOADING ERROR:",
      error
    );


    message.innerHTML = `

      <div class="error-box">

        <strong>
          Unable to load tasks
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

        <br><br>

        <button
          id="retryButton"
          class="task-button"
        >
          Try Again
        </button>

      </div>

    `;


    const retryButton =
      document.getElementById(
        "retryButton"
      );


    if (retryButton) {

      retryButton.addEventListener(
        "click",
        loadTasks
      );

    }

  }

}


/* =========================
   SHOW TASK DETAILS
========================= */

function showTaskDetails(
  task,
  submissionStatus
) {

  selectedTask =
    task;

  selectedSubmissionStatus =
    submissionStatus || null;


  document.getElementById(
    "detailTitle"
  ).textContent =
    task.title || "Task";


  document.getElementById(
    "detailPlatform"
  ).textContent =
    task.platform ||
    "Not specified";


  document.getElementById(
    "detailReward"
  ).textContent =
    formatMoney(
      task.reward
    );


  document.getElementById(
    "detailDescription"
  ).textContent =
    task.description ||
    "Follow the task instructions carefully.";


  const taskButton =
    document.getElementById(
      "openTaskButton"
    );


  if (
    task.task_url
  ) {

    taskButton.href =
      task.task_url;

    taskButton.style.display =
      "block";

  } else {

    taskButton.href =
      "#";

    taskButton.style.display =
      "none";

  }


  document.getElementById(
    "proofFile"
  ).value =
    "";


  proofMessage.textContent =
    "";

  proofMessage.className =
    "";


  /*
    PENDING
  */

  if (
    submissionStatus ===
    "pending"
  ) {

    proofMessage.textContent =
      "Your proof is currently pending admin review.";

    proofMessage.className =
      "warning";

    submitProofButton.disabled =
      true;

    submitProofButton.textContent =
      "Pending Review";

  }


  /*
    REJECTED
  */

  else if (
    submissionStatus ===
    "rejected"
  ) {

    proofMessage.textContent =
      "Your previous proof was rejected. Upload a new screenshot to try again.";

    proofMessage.className =
      "error";

    submitProofButton.disabled =
      false;

    submitProofButton.textContent =
      "Submit New Proof";

  }


  /*
    NEW
  */

  else {

    submitProofButton.disabled =
      false;

    submitProofButton.textContent =
      "Submit Proof";

  }


  taskListSection.style.display =
    "none";

  taskDetailsSection.style.display =
    "block";


  window.scrollTo(
    0,
    0
  );

}


/* =========================
   BACK
========================= */

backButton.addEventListener(
  "click",
  function(event) {

    event.preventDefault();


    selectedTask =
      null;

    selectedSubmissionStatus =
      null;


    taskDetailsSection.style.display =
      "none";

    taskListSection.style.display =
      "block";


    proofMessage.textContent =
      "";


    loadTasks();

  }
);


/* =========================
   SUBMIT PROOF
========================= */

submitProofButton.addEventListener(
  "click",
  async function() {

    if (!selectedTask) {

      proofMessage.textContent =
        "Please select a task first.";

      proofMessage.className =
        "error";

      return;

    }


    const file =
      document.getElementById(
        "proofFile"
      ).files[0];


    if (!file) {

      proofMessage.textContent =
        "Please upload a screenshot first.";

      proofMessage.className =
        "error";

      return;

    }


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      proofMessage.textContent =
        "Please upload an image screenshot.";

      proofMessage.className =
        "error";

      return;

    }


    try {

      submitProofButton.disabled =
        true;

      submitProofButton.textContent =
        "Submitting...";


      const user =
        await getCurrentUser();


      if (!user) {
        return;
      }


      /*
        Check latest submission.
      */

      const {
        data: existingSubmissions,
        error: existingError
      } =
      await supabaseClient
        .from("task_submissions")
        .select(
          "id, status, created_at"
        )
        .eq(
          "task_id",
          selectedTask.id
        )
        .eq(
          "worker_id",
          user.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (existingError) {

        throw new Error(
          "Could not check your previous submission: " +
          existingError.message
        );

      }


      const lat

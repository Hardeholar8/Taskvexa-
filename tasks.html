<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TaskVexa - Available Tasks</title><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #1d293d}.back,.logout{padding:9px 12px;border-radius:10px;background:#111a2b;color:#fff;border:1px solid #293548;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:26px 15px 90px}.hero h1{margin:0 0 7px}.hero p{color:#94a3b8}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.task,.empty{background:#0d1422;border:1px solid #1d293d;border-radius:18px;padding:19px}.desc{color:#a4b0c0;font-size:13px;line-height:1.6;margin:10px 0}.meta{margin:12px 0;color:#86efac}.button{padding:11px 14px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.open{background:#fff;color:#090d14}.submit{background:#7c3aed;color:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:#090f1c;border-top:1px solid #1d293d;display:flex;justify-content:space-around;align-items:center}.bottom a{color:#94a3b8;text-decoration:none;font-size:10px;text-align:center}.bottom b{display:block;font-size:19px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center}.modal.show{display:flex}.box{background:#0d1422;padding:20px;border-radius:18px;width:min(480px,90%)}input,textarea{width:100%;box-sizing:border-box;padding:11px;margin:8px 0;background:#090e18;color:#fff;border:1px solid #293548;border-radius:9px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="back" href="dashboard.html">← Dashboard</a><b>TaskVexa</b><button id="logout" class="logout">Logout</button></header><main class="wrap"><section class="hero"><h1>Available Tasks</h1><p>Complete available tasks and submit your screenshot proof for review.</p></section><div id="message">Loading tasks...</div><section id="taskList" class="grid"><div class="empty">Loading tasks...</div></section></main><div id="modal" class="modal"><div class="box"><h2>Submit Task Proof</h2><input id="file" type="file" accept="image/*"><textarea id="note" placeholder="Optional note"></textarea><button id="cancel" class="button">Cancel</button> <button id="send" class="button submit">Submit Proof</button></div></div><nav class="bottom"><a href="dashboard.html"><b>⌂</b>Home</a><a href="tasks.html"><b>✓</b>Tasks</a><a href="airtime.html"><b>₦</b>Airtime</a><a href="withdraw.html"><b>◉</b>Wallet</a><a href="profile.html"><b>☻</b>Profile</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const $=x=>document.getElementById(x);let user=null,selected=null,taskCache=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function showError(e){console.error(e);$('message').textContent='Unable to load tasks: '+(e?.message||'Unknown error');$('taskList').innerHTML='<div class="empty">Unable to load tasks. Please refresh.</div>'}async function init(){try{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}user=session.user;const {data:p,error:pe}=await sb.from('profiles').select('role,activation_status,activation_level').eq('id',user.id).maybeSingle();if(pe)throw pe;if(String(p?.role||'').toLowerCase()!=='worker')throw new Error('Worker account required.');const active=['active','activated','approved','true'].includes(String(p?.activation_status||'').toLowerCase())||Number(p?.activation_level||0)>0;if(!active){$('message').textContent='Your account must be activated before you can access tasks.';$('taskList').innerHTML='<div class="empty"><h3>Account not activated</h3><p>Please activate your worker account to access tasks.</p><a class="back" href="activation.html">Activate Account</a></div>';return}const {data:subs,error:se}=await sb.from('task_submissions').select('task_id').eq('worker_id',user.id);if(se)throw se;const done=new Set((subs||[]).map(x=>String(x.task_id)));const {data:tasks,error:te}=await sb.from('tasks').select('id,title,description,platform,task_url,reward,status,created_at').eq('status','active').order('created_at',{ascending:false});if(te)throw te;taskCache=(tasks||[]).filter(x=>!done.has(String(x.id)));$('message').textContent=taskCache.length?taskCache.length+' task'+(taskCache.length===1?'':'s')+' available.':'No new tasks are available right now.';$('taskList').innerHTML=taskCache.length?taskCache.map(t=>'<article class="task"><h2>'+esc(t.title)+'</h2><div class="desc">'+esc(t.description||'No instructions provided.')+'</div><div class="meta">Platform: '+esc(t.platform||'Task')+'<br>Reward: ₦'+Number(t.reward||0).toLocaleString('en-NG')+'</div><button class="button open" onclick="openTask(\''+t.id+'\')">Open Task</button> <button class="button submit" onclick="submitTask(\''+t.id+'\')">Submit Proof</button></article>').join(''):'<div class="empty">No new tasks are available right now.</div>'}catch(e){showError(e)}}window.openTask=id=>{const t=taskCache.find(x=>String(x.id)===String(id));if(t?.task_url)location.href=t.task_url;else alert('This task has no link.')};window.submitTask=id=>{selected=taskCache.find(x=>String(x.id)===String(id));$('file').value='';$('note').value='';$('modal').classList.add('show')};$('cancel').onclick=()=>$('modal').classList.remove('show');$('send').onclick=async()=>{const f=$('file').files[0];if(!f||!selected)return;try{$('send').disabled=true;const path=user.id+'/'+selected.id+'-'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await sb.storage.from('task-proofs').upload(path,f,{upsert:false,contentType:f.type});if(up.error)throw up.error;const url=sb.storage.from('task-proofs').getPublicUrl(path).data.publicUrl;const ins=await sb.from('task_submissions').insert({task_id:selected.id,worker_id:user.id,proof_url:url,proof_text:$('note').value.trim(),status:'pending',reward_amount:Number(selected.reward||0)});if(ins.error)throw ins.error;$('modal').classList.remove('show');init()}catch(e){alert(e.message||'Submission failed.')}finally{$('send').disabled=false}};$('logout').onclick=async()=>{await sb.auth.signOut();location.href='login.html'};init();</script></body></html>

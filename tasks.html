<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskVexa - Available Tasks</title><style>
*{box-sizing:border-box}

:root{
  --bg:#070a10;
  --card:#111722;
  --card2:#0d131e;
  --border:#202b3b;
  --text:#f8fafc;
  --muted:#7f8da3;
  --green:#4ade80;
  --red:#f87171;
  --yellow:#facc15;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

header{
  height:70px;
  background:#070a10;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.header-right{
  display:flex;
  gap:8px;
}

.back-button,
.logout{
  padding:9px 13px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

.back-button{
  background:#151d2a;
  color:white;
  border:1px solid #293548;
  text-decoration:none;
}

.logout{
  background:#32191d;
  color:#f87171;
  border:1px solid #5b292f;
}

.content{
  max-width:1100px;
  margin:auto;
  padding:28px 18px 50px;
}

.heading{
  margin-bottom:22px;
}

.heading h1{
  margin:0 0 8px;
  font-size:28px;
}

.heading p{
  margin:0;
  color:var(--muted);
  font-size:14px;
}

.message{
  margin-bottom:18px;
  font-size:13px;
}

.success{color:var(--green)}
.error{color:var(--red)}
.pending{color:var(--yellow)}
.approved{color:var(--green)}
.rejected{color:var(--red)}

.loading,
.empty{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
}

.task-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
}

.task-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:9px;
}

.task-description{
  color:#a4b0c0;
  line-height:1.6;
  white-space:pre-wrap;
  margin-bottom:18px;
}

.task-info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:18px;
}

.info{
  background:var(--card2);
  border:1px solid #1d2838;
  border-radius:11px;
  padding:13px;
}

.info small{
  display:block;
  color:#64748b;
  font-size:10px;
  margin-bottom:6px;
}

.info strong{
  font-size:14px;
  word-break:break-word;
}

.reward{
  color:var(--green);
  font-size:17px;
}

.button{
  min-height:42px;
  padding:10px 16px;
  border:0;
  border-radius:10px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  margin:4px 6px 4px 0;
}

.open-task{
  background:#f8fafc;
  color:#090d14;
}

.submit-proof{
  background:#151d2a;
  color:white;
  border:1px solid #293548;
}

.button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.submission-status{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  background:#0b111b;
  border:1px solid #1f2b3d;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:100;
  padding:20px;
  overflow-y:auto;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.modal-box h2{
  margin:0 0 8px;
}

.modal-description{
  color:var(--muted);
  font-size:13px;
  margin-bottom:18px;
  line-height:1.5;
}

.form-group{
  margin-bottom:16px;
}

label{
  display:block;
  color:#b9c4d3;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
}

input,
textarea{
  width:100%;
  padding:13px;
  background:#090e16;
  border:1px solid #293548;
  border-radius:10px;
  color:white;
  outline:none;
  font-size:14px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.file-note{
  color:#64748b;
  font-size:11px;
  margin-top:7px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.cancel{
  background:#151d2a;
  color:white;
  border:1px solid #293548;
}

.send{
  background:#f8fafc;
  color:#090d14;
}

#submitMessage{
  margin-top:12px;
  font-size:13px;
  font-weight:bold;
}

@media(max-width:700px){

  header{
    padding:0 13px;
  }

  .back-button,
  .logout{
    padding:8px 9px;
    font-size:11px;
  }

  .content{
    padding:22px 13px 40px;
  }

  .heading h1{
    font-size:24px;
  }

  .task-info{
    grid-template-columns:1fr;
  }
}
</style></head><body><header>  <div class="logo">
    TaskVexa
  </div>  <div class="header-right"><a href="worker.html" class="back-button">
  ← Dashboard
</a>

<button id="logoutButton" class="logout">
  Logout
</button>

  </div></header><main class="content">  <div class="heading">
    <h1>Available Tasks</h1>
    <p>Complete tasks and submit your screenshot proof for review.</p>
  </div>  <div id="message" class="message">
    Loading your tasks...
  </div>  <div id="taskList">
    <div class="loading">
      Loading tasks...
    </div>
  </div></main><div id="proofModal" class="modal">  <div class="modal-box"><h2>Submit Task Proof</h2>

<div class="modal-description">
  Complete the task first, then upload a screenshot proving that you completed it.
</div>

<form id="proofForm">

  <div class="form-group">

    <label>Screenshot Proof</label>

    <input
      id="proofFile"
      type="file"
      accept="image/*"
      required
    >

    <div class="file-note">
      Image/screenshot only. Maximum 5MB.
    </div>

  </div>

  <div class="form-group">

    <label>Additional Note (Optional)</label>

    <textarea
      id="proofText"
      placeholder="Add any information for the admin..."
    ></textarea>

  </div>

  <div id="submitMessage"></div>

  <div class="modal-actions">

    <button
      type="button"
      id="cancelProof"
      class="button cancel">
      Cancel
    </button>

    <button
      type="submit"
      id="submitProofButton"
      class="button send">
      Submit Proof
    </button>

  </div>

</form>

  </div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
"https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const message =
document.getElementById("message");

const taskList =
document.getElementById("taskList");

const proofModal =
document.getElementById("proofModal");

const proofForm =
document.getElementById("proofForm");

const proofFile =
document.getElementById("proofFile");

const proofText =
document.getElementById("proofText");

const submitProofButton =
document.getElementById("submitProofButton");

const submitMessage =
document.getElementById("submitMessage");

const cancelProof =
document.getElementById("cancelProof");

const logoutButton =
document.getElementById("logoutButton");


let currentUser = null;
let selectedTask = null;
let submissions = [];


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatMoney(value){

  return "₦" +
    Number(value || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits:0,
        maximumFractionDigits:2
      }
    );

}


function formatDate(value){

  if(!value) return "-";

  const d = new Date(value);

  if(Number.isNaN(d.getTime())) return "-";

  return d.toLocaleString(
    "en-NG",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* GET CURRENT WORKER */

async function getCurrentUser(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();

  if(error) throw error;

  if(!data || !data.user){

    window.location.href="login.html";
    return null;

  }

  currentUser = data.user;

  const {
    data:profile,
    error:profileError
  } =
  await supabaseClient
    .from("profiles")
    .select("role")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(profileError) throw profileError;

  if(
    !profile ||
    String(profile.role).toLowerCase() !== "worker"
  ){

    message.textContent =
      "This page is for worker accounts only.";

    message.className =
      "message error";

    return null;

  }

  return currentUser;

}


/* LOAD MY SUBMISSIONS */

async function loadMySubmissions(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("task_submissions")
    .select(
      "id,task_id,status,reward_amount,created_at"
    )
    .eq(
      "worker_id",
      currentUser.id
    )
    .order(
      "created_at",
      {ascending:false}
    );

  if(error) throw error;

  submissions =
    Array.isArray(data)
      ? data
      : [];

}


/* FIND SUBMISSION */

function getTaskSubmission(taskId){

  return submissions.find(
    item =>
      String(item.task_id) ===
      String(taskId)
  );

}


/* LOAD ACTIVE TASKS */

async function loadTasks(){

  taskList.innerHTML = `
    <div class="loading">
      Loading tasks...
    </div>
  `;

  try{

    const user =
      await getCurrentUser();

    if(!user) return;


    await loadMySubmissions();


    const {
      data,
      error
    } =
    await supabaseClient
      .from("tasks")
      .select(
        "id,title,description,platform,task_url,reward,status,created_at"
      )
      .eq(
        "status",
        "active"
      )
      .order(
        "created_at",
        {ascending:false}
      );


    if(error) throw error;


    renderTasks(
      Array.isArray(data)
        ? data
        : []
    );


    message.textContent =
      "Available tasks loaded.";

    message.className =
      "message success";


  }catch(error){

    console.error(
      "WORKER TASK ERROR:",
      error
    );

    taskList.innerHTML = `
      <div class="empty error">
        Unable to load tasks.<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    message.textContent =
      "Error: " + error.message;

    message.className =
      "message error";

  }

}


/* RENDER TASKS */

function renderTasks(tasks){

  if(!tasks.length){

    taskList.innerHTML = `
      <div class="empty">
        <h3>No active tasks</h3>
        <p>There are currently no tasks available.</p>
      </div>
    `;

    return;

  }


  taskList.innerHTML = "";


  tasks.forEach(task => {

    const submission =
      getTaskSubmission(task.id);

    let alreadySubmitted =
      Boolean(submission);

    let submissionHTML = "";


    if(submission){

      const status =
        String(
          submission.status || "pending"
        ).toLowerCase();


      let statusClass = "pending";
      let statusText = "Pending review";


      if(status === "approved"){

        statusClass = "approved";
        statusText = "Approved";

      }


      if(status === "rejected"){

        statusClass = "rejected";
        statusText = "Rejected";

        alreadySubmitted = false;

      }


      submissionHTML = `
        <div class="submission-status">

          Submission:
          <strong class="${statusClass}">
            ${statusText}
          </strong>

          ${
            status === "approved"
            ?
            `
            <br>
            Reward:
            <strong class="approved">
              ${formatMoney(
                submission.reward_amount
              )}
            </strong>
            `
            :
            ""
          }

        </div>
      `;

    }


    const card =
      document.createElement("section");

    card.className =
      "task-card";


    card.innerHTML = `

      <div class="task-title">
        ${escapeHTML(task.title)}
      </div>

      <div class="task-description">
        ${escapeHTML(task.description)}
      </div>

      <div class="task-info">

        <div class="info">
          <small>Platform</small>
          <strong>
            ${escapeHTML(task.platform || "-")}
          </strong>
        </div>

        <div class="info">
          <small>Task Reward</small>
          <strong class="reward">
            ${formatMoney(task.reward)}
          </strong>
        </div>

      </div>

      <div>

        <button
          class="button open-task"
          data-id="${escapeHTML(task.id)}"
          ${!task.task_url ? "disabled" : ""}
        >
          Open Task
        </button>

        <button
          class="button submit-proof"
          data-id="${escapeHTML(task.id)}"
          ${alreadySubmitted ? "disabled" : ""}
        >
          ${
            alreadySubmitted
              ? "Proof Submitted"
              : "Submit Proof"
          }
        </button>

      </div>

      ${submissionHTML}

    `;


    taskList.appendChild(card);

  });


  /* OPEN TASK */

  document
    .querySelectorAll(".open-task")
    .forEach(button => {

      button.addEventListener(
        "click",
        function(){

          const task =
            tasks.find(
              item =>
                String(item.id) ===
                String(button.dataset.id)
            );


          if(
            !task ||
            !task.task_url
          ){

            alert(
              "This task does not have a valid link."
            );

            return;

          }


          window.open(
            task.task_url,
            "_blank"
          );

        }
      );

    });


  /* SUBMIT PROOF */

  document
    .querySelectorAll(".submit-proof")
    .forEach(button => {

      button.addEventListener(
        "click",
        function(){

          const task =
            tasks.find(
              item =>
                String(item.id) ===
                String(button.dataset.id)
            );

          if(task){

            openProofModal(task);

          }

        }
      );

    });

}


/* OPEN PROOF MODAL */

function openProofModal(task){

  selectedTask =
    task;

  proofForm.reset();

  submitMessage.textContent =
    "";

  submitMessage.className =
    "";

  proofModal.classList.add("show");

}


/* CLOSE PROOF MODAL */

function closeProofModal(){

  selectedTask =
    null;

  proofForm.reset();

  submitMessage.textContent =
    "";

  proofModal.classList.remove("show");

}


cancelProof.addEventListener(
  "click",
  closeProofModal
);


proofModal.addEventListener(
  "click",
  function(event){

    if(event.target === proofModal){

      closeProofModal();

    }

  }
);


/* SUBMIT PROOF */

proofForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    if(!currentUser || !selectedTask){

      return;

    }


    const file =
      proofFile.files[0];


    if(!file){

      submitMessage.textContent =
        "Please select a screenshot.";

      submitMessage.className =
        "error";

      return;

    }


    if(
      !file.type ||
      !file.type.startsWith("image/")
    ){

      submitMessage.textContent =
        "Please upload an image screenshot only.";

      submitMessage.className =
        "error";

      return;

    }


    if(
      file.size >
      5 * 1024 * 1024
    ){

      submitMessage.textContent =
        "Screenshot must not be larger than 5MB.";

      submitMessage.className =
        "error";

      return;

    }


    try{

      submitProofButton.disabled =
        true;

      submitProofButton.textContent =
        "Checking...";


      /*
       * Check whether this worker
       * already submitted this task.
       */

      const {
        data:existing,
        error:existingError
      } =
      await supabaseClient
        .from("task_submissions")
        .select("id,status")
        .eq(
          "task_id",
          selectedTask.id
        )
        .eq(
          "worker_id",
          currentUser.id
        )
        .maybeSingle();


      if(existingError){

        throw existingError;

      }


      if(
        existing &&
        String(existing.status).toLowerCase()
        !== "rejected"
      ){

        throw new Error(
          "You have already submitted this task."
        );

      }


      submitProofButton.textContent =
        "Uploading...";


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase() || "jpg";


      const filePath =
        currentUser.id +
        "/" +
        selectedTask.id +
        "-" +
        Date.now() +
        "." +
        extension;


      const {
        data:uploadData,
        error:uploadError
      } =
      await supabaseClient
        .storage
        .from("task-proofs")
        .upload(
          filePath,
          file,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:file.type
          }
        );


      if(uploadError){

        throw uploadError;

      }


      submitProofButton.textContent =
        "Submitting...";


      /*
       * Use the database function created
       * specifically for worker submissions.
       *
       * This avoids the permission problem
       * from direct INSERT.
       */

      const {
        data:rpcData,
        error:rpcError
      } =
      await supabaseClient.rpc(
        "worker_submit_task_proof",
        {
          p_task_id:
            selectedTask.id,

          p_proof_path:
            uploadData.path,

          p_proof_text:
            proofText.value.trim() || null,

          p_reward_amount:
            Number(
              selectedTask.reward || 0
            )
        }
      );


      if(rpcError){

        await supabaseClient
          .storage
          .from("task-proofs")
          .remove([
            uploadData.path
          ]);

        throw rpcError;

      }


      if(
        rpcData &&
        typeof rpcData === "object" &&
        rpcData.success === false
      ){

        await supabaseClient
          .storage
          .from("task-proofs")
          .remove([
            uploadData.path
          ]);

        throw new Error(
          rpcData.message ||
          "Unable to submit proof."
        );

      }


      submitMessage.textContent =
        "Proof submitted successfully. Waiting for admin review.";

      submitMessage.className =
        "success";


      setTimeout(
        async function(){

          closeProofModal();

          await loadTasks();

        },
        1200
      );


    }catch(error){

      console.error(
        "SUBMIT PROOF ERROR:",
        error
      );

      submitMessage.textContent =
        error.message ||
        "Unable to submit proof.";

      submitMessage.className =
        "error";

    }finally{

      submitProofButton.disabled =
        false;

      submitProofButton.textContent =
        "Submit Proof";

    }

  }
);


/* LOGOUT */

logoutButton.addEventListener(
  "click",
  async function(){

    logoutButton.disabled =
      true;

    logoutButton.textContent =
      "Logging out...";

    try{

      await supabaseClient.auth.signOut();

      window.location.href =
        "login.html";

    }catch(error){

      logoutButton.disabled =
        false;

      logoutButton.textContent =
        "Logout";

      message.textContent =
        "Logout error: " +
        error.message;

      message.className =
        "message error";

    }

  }
);


/* START */

loadTasks();

</script></body>
  </html>

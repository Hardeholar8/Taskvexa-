<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Transactions</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:24px 15px 80px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{color:#c4b5fd;text-decoration:none}.card{background:#0d1422;border:1px solid #1d293d;border-radius:18px;padding:15px}.tx{padding:15px 2px;border-bottom:1px solid #1d293d;display:flex;justify-content:space-between;gap:12px}.tx:last-child{border-bottom:0}.tx strong{font-size:13px}.tx small{display:block;color:#94a3b8;margin-top:6px;font-size:11px}.amt{font-weight:800;white-space:nowrap}.empty,.loading{color:#94a3b8;font-size:13px;padding:20px 0}.error{color:#fca5a5}</style></head><body><main class="wrap"><div class="top"><a class="back" href="dashboard.html">← Dashboard</a><h2>Transactions</h2></div><section class="card"><div id="state" class="loading">Loading transactions...</div><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const money=v=>'₦'+Number(v||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=v=>String(v??'').replace(/[<>]/g,'');async function load(){try{const {data:s,error:se}=await sb.auth.getSession();if(se)throw se;const user=s?.session?.user;if(!user){location.href='login.html';return}const {data,error}=await sb.from('user_transaction_history').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error)throw error;document.getElementById('state').style.display='none';if(!data?.length){document.getElementById('list').innerHTML='<div class="empty">No transactions yet.</div>';return}document.getElementById('list').innerHTML=data.map(x=>{const debit=x.transaction_type==='airtime_purchase'||Number(x.amount)<0;return `<div class="tx"><div><strong>${esc(x.description||x.transaction_type||'Transaction')}</strong><small>${new Date(x.created_at).toLocaleString('en-NG')} · Balance after: ${money(x.balance_after)}</small></div><div class="amt">${debit?'−':'+'}${money(Math.abs(x.amount))}</div></div>`}).join('')}catch(e){document.getElementById('state').className='error';document.getElementById('state').textContent='Unable to load transactions. Please refresh.';console.error(e)}}load();</script></body></html>

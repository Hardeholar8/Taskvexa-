<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TaskVexa — Forgot Password</title>
<style>
:root{--bg:#07090f;--card:#101522;--field:#0b111c;--line:#263249;--text:#f7f9fc;--muted:#9aa6b8;--accent:#7c5cff;--accent2:#21d4a4;--danger:#fb7185}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#182044 0,#07090f 48%,#05060a 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:480px;margin:auto;padding:34px 16px}.brand{text-align:center;margin:8px 0 24px}.logo{width:54px;height:54px;border-radius:16px;margin:0 auto 10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#080b12;font-weight:900;font-size:25px;box-shadow:0 12px 35px #7c5cff33}.brand h1{margin:0;font-size:26px}.brand p{margin:7px 0;color:var(--muted);font-size:14px}.card{background:rgba(16,21,34,.94);border:1px solid var(--line);border-radius:22px;padding:25px 21px;box-shadow:0 24px 70px #0008}h2{font-size:20px;margin:0 0 8px}.intro{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:20px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.field input{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text);padding:0 14px;font-size:15px;outline:none}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c5cff18}.field input::placeholder{color:#68758a}button{width:100%;height:52px;margin-top:16px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#080b12;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}#message{min-height:22px;margin:14px 0 0;text-align:center;font-size:14px;line-height:1.5}.back{text-align:center;margin:20px 0 0}.back a{color:#a99aff;text-decoration:none;font-weight:700}.note{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px;line-height:1.5}
</style></head>
<body><div class="wrap"><div class="brand"><div class="logo">T</div><h1>TaskVexa</h1><p>Secure account recovery</p></div><main class="card"><h2>Forgot your password?</h2><p class="intro">Enter the email address connected to your TaskVexa account. We'll send you a secure password-reset link.</p><form id="forgotForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="Enter your email address" required></div><button id="forgotButton" type="submit">Send Reset Link</button></form><div id="message" aria-live="polite"></div><div class="note">If you don't see the email, check your spam or junk folder. Reset links expire for security.</div><div class="back"><a href="login.html">← Back to Login</a></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://dxtlnrthlpdaobnbazny.supabase.co";
const SUPABASE_KEY="sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById('forgotForm'),button=document.getElementById('forgotButton'),message=document.getElementById('message');
form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase();if(!email)return;button.disabled=true;button.textContent='Sending...';message.textContent='';message.style.color='';try{const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:new URL('reset-password.html',window.location.href).href});if(error)throw error;message.style.color='#21d4a4';message.textContent='If an account exists for this email, a reset link has been sent. Check your inbox and spam folder.';form.reset();}catch(err){message.style.color='#fb7185';message.textContent='Unable to send reset link: '+(err?.message||'Please try again.');}finally{button.disabled=false;button.textContent='Send Reset Link';}});
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>TaskVexa</title><link rel="stylesheet" href="/filora-theme.css?v=1"><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px 14px 90px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{color:#a98cff;text-decoration:none;font-weight:800;font-size:12px}.brand{font-size:22px;font-weight:900}.card{background:linear-gradient(180deg,#121b2d,#0f1728);border:1px solid #26344d;border-radius:20px;padding:16px;margin-bottom:12px}.muted{color:#94a3b8;font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{display:inline-flex;padding:10px 14px;border-radius:12px;background:#7048ff;color:#fff;text-decoration:none;font-weight:800;font-size:11px;border:0}.empty{text-align:center;padding:35px 15px;color:#94a3b8}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><script src="/theme.js?v=9"></script>
</head><body><main class="wrap"><div class="top"><div class="brand">Membership</div><a class="back" href="dashboard.html">← Dashboard</a></div><p class="muted">Choose the TaskVexa membership level that matches the access and activity limits you need.</p><div id="plans" class="grid"><div class="empty">Loading plans...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');async function load(){const{data,error}=await sb.from('membership_plans').select('*').eq('is_active',true).order('price');if(error)throw error;document.getElementById('plans').innerHTML=(data||[]).map(p=>'<article class="card"><h2>'+p.name+'</h2><div style="font-size:26px;font-weight:900;margin:8px 0">₦'+Number(p.price).toLocaleString()+' <small style="font-size:11px;color:#94a3b8">/ 30 days</small></div><p class="muted">'+p.description+'</p><ul class="muted">'+(p.features||[]).map(f=>'<li>'+f+'</li>').join('')+'</ul><button class="btn" onclick="alert(\'Membership payment will be connected before activation.\')">Choose '+p.name+'</button></article>').join('')||'<div class="empty">No membership plans available.</div>'}load().catch(e=>{document.getElementById('plans').innerHTML='<div class="empty">Unable to load membership plans.</div>'});</script></body></html>

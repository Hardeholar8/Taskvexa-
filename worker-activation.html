<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Activate Account</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:24px 15px 70px}.back{display:inline-block;color:#6d28d9;text-decoration:none;margin-bottom:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 18px rgba(15,23,42,.04)}.muted{color:#64748b;font-size:13px;line-height:1.6}.amount{display:block;font-size:28px;font-weight:900;color:#6d28d9;margin-top:8px}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:12px;background:#fff;border:1px solid #dbe2ea;border-radius:10px;color:#111827}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#6d28d9;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.msg{margin:12px 0;font-size:13px}.error{color:#b91c1c}.success{color:#15803d}.details{line-height:1.8;font-size:13px}</style><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script></head><body><main class="wrap"><a class="back" href="dashboard.html">← Dashboard</a><div class="card"><h1>Activate Your Worker Account</h1><p class="muted">Make the activation payment using the account details below, then submit your payment reference and proof for admin review.</p><div id="details" class="details muted">Loading payment details...</div></div><div class="card"><h2 style="margin-top:0">Activation Amount</h2><span id="amount" class="amount">Loading...</span></div><div class="card"><h2 style="margin-top:0">Submit Activation</h2><form id="form"><div class="field"><label>Payment Reference</label><input id="ref" required placeholder="Enter payment reference"></div><div class="field"><label>Payment Proof</label><input id="proof" type="file" accept="image/*" required></div><div id="msg" class="msg"></div><button class="btn" id="submit">Submit Activation</button></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const $=id=>document.getElementById(id);let user,amount=0;const money=v=>'₦'+Number(v).toLocaleString('en-NG');async function init(){try{const {data,error}=await sb.auth.getUser();if(error||!data.user){location.href='login.html';return}user=data.user;const {data:p,error:pe}=await sb.from('profiles').select('role,activation_status').eq('id',user.id).maybeSingle();if(pe)throw pe;if(String(p?.role||'').toLowerCase()!=='worker')throw new Error('Worker account required.');if(['active','activated','approved','true'].includes(String(p?.activation_status||'').toLowerCase())){$('msg').textContent='Your account is already activated.';$('msg').className='msg success';$('submit').disabled=true}const {data:s,error:se}=await sb.from('worker_activation_settings').select('activation_amount').eq('id',true).single();if(se)throw se;amount=Number(s?.activation_amount||0);if(amount<=0)throw new Error('Activation amount has not been configured by admin.');$('amount').textContent=money(amount);const {data:d,error:de}=await sb.from('promoter_payment_details').select('bank_name,account_name,account_number,instructions').order('updated_at',{ascending:false}).limit(1).maybeSingle();if(de)throw de;if(d)$('details').innerHTML='<b>Payment Details</b><br>Bank: '+String(d.bank_name||'')+'<br>Account Name: '+String(d.account_name||'')+'<br>Account Number: '+String(d.account_number||'')+'<br>'+String(d.instructions||'')}catch(e){$('msg').textContent=e.message||'Unable to load activation.';$('msg').className='msg error'}}$('form').onsubmit=async e=>{e.preventDefault();try{if(!amount)throw new Error('Activation amount is unavailable.');const ref=$('ref').value.trim(),file=$('proof').files[0];if(!ref||!file)throw new Error('Payment reference and proof are required.');$('submit').disabled=true;$('submit').textContent='Submitting...';const path=user.id+'/activation-'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await sb.storage.from('task-proofs').upload(path,file,{upsert:false,contentType:file.type});if(up.error)throw up.error;const proof=sb.storage.from('task-proofs').getPublicUrl(path).data.publicUrl;const {error}=await sb.rpc('submit_worker_activation',{p_payment_reference:ref,p_proof_url:proof,p_amount:amount});if(error)throw error;$('msg').textContent='Activation request submitted. Please wait for admin approval.';$('msg').className='msg success';$('form').reset()}catch(e){$('msg').textContent=e.message||'Submission failed.';$('msg').className='msg error'}finally{$('submit').disabled=false;$('submit').textContent='Submit Activation'}};init();</script></body></html>

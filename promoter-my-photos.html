<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa — My Photo Campaigns</title><meta name="taskvexa-page-version" content="20260919e"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/filora-theme.css?v=1"><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.wrap{max-width:780px;margin:auto;padding:20px 16px 105px}.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{width:42px;height:42px;border:1px solid #26344d;background:#111827;color:#fff;border-radius:13px;font-size:18px}.title{font-size:23px;font-weight:900}.sub{color:#94a3b8;font-size:11px;margin-top:4px}.card{background:linear-gradient(180deg,#121b2d,#0f1728);border:1px solid #26344d;border-radius:18px;padding:15px;margin-bottom:12px}.photo{width:100%;max-height:300px;object-fit:cover;border-radius:13px;background:#0b1220}.row{display:flex;justify-content:space-between;gap:12px;margin-top:11px}.name{font-size:15px;font-weight:900}.pill{font-size:9px;font-weight:900;text-transform:uppercase;padding:6px 9px;border-radius:99px;background:#123323;color:#4ade80;height:max-content}.desc{color:#94a3b8;font-size:11px;line-height:1.5}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.meta span{font-size:10px;color:#b9c3d4;background:#0b1220;border:1px solid #26344d;border-radius:9px;padding:7px 9px}.bar{height:6px;background:#0b1220;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7048ff,#42d8ff)}.empty{text-align:center;padding:35px;color:#94a3b8;font-size:12px}.btn{display:inline-block;margin-top:12px;padding:10px 13px;border-radius:11px;background:linear-gradient(135deg,#6947ff,#9b61ff);color:#fff;text-decoration:none;font-size:11px;font-weight:850}</style></head><body><main class="wrap"><header class="head"><button class="back" onclick="history.back()">←</button><div><div class="title">My Photo Campaigns</div><div class="sub">View the photos you have posted and track Worker views.</div></div></header><section id="list"><div class="empty">Loading photo campaigns…</div></section></main><script>
const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'taskvexa-promoter-auth'}});
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){const {data:{session},error:se}=await sb.auth.getSession();if(se||!session?.user){$('list').innerHTML='<div class="empty">Your Promoter session is not available. Please return to the Promoter Dashboard and open My Photos again.</div>';return}const r=await sb.rpc('get_my_photo_campaigns');if(r.error){$('list').innerHTML='<div class="empty">Unable to load your photo campaigns.</div>';return}const rows=r.data||[];if(!rows.length){$('list').innerHTML='<div class="empty">You have not posted any photo campaigns yet.<br><a class="btn" href="promoter-photo.html">＋ Post Photo</a></div>';return}$('list').innerHTML=rows.map(x=>{const target=Number(x.target_views||0),done=Number(x.completed_views||0),pct=target?Math.min(100,Math.round(done/target*100)):0;return '<article class="card"><img class="photo" src="'+esc(x.image_url)+'"><div class="row"><div class="name">'+esc(x.title||'Untitled photo')+'</div><span class="pill">'+esc(x.status||'active')+'</span></div><div class="desc">'+esc(x.description||'')+'</div><div class="meta"><span>Views: '+done+' / '+target+'</span><span>Worker reward: ₦'+Number(x.reward_per_view||0).toLocaleString('en-NG')+'</span><span>Verification: '+Number(x.verification_seconds||0)+'s</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></article>'}).join('')}load();</script></body></html>

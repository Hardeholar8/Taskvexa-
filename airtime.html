<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TaskVexa - Airtime</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,Helvetica,sans-serif;min-height:100vh}.top{height:68px;position:sticky;top:0;z-index:20;background:rgba(7,11,20,.94);backdrop-filter:blur(14px);border-bottom:1px solid #1d293d;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-size:23px;font-weight:800}.brand span{color:#a78bfa}.back{border:1px solid #263247;background:#111a2b;color:#fff;border-radius:10px;padding:9px 12px;text-decoration:none;font-size:13px}.wrap{max-width:820px;margin:auto;padding:26px 16px 100px}.hero{margin-bottom:22px}.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0;color:#94a3b8;font-size:14px}.card{background:#0d1422;border:1px solid #1d293d;border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 15px 40px rgba(0,0,0,.2)}.balance{background:linear-gradient(135deg,#17112d,#0d1422);border-color:rgba(139,92,246,.3)}.label{display:block;color:#94a3b8;font-size:12px;margin-bottom:8px}.balance strong{font-size:30px}.networks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.network{border:1px solid #263247;background:#111a2b;color:#dbeafe;border-radius:13px;padding:14px 8px;text-align:center;cursor:pointer;font-weight:700}.network.active{border-color:#8b5cf6;background:rgba(124,58,237,.17);box-shadow:0 0 0 1px rgba(139,92,246,.18)}.network small{display:block;color:#94a3b8;font-weight:400;margin-top:5px;font-size:10px}label{display:block;color:#cbd5e1;font-size:12px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:14px;background:#090e18;border:1px solid #263247;border-radius:11px;color:#fff;font-size:15px;outline:none}input:focus{border-color:#8b5cf6}.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.amount{padding:11px;background:#111a2b;border:1px solid #263247;color:#fff;border-radius:10px;cursor:pointer}.amount.active{border-color:#8b5cf6;background:rgba(124,58,237,.16)}.summary{background:#090e18;border:1px solid #1d293d;border-radius:13px;padding:15px;margin-top:18px}.row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}.row span:first-child{color:#94a3b8}.buy{width:100%;border:0;border-radius:12px;padding:14px;margin-top:16px;background:#7c3aed;color:white;font-size:14px;font-weight:800;cursor:pointer}.buy:disabled{opacity:.55;cursor:not-allowed}.message{font-size:13px;margin-top:12px;min-height:18px}.success{color:#86efac}.error{color:#fca5a5}.history h2{font-size:17px;margin:0 0 14px}.order{padding:13px 0;border-bottom:1px solid #1d293d;display:flex;justify-content:space-between;gap:12px}.order:last-child{border-bottom:0}.order strong{font-size:13px}.order small{display:block;color:#64748b;margin-top:4px}.status{font-size:10px;font-weight:800;text-transform:uppercase}.delivered{color:#86efac}.pending{color:#facc15}.failed{color:#fca5a5}.empty{color:#64748b;text-align:center;padding:20px}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:rgba(9,15,28,.97);border-top:1px solid #1d293d;display:flex;justify-content:space-around;align-items:center;z-index:30}.bottom a{color:#94a3b8;text-decoration:none;font-size:10px;text-align:center}.bottom a.active{color:#c4b5fd}.bottom b{display:block;font-size:19px;margin-bottom:3px}@media(max-width:600px){.wrap{padding:20px 14px 85px}.networks{grid-template-columns:repeat(2,1fr)}.amounts{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:24px}.card{padding:18px}}
</style>
</head>
<body>
<header class="top"><a class="back" href="dashboard.html">← Dashboard</a><div class="brand">Task<span>Vexa</span></div><div style="width:85px"></div></header>
<main class="wrap">
<section class="hero"><h1>Buy Airtime</h1><p>Recharge any Nigerian network directly from your TaskVexa wallet.</p></section>
<section class="card balance"><span class="label">Available Wallet Balance</span><strong id="balance">₦0.00</strong></section>
<section class="card">
<span class="label">Choose network</span>
<div class="networks"><button class="network active" data-network="mtn">MTN<small>Mobile</small></button><button class="network" data-network="airtel">Airtel<small>Mobile</small></button><button class="network" data-network="glo">Glo<small>Mobile</small></button><button class="network" data-network="9mobile">9mobile<small>Mobile</small></button></div>
<label for="phone">Phone number</label><input id="phone" inputmode="numeric" maxlength="11" placeholder="08012345678" autocomplete="tel">
<label>Quick amount</label><div class="amounts"><button class="amount" data-amount="100">₦100</button><button class="amount" data-amount="200">₦200</button><button class="amount" data-amount="500">₦500</button><button class="amount" data-amount="1000">₦1,000</button></div>
<label for="amount">Amount</label><input id="amount" type="number" min="50" max="50000" placeholder="Enter amount">
<div class="summary"><div class="row"><span>Network</span><b id="sumNetwork">MTN</b></div><div class="row"><span>Phone</span><b id="sumPhone">—</b></div><div class="row"><span>Amount</span><b id="sumAmount">₦0</b></div></div>
<button id="buy" class="buy">Buy Airtime</button><div id="message" class="message"></div>
</section>
<section class="card history"><h2>Recent Airtime Transactions</h2><div id="history"><div class="empty">Loading transactions...</div></div></section>
</main>
<nav class="bottom"><a href="dashboard.html"><b>⌂</b>Home</a><a href="tasks.html"><b>✓</b>Tasks</a><a class="active" href="airtime.html"><b>₦</b>Airtime</a><a href="withdraw.html"><b>◉</b>Wallet</a><a href="profile.html"><b>☻</b>Profile</a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL='https://dxtlnrthlpdaobnbazny.supabase.co';
const SUPABASE_KEY='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,network='mtn';
const $=id=>document.getElementById(id);
function money(n){return '₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2})}
function updateSummary(){const p=$('phone').value.trim();const a=Number($('amount').value||0);$('sumNetwork').textContent=network==='9mobile'?'9mobile':network[0].toUpperCase()+network.slice(1);$('sumPhone').textContent=p||'—';$('sumAmount').textContent=money(a)}
async function init(){
 const {data,error}=await supabaseClient.auth.getUser(); if(error||!data.user){location.href='login.html';return} user=data.user;
 await Promise.all([loadBalance(),loadHistory()]); updateSummary();
}
async function loadBalance(){const {data}=await supabaseClient.from('wallets').select('balance').eq('user_id',user.id).maybeSingle();$('balance').textContent=money(data?.balance||0)}
async function loadHistory(){const {data,error}=await supabaseClient.from('airtime_orders').select('id,network,phone,amount,status,created_at,provider_description').eq('user_id',user.id).order('created_at',{ascending:false}).limit(10);if(error){$('history').innerHTML='<div class="empty">Unable to load transaction history.</div>';return}if(!data?.length){$('history').innerHTML='<div class="empty">No airtime transactions yet.</div>';return}$('history').innerHTML=data.map(o=>{const s=o.status||'pending';return `<div class="order"><div><strong>${o.network==='9mobile'?'9mobile':o.network[0].toUpperCase()+o.network.slice(1)} · ${o.phone}</strong><small>${new Date(o.created_at).toLocaleString('en-NG')}</small></div><div style="text-align:right"><strong>${money(o.amount)}</strong><small class="status ${s}">${s}</small></div></div>`}).join('')}
for(const b of document.querySelectorAll('.network'))b.addEventListener('click',()=>{document.querySelectorAll('.network').forEach(x=>x.classList.remove('active'));b.classList.add('active');network=b.dataset.network;updateSummary()});
for(const b of document.querySelectorAll('.amount'))b.addEventListener('click',()=>{$('amount').value=b.dataset.amount;document.querySelectorAll('.amount').forEach(x=>x.classList.remove('active'));b.classList.add('active');updateSummary()});
$('phone').addEventListener('input',updateSummary);$('amount').addEventListener('input',updateSummary);
$('buy').addEventListener('click',async()=>{const phone=$('phone').value.trim(),amount=Number($('amount').value);const msg=$('message');msg.className='message';msg.textContent='';if(!/^0\d{10}$/.test(phone)){msg.className='message error';msg.textContent='Enter a valid 11-digit Nigerian phone number.';return}if(!Number.isFinite(amount)||amount<50||amount>50000){msg.className='message error';msg.textContent='Enter an amount between ₦50 and ₦50,000.';return}const ok=confirm(`Buy ₦${amount.toLocaleString()} airtime for ${phone}?`);if(!ok)return;$('buy').disabled=true;$('buy').textContent='Processing...';try{const {data:sessionData}=await supabaseClient.auth.getSession();const token=sessionData.session?.access_token;if(!token)throw new Error('Your session has expired. Please log in again.');const res=await fetch(`${SUPABASE_URL}/functions/v1/airtime-service`,{method:'POST',headers:{Authorization:`Bearer ${token}`,apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'purchase',network,phone,amount})});const out=await res.json();if(!res.ok||!out.success)throw new Error(out.message||'Airtime purchase failed.');msg.className='message '+(out.status==='delivered'?'success':'');msg.textContent=out.message;await loadBalance();await loadHistory()}catch(e){msg.className='message error';msg.textContent=e.message||'Airtime purchase failed.'}finally{$('buy').disabled=false;$('buy').textContent='Buy Airtime'}});
init();
</script>
</body>
</html>

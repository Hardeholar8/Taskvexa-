<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Worker Submissions</title><style>body{margin:0;background:#070a10;color:#f8fafc;font-family:Inter,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.card{background:#111a28;border:1px solid #202c3d;border-radius:16px;padding:18px;margin-bottom:14px}.muted{color:#8997aa;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.proof{background:#090e16;border:1px solid #293548;border-radius:10px;padding:12px;margin:12px 0;white-space:pre-wrap;word-break:break-word}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.approve{background:#4ade80;color:#061018}.reject{background:#f87171;color:#210609}.btn:disabled{opacity:.5}.error{color:#f87171}.success{color:#4ade80}</style></head><body><main class="wrap"><div class="top"><div><h1>Worker Submissions</h1><div class="muted">Review work submitted for your tasks.</div></div><button class="btn" onclick="location.href='promoter-dashboard.html'">Back to Dashboard</button></div><div id="message" class="muted">Loading submissions...</div><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const supabaseClient=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){try{const{data:u,error:ue}=await supabaseClient.auth.getUser();if(ue)throw ue;if(!u?.user){location.href='login.html';return}const{data:p,error:pe}=await supabaseClient.from('profiles').select('role').eq('id',u.user.id).maybeSingle();if(pe)throw pe;if(String(p?.role||'').toLowerCase()!=='promoter')throw new Error('Promoter account required.');const{data,error}=await supabaseClient.rpc('get_promoter_pending_submissions');if(error)throw error;const rows=Array.isArray(data)?data:[];render(rows)}catch(e){console.error(e);$('message').className='error';$('message').textContent=e.message||'Unable to load submissions.'}}function render(rows){if(!rows.length){$('message').textContent='No pending worker submissions.';$('list').innerHTML='';return}$('message').textContent='';$('list').innerHTML=rows.map(s=>`<section class="card" data-id="${esc(s.submission_id||s.id)}"><div class="row"><div><b>${esc(s.task_title||s.title||'Task')}</b><div class="muted">${esc(s.platform||'')} · Submitted ${esc(s.created_at||'')}</div></div><span class="muted">Worker submission</span></div><div class="proof">${s.proof_url?`Proof: <a href="${esc(s.proof_url)}" target="_blank" rel="noopener">Open proof</a>`:''}${s.proof_text?`\n${esc(s.proof_text)}`:''}</div><div class="row"><button class="btn approve" onclick="review('${esc(s.submission_id||s.id)}','approve',this)">Approve</button><button class="btn reject" onclick="review('${esc(s.submission_id||s.id)}','reject',this)">Reject</button></div></section>`).join('')}async function review(id,action,btn){const card=btn.closest('[data-id]');const buttons=card.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{const{data,error}=await supabaseClient.rpc('review_promoter_task_submission',{p_submission_id:id,p_action:action});if(error)throw error;if(!data?.success)throw new Error(data?.message||'Review failed.');card.remove();if(!$('list').children.length)$('message').textContent='No pending worker submissions.'}catch(e){console.error(e);alert(e.message||'Review failed.');buttons.forEach(b=>b.disabled=false)}}load();</script></body></html>

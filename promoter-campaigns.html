<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa — Campaigns</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/promoter-auth.js"></script><style>body{margin:0;background:#070a10;color:#f4f7fb;font-family:Arial}.wrap{max-width:700px;margin:auto;padding:20px 16px 90px}.head{font-size:21px;font-weight:800;margin-bottom:15px}.card{background:#101622;border:1px solid #202a3d;border-radius:16px;padding:15px;margin-bottom:10px}.muted{color:#98a4b8;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px}.pill{padding:5px 9px;border-radius:20px;background:#182033;font-size:11px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b101a;border-top:1px solid #202a3d;display:flex;justify-content:center;gap:10px;padding:11px}.nav a{color:#aeb8ca;text-decoration:none;font-size:11px}</style><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script></head><body><main class="wrap"><div class="head">My Campaigns</div><div id="list" class="muted">Loading...</div></main><nav class="nav"><a href="promoter-dashboard.html">Home</a><a href="promoter-campaigns.html">Campaigns</a><a href="promoter-create.html">Create</a><a href="promoter-wallet.html">Wallet</a><a href="promoter-settings.html">More</a></nav><script>async function load(){const ctx=await requirePromoter();if(!ctx)return;const {data,error}=await promoterSupabase.from('promoter_campaigns').select('id,title,status,workers_needed,price_per_worker,calculated_cost,created_at').eq('promoter_id',ctx.user.id).order('created_at',{ascending:false});if(error){list.textContent='Unable to load campaigns.';return}list.innerHTML=data?.length?data.map(x=>`<div class="card"><div class="row"><strong>${String(x.title||'Campaign').replace(/[<>]/g,'')}</strong><span class="pill">${x.status||'draft'}</span></div><div class="muted" style="margin-top:8px">${x.workers_needed||0} Workers · ₦${Number(x.calculated_cost||0).toLocaleString('en-NG',{minimumFractionDigits:2})}</div></div>`).join(''):'No campaigns yet.'}load()</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Deposit Verification</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script>
</head><body style="margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif"><main style="max-width:560px;margin:70px auto;padding:20px;text-align:center"><h1 id="title">Verifying Deposit…</h1><p id="msg" style="color:#94a3b8">Please wait while we confirm your payment.</p><a id="back" href="wallet.html" style="display:none;color:#c4b5fd">Return to Wallet</a></main><script>const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{try{const p=new URLSearchParams(location.search),tx=p.get('transaction_id'),ref=p.get('tx_ref');if(!tx&&!ref)throw new Error('Payment reference was not returned.');let j={};for(let i=0;i<4;i++){const r=await fetch('/api/flutterwave/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transaction_id:tx||undefined,tx_ref:ref||undefined,purpose:'worker_wallet_funding'})});j=await r.json().catch(()=>({}));if(r.ok&&j.verified&&j.wallet_funded)break;if(i<3)await sleep(2500)}if(!j.verified||!j.wallet_funded)throw new Error(j.error||'Deposit verification failed.');document.getElementById('title').textContent='Deposit Successful';document.getElementById('msg').textContent='Your wallet balance has been updated successfully.';document.getElementById('back').style.display='inline-block'}catch(e){document.getElementById('title').textContent='Deposit Verification Failed';document.getElementById('msg').textContent=e.message||'Please contact support.';document.getElementById('back').style.display='inline-block'}})();</script></body></html>

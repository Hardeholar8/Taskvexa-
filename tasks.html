/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   FORMAT MONEY
========================= */

function formatMoney(value) {

  return Number(
    value || 0
  ).toLocaleString(
    "en-NG",
    {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    }
  );

}


/* =========================
   GET CURRENT USER
========================= */

async function getCurrentUser() {

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();


  if (error) {

    throw error;

  }


  if (
    !data ||
    !data.user
  ) {

    window.location.href =
      "login.html";

    return null;

  }


  return data.user;

}


/* =========================
   LOAD TASKS
========================= */

async function loadTasks() {

  message.style.display =
    "block";

  message.className =
    "message";

  message.innerHTML = `
    <div class="loader"></div>
    Loading tasks...
  `;

  taskList.innerHTML =
    "";


  try {

    currentUser =
      await getCurrentUser();


    if (!currentUser) {

      return;

    }


    /*
      Load active tasks.

      workers_needed is still selected
      from the database because admin
      needs it, but it is NEVER displayed
      anywhere in the worker interface.
    */

    const {
      data: tasks,
      error: taskError
    } =
    await supabaseClient
      .from("tasks")
      .select(
        "id, title, description, platform, reward, workers_needed, task_url, status, created_at"
      )
      .eq(
        "status",
        "active"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (taskError) {

      throw new Error(
        "Could not load tasks: " +
        taskError.message
      );

    }


    /*
      Load this worker's submissions.
    */

    const {
      data: submissions,
      error: submissionError
    } =
    await supabaseClient
      .from("task_submissions")
      .select(
        "id, task_id, status, created_at"
      )
      .eq(
        "worker_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (submissionError) {

      throw new Error(
        "Could not load your submissions: " +
        submissionError.message
      );

    }


    /*
      Store latest submission
      status for each task.
    */

    const submissionMap = {};


    (submissions || []).forEach(
      submission => {

        if (
          !submissionMap[
            submission.task_id
          ]
        ) {

          submissionMap[
            submission.task_id
          ] =
            String(
              submission.status || ""
            ).toLowerCase();

        }

      }
    );


    /*
      Approved tasks disappear
      from the worker's task list.
    */

    const visibleTasks =
      (tasks || []).filter(
        task =>
          submissionMap[
            task.id
          ] !== "approved"
      );


    if (
      visibleTasks.length === 0
    ) {

      message.innerHTML =
        "No tasks are currently available.";

      return;

    }


    message.style.display =
      "none";


    /*
      CREATE TASK CARDS
    */

    visibleTasks.forEach(
      task => {

        const submissionStatus =
          submissionMap[
            task.id
          ];


        const card =
          document.createElement(
            "section"
          );


        card.className =
          "task-card";


        let statusHTML =
          "";


        if (
          submissionStatus ===
          "pending"
        ) {

          statusHTML = `

            <div class="submission-status pending-status">

              ⏳ Proof submitted —
              Pending admin review

            </div>

          `;

        }


        if (
          submissionStatus ===
          "rejected"
        ) {

          statusHTML = `

            <div class="submission-status rejected-status">

              ❌ Proof rejected —
              You can submit again

            </div>

          `;

        }


        /*
          IMPORTANT:

          Workers Needed is intentionally
          NOT included here.
        */

        card.innerHTML = `

          <h3>
            ${escapeHTML(
              task.title
            )}
          </h3>


          <div class="task-description">

            ${escapeHTML(
              task.description
            )}

          </div>


          <div class="task-info">

            <div class="info-row">

              <span>
                Platform
              </span>

              <span>
                ${escapeHTML(
                  task.platform ||
                  "Not specified"
                )}
              </span>

            </div>


            <div class="info-row">

              <span>
                Reward
              </span>

              <span class="reward">

                ₦${formatMoney(
                  task.reward
                )}

              </span>

            </div>

          </div>


          ${statusHTML}


          <button
            class="view-button"
          >
            View Task
          </button>

        `;


        card
          .querySelector(
            ".view-button"
          )
          .addEventListener(
            "click",
            () => {

              showTaskDetails(
                task,
                submissionStatus
              );

            }
          );


        taskList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      "TASK PAGE ERROR:",
      error
    );


    message.style.display =
      "block";

    message.className =
      "message error";


    message.innerHTML = `

      <strong>
        Unable to load tasks.
      </strong>

      <br><br>

      ${escapeHTML(
        error.message
      )}

      <br><br>

      <button
        onclick="loadTasks()"
        style="
          padding:10px 16px;
          border:0;
          border-radius:10px;
          font-weight:700;
          cursor:pointer;
        "
      >
        Try Again
      </button>

    `;

  }

}


/* =========================

========================= */

function showTaskDetails(
  task,
  submissionStatus
) {

  selectedTask =
    task;


  selectedSubmissionStatus =
    submissionStatus || null;


  document.getElementById(
    "detailTitle"
  ).textContent =
    task.title || "";


  document.getElementById(
    "detailDescription"
  ).textContent =
    task.description || "";


  document.getElementById(
    "detailPlatform"
  ).textContent =
    task.platform ||
    "Not specified";


  document.getElementById(
    "detailReward"
  ).textContent =
    formatMoney(
      task.reward
    );


  /*
    Workers Needed is deliberately
    NOT shown or inserted into the page.
  */


  document.getElementById(
    "openTaskButton"
  ).href =
    task.task_url || "#";


  document.getElementById(
    "proofFile"
  ).value =
    "";


  proofMessage.textContent =
    "";

  proofMessage.className =
    "";


  if (
    submissionStatus ===
    "pending"
  ) {

    proofMessage.className =
      "pending-text";

    proofMessage.textContent =
      "Your proof is pending admin review.";

    submitProofButton.disabled =
      true;

    submitProofButton.textContent =
      "Pending Review";

  }

  else if (
    submissionStatus ===
    "rejected"
  ) {

    proofMessage.className =
      "error-text";

    proofMessage.textContent =
      "Your previous proof was rejected. You can submit a new proof.";

    submitProofButton.disabled =
      false;

    submitProofButton.textContent =
      "Submit New Proof";

  }

  else {

    submitProofButton.disabled =
      false;

    submitProofButton.textContent =
      "Submit Proof";

  }


  taskListSection.style.display =
    "none";

  taskDetailsSection.style.display =
    "block";


  window.scrollTo(
    0,
    0
  );

}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskVexa - Promoter Wallet Management</title>

<link rel="stylesheet" href="style.css">

<style>
.box {
  background:#f3f4f6;
  padding:20px;
  margin:15px 0;
  border-radius:12px;
}

.deposit-card {
  background:white;
  padding:18px;
  margin:15px 0;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.deposit-card p {
  margin:8px 0;
}

.proof-image {
  width:100%;
  max-width:500px;
  max-height:500px;
  object-fit:contain;
  display:block;
  margin:15px 0;
  border-radius:10px;
  border:1px solid #ddd;
  background:#f9fafb;
}

.proof-link {
  display:inline-block;
  margin:8px 0 15px;
  padding:10px 14px;
  background:#2563eb;
  color:white;
  text-decoration:none;
  border-radius:8px;
}

button {
  padding:11px 18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin:5px 5px 5px 0;
}

.approve {
  background:#16a34a;
  color:white;
}

.reject {
  background:#dc2626;
  color:white;
}

.refresh {
  background:#374151;
  color:white;
}

.note-input {
  width:100%;
  box-sizing:border-box;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  margin:8px 0;
}

.success {
  color:#15803d;
}

.error {
  color:#dc2626;
}

.pending {
  color:#b45309;
}

.status {
  font-weight:bold;
}

.hidden {
  display:none;
}
</style>
</head>

<body>

<header>
  <h1>TaskVexa</h1>

  <a href="admin-dashboard.html">
    Dashboard
  </a>
</header>

<main>

<h2>Promoter Wallet Management</h2>

<p id="accessMessage">
Checking admin access...
</p>

<button
type="button"
class="refresh"
id="refreshButton"
>
Refresh
</button>


<!-- PENDING -->

<section class="box">

<h3>
Pending Deposits
</h3>

<div id="pendingDeposits">
Loading...
</div>

</section>


<!-- HISTORY -->

<section class="box">

<h3>
Deposit History
</h3>

<div id="depositHistory">
Loading...
</div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const PROOF_BUCKET =
"task-proofs";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================================
   ADMIN CHECK
================================ */

async function checkAdmin() {

  const message =
  document.getElementById(
    "accessMessage"
  );

  try {

    const {
      data: sessionData,
      error: sessionError
    } =
    await supabaseClient.auth.getSession();


    if (sessionError) {
      throw sessionError;
    }


    if (!sessionData.session) {

      message.textContent =
      "You are not logged in.";

      message.className =
      "error";

      return false;
    }


    const {
      data: userData,
      error: userError
    } =
    await supabaseClient.auth.getUser();


    if (userError) {
      throw userError;
    }


    const user =
    userData.user;


    if (!user) {

      message.textContent =
      "User not found.";

      message.className =
      "error";

      return false;
    }


    const {
      data: profile,
      error: profileError
    } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .maybeSingle();


    if (profileError) {
      throw profileError;
    }


    if (
      !profile ||
      profile.role !== "admin"
    ) {

      message.textContent =
      "Admin access required.";

      message.className =
      "error";

      return false;
    }


    message.textContent =
    "Admin access confirmed.";

    message.className =
    "success";


    return true;


  } catch (error) {

    message.textContent =
    "Error: " +
    error.message;

    message.className =
    "error";

    return false;
  }
}


/* ================================
   LOAD DEPOSITS
================================ */

async function loadDeposits() {

  const pendingBox =
  document.getElementById(
    "pendingDeposits"
  );

  const historyBox =
  document.getElementById(
    "depositHistory"
  );


  pendingBox.textContent =
  "Loading...";

  historyBox.textContent =
  "Loading...";


  try {

    /*
      Admin can read the deposit
      records through the existing
      admin permissions.
    */

    const {
      data,
      error
    } =
    await supabaseClient
      .from("promoter_deposit_requests")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if (error) {
      throw error;
    }


    const pending =
    (data || []).filter(
      item =>
      String(item.status)
        .toLowerCase()
      === "pending"
    );


    const reviewed =
    (data || []).filter(
      item =>
      String(item.status)
        .toLowerCase()
      !== "pending"
    );


    /* PENDING */

    pendingBox.innerHTML =
    "";


    if (pending.length === 0) {

      pendingBox.textContent =
      "No pending deposits.";

    } else {

      for (const item of pending) {

        await renderPendingDeposit(
          item,
          pendingBox
        );
      }
    }


    /* HISTORY */

    historyBox.innerHTML =
    "";


    if (reviewed.length === 0) {

      historyBox.textContent =
      "No reviewed deposits.";

    } else {

      for (const item of reviewed) {

        await renderHistoryDeposit(
          item,
          historyBox
        );
      }
    }


  } catch (error) {

    pendingBox.innerHTML =
    "<p class='error'>Error loading deposits: " +
    escapeHTML(error.message) +
    "</p>";

    historyBox.textContent =
    "Unable to load deposit history.";

    console.error(error);
  }
}


/* ================================
   RENDER PENDING
================================ */

async function renderPendingDeposit(
  item,
  container
) {

  const card =
  document.createElement(
    "div"
  );

  card.className =
  "deposit-card";


  card.innerHTML = `

    <h4>
      Promoter
    </h4>

    <p>
      <strong>ID:</strong>
      ${escapeHTML(item.promoter_id)}
    </p>

    <p>
      <strong>Amount:</strong>
      ₦${Number(
        item.amount || 0
      ).toLocaleString("en-NG")}
    </p>

    <p>
      <strong>Payment Reference:</strong>
      ${escapeHTML(
        item.payment_reference
      )}
    </p>

    <p>
      <strong>Submitted:</strong>
      ${formatDate(
        item.created_at
      )}
    </p>

    <div class="proof-area">
      Loading screenshot...
    </div>

    <label>
      Optional admin note
    </label>

    <input
      type="text"
      class="note-input"
      placeholder="Optional admin note"
    >

    <br>

    <button
      type="button"
      class="approve"
    >
      Approve
    </button>

    <button
      type="button"
      class="reject"
    >
      Reject
    </button>

    <p class="action-message"></p>

  `;


  container.appendChild(
    card
  );


  /* SCREENSHOT */

  const proofArea =
  card.querySelector(
    ".proof-area"
  );


  if (item.proof_path) {

    try {

      const {
        data,
        error
      } =
      await supabaseClient.storage
        .from(PROOF_BUCKET)
        .createSignedUrl(
          item.proof_path,
          3600
        );


      if (error) {
        throw error;
      }


      if (
        data &&
        data.signedUrl
      ) {

        proofArea.innerHTML = `

          <strong>
            Payment Screenshot
          </strong>

          <br>

          <img
            class="proof-image"
            src="${escapeAttribute(
              data.signedUrl
            )}"
            alt="Payment screenshot"
          >

          <a
            class="proof-link"
            href="${escapeAttribute(
              data.signedUrl
            )}"
            target="_blank"
            rel="noopener"
          >
            View Screenshot
          </a>

        `;

      } else {

        proofArea.innerHTML =
        "<p class='error'>Screenshot URL could not be created.</p>";
      }


    } catch (error) {

      console.error(
        "Proof error:",
        error
      );

      proofArea.innerHTML =
      "<p class='error'>Unable to load screenshot: " +
      escapeHTML(error.message) +
      "</p>";
    }


  } else if (item.proof_url) {

    proofArea.innerHTML = `

      <strong>
        Payment Screenshot
      </strong>

      <br>

      <img
        class="proof-image"
        src="${escapeAttribute(
          item.proof_url
        )}"
        alt="Payment screenshot"
      >

      <a
        class="proof-link"
        href="${escapeAttribute(
          item.proof_url
        )}"
        target="_blank"
        rel="noopener"
      >
        View Screenshot
      </a>

    `;

  } else {

    proofArea.innerHTML =
    "<p class='error'>No payment screenshot attached.</p>";
  }


  /* APPROVE */

  card.querySelector(
    ".approve"
  ).addEventListener(
    "click",
    () =>
    reviewDeposit(
      item.id,
      "approved",
      card
    )
  );


  /* REJECT */

  card.querySelector(
    ".reject"
  ).addEventListener(
    "click",
    () =>
    reviewDeposit(
      item.id,
      "rejected",
      card
    )
  );
}


/* ================================
   RENDER HISTORY
================================ */

async function renderHistoryDeposit(
  item,
  container
) {

  const card =
  document.createElement(
    "div"
  );

  card.className =
  "deposit-card";


  card.innerHTML = `

    <p>
      <strong>Promoter ID:</strong>
      ${escapeHTML(item.promoter_id)}
    </p>

    <p>
      <strong>Amount:</strong>
      ₦${Number(
        item.amount || 0
      ).toLocaleString("en-NG")}
    </p>

    <p>
      <strong>Payment Reference:</strong>
      ${escapeHTML(
        item.payment_reference
      )}
    </p>

    <p>
      <strong>Status:</strong>
      <span class="status">
        ${escapeHTML(item.status)}
      </span>
    </p>

    ${
      item.admin_note
      ? `
        <p>
          <strong>Admin Note:</strong>
          ${escapeHTML(item.admin_note)}
        </p>
      `
      : ""
    }

  `;


  container.appendChild(
    card
  );
}


/* ================================
   REVIEW DEPOSIT
================================ */

async function reviewDeposit(
  depositId,
  newStatus,
  card
) {

  const note =
  card.querySelector(
    ".note-input"
  ).value.trim();


  const message =
  card.querySelector(
    ".action-message"
  );


  const buttons =
  card.querySelectorAll(
    "button"
  );


  buttons.forEach(
    button =>
    button.disabled = true
  );


  message.textContent =
  "Processing...";


  try {

    /*
      Try the existing RPC first.
      If your admin page already has
      its own review function, use it.
    */

    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "review_promoter_deposit",
      {
        p_deposit_id:
        depositId,

        p_status:
        newStatus,

        p_admin_note:
        note || null
      }
    );


    if (error) {
      throw error;
    }


    if (
      data &&
      data.success === false
    ) {

      throw new Error(
        data.message ||
        "Review failed."
      );
    }


    message.textContent =
    newStatus === "approved"
    ? "Deposit approved successfully."
    : "Deposit rejected successfully.";


    message.className =
    "success";


    setTimeout(
      loadDeposits,
      800
    );


  } catch (error) {

    console.error(error);


    message.textContent =
    "Error: " +
    error.message;

    message.className =
    "error";


    buttons.forEach(
      button =>
      button.disabled = false
    );
  }
}


/* ================================
   HELPERS
================================ */

function formatDate(value) {

  if (!value) {
    return "-";
  }

  return new Date(value)
    .toLocaleString("en-NG");
}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttribute(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}


/* ================================
   REFRESH
================================ */

document
.getElementById("refreshButton")
.addEventListener(
  "click",
  async function() {

    this.disabled = true;

    this.textContent =
    "Refreshing...";

    await loadDeposits();

    this.disabled = false;

    this.textContent =
    "Refresh";
  }
);


/* ================================
   START
================================ */

async function initialize() {

  const allowed =
  await checkAdmin();


  if (!allowed) {
    return;
  }


  await loadDeposits();
}


initialize();

</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskVexa - Tasks</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .submission-status {
      font-weight: bold;
      margin: 10px 0;
    }

    .pending-status {
      color: #b7791f;
    }

    .rejected-status {
      color: #c53030;
    }

    .task-card {
      margin-bottom: 20px;
    }

  </style>
</head>


<body>


<header>

  <h1>TaskVexa</h1>

  <a href="dashboard.html">
    Dashboard
  </a>

</header>


<main>


  <!-- =========================
       TASK LIST
  ========================== -->

  <section id="taskListSection">

    <h2>Available Tasks</h2>

    <p>
      Choose a task you want to complete.
    </p>

    <div id="message">
      Loading tasks...
    </div>

    <div id="taskList"></div>

  </section>


  <!-- =========================
       TASK DETAILS
  ========================== -->

  <section
    id="taskDetailsSection"
    style="display:none;"
  >

    <button id="backButton">
      ← Back to Tasks
    </button>


    <h2 id="detailTitle"></h2>


    <p>
      <strong>Platform:</strong>
      <span id="detailPlatform"></span>
    </p>


    <p>
      <strong>Task Reward:</strong>
      ₦<span id="detailReward"></span>
    </p>


    <p>
      <strong>Workers Needed:</strong>
      <span id="detailWorkers"></span>
    </p>


    <hr>


    <h3>Instructions</h3>

    <p id="detailDescription"></p>


    <br>


    <a
      id="openTaskButton"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      class="task-button"
    >
      Open Task
    </a>


    <hr>


    <h3>Submit Proof</h3>


    <p>
      Upload a screenshot showing that you completed the task.
    </p>


    <input
      type="file"
      id="proofFile"
      accept="image/*"
    >


    <br><br>


    <button id="submitProofButton">
      Submit Proof
    </button>


    <p id="proofMessage"></p>

  </section>


</main>


<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const taskList =
  document.getElementById(
    "taskList"
  );


const message =
  document.getElementById(
    "message"
  );


const taskListSection =
  document.getElementById(
    "taskListSection"
  );


const taskDetailsSection =
  document.getElementById(
    "taskDetailsSection"
  );


const backButton =
  document.getElementById(
    "backButton"
  );


const submitProofButton =
  document.getElementById(
    "submitProofButton"
  );


const proofMessage =
  document.getElementById(
    "proofMessage"
  );


let selectedTask = null;

let selectedSubmissionStatus = null;

let currentUser = null;


/* =========================
   LOAD TASKS
========================= */

async function loadTasks() {

  try {

    const {
      data: { user },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (
      userError ||
      !user
    ) {

      window.location.href =
        "login.html";

      return;

    }


    currentUser = user;


    /*
      Load active tasks.
    */

    const {
      data: tasks,
      error: taskError
    } =
      await supabaseClient
        .from("tasks")
        .select("*")
        .eq(
          "status",
          "active"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (taskError) {

      throw taskError;

    }


    /*
      Load this worker's
      submissions.
    */

    const {
      data: submissions,
      error: submissionError
    } =
      await supabaseClient
        .from("task_submissions")
        .select(
          "id, task_id, status, created_at"
        )
        .eq(
          "worker_id",
          user.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (submissionError) {

      throw submissionError;

    }


    /*
      Store the latest submission
      status for each task.
    */

    const submissionMap = {};


    (submissions || []).forEach(
      submission => {

        /*
          Because submissions are ordered
          newest first, only save the
          first/latest submission.
        */

        if (
          !submissionMap[
            submission.task_id
          ]
        ) {

          submissionMap[
            submission.task_id
          ] =
            submission.status;

        }

      }
    );


    taskList.innerHTML = "";


    /*
      APPROVED tasks disappear.

      PENDING tasks remain.

      REJECTED tasks remain.
    */

    const visibleTasks =
      (tasks || []).filter(
        task => {

          const status =
            submissionMap[
              task.id
            ];


          return status !==
            "approved";

        }
      );


    if (
      visibleTasks.length === 0
    ) {

      message.textContent =
        "No tasks are currently available.";

      return;

    }


    message.textContent =
      "";


    /*
      Create task cards.
    */

    visibleTasks.forEach(
      task => {

        const submissionStatus =
          submissionMap[
            task.id
          ];


        const card =
          document.createElement(
            "section"
          );


        card.className =
          "task-card";


        let statusHTML = "";


        /*
          PENDING
        */

        if (
          submissionStatus ===
          "pending"
        ) {

          statusHTML = `

            <p class="submission-status pending-status">

              <strong>Status:</strong>
              Pending Review

            </p>

          `;

        }


        /*
          REJECTED
        */

        if (
          submissionStatus ===
          "rejected"
        ) {

          statusHTML = `

            <p class="submission-status rejected-status">

              <strong>Status:</strong>
              ❌ Rejected — You can try again

            </p>

          `;

        }


        card.innerHTML = `

          <h3>
            ${escapeHTML(
              task.title
            )}
          </h3>


          <p>
            ${escapeHTML(
              task.description
            )}
          </p>


          <p>

            <strong>
              Platform:
            </strong>

            ${escapeHTML(
              task.platform ||
              "Not specified"
            )}

          </p>


          <p>

            <strong>
              Task Reward:
            </strong>

            ₦${Number(
              task.reward || 0
            ).toLocaleString()}

          </p>


          <p>

            <strong>
              Workers Needed:
            </strong>

            ${Number(
              task.workers_needed || 0
            )}

          </p>


          ${statusHTML}


          <button
            class="task-button view-task-button"
          >
            View Task
          </button>

        `;


        const viewButton =
          card.querySelector(
            ".view-task-button"
          );


        viewButton.addEventListener(
          "click",
          () => {

            showTaskDetails(
              task,
              submissionStatus
            );

          }
        );


        taskList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    message.textContent =
      "ERROR: " +
      error.message;

  }

}


/* =========================
   SHOW TASK DETAILS
========================= */

function showTaskDetails(
  task,
  submissionStatus
) {

  selectedTask =
    task;


  selectedSubmissionStatus =
    submissionStatus || null;


  document.getElementById(
    "detailTitle"
  ).textContent =
    task.title;


  document.getElementById(
    "detailPlatform"
  ).textContent =
    task.platform ||
    "Not specified";


  document.getElementById(
    "detailReward"
  ).textContent =
    Number(
      task.reward || 0
    ).toLocaleString();


  document.getElementById(
    "detailWorkers"
  ).textContent =
    task.workers_needed;


  document.getElementById(
    "detailDescription"
  ).textContent =
    task.description;


  document.getElementById(
    "openTaskButton"
  ).href =
    task.task_url || "#";


  document.getElementById(
    "proofFile"
  ).value =
    "";


  proofMessage.textContent =
    "";


  /*
    PENDING
  */

  if (
    submissionStatus ===
    "pending"
  ) {

    proofMessage.textContent =
      "Your proof is pending admin review.";


    submitProofButton.disabled =
      true;


    submitProofButton.textContent =
      "Pending Review";

  }


  /*
    REJECTED

    Worker is allowed to
    submit again.
  */

  else if (
    submissionStatus ===
    "rejected"
  ) {

    proofMessage.textContent =
      "❌ Your previous proof was rejected. You can submit a new proof.";


    submitProofButton.disabled =
      false;


    submitProofButton.textContent =
      "Submit New Proof";

  }


  /*
    NEW TASK
  */

  else {

    submitProofButton.disabled =
      false;


    submitProofButton.textContent =
      "Submit Proof";

  }


  taskListSection.style.display =
    "none";


  taskDetailsSection.style.display =
    "block";


  window.scrollTo(
    0,
    0
  );

}


/* =========================
   BACK TO TASKS
========================= */

backButton.addEventListener(
  "click",
  () => {

    selectedTask =
      null;


    selectedSubmissionStatus =
      null;


    taskDetailsSection.style.display =
      "none";


    taskListSection.style.display =
      "block";


    proofMessage.textContent =
      "";


    /*
      Reload so an approved
      task disappears immediately.
    */

    loadTasks();

  }
);


/* =========================
   SUBMIT PROOF
========================= */

submitProofButton.addEventListener(
  "click",
  async () => {

    if (!selectedTask) {

      proofMessage.textContent =
        "Please select a task.";

      return;

    }


    const file =
      document.getElementById(
        "proofFile"
      ).files[0];


    if (!file) {

      proofMessage.textContent =
        "Please upload a screenshot first.";

      return;

    }


    try {

      submitProofButton.disabled =
        true;


      submitProofButton.textContent =
        "Submitting...";


      const {
        data: { user },
        error: userError
      } =
        await supabaseClient.auth.getUser();


      if (
        userError ||
        !user
      ) {

        window.location.href =
          "login.html";

        return;

      }


      /*
        Check latest submission.
      */

      const {
        data: existingSubmissions,
        error: existingError
      } =
        await supabaseClient
          .from("task_submissions")
          .select(
            "id, status, created_at"
          )
          .eq(
            "task_id",
            selectedTask.id
          )
          .eq(
            "worker_id",
            user.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (existingError) {

        throw existingError;

      }


      const latestSubmission =
        existingSubmissions &&
        existingSubmissions.length > 0
          ? existingSubmissions[0]
          : null;


      /*
        PENDING

        Do not allow another
        submission.
      */

      if (
        latestSubmission &&
        latestSubmission.status ===
        "pending"
      ) {

        proofMessage.textContent =
          "Your previous submission is still pending review.";


        submitProofButton.disabled =
          true;


        submitProofButton.textContent =
          "Pending Review";


        return;

      }


      /*
        APPROVED

        Never allow another
        submission.
      */

      if (
        latestSubmission &&
        latestSubmission.status ===
        "approved"
      ) {

        proofMessage.textContent =
          "You have already completed this task.";


        submitProofButton.disabled =
          true;


        submitProofButton.textContent =
          "Already Completed";


        return;

      }


      /*
        REJECTED

        Allowed to submit again.
      */


      /*
        Upload screenshot.
      */

      const safeFileName =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const fileName =
        `${user.id}/${selectedTask.id}-${Date.now()}-${safeFileName}`;


      const {
        error: uploadError
      } =
        await supabaseClient.storage
          .from("task-proofs")
          .upload(
            fileName,
            file
          );


      if (uploadError) {

        throw uploadError;

      }


      /*
        Get public proof URL.
      */

      const {
        data: publicUrlData
      } =
        supabaseClient.storage
          .from("task-proofs")
          .getPublicUrl(
            fileName
          );


      const proofUrl =
        publicUrlData.publicUrl;


      /*
        Create new pending submission.
      */

      const {
        error: submissionError
      } =
        await supabaseClient
          .from("task_submissions")
          .insert({

            task_id:
              selectedTask.id,

            worker_id:
              user.id,

            proof_url:
              proofUrl,

            reward_amount:
              selectedTask.reward,

            status:
              "pending"

          });


      if (submissionError) {

        throw submissionError;

      }


      /*
        Success.
      */

      proofMessage.textContent =
        "Proof submitted successfully. Waiting for admin review.";


      submitProofButton.disabled =
        true;


      submitProofButton.textContent =
        "Pending Review";


      selectedSubmissionStatus =
        "pending";


    } catch (error) {

      console.error(
        error
      );


      proofMessage.textContent =
        "Error: " +
        error.message;


      submitProofButton.disabled =
        false;


      submitProofButton.textContent =
        "Submit Proof";

    }

  }
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   START
========================= */

loadTasks();

</script>


</body>

</html>

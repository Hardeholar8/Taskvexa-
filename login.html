<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07090f">
<title>TaskVexa - Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#18264a 0,#0b1020 38%,#05070d 78%,#030409 100%);color:#f8fafc;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 16px}.page{width:100%;max-width:470px}.brand{text-align:center;margin-bottom:24px}.logo{width:72px;height:72px;margin:0 auto 14px;border-radius:22px;background:linear-gradient(135deg,#7c5cff,#39d9c5);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#071019;box-shadow:0 16px 45px #0008}.brand h1{margin:0;font-size:31px;letter-spacing:-.8px}.brand p{margin:8px 0 0;color:#9ca9bf;font-size:16px}.card{background:linear-gradient(180deg,#111927,#0b111c);border:1px solid #26344a;border-radius:24px;padding:30px 26px;box-shadow:0 28px 80px #0009}.card h2{margin:0 0 8px;font-size:26px}.intro{margin:0 0 24px;color:#9ca9bf;line-height:1.55;font-size:15px}.field{margin-bottom:17px}.field label{display:block;margin-bottom:8px;font-weight:700;color:#e7edf7;font-size:14px}.input-wrap{position:relative}.input-wrap input{width:100%;height:54px;border:1px solid #2b3a51;border-radius:13px;background:#080e18;color:#f8fafc;padding:0 15px;font-size:16px;outline:none}.input-wrap input:focus{border-color:#7c6cff;box-shadow:0 0 0 3px #7c6cff20}.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:none;color:#8e9ab0;cursor:pointer;font-size:13px;font-weight:700}.forgot{text-align:right;margin:-4px 0 20px}.forgot a{color:#a99aff;font-weight:700;text-decoration:none}.login-btn{width:100%;height:54px;border:0;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#27d5bf);color:#061018;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 12px 30px #6f5cff33}.login-btn:disabled{opacity:.6;cursor:not-allowed}.message{min-height:22px;text-align:center;margin-bottom:8px;color:#f87171;font-size:14px}.bottom{text-align:center;color:#8996aa;margin:22px 0 0;font-size:15px}.bottom a{color:#b0a3ff;font-weight:800;text-decoration:none}.legal{border-top:1px solid #1d2939;margin-top:24px;padding-top:18px;text-align:center;color:#66748a;font-size:12px}.legal a{color:#8f9bb0;text-decoration:none;margin:0 7px}@media(max-width:430px){.card{padding:26px 20px}.brand h1{font-size:28px}}
</style>
</head>
<body>
<div class="page">
<header class="brand"><div class="logo">T</div><h1>TaskVexa</h1><p>Welcome back to your account</p></header>
<main class="card">
<h2>Sign in</h2>
<p class="intro">Enter your account details below to continue to your TaskVexa dashboard.</p>
<div id="message" class="message" aria-live="polite"></div>
<form id="loginForm">
<div class="field"><label for="loginEmail">Email address</label><div class="input-wrap"><input type="email" id="loginEmail" name="email" autocomplete="email" placeholder="Enter your email address" required></div></div>
<div class="field"><label for="loginPassword">Password</label><div class="input-wrap"><input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" class="password-toggle" id="togglePassword">Show</button></div></div>
<div class="forgot"><a href="forgot-password.html">Forgot your password?</a></div>
<button type="submit" class="login-btn" id="loginButton">Login to TaskVexa</button>
</form>
<p class="bottom">Don't have an account? <a href="register.html">Create Account</a></p>
<footer class="legal"><a href="terms.html">Terms of Use</a><a href="privacy.html">Privacy Policy</a><a href="support.html">Customer Support</a></footer>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
const toggle=document.getElementById('togglePassword');const password=document.getElementById('loginPassword');
toggle.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';toggle.textContent=show?'Hide':'Show';});
</script>
</body>
</html>

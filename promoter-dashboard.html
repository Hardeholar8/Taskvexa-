<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>TaskVexa - Promoter Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #070a10;
            --panel: #0e1521;
            --panel2: #111a28;
            --border: #202c3d;
            --text: #f8fafc;
            --muted: #8997aa;
            --green: #4ade80;
            --blue: #60a5fa;
            --yellow: #facc15;
            --red: #f87171;
        }

        body {
            margin: 0;
            background: radial-gradient(
                circle at 80% -10%,
                #17243a 0,
                #070a10 38%
            );
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 250px;
            background: rgba(8, 12, 19, .96);
            border-right: 1px solid var(--border);
            padding: 20px 14px;
            z-index: 50;
        }

        .brand {
            padding: 8px 12px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
        }

        .brand b {
            font-size: 23px;
        }

        .brand small {
            display: block;
            color: var(--muted);
            margin-top: 5px;
        }

        .section-title {
            font-size: 10px;
            color: #59687c;
            font-weight: 800;
            letter-spacing: 1.4px;
            margin: 20px 12px 8px;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 13px;
            margin: 4px 0;
            border: 0;
            border-radius: 12px;
            background: transparent;
            color: #aeb9c9;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
        }

        .nav:hover,
        .nav.active {
            background: #171f2d;
            color: #fff;
        }

        .nav i {
            font-style: normal;
            width: 22px;
            text-align: center;
            font-size: 17px;
        }

        .logout {
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .logout .nav {
            color: var(--red);
        }

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            min-width: 0;
        }

        .top {
            height: 70px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            background: rgba(7, 10, 16, .9);
            backdrop-filter: blur(14px);
            z-index: 20;
        }

        .top h2 {
            margin: 0;
            font-size: 18px;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--muted);
            font-size: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #60a5fa, #4ade80);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #061018;
            font-weight: 900;
        }

        .menu {
            display: none;
        }

        .content {
            max-width: 1400px;
            margin: auto;
            padding: 28px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: center;
            margin-bottom: 24px;
        }

        .hero h1 {
            font-size: 30px;
            margin: 0 0 7px;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .status {
            padding: 9px 13px;
            border: 1px solid #24412f;
            background: #102419;
            border-radius: 20px;
            color: var(--green);
            font-size: 12px;
            font-weight: 700;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat,
        .card {
            background: linear-gradient(
                145deg,
                rgba(17, 25, 38, .96),
                rgba(12, 18, 28, .96)
            );
            border: 1px solid var(--border);
            border-radius: 18px;
        }

        .stat {
            padding: 19px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 11px;
        }

        .stat-value {
            font-size: 25px;
            font-weight: 850;
            margin-top: 9px;
        }

        .stat-icon {
            float: right;
            font-size: 20px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1.35fr .65fr;
            gap: 18px;
        }

        .card {
            padding: 21px;
            margin-bottom: 18px;
        }

        .head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .head-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #182131;
            border: 1px solid #29364a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .head h3 {
            margin: 0;
            font-size: 16px;
        }

        .head p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 11px;
        }

        .wallet {
            background: linear-gradient(145deg, #17253a, #0d141f);
        }

        .balance {
            font-size: 35px;
            font-weight: 900;
            margin: 8px 0 18px;
        }

        .muted {
            color: var(--muted);
        }

        .btn {
            border: 0;
            border-radius: 11px;
            padding: 12px 16px;
            background: #f8fafc;
            color: #080c12;
            font-weight: 800;
            cursor: pointer;
        }

            background: #

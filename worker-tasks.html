<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Available Tasks</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f8fafc;font-family:Arial,sans-serif}header{height:70px;background:#070a10;border-bottom:1px solid #202b3b;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}.logo{font-size:21px;font-weight:800}.actions{display:flex;gap:8px}.btn,.back{padding:9px 13px;border-radius:9px;font-size:13px;font-weight:700}.back{background:#151d2a;color:#fff;border:1px solid #293548;text-decoration:none}.btn{background:#32191d;color:#f87171;border:1px solid #5b292f;cursor:pointer}.content{max-width:1100px;margin:auto;padding:28px 16px 60px}.heading h1{margin:0 0 8px;font-size:28px}.heading p{margin:0 0 18px;color:#7f8da3;font-size:14px}.message{font-size:13px;margin-bottom:18px}.success{color:#4ade80}.error{color:#f87171}.loading,.empty{background:#111722;border:1px solid #202b3b;border-radius:17px;padding:35px 20px;text-align:center;color:#7f8da3}.task{background:#111722;border:1px solid #202b3b;border-radius:18px;padding:20px;margin-bottom:15px}.offer{border-color:#315b4a;background:linear-gradient(135deg,#111722,#102019);padding:14px}.offerhead{padding:6px 6px 12px}.title{font-size:19px;font-weight:800;margin-bottom:8px}.desc{color:#a4b0c0;line-height:1.6;white-space:pre-wrap;margin-bottom:15px}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.box{background:#0d131e;border:1px solid #1d2838;border-radius:11px;padding:12px}.box small{display:block;color:#64748b;font-size:10px;margin-bottom:5px}.reward{color:#4ade80;font-weight:800}.offerframe{width:100%;height:700px;border:1px solid #293548;border-radius:14px;background:#fff;display:block}.task button{border:0;border-radius:10px;padding:11px 15px;margin:3px 6px 3px 0;font-weight:700;cursor:pointer}.open{background:#f8fafc;color:#090d14}.submit{background:#151d2a;color:#fff;border:1px solid #293548!important}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{width:100%;max-width:500px;background:#111722;border:1px solid #202b3b;border-radius:18px;padding:20px}.modalbox input,.modalbox textarea{width:100%;padding:12px;background:#090e16;border:1px solid #293548;border-radius:10px;color:#fff;margin:7px 0 14px}.modalbox textarea{min-height:80px}.cancel{background:#151d2a;color:#fff;border:1px solid #293548}@media(max-width:650px){.info{grid-template-columns:1fr}.heading h1{font-size:24px}.offerframe{height:720px}}</style></head><body><header><div class="logo">TaskVexa</div><div class="actions"><a class="back" href="worker.html">← Dashboard</a><button id="logout" class="btn">Logout</button></div></header><main class="content"><div class="heading"><h1>Available Tasks</h1><p>Complete available tasks and submit your screenshot proof for review.</p></div><div id="message" class="message">Checking account...</div><div id="list"><div class="loading">Checking account...</div></div></main><div id="modal" class="modal"><div class="modalbox"><h2>Submit Task Proof</h2><form id="form"><label>Screenshot Proof</label><input id="file" type="file" accept="image/*" required><label>Additional Note (Optional)</label><textarea id="note"></textarea><div id="modalmsg" class="message"></div><button class="task submit" type="submit">Submit Proof</button><button class="task cancel" type="button" id="cancel">Cancel</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=v=>'₦'+Number(v||0).toLocaleString('en-NG');let user,selected;async function init(){try{const {data,error}=await sb.auth.getUser();if(error)throw error;if(!data.user){location.href='login.html';return}user=data.user;const {data:p,error:pe}=await sb.from('profiles').select('role,activation_status').eq('id',user.id).maybeSingle();if(pe)throw pe;if(String(p?.role||'').toLowerCase()!=='worker')throw new Error('Worker account required.');if(String(p?.activation_status||'').toLowerCase()!=='active'){$('message').textContent='Your account must be activated before you can access tasks.';$('message').className='message error';$('list').innerHTML='<div class="empty"><h3 style="color:#fff">Account not activated</h3><p>Activate your worker account before accessing available tasks.</p><a class="back" href="worker-activation.html">Activate Account</a></div>';return}const {data:s,error:se}=await sb.from('task_submissions').select('task_id').eq('worker_id',user.id);if(se)throw se;const done=new Set((s||[]).map(x=>String(x.task_id)));const {data:t,error:te}=await sb.from('tasks').select('id,title,description,platform,task_url,reward,status,created_at').eq('status','active').order('created_at',{ascending:false});if(te)throw te;const tasks=(t||[]).filter(x=>!done.has(String(x.id)));render(tasks);$('message').textContent=tasks.length?`${tasks.length} regular task${tasks.length===1?'':'s'} available. AdswedMedia offers are shown below.`:'AdswedMedia offers are available below.';$('message').className='message success'}catch(e){console.error(e);$('message').textContent=e.message||'Unable to load tasks.';$('message').className='message error';$('list').innerHTML='<div class="empty error">Unable to load tasks.</div>'}}function render(tasks){const offer=`<article class="task offer"><div class="offerhead"><div class="title">🎁 AdswedMedia Offers</div><div class="desc">Complete sponsored offers directly below. Offers are tracked to your TaskVexa account automatically.</div></div><iframe class="offerframe" id="adswedFrame" title="AdswedMedia Offers" loading="eager" allow="clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe></article>`;if(!tasks.length){$('list').innerHTML=offer+'<div class="empty"><h3 style="color:#fff">Regular tasks completed</h3><p>No new regular TaskVexa tasks are available right now.</p></div>'}else{$('list').innerHTML=offer+tasks.map(t=>`<article class="task"><div class="title">${esc(t.title)}</div><div class="desc">${esc(t.description||'No instructions provided.')}</div><div class="info"><div class="box"><small>Platform</small><strong>${esc(t.platform||'-')}</strong></div><div class="box"><small>Task Reward</small><strong class="reward">${money(t.reward)}</strong></div></div><button class="open" data-open="${esc(t.id)}">Open Task</button><button class="submit" data-submit="${esc(t.id)}">Submit Proof</button></article>`).join('')}const frame=$('adswedFrame');if(frame)frame.src='https://adswedmedia.com/offer/Et3Mt71/'+encodeURIComponent(user.id);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const t=tasks.find(x=>String(x.id)===String(b.dataset.open));if(t?.task_url)window.open(t.task_url,'_blank','noopener,noreferrer');else alert('This task does not have a valid link.')});document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>{selected=tasks.find(x=>String(x.id)===String(b.dataset.submit));$('modal').classList.add('show')})}$('cancel').onclick=()=>$('modal').classList.remove('show');$('form').onsubmit=async e=>{e.preventDefault();if(!selected||!$('file').files[0])return;const f=$('file').files[0];$('modalmsg').textContent='Submitting...';try{const path=`${user.id}/${selected.id}-${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error:ue}=await sb.storage.from('task-proofs').upload(path,f,{upsert:false,contentType:f.type});if(ue)throw ue;const {data:u}=sb.storage.from('task-proofs').getPublicUrl(path);const {error:ie}=await sb.from('task_submissions').insert({task_id:selected.id,worker_id:user.id,proof_url:u.publicUrl,proof_text:$('note').value.trim(),status:'pending',reward_amount:Number(selected.reward||0)});if(ie)throw ie;$('modal').classList.remove('show');location.reload()}catch(e){$('modalmsg').textContent=e.message||'Submission failed.';$('modalmsg').className='message error'}};$('logout').onclick=async()=>{await sb.auth.signOut();location.href='login.html'};init();</script></body></html>

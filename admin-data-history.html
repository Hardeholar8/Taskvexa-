<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Data Orders</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.top{height:66px;border-bottom:1px solid #202c40;display:flex;align-items:center;gap:16px;padding:0 18px}.back{color:#c4b5fd;text-decoration:none}.brand{font-size:21px;font-weight:900}.brand span{color:#a78bfa}.wrap{max-width:1100px;margin:auto;padding:24px 16px 60px}.card,.item{background:#101825;border:1px solid #202c40;border-radius:16px}.card{padding:18px;margin-bottom:14px}.h{margin:0 0 5px;font-size:21px}.muted{color:#8b98aa;font-size:12px}.item{padding:14px;margin:9px 0;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:12px;align-items:center;font-size:12px}.item strong{font-size:13px}.small{color:#8b98aa;font-size:11px;margin-top:4px}.tag{display:inline-block;padding:5px 8px;border-radius:8px;background:#192234;font-size:10px;text-transform:capitalize}.pending{color:#fcd34d}.delivered{color:#86efac}.failed,.reversed{color:#fca5a5}@media(max-width:760px){.item{display:block}.cell{margin:6px 0}}</style></head><body><header class="top"><a class="back" href="admin.html">← Admin</a><div class="brand">Task<span>Vexa</span></div></header><main class="wrap"><section class="card"><h1 class="h">Data Orders</h1><p class="muted">Admin view of Data purchase records. Provider delivery is not connected yet.</p></section><section id="list"><div class="muted">Loading...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const u=await sb.auth.getUser();if(u.error||!u.data.user){location.href='login.html';return}const p=await sb.from('profiles').select('role').eq('id',u.data.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()!=='admin'){location.href='login.html';return}const r=await sb.from('data_orders').select('id,user_id,network,phone,data_amount,amount,status,request_id,provider_transaction_id,created_at').order('created_at',{ascending:false}).limit(100);if(r.error){$('list').innerHTML='<div class="muted">Unable to load Data orders.</div>';return}const rows=r.data||[];$('list').innerHTML=rows.length?rows.map(x=>`<article class="item"><div class="cell"><strong>${esc(x.network.toUpperCase())}</strong><div class="small">${esc(x.data_amount)}</div></div><div class="cell"><strong>${esc(x.phone)}</strong><div class="small">User: ${esc(x.user_id)}</div></div><div class="cell"><strong>₦${Number(x.amount).toLocaleString('en-NG',{minimumFractionDigits:2})}</strong><div class="small">${new Date(x.created_at).toLocaleString('en-NG')}</div></div><div class="cell"><span class="tag ${esc(x.status)}">${esc(x.status)}</span><div class="small">Ref: ${esc(x.request_id)}</div></div><div class="cell"><div class="small">${x.provider_transaction_id?'Provider: '+esc(x.provider_transaction_id):'No provider ref yet'}</div></div></article>`).join(''):'<div class="muted">No Data orders yet.</div>'}init();</script></body></html>

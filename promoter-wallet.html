<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa — Promoter Wallet</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/promoter-auth.js"></script><style>body{margin:0;background:#070a10;color:#f4f7fb;font-family:Arial}.wrap{max-width:700px;margin:auto;padding:20px 16px 90px}.card{background:#101622;border:1px solid #202a3d;border-radius:17px;padding:18px;margin-bottom:12px}.label,.muted{color:#98a4b8;font-size:12px}.balance{font-size:30px;font-weight:900;margin-top:7px}.btn{display:block;text-align:center;text-decoration:none;background:#7c5cff;color:#fff;padding:14px;border-radius:13px;font-weight:800}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #202a3d;font-size:13px}.row:last-child{border:0}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b101a;border-top:1px solid #202a3d;display:flex;justify-content:center;gap:10px;padding:11px}.nav a{color:#aeb8ca;text-decoration:none;font-size:11px}</style><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script></head><body><main class="wrap"><div class="card"><div class="label">Available Balance</div><div id="balance" class="balance">₦0.00</div><div class="muted" style="margin-top:8px">Use your wallet balance to fund campaigns.</div></div><a class="btn" href="promoter-fund.html">＋ Fund Wallet</a><div class="card" style="margin-top:12px"><div class="label">Wallet Summary</div><div class="row"><span>Total Funded</span><strong id="funded">₦0.00</strong></div><div class="row"><span>Total Spent</span><strong id="spent">₦0.00</strong></div></div><div class="card"><div class="label">Recent Transactions</div><div id="tx" class="muted" style="margin-top:10px">Loading...</div></div></main><nav class="nav"><a href="promoter-dashboard.html">Home</a><a href="promoter-campaigns.html">Campaigns</a><a href="promoter-create.html">Create</a><a href="promoter-wallet.html">Wallet</a><a href="promoter-settings.html">More</a></nav><script>const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2});async function load(){const ctx=await requirePromoter();if(!ctx)return;const {data:w}=await promoterSupabase.rpc('get_my_promoter_wallet');if(w?.[0]){balance.textContent=money(w[0].balance);funded.textContent=money(w[0].total_funded);spent.textContent=money(w[0].total_spent)}const {data:t}=await promoterSupabase.rpc('get_my_promoter_wallet_transactions');tx.innerHTML=t?.length?t.slice(0,8).map(x=>`<div class="row"><span>${String(x.description||x.transaction_type||'Transaction').replace(/[<>]/g,'')}</span><strong>${money(x.amount)}</strong></div>`).join(''):'No transactions yet.'}load()</script></body></html>

<script>

const supabaseClient =

/* =====================================================

const message =

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   MONEY
===================================================== */

function formatMoney(value){

  return "₦" +
    Number(value || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

  if(!value) return "-";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return "-";
  }

  return date.toLocaleString(
    "en-NG",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin(){

  try{

    message.textContent =
      "Checking admin access...";

    /*
      Use getSession first so the page does not
      unnecessarily wait for a new authentication
      request.
    */

    const {
      data:sessionData,
      error:sessionError
    } =
    await supabaseClient.auth.getSession();

    if(sessionError){
      throw sessionError;
    }

    let session =
      sessionData?.session;


    /*
      If no session was found, try getUser once.
    */

    if(!session){

      const {
        data:userData,
        error:userError
      } =
      await supabaseClient.auth.getUser();

      if(userError){
        throw userError;
      }

      if(!userData?.user){

        message.textContent =
          "You are not logged in. Redirecting...";

        setTimeout(
          () => {
            window.location.href =
              "login.html";
          },
          500
        );

        return false;
      }

      currentUser =
        userData.user;

    }else{

      currentUser =
        session.user;

    }


    /*
      Check profile role.
    */

    const {
      data:profile,
      error:profileError
    } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id",currentUser.id)
      .maybeSingle();


    if(profileError){
      throw profileError;
    }


    if(
      !profile ||
      String(profile.role).toLowerCase() !== "admin"
    ){

      message.textContent =
        "Access denied. Admin account required.";

      message.className =
        "error";

      return false;
    }


    message.textContent =
      "Admin access confirmed.";

    message.className =
      "success";

    adminContent.classList.remove(
      "hidden"
    );

    return true;

  }catch(error){

    console.error(
      "ADMIN CHECK ERROR:",
      error
    );

    message.textContent =
      "Admin access error: " +
      (error.message || "Unknown error");

    message.className =
      "error";

    return false;
  }

}


/* =====================================================
   LOAD TASKS
===================================================== */

async function loadTasks(){

  taskList.innerHTML =
    "<div class='empty'>Loading tasks...</div>";

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("tasks")
      .select(
        "id,title,description,platform,task_url,reward,workers_needed,target_levels,status,created_by,source,created_at,updated_at,promoter_charge"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){
      throw error;
    }


    allTasks =
      Array.isArray(data)
        ? data
        : [];


    renderTasks(
      allTasks
    );

  }catch(error){

    console.error(
      "LOAD TASKS ERROR:",
      error
    );

    taskList.innerHTML = `
      <div class="empty error">
        Unable to load tasks.<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}


/* =====================================================
   RENDER TASKS
===================================================== */

function renderTasks(tasks){

  if(!tasks.length){

    taskList.innerHTML =
      "<div class='empty'>No tasks found.</div>";

    return;
  }


  taskList.innerHTML = "";


  tasks.forEach(task => {

    const card =
      document.createElement("div");

    card.className =
      "task-card";


    const status =
      String(
        task.status || "active"
      ).toLowerCase();


    let statusClass =
      "active";


    if(status === "paused"){
      statusClass = "paused";
    }

    if(status === "closed"){
      statusClass = "closed";
    }


    const levels =
      Array.isArray(task.target_levels)
        ? task.target_levels.join(", ")
        : "-";


    card.innerHTML = `

      <h3>
        ${escapeHTML(task.title)}
      </h3>

      <div class="description">
        ${escapeHTML(task.description)}
      </div>

      <div class="info">
        <span>Platform</span>
        <span>
          ${escapeHTML(task.platform || "-")}
        </span>
      </div>

      <div class="info">
        <span>Reward</span>
        <span class="reward">
          ${formatMoney(task.reward)}
        </span>
      </div>

      <div class="info">
        <span>Workers Needed</span>
        <span>
          ${escapeHTML(task.workers_needed || 0)}
        </span>
      </div>

      <div class="info">
        <span>Target Level</span>
        <span>
          ${escapeHTML(levels)}
        </span>
      </div>

      <div class="info">
        <span>Created</span>
        <span>
          ${escapeHTML(formatDate(task.created_at))}
        </span>
      </div>

      <div>
        <span class="status ${statusClass}">
          ${escapeHTML(status.toUpperCase())}
        </span>
      </div>

      <div class="actions">

        <button
          class="secondary"
          data-action="edit"
          data-id="${escapeHTML(task.id)}"
        >
          Edit
        </button>

        ${
          status === "active"
          ? `
            <button
              class="secondary"
              data-action="pause"
              data-id="${escapeHTML(task.id)}"
            >
              Pause
            </button>
          `
          : ""
        }

        ${
          status === "paused"
          ? `
            <button
              class="secondary"
              data-action="activate"
              data-id="${escapeHTML(task.id)}"
            >
              Activate
            </button>
          `
          : ""
        }

        ${
          status !== "closed"
          ? `
            <button
              class="danger"
              data-action="close"
              data-id="${escapeHTML(task.id)}"
            >
              Close
            </button>
          `
          : ""
        }

        <button
          class="danger"
          data-action="delete"
          data-id="${escapeHTML(task.id)}"
        >
          Delete
        </button>

      </div>

    `;


    taskList.appendChild(card);

  });

}

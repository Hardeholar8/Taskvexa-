<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa • Photo Feed</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=12"></script><style>body{margin:0;background:#070b14;color:#fff;font-family:Arial}.wrap{max-width:700px;margin:auto;padding:16px 14px 80px}.top{display:flex;justify-content:space-between}.back{color:#a78bfa;text-decoration:none;font-size:11px;font-weight:800}.intro{color:#94a3b8;font-size:11px}.feed{display:grid;gap:14px;margin-top:16px}.card{background:#101a2c;border:1px solid #273650;border-radius:20px;overflow:hidden}.pic{width:100%;display:block;max-height:420px;object-fit:cover;background:#0b1220}.body{padding:14px}.title{font-size:17px;font-weight:900}.desc{color:#94a3b8;font-size:10px;line-height:1.5}.meta{display:flex;justify-content:space-between;color:#c4b5fd;font-size:10px;margin:10px 0}.btn{width:100%;padding:11px;border:0;border-radius:11px;background:#7048ff;color:#fff;font-weight:900;font-size:11px}.btn:disabled{opacity:.55}</style></head><body><main class="wrap"><div class="top"><h1 style="margin:0;font-size:23px">Photo Feed</h1><a class="back" href="dashboard.html">← Dashboard</a></div><p class="intro">View sponsored photos, complete the verification step, and receive the campaign reward after successful verification.</p><section id="feed" class="feed"><div class="intro">No photos available right now.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY'),feed=document.getElementById('feed'),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){const a=await sb.auth.getUser();if(!a.data?.user){location.href='login.html';return}const now=new Date().toISOString();const r=await sb.rpc('get_active_photo_campaigns');if(r.error)throw r.error;if(!r.data?.length){feed.innerHTML='<div class="intro">No photo campaigns are available right now.</div>';return}const v=await sb.rpc('get_my_completed_photo_campaigns');if(v.error)throw v.error;const done=new Set((v.data||[]).map(x=>x.campaign_id));const completed={};feed.innerHTML=r.data.map(x=>{const d=done.has(x.id),left=Math.max(0,Number(x.target_views||0)-Number(completed[x.id]||0));return '<article class="card"><img class="pic" src="'+esc(x.image_url)+'" loading="lazy"><div class="body"><div class="title">'+esc(x.title)+'</div><p class="desc">'+esc(x.description||'')+'</p><div class="meta"><span>+₦'+Number(x.reward_per_view||0).toLocaleString('en-NG')+'</span><span>'+left+' views left</span></div><button class="btn" '+(d||!left?'disabled':'')+' data-id="'+x.id+'">'+(d?'Already viewed':!left?'Completed':'View & Verify')+'</button></div></article>'}).join('');document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>verify(b,a.data.user.id))}async function verify(b,user){b.disabled=true;b.textContent='Starting…';const camp=b.dataset.id;const start=await sb.rpc('start_photo_view',{p_campaign_id:camp});if(start.error){alert(start.error.message);b.disabled=false;b.textContent='View & Verify';return}const seconds=Math.max(1,Number(start.data?.verification_seconds||10));b.textContent='Viewing '+seconds+'s…';await new Promise(r=>setTimeout(r,seconds*1000));const answer=prompt('Verification: What main visual is shown in this photo?');if(!answer){b.disabled=false;b.textContent='View & Verify';return}const rr=await sb.rpc('complete_photo_view',{p_campaign_id:camp,p_duration_seconds:seconds,p_answer:answer||''});if(rr.error){alert(rr.error.message);b.disabled=false;b.textContent='View & Verify';return}b.textContent='Reward added ✓';}load().catch(e=>{console.error(e);feed.innerHTML='<div class="intro">Unable to load Photo Feed. Please refresh.</div>'});</script></body></html>

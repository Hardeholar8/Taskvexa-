<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskVexa - Tasks</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: #f8fafc;
  font-family: Arial, sans-serif;
}

header {
  background: #0d111b;
  border-bottom: 1px solid #202b3b;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
}

header a {
  color: #cbd5e1;
  text-decoration: none;
  font-size: 14px;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 24px 16px 60px;
}

.page-title h2 {
  margin: 0 0 7px;
  font-size: 28px;
}

.page-title p {
  margin: 0 0 24px;
  color: #94a3b8;
  line-height: 1.5;
}

/* MESSAGE */

#message {
  color: #94a3b8;
  text-align: center;
  padding: 25px 10px;
}

/* TASK CARD */

.task-card {
  background: linear-gradient(145deg, #111722, #0d131e);
  border: 1px solid #202b3b;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
}

.task-card h3 {
  margin: 0 0 10px;
  font-size: 19px;
}

.task-description {
  color: #94a3b8;
  line-height: 1.5;
  margin-bottom: 18px;
}

.task-info {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 0;
  border-top: 1px solid #1b2533;
}

.task-info span:first-child {
  color: #64748b;
}

.task-info span:last-child {
  color: #e2e8f0;
  font-weight: 700;
  text-align: right;
}

.reward {
  color: #4ade80 !important;
  font-size: 17px;
}

.task-button {
  width: 100%;
  display: block;
  margin-top: 17px;
  padding: 14px;
  border: none;
  border-radius: 13px;
  background: #f8fafc;
  color: #080b12;
  text-align: center;
  text-decoration: none;
  font-weight: 800;
  cursor: pointer;
}

/* STATUS */

.submission-status {
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 13px;
  margin: 12px 0;
}

.pending-status {
  background: #332b16;
  color: #facc15;
}

.rejected-status {
  background: #32191d;
  color: #f87171;
}

/* DETAILS */

#taskDetailsSection {
  display: none;
}

.back-button {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid #2a3648;
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  margin-bottom: 22px;
}

.details-card {
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 20px;
  padding: 20px;
}

.details-card h2 {
  margin-top: 0;
  font-size: 24px;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 13px 0;
  border-bottom: 1px solid #1b2533;
}

.detail-row span:first-child {
  color: #64748b;
}

.detail-row span:last-child {
  color: #e2e8f0;
  font-weight: 700;
  text-align: right;
}

.instructions {
  margin-top: 22px;
}

.instructions h3 {
  margin-bottom: 8px;
}

.instructions p {
  color: #cbd5e1;
  line-height: 1.6;
  white-space: pre-wrap;
}

.proof-section {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid #202b3b;
}

.proof-section p {
  color: #94a3b8;
}

input[type="file"] {
  width: 100%;
  padding: 12px;
  border: 1px solid #2a3648;
  border-radius: 12px;
  background: #0b1019;
  color: #cbd5e1;
}

#proofMessage {
  margin-top: 14px;
  line-height: 1.5;
  font-size: 14px;
}

.success {
  color: #4ade80;
}

.error {
  color: #f87171;
}

.no-tasks {
  text-align: center;
  padding: 35px 15px;
  color: #64748b;
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 18px;
}
</style>
</head>

<body>

<header>
  <h1>TaskVexa</h1>
  <a href="dashboard.html">← Dashboard</a>
</header>

<main>

  <!-- TASK LIST -->

  <section id="taskListSection">

    <div class="page-title">
      <h2>Available Tasks</h2>
      <p>Complete tasks and submit your proof for review.</p>
    </div>

    <div id="message">
      Loading tasks...
    </div>

    <div id="taskList"></div>

  </section>


  <!-- TASK DETAILS -->

  <section id="taskDetailsSection">

    <button
      id="backButton"
      class="back-button"
    >
      ← Back to Tasks
    </button>

    <div class="details-card">

      <h2 id="detailTitle"></h2>

      <div class="detail-row">
        <span>Platform</span>
        <span id="detailPlatform"></span>
      </div>

      <div class="detail-row">
        <span>Reward</span>
        <span
          id="detailReward"
          class="reward"
        ></span>
      </div>


      <div class="instructions">

        <h3>Instructions</h3>

        <p id="detailDescription"></p>

      </div>


      <a
        id="openTaskButton"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        class="task-button"
      >
        Open Task
      </a>


      <div class="proof-section">

        <h3>Submit Proof</h3>

        <p>
          Upload a screenshot showing that you completed this task.
        </p>

        <input
          type="file"
          id="proofFile"
          accept="image/*"
        >

        <button
          id="submitProofButton"
          class="task-button"
        >
          Submit Proof
        </button>

        <div id="proofMessage"></div>

      </div>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const taskList =
document.getElementById("taskList");

const message =
document.getElementById("message");

const taskListSection =
document.getElementById("taskListSection");

const taskDetailsSection =
document.getElementById("taskDetailsSection");

const backButton =
document.getElementById("backButton");

const submitProofButton =
document.getElementById("submitProofButton");

const proofMessage =
document.getElementById("proofMessage");


let currentUser = null;
let selectedTask = null;
let selectedSubmissionStatus = null;


/* =========================
   FORMAT MONEY
========================= */

function formatMoney(amount) {

  return "₦" +
    Number(amount || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   GET LOGGED IN USER
========================= */

async function getCurrentUser() {

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();

  if (error) {
    throw error;
  }

  if (!data || !data.user) {

    window.location.href =
      "login.html";

    return null;
  }

  return data.user;
}


/* =========================
   LOAD TASKS
========================= */

async function loadTasks() {

  message.textContent =
    "Loading tasks...";

  taskList.innerHTML = "";

  try {

    /*
      Get logged-in user.
    */

    currentUser =
      await getCurrentUser();

    if (!currentUser) {
      return;
    }


    /*
      Load active tasks.

      Only select the columns
      required by this page.
    */

    const {
      data: tasks,
      error: taskError
    } =
    await supabaseClient
      .from("tasks")
      .select(
        "id, title, description, platform, reward, task_url, status, created_at"
      )
      .eq(
        "status",
        "active"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (taskError) {
      throw taskError;
    }


    /*
      Load worker submissions.

      If there are no submissions,
      the result is simply empty.
    */

    const {
      data: submissions,
      error: submissionError
    } =
    await supabaseClient
      .from("task_submissions")
      .select(
        "id, task_id, status, created_at"
      )
      .eq(
        "worker_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (submissionError) {
      throw submissionError;
    }


    /*
      Latest submission status
      for each task.
    */

    const submissionMap = {};


    (submissions || []).forEach(
      submission => {

        if (
          submissionMap[
            submission.task_id
          ] === undefined
        ) {

          submissionMap[
            submission.task_id
          ] =
            String(
              submission.status || ""
            ).toLowerCase();

        }

      }
    );


    /*
      Approved tasks disappear.

      Pending tasks remain visible.

      Rejected tasks remain visible
      so the worker can submit again.
    */

    const visibleTasks =
      (tasks || []).filter(
        task => {

          const status =
            submissionMap[
              task.id
            ];

          return status !== "approved";

        }
      );


    if (
      visibleTasks.length === 0
    ) {

      message.innerHTML = `
        <div class="no-tasks">
          No tasks are currently available.
        </div>
      `;

      return;
    }


    message.textContent =
      "";


    /*
      Display tasks.
    */

    visibleTasks.forEach(
      task => {

        const submissionStatus =
          submissionMap[
            task.id
          ];


        const card =
          document.createElement(
            "section"
          );


        card.className =
          "task-card";


        let statusHTML =
          "";


        if (
          submissionStatus ===
          "pending"
        ) {

          statusHTML = `

            <div class="submission-status pending-status">
              ⏳ Your proof is pending admin review.
            </div>

          `;

        }


        if (
          submissionStatus ===
          "rejected"
        ) {

          statusHTML = `

            <div class="submission-status rejected-status">
              ❌ Previous proof rejected — you can submit again.
            </div>

          `;

        }


        card.innerHTML = `

          <h3>
            ${escapeHTML(task.title)}
          </h3>

          <div class="task-description">
            ${escapeHTML(task.description)}
          </div>

          <div class="task-info">

            <span>Platform</span>

            <span>
              ${escapeHTML(
                task.platform ||
                "Not specified"
              )}
            </span>

          </div>

          <div class="task-info">

            <span>Reward</span>

            <span class="reward">
              ${formatMoney(task.reward)}
            </span>

          </div>

          ${statusHTML}

          <button
            class="task-button view-task-button"
          >
            View Task
          </button>

        `;


        card
          .querySelector(
            ".view-task-button"
          )
          .addEventListener(
            "click",
            function() {

              showTaskDetails(
                task,
                submissionStatus
              );

            }
          );


        taskList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      "TASK LOADING ERROR:",
      error
    );


    /*
      Do not leave the user
      stuck on Loading forever.
    */

    message.innerHTML = `
      <div class="no-tasks error">
        Unable to load tasks.<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}


/* =========================
   SHOW DETAILS
========================= */

function showTaskDetails(
  task,
  submissionStatus
) {

  selectedTask =
    task;

  selectedSubmissionStatus =
    submissionStatus || null;


  document.getElementById(
    "detailTitle"
  ).textContent =
    task.title;


  document.getElementById(
    "detailPlatform"
  ).textContent =
    task.platform ||
    "Not specified";


  document.getElementById(
    "detailReward"
  ).textContent =
    formatMoney(
      task.reward
    );


  document.getElementById(
    "detailDescription"
  ).textContent =
    task.description ||
    "No instructions provided.";


  document.getElementById(
    "openTaskButton"
  ).href =
    task.task_url ||
    "#";


  document.getElementById(
    "proofFile"
  ).value =
    "";


  proofMessage.textContent =
    "";


  if (
    submissionStatus ===
    "pending"
  ) {

    proofMessage.textContent =
      "Your proof is pending admin review.";

    proofMessage.className =
      "pending-status";

    submitProofButton.disabled =
      true;

    submitProofButton.textContent =
      "Pending Review";

  }

  else if (
    submissionStatus ===
    "rejected"
  ) {

    proofMessage.textContent =
      "Your previous proof was rejected. You can submit a new proof.";

    proofMessage.className =
      "error";

    submitProofButton.disabled =
      false;

    submitProofButton.textContent =
      "Submit New Proof";

  }

  else {

    submitProofButton.disabled =
      false;

    submitProofButton.textContent =
      "Submit Proof";

  }


  taskListSection.style.display =
    "none";

  taskDetailsSection.style.display =
    "block";

  window.scrollTo(
    0,
    0
  );

}


/* =========================
   BACK BUTTON
========================= */

backButton.addEventListener(
  "click",
  function() {

    selectedTask =
      null;

    selectedSubmissionStatus =
      null;

    taskDetailsSection.style.display =
      "none";

    taskListSection.style.display =
      "block";

    proofMessage.textContent =
      "";

    loadTasks();

  }
);


/* =========================
   SUBMIT PROOF
========================= */

submitProofButton.addEventListener(
  "click",
  async function() {

    proofMessage.textContent =
      "";

    proofMessage.className =
      "";


    if (!selectedTask) {

      proofMessage.textContent =
        "Please select a task.";

      proofMessage.className =
        "error";

      return;
    }


    const file =
      document.getElementById(
        "proofFile"
      ).files[0];


    if (!file) {

      proofMessage.textContent =
        "Please upload a screenshot first.";

      proofMessage.className =
        "error";

      return;
    }


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      proofMessage.textContent =
        "Please upload an image screenshot.";

      proofMessage.className =
        "error";

      return;
    }


    try {

      submitProofButton.disabled =
        true;

      submitProofButton.textContent =
        "Submitting...";


      /*
        Confirm logged-in user.
      */

      currentUser =
        await getCurrentUser();


      if (!currentUser) {
        return;
      }


      /*
        Check previous submissions.
      */

      const {
        data: existing,
        error: existingError
      } =
      await supabaseClient
        .from("task_submissions")
        .select(
          "id, status, created_at"
        )
        .eq(
          "task_id",
          selectedTask.id
        )
        .eq(
          "worker_id",
          currentUser.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (existingError) {
        throw existingError;
      }


      const latest =
        existing &&
        existing.length
          ? existing[0]
          : null;


      if (
        latest &&
        String(
          latest.status
        ).toLowerCase() ===
        "pending"
      ) {

        proofMessage.textContent =
          "Your previous submission is still pending review.";

        proofMessage.className =
          "error";

        submitProofButton.disabled =
          true;

        submitProofButton.textContent =
          "Pending Review";

        return;
      }


      if (
        latest &&
        String(
          latest.status
        ).toLowerCase() ===
        "approved"
      ) {

        proofMessage.textContent =
          "You have already completed this task.";

        proofMessage.className =
          "error";

        submitProofButton.disabled =
          true;

        submitProofButton.textContent =
          "Already Completed";

        return;
      }


      /*
        Create safe file name.
      */

      const safeName =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const filePath =
        currentUser.id +
        "/" +
        selectedTask.id +
        "-" +
        Date.now() +
        "-" +
        safeName;


      /*
        Upload screenshot.
      */

      const {
        error: uploadError
      } =
      await supabaseClient.storage
        .from("task-proofs")
        .upload(
          filePath,
          file
        );


      if (uploadError) {
        throw uploadError;
      }


      /*
        Get public URL.
      */

      const {
        data: publicData
      } =
      supabaseClient.storage
        .from("task-proofs")
        .getPublicUrl(
          filePath
        );


      const proofUrl =
        publicData.publicUrl;


      /*
        Insert submission.
      */

      const {
        error: insertError
      } =
      await supabaseClient
        .from("task_submissions")
        .insert({

          task_id:
            selectedTask.id,

          worker_id:
            currentUser.id,

          proof_url:
            proofUrl,

          reward_amount:
            Number(
              selectedTask.reward || 0
            ),

          status:
            "pending"

        });


      if (insertError) {
        throw insertError;
      }


      proofMessage.textContent =
        "Proof submitted successfully. Waiting for admin review.";

      proofMessage.className =
        "success";


      submitProofButton.disabled =
        true;

      submitProofButton.textContent =
        "Pending Review";


      selectedSubmissionStatus =
        "pending";


    } catch (error) {

      console.error(
        "PROOF SUBMISSION ERROR:",
        error
      );


      proofMessage.textContent =
        "Error: " +
        error.message;

      proofMessage.className =
        "error";


      submitProofButton.disabled =
        false;

      submitProofButton.textContent =
        "Submit Proof";

    }

  }
);


/* =========================
   START
========================= */

loadTasks();

</script>

</body>
</html>

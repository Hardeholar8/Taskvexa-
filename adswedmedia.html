<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskVexa - Earn Offers</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f8fafc;font-family:Arial,sans-serif}header{height:70px;background:#0b0f17;border-bottom:1px solid #202b3b;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:5}.logo{font-size:21px;font-weight:800}.back{padding:9px 13px;border-radius:9px;background:#151d2a;color:#fff;border:1px solid #293548;text-decoration:none;font-size:13px;font-weight:700}.content{max-width:1200px;margin:auto;padding:22px 14px 40px}.heading{margin-bottom:16px}.heading h1{margin:0 0 7px;font-size:26px}.heading p{margin:0;color:#7f8da3;font-size:14px}.message{margin:12px 0;color:#7f8da3;font-size:13px}.error{color:#f87171}.wall{width:100%;height:720px;border:1px solid #202b3b;border-radius:16px;background:#111722;overflow:hidden}.loading{padding:35px;text-align:center;color:#7f8da3}@media(max-width:650px){.heading h1{font-size:23px}.wall{height:760px}}
</style>
</head>
<body>
<header><div class="logo">TaskVexa</div><a class="back" href="worker-tasks.html">← Back to Tasks</a></header>
<main class="content">
<section class="heading"><h1>Earn More</h1><p>Complete approved AdswedMedia offers and earn rewards on TaskVexa.</p></section>
<div id="message" class="message">Loading your offerwall...</div>
<div id="container"><div class="loading">Loading offers...</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');
const message=document.getElementById('message');
const container=document.getElementById('container');
async function init(){
 try{
  const {data,error}=await sb.auth.getUser();
  if(error) throw error;
  if(!data.user){location.href='login.html';return;}
  const user=data.user;
  const {data:p,error:pe}=await sb.from('profiles').select('role,activation_status').eq('id',user.id).maybeSingle();
  if(pe) throw pe;
  if(String(p?.role||'').toLowerCase()!=='worker') throw new Error('Worker account required.');
  if(String(p?.activation_status||'').toLowerCase()!=='active') throw new Error('Your worker account must be activated before using offers.');
  const frame=document.createElement('iframe');
  frame.className='wall';
  frame.title='AdswedMedia Offers';
  frame.loading='lazy';
  frame.referrerPolicy='strict-origin-when-cross-origin';
  frame.allow='clipboard-write';
  frame.src='https://adswedmedia.com/offer/Et3Mt71/'+encodeURIComponent(user.id);
  container.innerHTML='';
  container.appendChild(frame);
  message.textContent='Offers loaded. Complete an offer through the wall; rewards are credited after AdswedMedia confirms the conversion.';
 }catch(e){
  console.error(e);
  message.textContent=e.message||'Unable to load AdswedMedia offers.';
  message.className='message error';
  container.innerHTML='<div class="loading">Unable to load offers right now.</div>';
 }
}
init();
</script>
</body>
</html>

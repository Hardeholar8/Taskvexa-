<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TaskVexa - Admin Withdrawals</title><link rel="stylesheet" href="style.css"><style>body{background:#070a10;color:#f8fafc}.withdrawal-page{max-width:1200px;margin:auto;padding:28px}.withdrawal-page h2{margin:0 0 7px;font-size:28px}.subtitle{color:#7f8da3;font-size:13px;margin-bottom:22px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.summary-card{background:#111722;border:1px solid #202b3b;border-radius:16px;padding:18px}.summary-card small{color:#7f8da3;font-size:11px}.summary-card strong{display:block;font-size:25px;margin-top:8px}.withdrawal-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.withdrawal-card{background:#111722!important;color:#f8fafc!important;border:1px solid #202b3b!important;padding:19px!important;margin:0!important;border-radius:17px!important;box-shadow:none!important}.withdrawal-card h3{margin:0 0 14px;font-size:16px}.withdrawal-card p{margin:9px 0;color:#c5cfdd;font-size:13px}.withdrawal-card p strong{color:#fff}.status{font-weight:700;padding:5px 9px;border-radius:7px;display:inline-block}.status.pending{color:#fbbf24;background:#332a13}.status.approved{color:#4ade80;background:#12321f}.status.rejected{color:#f87171;background:#35191b}.action-buttons{display:flex;gap:10px;margin-top:17px;flex-wrap:wrap}.approve-button,.reject-button{border:none;padding:11px 18px;border-radius:9px;cursor:pointer;font-weight:700}.approve-button{background:#22c55e;color:#04120a}.reject-button{background:#ef4444;color:#fff}button:disabled{opacity:.6;cursor:not-allowed}#message{color:#7f8da3;font-size:13px;margin-bottom:15px}@media(max-width:750px){.withdrawal-page{padding:22px 14px}.summary{grid-template-columns:1fr 1fr}.withdrawal-list{grid-template-columns:1fr}}@media(max-width:450px){.summary{grid-template-columns:1fr}.withdrawal-page h2{font-size:24px}}</style></head><body><header><h1>TaskVexa Admin</h1><a href="admin.html">Admin Dashboard</a></header><main class="withdrawal-page"><h2>Withdrawal Requests</h2><div class="subtitle">Review and manage worker withdrawal requests.</div><div class="summary"><div class="summary-card"><small>PENDING</small><strong id="pendingCount">—</strong></div><div class="summary-card"><small>APPROVED</small><strong id="approvedCount">—</strong></div><div class="summary-card"><small>REJECTED</small><strong id="rejectedCount">—</strong></div></div><div id="message">Loading withdrawal requests...</div><div id="withdrawalList" class="withdrawal-list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://dxtlnrthlpdaobnbazny.supabase.co",SUPABASE_KEY="sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),message=document.getElementById("message"),withdrawalList=document.getElementById("withdrawalList");async function loadWithdrawals(){try{const{data:{user},error:userError}=await supabaseClient.auth.getUser();if(userError||!user){location.href="login.html";return}const{data:withdrawals,error}=await supabaseClient.rpc("admin_get_withdrawals");if(error)throw error;const rows=withdrawals||[],num=s=>rows.filter(x=>String(x.status||"").toLowerCase()===s).length;pendingCount.textContent=num("pending");approvedCount.textContent=num("approved");rejectedCount.textContent=num("rejected");withdrawalList.innerHTML="";if(!rows.length){message.textContent="No withdrawal requests.";return}message.textContent="";for(const withdrawal of rows){let workerEmail=null;try{const r=await supabaseClient.rpc("get_withdrawal_worker_email",{p_worker_id:withdrawal.worker_id});workerEmail=r.data||null}catch(e){}const card=document.createElement("section"),status=String(withdrawal.status||"pending").toLowerCase(),date=new Date(withdrawal.created_at).toLocaleString("en-NG");card.className="withdrawal-card";card.innerHTML=`<h3>Withdrawal Request</h3><p><strong>Worker Email:</strong> ${escapeHTML(workerEmail||"Email unavailable")}</p><p><strong>Worker ID:</strong> ${escapeHTML(withdrawal.worker_id)}</p><p><strong>Amount:</strong> ₦${Number(withdrawal.amount||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}</p><p><strong>Bank:</strong> ${escapeHTML(withdrawal.bank_name)}</p><p><strong>Account Name:</strong> ${escapeHTML(withdrawal.account_name)}</p><p><strong>Account Number:</strong> ${escapeHTML(withdrawal.account_number)}</p><p><strong>Status:</strong> <span class="status ${status}">${escapeHTML(status.charAt(0).toUpperCase()+status.slice(1))}</span></p><p><strong>Requested:</strong> ${escapeHTML(date)}</p>`;if(status==="pending"){const buttons=document.createElement("div");buttons.className="action-buttons";const approve=document.createElement("button"),reject=document.createElement("button");approve.className="approve-button";approve.textContent="Approve";reject.className="reject-button";reject.textContent="Reject";approve.onclick=()=>reviewWithdrawal(withdrawal.id,"approve",approve,reject);reject.onclick=()=>reviewWithdrawal(withdrawal.id,"reject",approve,reject);buttons.append(approve,reject);card.appendChild(buttons)}withdrawalList.appendChild(card)}}catch(error){console.error(error);message.textContent="ERROR: "+error.message}}async function reviewWithdrawal(id,action,approve,reject){if(!confirm(`Are you sure you want to ${action} this withdrawal?`))return;approve.disabled=reject.disabled=true;try{const{data,error}=await supabaseClient.rpc("review_withdrawal",{p_withdrawal_id:id,p_action:action});if(error)throw error;if(!data||data.success!==true)throw new Error(data?.message||"Withdrawal review failed.");alert(action==="approve"?"Withdrawal approved successfully.":"Withdrawal rejected successfully.");await loadWithdrawals()}catch(error){alert("Error: "+error.message);approve.disabled=reject.disabled=false}}function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}loadWithdrawals();</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-store"><title>TaskVexa - Airtime</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,Helvetica,sans-serif;min-height:100vh}.wrap{max-width:820px;margin:auto;padding:26px 16px 100px}.card{background:#0d1422;border:1px solid #1d293d;border-radius:20px;padding:22px;margin-bottom:18px}label{display:block;color:#cbd5e1;font-size:12px;font-weight:700;margin:16px 0 7px}input,select{width:100%;padding:14px;background:#090e18;border:1px solid #263247;border-radius:11px;color:#fff;font-size:15px;outline:none}button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:16px;background:#7c3aed;color:white;font-size:14px;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.message{font-size:13px;margin-top:12px;min-height:18px}.error{color:#fca5a5}.success{color:#86efac}</style></head><body><main class="wrap"><h1>Buy Airtime</h1><section class="card"><label for="network">Network</label><select id="network"><option value="MTN">MTN</option><option value="Airtel">Airtel</option><option value="Glo">Glo</option><option value="9mobile">9mobile</option></select><label for="phone">Phone number</label><input id="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="08012345678"><label for="amount">Amount</label><input id="amount" type="number" min="50" max="50000" placeholder="100"><button id="buy">Buy Airtime</button><div id="message" class="message"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://dxtlnrthlpdaobnbazny.supabase.co';const SUPABASE_KEY='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);
$('buy').addEventListener('click',async()=>{const raw=String($('phone').value??'');const phone=raw.replace(/\D/g,'');const amount=Number($('amount').value);const network=$('network').value;const m=$('message');m.className='message';m.textContent='';if(phone.length!==11||phone[0]!=='0'){m.classList.add('error');m.textContent='Enter a valid 11-digit Nigerian phone number.';return}if(!Number.isFinite(amount)||amount<50||amount>50000){m.classList.add('error');m.textContent='Enter an amount between ₦50 and ₦50,000.';return}$('buy').disabled=true;$('buy').textContent='Processing...';try{const {data:sessionData,error:sessionError}=await sb.auth.getSession();if(sessionError||!sessionData.session)throw new Error('Your session has expired. Please log in again.');const payload={action:'purchase',network:network,phone:phone,phone_number:phone,mobile_number:phone,phoneNumber:phone,amount:amount};const {data:result,error}=await sb.functions.invoke('airtime-service',{body:payload});if(error){throw new Error(error.message||'Unable to connect to Airtime service.')}if(!result?.success){throw new Error(result?.message||'Airtime purchase failed.')}m.classList.add('success');m.textContent=result.message||'Airtime purchased successfully.'}catch(e){m.classList.add('error');m.textContent=e.message||'Airtime purchase failed.'}finally{$('buy').disabled=false;$('buy').textContent='Buy Airtime'}});
</script></body></html>

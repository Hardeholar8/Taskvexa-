<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a10"><title>TaskVexa — Withdraw</title><link rel="stylesheet" href="/filora-theme.css?v=8"><style>body{margin:0;background:#070a10;color:#f5f7fb;font-family:Arial,sans-serif}.page{max-width:620px;margin:auto;padding:16px 14px 40px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{width:42px;height:42px;border-radius:14px;background:#101722;border:1px solid #202c3e;color:#fff;text-decoration:none;display:grid;place-items:center;font-size:24px}.brand strong{display:block;font-size:17px}.brand span{display:block;color:#718096;font-size:11px;margin-top:3px}.card{background:linear-gradient(145deg,#111a27,#0c121c);border:1px solid #202c3e;border-radius:20px;padding:18px;margin-bottom:13px}.center{text-align:center}.label{color:#7f8da3;text-transform:uppercase;letter-spacing:1px;font-size:10px;font-weight:800}.balance{font-size:38px;font-weight:900;margin:8px 0}.type{font-size:12px;color:#9aa8bb}.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.row h2{font-size:16px;margin:0}.pill{font-size:9px;font-weight:900;padding:6px 9px;border-radius:99px;background:#103522;color:#61e58b}.account{padding:13px;border:1px solid #243249;background:#0a1019;border-radius:15px;margin-bottom:16px}.account strong,.account span{display:block}.account span{color:#7d8ba0;font-size:11px;margin-top:4px}.amount-label{font-size:12px;font-weight:800;margin-bottom:7px}.input{width:100%;box-sizing:border-box;border:1px solid #29374b;background:#080e17;color:#fff;border-radius:14px;padding:16px;font-size:21px;font-weight:800}.quick{display:flex;gap:7px;margin-top:9px}.quick button{flex:1;border:1px solid #263449;background:#0c131e;color:#aab6c7;border-radius:10px;padding:9px 3px;font-size:10px;font-weight:800}.btn{width:100%;border:0;border-radius:14px;margin-top:13px;padding:15px;background:#f4f7fb;color:#080c12;font-size:14px;font-weight:900}.btn:disabled{opacity:.5}.msg{margin-top:10px;padding:11px;border-radius:11px;font-size:11px;display:none;white-space:pre-line}.msg.show{display:block}.ok{color:#65e68e;background:#0c2116}.err{color:#fb7185;background:#251017}.history{padding:12px;border:1px solid #202c3e;background:#0a1019;border-radius:15px;margin-top:8px}.history-top{display:flex;justify-content:space-between}.history small{display:block;color:#7d8ba0;margin-top:7px;font-size:10px}.status{font-size:9px;font-weight:900}.empty{color:#65748a;font-size:11px;text-align:center;padding:15px}</style><link rel="stylesheet" href="/filora-theme.css?v=1">

</head><body><main class="page"><div class="top"><a class="back" href="wallet.html">‹</a><div class="brand"><strong id="title">Withdraw</strong><span id="subtitle">Select balance and withdraw to your verified account</span></div></div><section class="card center"><div class="label" id="balanceLabel">Task Balance</div><div class="balance" id="balance">₦0.00</div><div class="type" id="balanceMessage">Loading...</div></section><section class="card"><div class="row"><h2>Withdrawal Account</h2><span class="pill" id="verify">CHECKING</span></div><div class="account"><strong id="bank">Loading bank...</strong><span id="account">•••• ••••</span><span id="name">Checking account...</span></div><div class="amount-label">Withdrawal Amount</div><input class="input" id="amount" type="number" min="1" step="0.01" inputmode="decimal" placeholder="0.00"><div class="quick"><button data-v="25">₦25</button><button data-v="50">₦50</button><button data-v="100">₦100</button><button id="max">MAX</button></div><button class="btn" id="withdraw">Withdraw Automatically</button><div class="msg" id="msg"></div></section><section class="card"><div class="row"><h2>Withdrawal History</h2><span style="color:#69788e;font-size:10px">Latest</span></div><div id="history"><div class="empty">Loading...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://dxtlnrthlpdaobnbazny.supabase.co',KEY='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY',sb=window.supabase.createClient(URL,KEY);const $=id=>document.getElementById(id),money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});let user,payout,balanceType=new URLSearchParams(location.search).get('type')==='affiliate'?'affiliate':'task',currentBalance=0;const label=balanceType==='affiliate'?'Affiliate Balance':'Task Balance';$('balanceLabel').textContent=label;$('title').textContent='Withdraw '+(balanceType==='affiliate'?'Affiliate':'Task')+' Balance';$('subtitle').textContent='Withdraw from your '+(balanceType==='affiliate'?'affiliate':'task')+' balance';function message(t,ok=false){$('msg').className='msg show '+(ok?'ok':'err');$('msg').textContent=t}function setAmount(v){$('amount').value=Number(v||0)>0?Number(v).toFixed(2):''}async function init(){const r=await sb.auth.getUser();if(r.error||!r.data.user){location.href='login.html';return}user=r.data.user;await Promise.all([loadBalance(),loadAccount(),loadHistory()])}async function loadBalance(){const r=await sb.from('wallets').select('balance,affiliate_balance').eq('user_id',user.id).maybeSingle();if(r.error){$('balanceMessage').textContent='Unable to load balance';return}currentBalance=Number(balanceType==='affiliate'?r.data?.affiliate_balance:r.data?.balance)||0;$('balance').textContent=money(currentBalance);$('balanceMessage').textContent='Available for '+(balanceType==='affiliate'?'affiliate':'task')+' withdrawal'}async function loadAccount(){const r=await sb.from('payout_accounts').select('bank_name,account_number,account_name,verification_status').eq('user_id',user.id).eq('verification_status','verified').maybeSingle();if(r.error||!r.data){$('verify').textContent='NOT VERIFIED';$('verify').style.background='#35171e';$('verify').style.color='#fb7185';$('withdraw').disabled=true;return}payout=r.data;$('verify').textContent='VERIFIED';$('bank').textContent=r.data.bank_name||'Verified bank';$('account').textContent='•••• •••• '+String(r.data.account_number||'').slice(-4);$('name').textContent=r.data.account_name||'Verified account'}async function loadHistory(){const r=await sb.from('withdrawals').select('amount,status,created_at,balance_type,account_number').eq('worker_id',user.id).order('created_at',{ascending:false}).limit(30);if(r.error){$('history').innerHTML='<div class="empty">Unable to load withdrawal history.</div>';return}if(!r.data?.length){$('history').innerHTML='<div class="empty">No withdrawal requests yet.</div>';return}$('history').innerHTML=r.data.map(w=>'<div class="history"><div class="history-top"><strong>'+money(w.amount)+'</strong><span class="status">'+String(w.status||'pending').toUpperCase()+'</span></div><small>'+(w.balance_type==='affiliate'?'Affiliate Balance':'Task Balance')+' · '+new Date(w.created_at).toLocaleString('en-NG')+' · ••••'+String(w.account_number||'').slice(-4)+'</small></div>').join('')}document.querySelectorAll('.quick button[data-v]').forEach(b=>b.onclick=()=>setAmount(b.dataset.v));$('max').onclick=()=>setAmount(currentBalance);$('withdraw').onclick=async()=>{const amount=Number($('amount').value),btn=$('withdraw');$('msg').className='msg';if(!payout){message('Verify your payout account first.');return}if(!amount||amount<=0){message('Enter a valid withdrawal amount.');return}if(amount>currentBalance){message('Insufficient balance.');return}btn.disabled=true;btn.textContent='Processing...';try{const c=await sb.rpc('set_withdrawal_balance_type',{p_balance_type:balanceType});if(c.error||!c.data?.success)throw Error(c.data?.message||c.error?.message||'Unable to select balance.');const s=await sb.auth.getSession();if(!s.data.session)throw Error('Session expired. Please log in again.');const res=await fetch(URL+'/functions/v1/process-withdrawal',{method:'POST',headers:{Authorization:'Bearer '+s.data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({amount,balance_type:balanceType})});const result=await res.json().catch(()=>({}));if(!res.ok||!result.success){message(result.message||result.error||'Automatic withdrawal failed.');return}message(result.message||'Withdrawal is being processed.',true);$('amount').value='';await Promise.all([loadBalance(),loadHistory()])}catch(e){message(e.message||'Automatic withdrawal failed.')}finally{btn.disabled=!payout;btn.textContent='Withdraw Automatically'}};init();</script></body></html>

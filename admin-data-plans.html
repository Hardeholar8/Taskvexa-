<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Data Plans</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#101828;font-family:Arial,sans-serif}.top{height:66px;background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;gap:16px;padding:0 18px;position:sticky;top:0;z-index:5}.back{color:#5146c8;text-decoration:none;font-weight:700}.brand{font-size:21px;font-weight:900}.brand span{color:#5146c8}.wrap{max-width:1100px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px rgba(16,24,40,.06)}.h{font-size:20px;margin:0 0 5px}.muted{color:#667085;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-size:11px;color:#475467;margin:0 0 6px}input,select{width:100%;padding:11px;background:#fff;border:1px solid #d0d5dd;border-radius:10px;color:#101828;outline:none}input:focus,select:focus{border-color:#7c72e8;box-shadow:0 0 0 3px rgba(81,70,200,.08)}.btn{margin-top:14px;padding:11px 16px;border:0;border-radius:10px;background:#5146c8;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}.plans{overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr .8fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eaecf0;font-size:12px}.row span{color:#344054}.row[style]{color:#101828}.tag{padding:5px 7px;border-radius:8px;background:#f2f4f7;display:inline-block}.del{border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:8px;padding:7px 9px;cursor:pointer;font-weight:700}.del:hover{background:#f8f9fc}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{min-width:700px}.plans{overflow-x:auto}.top{padding:0 14px}}</style><link rel="stylesheet" href="/filora-theme.css?v=1">
<script src="/theme.js?v=9"></script>
</head><body><header class="top"><a class="back" href="admin.html">← Admin</a><div class="brand">Task<span>Vexa</span></div></header><main class="wrap"><section class="card"><h1 class="h">Data Plans</h1><p class="muted">Add and manage the bundles shown on the worker Data page.</p></section><section class="card"><div class="grid"><div><label>Network</label><select id="network"><option value="mtn">MTN</option><option value="airtel">Airtel</option><option value="glo">Glo</option><option value="9mobile">9mobile</option></select></div><div><label>Service ID</label><input id="serviceId" placeholder="e.g. MTN-1GB"></div><div><label>Plan name</label><input id="planName" placeholder="1GB Daily"></div><div><label>Data amount</label><input id="dataAmount" placeholder="1GB"></div><div><label>Price</label><input id="price" inputmode="decimal" placeholder="0"></div><div><label>Provider price (optional)</label><input id="providerPrice" inputmode="decimal" placeholder="0"></div><div><label>Sort order</label><input id="sortOrder" inputmode="numeric" value="0"></div></div><button type="button" class="btn" id="add">Add Data Plan</button><div id="msg" class="muted" style="margin-top:10px"></div></section><section class="card"><h2 class="h">Configured Plans</h2><div class="plans"><div class="row" style="font-weight:800"><span>Network</span><span>Service ID</span><span>Plan</span><span>Data</span><span>Price</span><span>Action</span></div><div id="list" class="muted">Loading...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://dxtlnrthlpdaobnbazny.supabase.co';
const SUPABASE_KEY='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY';
let sb;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(t,error=false){$('msg').textContent=t;$('msg').style.color=error?'#b42318':'';}
function fail(t){$('list').textContent=t;show(t,true);}
async function init(){try{if(!window.supabase||!window.supabase.createClient)throw new Error('Supabase library failed to load. Refresh the page.');sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const u=await sb.auth.getUser();if(u.error)throw u.error;if(!u.data.user){location.href='login.html';return false}const p=await sb.from('profiles').select('role').eq('id',u.data.user.id).maybeSingle();if(p.error)throw p.error;if(String(p.data?.role||'').toLowerCase()!=='admin'){location.href='login.html';return false}await load();return true}catch(e){fail('Unable to load plans: '+(e.message||String(e)));return false}}
async function load(){const r=await sb.from('data_plans').select('id,network,service_id,plan_name,data_amount,price,is_active,sort_order').order('network').order('sort_order');if(r.error){fail('Unable to load plans: '+r.error.message);return}const rows=r.data||[];$('list').innerHTML=rows.length?rows.map(x=>`<div class="row"><span class="tag">${esc(x.network)}</span><span>${esc(x.service_id)}</span><span>${esc(x.plan_name)}</span><span>${esc(x.data_amount)}</span><span>₦${Number(x.price).toLocaleString('en-NG')}</span><span><button type="button" class="del" data-id="${x.id}">${x.is_active?'Disable':'Enable'}</button></span></div>`).join(''):'No plans configured yet.';document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{const current=rows.find(x=>x.id===b.dataset.id);if(!current)return;b.disabled=true;const r=await sb.from('data_plans').update({is_active:!current.is_active,updated_at:new Date().toISOString()}).eq('id',current.id);if(r.error){show(r.error.message,true);b.disabled=false}else await load()})}
async function addPlan(){const btn=$('add');btn.disabled=true;show('Saving...');try{const payload={network:$('network').value,service_id:$('serviceId').value.trim(),plan_name:$('planName').value.trim(),data_amount:$('dataAmount').value.trim(),price:Number($('price').value),provider_price:$('providerPrice').value.trim()?Number($('providerPrice').value):null,sort_order:Number($('sortOrder').value||0),is_active:true};if(!payload.service_id||!payload.plan_name||!payload.data_amount||!(payload.price>0))throw new Error('Fill Service ID, Plan name, Data amount and a valid price.');const r=await sb.from('data_plans').insert(payload);if(r.error)throw r.error;show('Data plan added.');['serviceId','planName','dataAmount','price','providerPrice'].forEach(id=>$(id).value='');await load()}catch(e){show(e.message||String(e),true)}finally{btn.disabled=false}}
document.addEventListener('DOMContentLoaded',()=>{$('add').addEventListener('click',addPlan);init()});
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TaskVexa - Activate Worker Account</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 15px 70px}.back{color:#c4b5fd;text-decoration:none}.card{background:#0d1422;border:1px solid #1d293d;border-radius:18px;padding:20px;margin:16px 0}.level{border:1px solid #293548;border-radius:14px;padding:15px;margin:10px 0;cursor:pointer}.level.selected{border-color:#a78bfa;background:#18112b}.level input{margin-right:8px}label{display:block;font-size:12px;color:#aeb9ca;margin:13px 0 6px}input[type=text],input[type=file],textarea{width:100%;padding:11px;background:#090e18;color:#fff;border:1px solid #293548;border-radius:9px}button{padding:12px 16px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.muted{color:#94a3b8;font-size:13px;line-height:1.6}.amount{font-size:21px;font-weight:800;color:#c4b5fd}.error{color:#fca5a5}.success{color:#86efac}.details{line-height:1.8;font-size:13px}</style></head><body><main class="wrap"><a class="back" href="dashboard.html">← Dashboard</a><h1>Activate Worker Account</h1><p class="muted">Choose an activation level, follow the payment instructions, then submit your payment reference and proof for admin review.</p><section class="card"><h2>Available Activation Levels</h2><div id="levels">Loading activation levels...</div></section><section class="card"><h2>Payment Details</h2><div id="payment" class="details">Loading payment details...</div></section><section class="card"><h2>Submit Activation</h2><label>Payment Reference</label><input id="reference" type="text" placeholder="Enter your payment reference"><label>Payment Proof</label><input id="proof" type="file" accept="image/*"><label>Optional Note</label><textarea id="note" rows="3" placeholder="Optional note"></textarea><br><br><button id="submit">Submit Activation Request</button><div id="msg" class="muted"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY'),$=id=>document.getElementById(id);let user,selectedLevel,settings;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function init(){try{const {data,error}=await sb.auth.getUser();if(error||!data.user){location.href='login.html';return}user=data.user;const {data:p,error:pe}=await sb.from('profiles').select('role,activation_status,activation_level').eq('id',user.id).maybeSingle();if(pe)throw pe;if(String(p?.role||'').toLowerCase()!=='worker')throw new Error('Worker account required.');if(['active','activated','approved','true'].includes(String(p?.activation_status||'').toLowerCase())||Number(p?.activation_level||0)>0){$('msg').textContent='Your account is already activated.';$('msg').className='muted success';return}const {data:s,error:se}=await sb.from('worker_activation_settings').select('level_1_amount,level_2_amount').eq('id',true).maybeSingle();if(se)throw se;settings=s||{};const levels=[{level:1,amount:settings.level_1_amount},{level:2,amount:settings.level_2_amount}].filter(x=>x.amount!==null&&x.amount!==undefined);$('levels').innerHTML=levels.length?levels.map(x=>`<label class="level" id="level-${x.level}"><input type="radio" name="level" value="${x.level}">Level ${x.level}<div class="amount">₦${Number(x.amount).toLocaleString('en-NG')}</div></label>`).join(''):'<p class="muted">No activation levels are currently configured by admin.</p>';document.querySelectorAll('input[name=level]').forEach(r=>r.onchange=()=>{selectedLevel=Number(r.value);document.querySelectorAll('.level').forEach(x=>x.classList.remove('selected'));$('level-'+selectedLevel).classList.add('selected')});const {data:pay,error:pa}=await sb.from('promoter_payment_details').select('bank_name,account_name,account_number,instructions').order('updated_at',{ascending:false}).limit(1).maybeSingle();if(pa)throw pa;if(pay){$('payment').innerHTML=`<b>Bank:</b> ${esc(pay.bank_name)}<br><b>Account Name:</b> ${esc(pay.account_name)}<br><b>Account Number:</b> ${esc(pay.account_number)}<br><b>Instructions:</b> ${esc(pay.instructions||'Follow the payment instructions above.')}`}else $('payment').textContent='Payment details have not been configured yet.'}catch(e){$('msg').textContent=e.message||'Unable to load activation page.';$('msg').className='muted error'}}$('submit').onclick=async()=>{try{if(!selectedLevel)return $('msg').textContent='Please select an activation level.';const ref=$('reference').value.trim(),file=$('proof').files[0];if(!ref)return $('msg').textContent='Please enter your payment reference.';if(!file)return $('msg').textContent='Please upload payment proof.';const amount=selectedLevel===1?Number(settings.level_1_amount):Number(settings.level_2_amount);if(!amount)throw new Error('This activation level is not configured.');$('submit').disabled=true;$('msg').textContent='Submitting...';const path=user.id+'/activation-'+selectedLevel+'-'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await sb.storage.from('task-proofs').upload(path,file,{upsert:false,contentType:file.type});if(up.error)throw up.error;const proof=sb.storage.from('task-proofs').getPublicUrl(path).data.publicUrl;const ins=await sb.from('worker_activation_requests').insert({worker_id:user.id,level:selectedLevel,amount,payment_reference:ref,proof_url:proof,status:'pending'});if(ins.error)throw ins.error;$('msg').textContent='Activation request submitted. Please wait for admin review.';$('msg').className='muted success';$('submit').disabled=true}catch(e){$('msg').textContent=e.message||'Submission failed.';$('msg').className='muted error';$('submit').disabled=false}};init();</script></body></html>

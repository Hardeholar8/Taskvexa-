<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskVexa - Admin Submissions</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: #f8fafc;
  font-family: Arial, sans-serif;
}

/* HEADER */

header {
  background: #0d111b;
  border-bottom: 1px solid #202b3b;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 800;
}

header a {
  color: #cbd5e1;
  text-decoration: none;
  font-size: 14px;
}

/* MAIN */

main {
  max-width: 700px;
  margin: auto;
  padding: 25px 16px 60px;
}

.page-title {
  margin-bottom: 22px;
}

.page-title h2 {
  margin: 0 0 7px;
  font-size: 27px;
}

.page-title p {
  margin: 0;
  color: #64748b;
  font-size: 14px;
}

/* MESSAGE */

#message {
  margin-bottom: 15px;
  color: #94a3b8;
  text-align: center;
}

/* SUBMISSION CARD */

.submission-card {
  background: linear-gradient(
    145deg,
    #111722,
    #0d131e
  );

  border: 1px solid #202b3b;

  border-radius: 20px;

  padding: 20px;

  margin-bottom: 17px;

  box-shadow:
    0 12px 30px rgba(0,0,0,.25);
}

/* TOP */

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
  margin-bottom: 18px;
}

.card-top h3 {
  margin: 0;
  font-size: 19px;
}

.pending-badge {
  background: #332b16;
  color: #facc15;
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}

/* INFO */

.info-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 11px 0;
  border-top: 1px solid #1b2533;
  font-size: 13px;
}

.info-label {
  color: #64748b;
}

.info-value {
  color: #e2e8f0;
  text-align: right;
  word-break: break-word;
}

.reward {
  color: #4ade80;
  font-weight: 800;
}

/* SCREENSHOT */

.proof-box {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid #1b2533;
}

.proof-title {
  margin-bottom: 10px;
  font-size: 14px;
  font-weight: 700;
}

.proof-image {
  width: 100%;
  max-height: 430px;
  object-fit: contain;
  border-radius: 14px;
  background: #080b12;
  border: 1px solid #2a3648;
  display: block;
  cursor: pointer;
}

.no-proof {
  padding: 18px;
  border-radius: 12px;
  background: #0b1019;
  color: #64748b;
  text-align: center;
  font-size: 13px;
}

/* BUTTONS */

.actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  flex: 1;
}

.approve-button {
  background: #4ade80;
  color: #06120b;
}

.reject-button {
  background: #32191d;
  color: #f87171;
  border: 1px solid #54242b;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* EMPTY */

.empty {
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 18px;
  padding: 35px 20px;
  text-align: center;
  color: #64748b;
}

/* ERROR */

.error {
  color: #f87171 !important;
}

/* LOADING */

.loading {
  text-align: center;
  padding: 30px;
  color: #64748b;
}

/* IMAGE MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  z-index: 9999;
  padding: 20px;
  align-items: center;
  justify-content: center;
}

.modal img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 10px;
}

.close-modal {
  position: fixed;
  top: 18px;
  right: 20px;
  color: white;
  font-size: 30px;
  cursor: pointer;
}

/* MOBILE */

@media (max-width: 500px) {

  main {
    padding: 20px 12px 50px;
  }

  .card-top {
    flex-direction: column;
  }

  .actions {
    flex-direction: column;
  }

}

</style>
</head>


<body>


<header>

  <h1>TaskVexa Admin</h1>

  <a href="dashboard.html">
    ← Dashboard
  </a>

</header>


<main>


  <div class="page-title">

    <h2>
      Task Submissions
    </h2>

    <p>
      Review worker proofs and approve or reject completed tasks.
    </p>

  </div>


  <div id="message" class="loading">
    Loading submissions...
  </div>


  <div id="submissionList"></div>


</main>


<!-- IMAGE PREVIEW MODAL -->

<div
  id="imageModal"
  class="modal"
>

  <span
    id="closeModal"
    class="close-modal"
  >
    ×
  </span>

  <img
    id="modalImage"
    src=""
    alt="Proof Screenshot"
  >

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const message =
document.getElementById(
  "message"
);

const submissionList =
document.getElementById(
  "submissionList"
);


/* =========================
   LOAD SUBMISSIONS
========================= */

async function loadSubmissions() {

  message.textContent =
    "Loading submissions...";

  message.className =
    "loading";

  submissionList.innerHTML =
    "";


  try {

    /*
      Confirm logged-in admin.
    */

    const {
      data: { user },
      error: userError
    } =
    await supabaseClient.auth.getUser();


    if (
      userError ||
      !user
    ) {

      window.location.href =
        "login.html";

      return;

    }


    /*
      Load pending submissions
      using the existing secure RPC.
    */

    const {
      data: submissions,
      error
    } =
    await supabaseClient.rpc(
      "get_admin_pending_submissions"
    );


    if (error) {

      throw error;

    }


    if (
      !submissions ||
      submissions.length === 0
    ) {

      message.textContent =
        "No pending submissions.";

      message.className =
        "empty";

      return;

    }


    message.textContent =
      `${submissions.length} pending submission${
        submissions.length === 1 ? "" : "s"
      }`;

    message.className =
      "";


    /*
      Create cards.
    */

    submissions.forEach(
      submission => {

        const card =
          document.createElement(
            "section"
          );

        card.className =
          "submission-card";


        const reward =
          Number(
            submission.reward_amount ||
            submission.task_reward ||
            0
          );


        const date =
          submission.created_at
            ? new Date(
                submission.created_at
              ).toLocaleString(
                "en-NG"
              )
            : "-";


        card.innerHTML = `

          <div class="card-top">

            <h3>
              ${escapeHTML(
                submission.task_title ||
                "Task"
              )}
            </h3>

            <span class="pending-badge">
              PENDING
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Platform
            </span>

            <span class="info-value">
              ${escapeHTML(
                submission.task_platform ||
                "Not specified"
              )}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Reward
            </span>

            <span class="info-value reward">
              ₦${reward.toLocaleString(
                "en-NG"
              )}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Worker Email
            </span>

            <span class="info-value">
              ${escapeHTML(
                submission.worker_email ||
                "Email unavailable"
              )}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Worker ID
            </span>

            <span class="info-value">
              ${escapeHTML(
                submission.worker_id ||
                "-"
              )}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Submitted
            </span>

            <span class="info-value">
              ${escapeHTML(date)}
            </span>

          </div>


          <div class="proof-box">

            <div class="proof-title">
              📷 Worker Proof
            </div>

            ${
              submission.proof_url
              ?
              `
                <img
                  src="${escapeHTML(
                    submission.proof_url
                  )}"
                  class="proof-image"
                  alt="Worker proof"
                >
              `
              :
              `
                <div class="no-proof">
                  No screenshot uploaded.
                </div>
              `
            }

          </div>


          <div class="actions">

            <button
              class="approve-button"
            >
              ✓ Approve
            </button>

            <button
              class="reject-button"
            >
              ✕ Reject
            </button>

          </div>

        `;


        const approveButton =
          card.querySelector(
            ".approve-button"
          );

        const rejectButton =
          card.querySelector(
            ".reject-button"
          );


        approveButton.addEventListener(
          "click",
          () => {

            reviewSubmission(
              submission.id,
              "approved",
              approveButton,
              rejectButton
            );

          }
        );


        rejectButton.addEventListener(
          "click",
          () => {

            reviewSubmission(
              submission.id,
              "rejected",
              approveButton,
              rejectButton
            );

          }
        );


        /*
          Click screenshot to enlarge.
        */

        const proofImage =
          card.querySelector(
            ".proof-image"
          );


        if (proofImage) {

          proofImage.addEventListener(
            "click",
            () => {

              openImage(
                proofImage.src
              );

            }
          );

        }


        submissionList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      "SUBMISSIONS ERROR:",
      error
    );


    message.textContent =
      "Unable to load submissions: " +
      error.message;

    message.className =
      "error";

  }

}


/* =========================
   REVIEW SUBMISSION
========================= */

async function reviewSubmission(
  submissionId,
  newStatus,
  approveButton,
  rejectButton
) {

  const action =
    newStatus === "approved"
      ? "approve"
      : "reject";


  const confirmation =
    action === "approve"
      ? "Approve this submission and credit the worker's reward?"
      : "Reject this submission?";


  if (
    !confirm(
      confirmation
    )
  ) {

    return;

  }


  try {

    approveButton.disabled =
      true;

    rejectButton.disabled =
      true;


    if (
      action === "approve"
    ) {

      approveButton.textContent =
        "Approving...";

    } else {

      rejectButton.textContent =
        "Rejecting...";

    }


    /*
      Use the existing secure
      database function.

      This keeps reward crediting
      inside Supabase.
    */

    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "review_task_submission",
      {
        p_submission_id:
          submissionId,

        p_action:
          action
      }
    );


    if (error) {

      throw error;

    }


    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.message ||
        "The submission could not be reviewed."
      );

    }


    if (
      action === "approve"
    ) {

      alert(
        "Submission approved. Worker reward credited successfully."
      );

    } else {

      alert(
        "Submission rejected successfully."
      );

    }


    /*
      Reload pending list.
    */

    await loadSubmissions();


  } catch (error) {

    console.error(
      "REVIEW ERROR:",
      error
    );


    alert(
      "Error: " +
      error.message
    );


    approveButton.disabled =
      false;

    rejectButton.disabled =
      false;

    approveButton.textContent =
      "✓ Approve";

    rejectButton.textContent =
      "✕ Reject";

  }

}


/* =========================
   IMAGE MODAL
========================= */

const imageModal =
document.getElementById(
  "imageModal"
);

const modalImage =
document.getElementById(
  "modalImage"
);

const closeModal =
document.getElementById(
  "closeModal"
);


function openImage(
  imageUrl
) {

  modalImage.src =
    imageUrl;

  imageModal.style.display =
    "flex";

}


closeModal.addEventListener(
  "click",
  () => {

    imageModal.style.display =
      "none";

    modalImage.src =
      "";

  }
);


imageModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      imageModal
    ) {

      imageModal.style.display =
        "none";

      modalImage.src =
        "";

    }

  }
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   START
========================= */

loadSubmissions();

</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TaskVexa - Promoter Dashboard</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/theme.js?v=9"></script></head><body><div id="app">Loading Promoter Hub...</div><script>
const SUPABASE_URL='https://dxtlnrthlpdaobnbazny.supabase.co';
const SUPABASE_KEY=window.TASKVEXA_SUPABASE_ANON_KEY||'';
const sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
async function boot(){
 if(!sb){app.innerHTML='<main style="padding:30px"><h2>Promoter Hub</h2><p>Configuration error. Please refresh.</p></main>';return}
 const {data:{session}}=await sb.auth.getSession();
 if(!session){location.href='login.html?role=promoter';return}
 const uid=session.user.id;
 let profile=null;
 const p=await sb.from('profiles').select('full_name,email,role').eq('id',uid).maybeSingle();
 profile=p.data||{};
 const role=String(profile.role||'').toLowerCase();
 if(role!=='promoter'){app.innerHTML='<main style="padding:30px"><h2>Promoter access required</h2><p>This account is not a promoter account.</p></main>';return}
 app.innerHTML=`<main style="max-width:1100px;margin:auto;padding:24px"><h1>Welcome back, ${escapeHtml(profile.full_name||'Promoter')}</h1><p>Promoter Hub</p><div id="status">Loading account data...</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px"><section class="card"><h3>Wallet Balance</h3><strong id="balance">₦0</strong></section><section class="card"><h3>My Tasks</h3><strong id="taskCount">0</strong></section><section class="card"><h3>Quick Actions</h3><button id="create">Create Task</button> <a href="promoter-wallet.html">Wallet</a></section></div><section class="card" style="margin-top:20px"><h3>Recent Tasks</h3><div id="tasks">Loading...</div></section><button id="logout">Logout</button></main>`;
 document.getElementById('create').onclick=()=>location.href='promoter-create-task.html';
 document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='login.html'};
 await loadData();
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadData(){
 const b=await sb.rpc('get_my_promoter_wallet');
 if(!b.error){const v=Array.isArray(b.data)?b.data[0]?.balance:b.data?.balance??b.data??0;document.getElementById('balance').textContent='₦'+Number(v||0).toLocaleString()}
 const t=await sb.rpc('get_my_promoter_tasks');
 if(t.error){document.getElementById('tasks').textContent='Unable to load tasks. Please refresh.';document.getElementById('status').textContent='Some promoter data could not be loaded.';return}
 const rows=Array.isArray(t.data)?t.data:[];document.getElementById('taskCount').textContent=rows.length;document.getElementById('status').textContent='Account active';document.getElementById('tasks').innerHTML=rows.length?rows.slice(0,10).map(x=>`<div style="padding:12px 0;border-bottom:1px solid #ddd"><b>${escapeHtml(x.title||'Untitled')}</b><br><small>${escapeHtml(x.status||'pending')} · ${escapeHtml(x.platform||'')}</small></div>`).join(''):'No tasks yet.';
}
boot().catch(e=>{console.error(e);app.innerHTML='<main style="padding:30px"><h2>Promoter Hub</h2><p>Unable to load your account. Please refresh.</p></main>'});
</script></body></html>

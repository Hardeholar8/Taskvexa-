<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskVexa - Promoter Wallet</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .debug {
      background:#111827;
      color:white;
      padding:15px;
      margin:15px;
      border-radius:10px;
      white-space:pre-wrap;
      font-size:14px;
    }

    .box {
      margin:15px;
      padding:20px;
      border-radius:12px;
      background:#f3f4f6;
    }

    .hidden {
      display:none;
    }

    .balance {
      font-size:30px;
      font-weight:bold;
    }

    .success {
      color:green;
    }

    .error {
      color:red;
    }

    .payment-detail {
      background:white;
      padding:12px;
      margin:10px 0;
      border-radius:8px;
    }

    .account-number {
      font-size:20px;
      font-weight:bold;
    }

    input, button {
      padding:12px;
      margin:5px 0;
      box-sizing:border-box;
      width:100%;
    }

    button {
      cursor:pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>TaskVexa</h1>
  <a href="promoter-dashboard.html">Promoter Dashboard</a>
</header>

<main>

  <h2>Promoter Wallet</h2>

  <div id="debug" class="debug">Starting...</div>

  <p id="message">Checking account...</p>

  <section id="walletSection" class="box hidden">
    <h3>Available Balance</h3>
    <p class="balance">
      ₦<span id="balance">0</span>
    </p>
  </section>

  <section id="paymentSection" class="box hidden">
    <h3>Payment Details</h3>

    <div class="payment-detail">
      <strong>Bank Name</strong>
      <span id="bankName">Loading...</span>
    </div>

    <div class="payment-detail">
      <strong>Account Name</strong>
      <span id="accountName">Loading...</span>
    </div>

    <div class="payment-detail">
      <strong>Account Number</strong>
      <span id="accountNumber" class="account-number">
        Loading...
      </span>
    </div>

    <div id="instructionsBox" class="payment-detail hidden">
      <strong>Payment Instructions</strong>
      <p id="instructions"></p>
    </div>
  </section>

  <section id="depositSection" class="box hidden">
    <h3>Submit Deposit</h3>

    <label>Amount</label>
    <input type="number" id="amount" placeholder="Enter amount">

    <label>Payment Reference</label>
    <input type="text" id="reference" placeholder="Enter payment reference">

    <label>Payment Screenshot</label>
    <input type="file" id="screenshot" accept="image/png,image/jpeg,image/webp">

    <button id="submitButton">
      Submit Deposit
    </button>

    <p id="depositMessage"></p>
  </section>

  <section id="historySection" class="box hidden">
    <h3>Deposit History</h3>
    <div id="history">Loading...</div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;

const debug =
document.getElementById("debug");

const message =
document.getElementById("message");

function log(text) {
  debug.textContent += "\n" + text;
  console.log(text);
}

async function start() {

  try {

    log("1. Supabase client created.");

    log("2. Checking session...");

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if (error) {
      log("SESSION ERROR: " + error.message);
      throw error;
    }

    if (!data.session) {

      log("NO LOGIN SESSION.");

      message.textContent =
      "You are not logged in.";

      message.className = "error";

      return;
    }

    log("3. Session found.");

    log("4. Getting user...");

    const {
      data: userData,
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError) {
      log("USER ERROR: " + userError.message);
      throw userError;
    }

    if (!userData.user) {

      log("USER NOT FOUND.");

      message.textContent =
      "User not found.";

      message.className = "error";

      return;
    }

    currentUser =
    userData.user;

    log(
      "5. User found: " +
      currentUser.id
    );

    log("6. Checking promoter profile...");

    const {
      data: profile,
      error: profileError
    } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", currentUser.id)
      .maybeSingle();

    if (profileError) {
      log(
        "PROFILE ERROR: " +
        profileError.message
      );
      throw profileError;
    }

    if (!profile) {

      log("PROFILE NOT FOUND.");

      message.textContent =
      "Profile not found.";

      message.className = "error";

      return;
    }

    log("7. Profile found.");

    log(
      "8. Role: " +
      profile.role
    );

    if (profile.role !== "promoter") {

      log("NOT A PROMOTER.");

      message.textContent =
      "Promoter account required.";

      message.className = "error";

      return;
    }

    log("9. PROMOTER ACCESS CONFIRMED.");

    message.textContent =
    "Promoter account confirmed.";

    message.className =
    "success";

    document
      .getElementById("walletSection")
      .classList.remove("hidden");

    document
      .getElementById("paymentSection")
      .classList.remove("hidden");

    document
      .getElementById("depositSection")
      .classList.remove("hidden");

    document
      .getElementById("historySection")
      .classList.remove("hidden");

    await loadWallet();

    await loadPaymentDetails();

    await loadHistory();

    log("13. Page finished.");

  } catch (error) {

    log(
      "FINAL ERROR: " +
      (error.message || error)
    );

    message.textContent =
    "Error: " +
    (error.message || "Unknown error");

    message.className =
    "error";
  }
}

async function loadWallet() {

  log("10. Loading wallet...");

  const {
    data,
    error
  } =
  await supabaseClient
    .from("wallets")
    .select("balance")
    .eq("user_id", currentUser.id)
    .maybeSingle();

  if (error) {

    log(
      "WALLET ERROR: " +
      error.message
    );

    return;
  }

  document.getElementById("balance")
    .textContent =
    Number(data?.balance || 0)
      .toLocaleString("en-NG");

  log("11. Wallet loaded.");
}

async function loadPaymentDetails() {

  log("12. Loading payment details...");

  const {
    data,
    error
  } =
  await supabaseClient
    .from("promoter_payment_details")
    .select(
      "bank_name, account_name, account_number, instructions"
    )
    .limit(1)
    .maybeSingle();

  if (error) {

    log(
      "PAYMENT ERROR: " +
      error.message
    );

    document.getElementById("bankName")
      .textContent =
      "Unable to load";

    document.getElementById("accountName")
      .textContent =
      "Unable to load";

    document.getElementById("accountNumber")
      .textContent =
      "Unable to load";

    return;
  }

  if (!data) {

    log("NO PAYMENT DETAILS FOUND.");

    document.getElementById("bankName")
      .textContent =
      "Not configured";

    document.getElementById("accountName")
      .textContent =
      "-";

    document.getElementById("accountNumber")
      .textContent =
      "-";

    return;
  }

  document.getElementById("bankName")
    .textContent =
    data.bank_name || "-";

  document.getElementById("accountName")
    .textContent =
    data.account_name || "-";

  document.getElementById("accountNumber")
    .textContent =
    data.account_number || "-";

  if (data.instructions) {

    document.getElementById("instructions")
      .textContent =
      data.instructions;

    document.getElementById("instructionsBox")
      .classList.remove("hidden");
  }

  log("Payment details loaded.");
}

async function loadHistory() {

  log("Loading deposit history...");

  const {
    data,
    error
  } =
  await supabaseClient.rpc(
    "get_my_promoter_deposits"
  );

  if (error) {

    log(
      "HISTORY ERROR: " +
      error.message
    );

    document.getElementById("history")
      .textContent =
      "Unable to load history.";

    return;
  }

  const history =
  document.getElementById("history");

  if (!data || data.length === 0) {

    history.textContent =
    "No deposit requests yet.";

    return;
  }

  history.innerHTML = "";

  data.forEach(item => {

    const div =
    document.createElement("div");

    div.className =
    "payment-detail";

    div.innerHTML =
    "<strong>₦" +
    Number(item.amount || 0)
      .toLocaleString("en-NG") +
    "</strong>" +
    "<p>Reference: " +
    escapeHTML(item.payment_reference) +
    "</p>" +
    "<p>Status: " +
    escapeHTML(item.status) +
    "</p>";

    history.appendChild(div);
  });
}

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

document
.getElementById("submitButton")
.addEventListener("click", function() {

  document.getElementById("depositMessage")
    .textContent =
    "Deposit submission will be connected after the account/payment display is confirmed.";

});

start();

</script>

</body>
</html>

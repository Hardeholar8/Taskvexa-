<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskVexa - Reset Password</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main>
  <h1>Reset Password</h1>

  <div id="message"></div>

  <form id="resetForm">

    <label>New Password</label>
    <input type="password" id="newPassword" minlength="6" required>

    <label>Confirm New Password</label>
    <input type="password" id="confirmPassword" minlength="6" required>

    <button type="submit" id="resetButton">
      Update Password
    </button>

  </form>

  <p>
    <a href="login.html">Back to Login</a>
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://dxtlnrthlpdaobnbazny.supabase.co";
const SUPABASE_KEY = "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("resetForm");
const button = document.getElementById("resetButton");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const password = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password.length < 6) {
    message.textContent = "Password must be at least 6 characters.";
    return;
  }

  if (password !== confirmPassword) {
    message.textContent = "Passwords do not match.";
    return;
  }

  button.disabled = true;
  button.textContent = "Updating...";
  message.textContent = "";

  const { error } = await supabaseClient.auth.updateUser({
    password: password
  });

  if (error) {
    message.textContent = error.message;
    button.disabled = false;
    button.textContent = "Update Password";
    return;
  }

  message.textContent = "Password updated successfully.";

  setTimeout(() => {
    window.location.href = "login.html";
  }, 1500);
});
</script>

</body>
</html>

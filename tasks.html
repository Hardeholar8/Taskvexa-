<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskVexa - Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>TaskVexa</h1>
  <a href="dashboard.html">Dashboard</a>
</header>

<main>

  <section>
    <h2>Available Tasks</h2>
    <p>Choose a task you want to complete.</p>
  </section>

  <div id="message">Loading tasks...</div>

  <section id="taskList"></section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const taskList =
  document.getElementById("taskList");

const message =
  document.getElementById("message");


async function loadTasks() {

  try {

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {

      window.location.href = "login.html";
      return;
    }

    const { data: tasks, error } =
      await supabaseClient
        .from("tasks")
        .select("*")
        .eq("status", "active")
        .order("created_at", {
          ascending: false
        });

    if (error) {
      throw error;
    }

    taskList.innerHTML = "";

    if (!tasks || tasks.length === 0) {

      message.textContent =
        "No tasks are currently available.";

      return;
    }

    message.textContent = "";

    tasks.forEach(task => {

      const card =
        document.createElement("section");

      card.className = "task-card";

      card.innerHTML = `
        <h3>${escapeHTML(task.title)}</h3>

        <p>
          ${escapeHTML(task.description)}
        </p>

        <p>
          <strong>Platform:</strong>
          ${escapeHTML(task.platform || "Not specified")}
        </p>

        <p>
          <strong>Task Reward:</strong>
          ₦${Number(task.reward).toLocaleString()}
        </p>

        <p>
          <strong>Workers Needed:</strong>
          ${task.workers_needed}
        </p>

        <a
          href="task-details.html?id=${encodeURIComponent(task.id)}"
          class="task-button"
        >
          View Task
        </a>
      `;

      taskList.appendChild(card);

    });

  } catch (error) {

    console.error(error);

    message.textContent =
  "ERROR: " + error.message;

  }

}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


loadTasks();

</script>

</body>
</html>

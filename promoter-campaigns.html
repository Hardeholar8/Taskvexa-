<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>TaskVexa — My Campaigns</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/promoter-auth.js"></script><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 16px 104px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:25px;font-weight:900}.sub{color:#94a3b8;font-size:12px;margin-top:4px}.create{background:linear-gradient(135deg,#6947ff,#9b61ff);color:#fff;text-decoration:none;padding:11px 14px;border-radius:13px;font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat,.card{background:linear-gradient(180deg,#121b2d,#0f1728);border:1px solid #26344d;border-radius:18px;box-shadow:0 14px 38px rgba(0,0,0,.22)}.stat{padding:14px}.label{font-size:10px;color:#94a3b8}.num{font-size:22px;font-weight:900;margin-top:6px}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.filter{flex:0 0 auto;border:1px solid #26344d;background:#101827;color:#94a3b8;border-radius:999px;padding:9px 13px;font-size:11px}.filter.active{background:#211941;color:#fff;border-color:#7048ff}.card{padding:16px;margin-bottom:11px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-size:15px;font-weight:850}.pill{padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800;text-transform:capitalize}.active{background:#123323;color:#4ade80}.pending,.draft{background:#352b12;color:#fbbf24}.completed,.closed{background:#172235;color:#aab8ce}.rejected{background:#35191d;color:#f87171}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0;color:#94a3b8;font-size:11px}.meta span{background:#0b1220;border:1px solid #26344d;border-radius:9px;padding:7px 9px}.progress{height:7px;background:#0b1220;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#7048ff,#42d8ff);border-radius:99px;width:0}.progressrow{display:flex;justify-content:space-between;margin:8px 0 5px;font-size:11px;color:#94a3b8}.empty{text-align:center;padding:38px 18px;color:#94a3b8}.empty strong{display:block;color:#fff;font-size:15px;margin-bottom:5px}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;padding:0 10px 4px;background:rgba(10,16,30,.97);border-top:1px solid #26344d;display:flex;align-items:center;justify-content:space-around;z-index:1000}.nav a{flex:1;text-align:center;color:#7f8da5;text-decoration:none;font-size:10px;padding:10px 2px}.nav a.active{color:#9a73ff}.nav .plus{flex:0 0 56px;height:56px;margin-top:-20px;border-radius:50%;background:linear-gradient(145deg,#5d35ed,#8c45ff);color:#fff;font-size:27px;padding:0;display:grid;place-items:center;border:4px solid #080d18}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr 1fr}.title{font-size:22px}.create{padding:10px 11px}.num{font-size:18px}}@media(max-width:360px){.stats{gap:7px}.stat{padding:11px 9px}}</style></head><body><main class="wrap"><header class="head"><div><div class="title">My Campaigns</div><div class="sub">Track every campaign from launch to completion.</div></div><a class="create" href="promoter-create.html">＋ Create</a></header><section class="stats"><div class="stat"><div class="label">ACTIVE</div><div id="activeCount" class="num">0</div></div><div class="stat"><div class="label">PENDING</div><div id="pendingCount" class="num">0</div></div><div class="stat"><div class="label">COMPLETED</div><div id="completedCount" class="num">0</div></div></section><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="active">Active</button><button class="filter" data-filter="pending">Pending</button><button class="filter" data-filter="completed">Completed</button><button class="filter" data-filter="rejected">Rejected</button></div><section id="list"></section></main><nav class="nav"><a href="promoter-dashboard.html">⌂<br>Home</a><a class="active" href="promoter-campaigns.html">▣<br>Campaigns</a><a class="plus" href="promoter-create.html">+</a><a href="promoter-wallet.html">◉<br>Wallet</a><a href="promoter-settings.html">☰<br>More</a></nav><script>let campaigns=[];const $=id=>document.getElementById(id);const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});function group(s){if(s==='active')return'active';if(['completed','closed'].includes(s))return'completed';if(['rejected','cancelled'].includes(s))return'rejected';return'pending'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(filter='all'){const rows=campaigns.filter(x=>filter==='all'||group(x.status)===filter);$('list').innerHTML=rows.length?rows.map(x=>{const needed=Number(x.workers_needed||0),done=Number(x.approved_worker_count||x.paid_worker_slots||0),pct=needed?Math.min(100,Math.round(done/needed*100)):0;const st=group(x.status);return `<article class="card"><div class="top"><div><div class="name">${esc(x.title||'Untitled campaign')}</div><div class="meta"><span>${esc(x.platform||'Platform not set')}</span><span>${esc(x.task_type||'Task')}</span><span>${money(x.calculated_cost)}</span></div></div><span class="pill ${st}">${esc(x.status||'pending')}</span></div><div class="progressrow"><span>${done} of ${needed} Workers approved</span><strong>${pct}%</strong></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="meta"><span>Created ${new Date(x.created_at).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'})}</span><span>${x.proof_required?'Proof required':'No proof'}</span></div></article>`}).join(''):`<div class="card empty"><strong>No ${filter==='all'?'campaigns':filter+' campaigns'} yet</strong>Create a campaign and it will appear here.</div>`}async function load(){const ctx=await requirePromoter();if(!ctx)return;const {data,error}=await promoterSupabase.from('promoter_campaigns').select('id,title,status,workers_needed,price_per_worker,calculated_cost,created_at,proof_required,platform,task_type,approved_worker_count,paid_worker_slots').eq('promoter_id',ctx.user.id).order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="card empty"><strong>Unable to load campaigns</strong>Please try again.</div>';return}campaigns=data||[];$('activeCount').textContent=campaigns.filter(x=>group(x.status)==='active').length;$('pendingCount').textContent=campaigns.filter(x=>group(x.status)==='pending').length;$('completedCount').textContent=campaigns.filter(x=>group(x.status)==='completed').length;render()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});load();</script></body></html>

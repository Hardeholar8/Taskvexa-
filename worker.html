<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskVexa - Workers</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #070a10;
  --sidebar: #0b0f17;
  --card: #111722;
  --card2: #0d131e;
  --border: #202b3b;
  --text: #f8fafc;
  --muted: #7f8da3;
  --green: #4ade80;
  --red: #f87171;
  --yellow: #facc15;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
}

/* HEADER */

header {
  height: 70px;
  background: var(--sidebar);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

header h1 {
  margin: 0;
  font-size: 21px;
}

header a {
  color: #cbd5e1;
  text-decoration: none;
  font-size: 14px;
}

/* MAIN */

main {
  max-width: 1200px;
  margin: auto;
  padding: 25px 16px 50px;
}

.page-title h2 {
  margin: 0 0 7px;
  font-size: 27px;
}

.page-title p {
  color: var(--muted);
  margin: 0 0 25px;
  font-size: 14px;
}

/* MESSAGE */

.message {
  margin-bottom: 18px;
  font-size: 14px;
}

.success {
  color: var(--green);
}

.error {
  color: var(--red);
}

.warning {
  color: var(--yellow);
}

/* CONTROLS */

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.search {
  flex: 1;
  min-width: 220px;
  padding: 12px 14px;
  background: #0d131e;
  border: 1px solid #293548;
  border-radius: 10px;
  color: white;
  outline: none;
}

.search:focus {
  border-color: #59677e;
}

.button {
  border: 1px solid #293548;
  border-radius: 10px;
  background: #151d2a;
  color: white;
  padding: 11px 16px;
  cursor: pointer;
  font-weight: 700;
}

.button:hover {
  opacity: .9;
}

.button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* STATS */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 25px;
}

.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
}

.stat-label {
  color: var(--muted);
  font-size: 12px;
}

.stat-value {
  margin-top: 10px;
  font-size: 24px;
  font-weight: 800;
}

/* WORKER CARD */

.worker-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 19px;
  margin-bottom: 14px;
}

.worker-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 15px;
}

.worker-name {
  font-size: 17px;
  font-weight: 800;
}

.worker-id {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
  word-break: break-all;
}

.status {
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.status.active {
  background: #102d20;
  color: var(--green);
}

.status.inactive {
  background: #32191d;
  color: var(--red);
}

/* INFO */

.worker-info {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.info {
  background: var(--card2);
  border: 1px solid #1d2838;
  border-radius: 11px;
  padding: 12px;
}

.info small {
  display: block;
  color: #64748b;
  font-size: 10px;
  margin-bottom: 5px;
}

.info strong {
  font-size: 13px;
  word-break: break-word;
}

/* ACTIONS */

.worker-actions {
  display: flex;
  gap: 9px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.activate-button {
  background: #12301f;
  border-color: #245b3a;
  color: var(--green);
}

.deactivate-button {
  background: #32191d;
  border-color: #643139;
  color: var(--red);
}

/* EMPTY */

.empty {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 35px 20px;
  text-align: center;
  color: var(--muted);
}

/* MOBILE */

@media(max-width:700px) {

  .stats {
    grid-template-columns: 1fr;
  }

  .worker-info {
    grid-template-columns: 1fr 1fr;
  }

  .worker-top {
    align-items: flex-start;
  }
}

@media(max-width:450px) {

  .worker-info {
    grid-template-columns: 1fr;
  }

  header {
    padding: 0 14px;
  }

  header h1 {
    font-size: 18px;
  }

  header a {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<header>

  <h1>TaskVexa</h1>

  <a href="admin.html">
    ← Admin Dashboard
  </a>

</header>


<main>

  <div class="page-title">

    <h2>Workers</h2>

    <p>
      View and manage registered worker accounts.
    </p>

  </div>


  <div id="message" class="message">
    Checking admin access...
  </div>


  <!-- STATISTICS -->

  <section class="stats">

    <div class="stat">

      <div class="stat-label">
        Total Workers
      </div>

      <div
        class="stat-value"
        id="totalWorkers"
      >
        —
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Active Workers
      </div>

      <div
        class="stat-value"
        id="activeWorkers"
      >
        —
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Total Worker Balance
      </div>

      <div
        class="stat-value"
        id="totalBalance"
      >
        ₦0.00
      </div>

    </div>

  </section>


  <!-- SEARCH -->

  <div class="controls">

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Search by worker ID or account type..."
    >

    <button
      id="refreshButton"
      class="button"
    >
      ↻ Refresh Workers
    </button>

  </div>


  <div id="workerList"></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const message =
  document.getElementById("message");

const workerList =
  document.getElementById("workerList");

const refreshButton =
  document.getElementById("refreshButton");

const searchInput =
  document.getElementById("searchInput");

const totalWorkers =
  document.getElementById("totalWorkers");

const activeWorkers =
  document.getElementById("activeWorkers");

const totalBalance =
  document.getElementById("totalBalance");


let allWorkers = [];


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================
   MONEY
========================================= */

function formatMoney(amount) {

  return "₦" +
    Number(amount || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

}


/* =========================================
   CHECK ADMIN
========================================= */

async function checkAdmin() {

  try {

    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (sessionError) {
      throw sessionError;
    }


    const session =
      sessionData.session;


    if (!session) {

      window.location.href =
        "login.html";

      return false;

    }


    const user =
      session.user;


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();


    if (profileError) {
      throw profileError;
    }


    if (
      !profile ||
      String(profile.role).toLowerCase() !==
      "admin"
    ) {

      message.textContent =
        "Access denied. Admin account required.";

      message.className =
        "message error";

      return false;

    }


    return true;

  } catch (error) {

    console.error(
      "ADMIN CHECK ERROR:",
      error
    );

    message.textContent =
      "Admin check error: " +
      error.message;

    message.className =
      "message error";

    return false;

  }

}


/* =========================================
   LOAD WORKERS
========================================= */

async function loadWorkers() {

  refreshButton.disabled = true;

  refreshButton.textContent =
    "Loading...";


  message.textContent =
    "Loading worker accounts...";

  message.className =
    "message";


  try {

    const isAdmin =
      await checkAdmin();


    if (!isAdmin) {
      return;
    }


    /*
      IMPORTANT:
      Read directly from profiles.
      No RPC is used.
    */

    const {
      data: workers,
      error: workersError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id, role, created_at, updated_at"
        )
        .eq(
          "role",
          "worker"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (workersError) {

      throw workersError;

    }


    allWorkers =
      workers || [];


    /*
      Load wallet balances.
    */

    let wallets = [];


    if (allWorkers.length > 0) {

      const workerIds =
        allWorkers.map(
          worker => worker.id
        );


      const {
        data: walletData,
        error: walletError
      } =
        await supabaseClient
          .from("wallets")
          .select(
            "user_id, balance"
          )
          .in(
            "user_id",
            workerIds
          );


      if (walletError) {

        console.warn(
          "Wallet loading warning:",
          walletError
        );

      } else {

        wallets =
          walletData || [];

      }

    }


    /*
      Attach balances.
    */

    const walletMap = {};


    wallets.forEach(
      wallet => {

        walletMap[
          wallet.user_id
        ] =
          Number(wallet.balance || 0);

      }
    );


    allWorkers =
      allWorkers.map(
        worker => ({

          ...worker,

          balance:
            walletMap[worker.id] || 0

        })
      );


    updateStatistics();

    renderWorkers();


    message.textContent =
      "Worker accounts loaded successfully.";

    message.className =
      "message success";


  } catch (error) {

    console.error(
      "WORKER LOAD ERROR:",
      error
    );


    message.textContent =
      "Unable to load workers: " +
      error.message;

    message.className =
      "message error";


    workerList.innerHTML = "";

  } finally {

    refreshButton.disabled =
      false;

    refreshButton.textContent =
      "↻ Refresh Workers";

  }

}


/* =========================================
   STATISTICS
========================================= */

function updateStatistics() {

  const count =
    allWorkers.length;


  const active =
    allWorkers.filter(
      worker =>
        worker.status !== "inactive"
    ).length;


  const balance =
    allWorkers.reduce(
      (
        total,
        worker
      ) =>
        total +
        Number(
          worker.balance || 0
        ),
      0
    );


  totalWorkers.textContent =
    count;


  activeWorkers.textContent =
    active;


  totalBalance.textContent =
    formatMoney(balance);

}


/* =========================================
   RENDER
========================================= */

function renderWorkers() {

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    allWorkers.filter(
      worker => {

        const id =
          String(
            worker.id || ""
          ).toLowerCase();


        const role =
          String(
            worker.role || ""
          ).toLowerCase();


        return (
          !search ||
          id.includes(search) ||
          role.includes(search)
        );

      }
    );


  workerList.innerHTML = "";


  if (filtered.length === 0) {

    workerList.innerHTML = `

      <div class="empty">

        ${
          allWorkers.length === 0
            ? "No worker accounts have been registered yet."
            : "No workers match your search."
        }

      </div>

    `;

    return;

  }


  filtered.forEach(
    worker => {

      const card =
        document.createElement(
          "section"
        );


      card.className =
        "worker-card";


      const workerId =
        worker.id ||
        "Unavailable";


      const role =
        worker.role ||
        "worker";


      const balance =
        Number(
          worker.balance || 0
        );


      const created =
        worker.created_at
          ? new Date(
              worker.created_at
            ).toLocaleString(
              "en-NG"
            )
          : "-";


      const updated =
        worker.updated_at
          ? new Date(
              worker.updated_at
            ).toLocaleString(
              "en-NG"
            )
          : "-";


      card.innerHTML = `

        <div class="worker-top">

          <div>

            <div class="worker-name">
              Worker Account
            </div>

            <div class="worker-id">
              ${escapeHTML(workerId)}
            </div>

          </div>

          <span class="status active">
            Active
          </span>

        </div>


        <div class="worker-info">

          <div class="info">

            <small>
              Account Type
            </small>

            <strong>
              ${escapeHTML(role)}
            </strong>

          </div>


          <div class="info">

            <small>
              Balance
            </small>

            <strong>
              ${formatMoney(balance)}
            </strong>

          </div>


          <div class="info">

            <small>
              Registered
            </small>

            <strong>
              ${escapeHTML(created)}
            </strong>

          </div>


          <div class="info">

            <small>
              Last Updated
            </small>

            <strong>
              ${escapeHTML(updated)}
            </strong>

          </div>


          <div class="info">

            <small>
              Worker ID
            </small>

            <strong>
              ${escapeHTML(workerId)}
            </strong>

          </div>

        </div>


        <div class="worker-actions">

          <button
            class="button deactivate-button"
            onclick="showWorkerInfo('${escapeHTML(workerId)}')"
          >
            View Worker ID
          </button>

        </div>

      `;


      workerList.appendChild(
        card
      );

    }
  );

}


/* =========================================
   VIEW WORKER
========================================= */

function showWorkerInfo(workerId) {

  alert(
    "Worker ID:\\n\\n" +
    workerId
  );

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
  "input",
  renderWorkers
);


/* =========================================
   REFRESH
========================================= */

refreshButton.addEventListener(
  "click",
  loadWorkers
);


/* =========================================
   START
========================================= */

loadWorkers();

</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskVexa - Register</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>
    <h1>Create TaskVexa Account</h1>

    <form id="registerForm">

      <label>Full Name</label>
      <input type="text" id="fullName" required>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Password</label>
      <input type="password" id="password" minlength="6" required>

      <label>Account Type</label>
      <select id="accountType" required>
        <option value="">Select account type</option>
        <option value="worker">Worker</option>
        <option value="promoter">Promoter</option>
      </select>

      <button type="submit">Create Account</button>

    </form>

    <p>
      Already have an account?
      <a href="login.html">Login</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = https://dxtlnrthlpdaobnbazny.supabase.co/rest/v1/
    const SUPABASE_KEY = sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("registerForm");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const accountType = document.getElementById("accountType").value;

      if (!name || !email || !password || !accountType) {
        alert("Please complete all fields.");
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: name,
            account_type: accountType
          }
        }
      });

      if (error) {
        alert(error.message);
        return;
      }

      alert("Account created successfully. Check your email if verification is required.");
      window.location.href = "login.html";
    });
  </script>

</body>
</html>

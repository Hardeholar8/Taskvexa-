<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa • Platform Settings</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script></head><body><main style="padding:30px"><h1>Platform Settings</h1><section id="activation" style="max-width:600px;padding:20px;border:1px solid #334155;border-radius:16px"><h2>⚡ Worker Activation</h2><p>Set the worker activation amount.</p><input id="activationAmount" type="number" min="0" step="0.01" style="padding:12px;width:100%;margin:10px 0"><button id="save" style="padding:12px 18px">Save Changes</button><div id="am" style="margin-top:10px"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const input=document.getElementById('activationAmount'),msg=document.getElementById('am');let rowId=null;async function init(){const u=await sb.auth.getUser();if(u.error||!u.data.user)return location.href='login.html';const p=await sb.from('profiles').select('role').eq('id',u.data.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()!=='admin')return location.href='dashboard.html';const r=await sb.from('worker_activation_settings').select('id,activation_amount').limit(1).maybeSingle();if(r.error){msg.textContent=r.error.message;msg.style.color='#f87171';return}if(!r.data){msg.textContent='Activation settings row not found.';msg.style.color='#f87171';return}rowId=r.data.id;input.value=r.data.activation_amount??''}async function saveActivation(){const value=Number(input.value);if(!Number.isFinite(value)||value<0){msg.textContent='Enter a valid activation amount.';msg.style.color='#f87171';return}if(rowId===null){msg.textContent='Settings row not loaded. Refresh and try again.';msg.style.color='#f87171';return}const r=await sb.from('worker_activation_settings').update({activation_amount:value,updated_at:new Date().toISOString()}).eq('id',rowId).select('id,activation_amount').maybeSingle();if(r.error){msg.textContent=r.error.message;msg.style.color='#f87171';return}msg.textContent='Activation amount saved ✓';msg.style.color='#4ade80';rowId=r.data?.id??rowId}document.getElementById('save').onclick=saveActivation;init()</script></body></html>

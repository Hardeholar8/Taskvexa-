<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskVexa - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Create TaskVexa Account</h1>
  <div id="message"></div>
  <form id="registerForm">
    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" required>
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <label for="password">Password</label>
    <input type="password" id="password" minlength="6" required>
    <label for="accountType">Account Type</label>
    <select id="accountType" required>
      <option value="">Select account type</option>
      <option value="worker">Worker</option>
      <option value="promoter">Promoter</option>
    </select>
    <button type="submit" id="registerButton">Create Account</button>
  </form>
  <div id="successBox" style="display:none;">
    <h2>Account Created Successfully!</h2>
    <p>Your account has been created. Please check your email and confirm your email address.</p>
    <button type="button" onclick="window.location.href='login.html'">Go to Login</button>
  </div>
  <p>Already have an account? <a href="login.html">Login</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="referral-capture.js"></script>
<script src="auth.js"></script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>TaskVexa</title><link rel="stylesheet" href="/filora-theme.css?v=1"><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px 14px 90px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{color:#a98cff;text-decoration:none;font-weight:800;font-size:12px}.brand{font-size:22px;font-weight:900}.card{background:linear-gradient(180deg,#121b2d,#0f1728);border:1px solid #26344d;border-radius:20px;padding:16px;margin-bottom:12px}.muted{color:#94a3b8;font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{display:inline-flex;padding:10px 14px;border-radius:12px;background:#7048ff;color:#fff;text-decoration:none;font-weight:800;font-size:11px;border:0}.empty{text-align:center;padding:35px 15px;color:#94a3b8}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><script src="/theme.js?v=9"></script>
</head><body><main class="wrap"><div class="top"><div class="brand">Opportunities</div><a class="back" href="dashboard.html">← Dashboard</a></div><p class="muted">Browse active opportunities and apply when you meet the requirements.</p><div id="list"><div class="empty">Loading opportunities...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');async function load(){const{data,error}=await sb.from('opportunities').select('id,title,description,category,reward,slots,application_deadline').eq('status','active').order('created_at',{ascending:false});if(error)throw error;document.getElementById('list').innerHTML=(data||[]).map(x=>'<article class="card"><h3>'+x.title+'</h3><p class="muted">'+x.description+'</p><p class="muted">Category: '+x.category+' · Reward: ₦'+Number(x.reward).toLocaleString()+' · Slots: '+x.slots+'</p><button class="btn" onclick="applyOpportunity(\''+x.id+'\')">Apply</button></article>').join('')||'<div class="empty">No active opportunities yet.</div>}async function applyOpportunity(id){const{data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const{error}=await sb.from('opportunity_applications').insert({opportunity_id:id,worker_id:user.id});alert(error?error.message:'Application submitted.');}load().catch(()=>document.getElementById('list').innerHTML='<div class="empty">Unable to load opportunities.</div>');</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>TaskVexa</title><link rel="stylesheet" href="/filora-theme.css?v=1"><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px 14px 90px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{color:#a98cff;text-decoration:none;font-weight:800;font-size:12px}.brand{font-size:22px;font-weight:900}.card{background:linear-gradient(180deg,#121b2d,#0f1728);border:1px solid #26344d;border-radius:20px;padding:16px;margin-bottom:12px}.muted{color:#94a3b8;font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{display:inline-flex;padding:10px 14px;border-radius:12px;background:#7048ff;color:#fff;text-decoration:none;font-weight:800;font-size:11px;border:0}.empty{text-align:center;padding:35px 15px;color:#94a3b8}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><script src="/theme.js?v=9"></script>
</head><body><main class="wrap"><div class="top"><div class="brand">Challenges</div><a class="back" href="dashboard.html">← Dashboard</a></div><p class="muted">Join active TaskVexa challenges and track your progress.</p><div id="list"><div class="empty">Loading challenges...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY'),{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'taskvexa-worker-auth'}};async function load(){const a=await sb.auth.getUser();if(!a.data?.user){location.href='login.html';return}const mem=await sb.rpc('worker_has_feature',{p_feature:'challenges'});if(mem.error||mem.data!==true){document.getElementById('list').innerHTML='<div class="empty">An active TaskVexa membership is required to access Challenges.</div>';return}const r=await sb.from('challenges').select('id,title,description,reward_pool,participant_limit,starts_at,ends_at').eq('status','active').lte('starts_at',new Date().toISOString()).gt('ends_at',new Date().toISOString()).order('starts_at');if(r.error)throw r.error;const ids=(r.data||[]).map(x=>x.id);const p=ids.length?await sb.from('challenge_participants').select('challenge_id,status,progress').eq('worker_id',a.data.user.id).in('challenge_id',ids):{data:[]};const mine=new Map((p.data||[]).map(x=>[x.challenge_id,x]));document.getElementById('list').innerHTML=(r.data||[]).map(x=>{const m=mine.get(x.id);return '<article class="card"><h3>'+x.title+'</h3><p class="muted">'+(x.description||'')+'</p><p class="muted">Reward pool: '+Number(x.reward_pool).toLocaleString('en-NG')+' credits · Limit: '+(x.participant_limit||'Open')+'</p>'+(m?'<p class="muted">Status: '+m.status+' · Progress: '+m.progress+'</p>':'<button class="btn" onclick="joinChallenge(\''+x.id+'\')">Join Challenge</button>')+'</article>'}).join('')||'<div class="empty">No active challenges yet.</div>}async function joinChallenge(id){const{data:{user}}=await sb.auth.getUser();const{error}=await sb.rpc('join_challenge',{p_challenge_id:id});alert(error?error.message:'Challenge joined successfully.');load()}load().catch(()=>document.getElementById('list').innerHTML='<div class="empty">Unable to load challenges.</div>');</script></body></html></html>

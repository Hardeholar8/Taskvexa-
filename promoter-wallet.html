<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TaskVexa - Promoter Wallet</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script><style>body{margin:0;background:#070a10;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#111722;border:1px solid #202b3b;border-radius:18px;padding:22px;margin-bottom:18px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:10px 0}.muted{color:#8997aa;font-size:13px}.balance{font-size:36px;font-weight:900}.input{width:100%;box-sizing:border-box;padding:13px;background:#090e16;color:#fff;border:1px solid #293548;border-radius:10px;margin:8px 0 14px}.btn{border:0;border-radius:11px;padding:13px 17px;background:#f8fafc;color:#090d14;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.message{margin-top:14px;font-size:13px}.success{color:#4ade80}.error{color:#f87171}.history{padding:13px 0;border-top:1px solid #202b3b}.history:first-child{border-top:0}</style></head><body><div class="wrap"><div class="card"><h1>Promoter Wallet</h1><p class="muted">Fund your promoter wallet securely through TaskVexa.</p><div class="balance">₦<span id="balance">0</span></div></div><div class="card"><h2>Add Funds</h2><p class="muted">Enter the amount. TaskVexa will generate a dedicated bank account for this payment. After you transfer, payment verification is automatic.</p><input class="input" id="amount" type="number" min="1" step="1" placeholder="Enter amount"><button class="btn" id="pay">Continue to Bank Transfer</button><div id="message" class="message"></div></div><div class="card"><h2>Payment History</h2><div id="history" class="muted">Loading...</div></div><p><a href="promoter-dashboard.html" style="color:#60a5fa">← Back to Promoter Dashboard</a></p></div><script>'use strict';const URL='https://dxtlnrthlpdaobnbazny.supabase.co',KEY='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY',sb=supabase.createClient(URL,KEY);let user=null;const $=id=>document.getElementById(id);function msg(t,c=''){ $('message').textContent=t;$('message').className='message '+c }async function init(){const {data,error}=await sb.auth.getUser();if(error||!data.user){msg('Please log in first.','error');return}user=data.user;const p=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p.error||String(p.data?.role||'').toLowerCase()!=='promoter'){msg('Promoter account required.','error');return}await loadWallet();await loadHistory()}async function loadWallet(){const r=await sb.from('wallets').select('balance').eq('user_id',user.id).maybeSingle();if(!r.error)$('balance').textContent=Number(r.data?.balance||0).toLocaleString('en-NG')}async function loadHistory(){const r=await sb.from('wallet_transactions').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(20);if(r.error){$('history').textContent='Unable to load history.';return}if(!r.data?.length){$('history').textContent='No wallet transactions yet.';return}$('history').innerHTML=r.data.map(x=>`<div class="history"><div class="row"><b>${String(x.type||x.transaction_type||'Transaction')}</b><b>₦${Number(x.amount||0).toLocaleString('en-NG')}</b></div><div class="muted">${new Date(x.created_at).toLocaleString('en-NG')}</div></div>`).join('')}$('pay').onclick=async()=>{const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<=0){msg('Enter a valid amount.','error');return}const b=$('pay');b.disabled=true;b.textContent='Creating payment...';msg('');try{const r=await fetch('/api/flutterwave/checkout.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:user.email,user_id:user.id,amount,purpose:'promoter_wallet_funding',title:'Fund Promoter Wallet',description:'TaskVexa promoter wallet funding',return_path:'promoter-payment-callback.html'})});const j=await r.json();if(!r.ok||!j.payment_url)throw new Error(j.error||'Unable to start payment.');window.location.href=j.payment_url}catch(e){msg(e.message||'Unable to start payment.','error');b.disabled=false;b.textContent='Continue to Bank Transfer'}};init();</script></body></html>

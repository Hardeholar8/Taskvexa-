.message||'Wallet credit failed.');$('title').textContent='Payment Confirmed';$('title').className='ok';$('text').textContent='Your promoter wallet has been credited successfully.';setTimeout(()=>location.href='promoter-wallet.html',1800)}catch(e){$('title').textContent='Payment Verification';$('title').className='err';$('text').textContent=e.message||'Unable to verify payment.';$('text').insertAdjacentHTML('afterend','<a class="btn" href="promoter-wallet.html">Return to Wallet</a>')}}run();</script></body></html>

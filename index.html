<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskVexa</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <header>
    <h1>TaskVexa</h1>

    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Welcome to TaskVexa</h2>
      <p>Complete tasks, submit your work and manage your account easily.</p>

      <button onclick="window.location.href='register.html'">
        Get Started
      </button>
    </section>

    <section>
      <h2>Choose Your Account</h2>

      <div>
        <h3>Worker</h3>
        <p>Complete available tasks and submit proof of your work.</p>
        <button onclick="window.location.href='register.html'">
          Register as Worker
        </button>
      </div>

      <div>
        <h3>Promoter</h3>
        <p>Create and submit tasks for workers.</p>
        <button onclick="window.location.href='register.html'">
          Register as Promoter
        </button>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 TaskVexa. All rights reserved.</p>
  </footer>

</body>
</html>

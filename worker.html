<head>

  justify-content: space-between;
  padding: 0 20px;
}

}

}

}

  border: 1px solid #202b3b;

}

  margin-top: 0;
}

  word-break: break-all;
}

</style></head><body><header>  <h1>TaskVexa</h1>  <a href="admin.html">

    View registered worker accounts and their account information.
  </p><button
id="refreshButton"

«»

↻ Refresh Workers

  </button>  <div id="message">
    Starting...
  </div>  <div id="workerList"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const message =
  document.getElementById("message");

const workerList =
  document.getElementById("workerList");

const refreshButton =
  document.getElementById("refreshButton");


function showMessage(
  text,
  type = ""
) {

  message.textContent = text;

  message.className = type;

}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatMoney(amount) {

  return "₦" +
    Number(amount || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

}


async function loadWorkers() {

  refreshButton.disabled = true;

  workerList.innerHTML = "";

  showMessage(
    "STEP 1: Checking login..."
  );


  try {

    /* =========================
       STEP 1
    ========================= */

    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (sessionError) {

      throw new Error(
        "SESSION ERROR: " +
        sessionError.message
      );

    }


    const session =
      sessionData.session;


    if (!session) {

      showMessage(
        "NO ACTIVE SESSION.\n\nYou are not logged in as an admin in this browser.",
        "error"
      );

      return;

    }


    showMessage(
      "STEP 2: Logged in successfully.\n\nUser ID:\n" +
      session.user.id +
      "\n\nChecking admin profile..."
    );


    /* =========================
       STEP 2
    ========================= */

    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("id, role")
        .eq(
          "id",
          session.user.id
        )
        .maybeSingle();


    if (profileError) {

      throw new Error(
        "PROFILE ERROR: " +
        profileError.message +
        "\n\nCode: " +
        (profileError.code || "none")
      );

    }


    if (!profile) {

      showMessage(
        "PROFILE NOT FOUND.\n\nLogged-in User ID:\n" +
        session.user.id,
        "error"
      );

      return;

    }


    if (
      String(profile.role).toLowerCase() !==
      "admin"
    ) {

      showMessage(
        "ACCESS DENIED.\n\nYour profile role is:\n" +
        profile.role +
        "\n\nAn admin account is required.",
        "error"
      );

      return;

    }


    showMessage(
      "STEP 3: Admin verified.\n\nCalling admin_get_workers()..."
    );


    /* =========================
       STEP 3
    ========================= */

    const {
      data: workers,
      error: workersError
    } =
      await supabaseClient.rpc(
        "admin_get_workers"
      );


    if (workersError) {

      throw new Error(
        "RPC ERROR: " +
        workersError.message +
        "\n\nCode: " +
        (workersError.code || "none") +
        "\n\nDetails: " +
        (workersError.details || "none") +
        "\n\nHint: " +
        (workersError.hint || "none")
      );

    }


    /* =========================
       STEP 4
    ========================= */

    showMessage(
      "STEP 4: RPC worked.\n\nWorkers returned: " +
      (workers ? workers.length : 0)
    );


    if (
      !workers ||
      workers.length === 0
    ) {

      showMessage(
        "RPC WORKED BUT RETURNED 0 WORKERS.\n\nThe database contains a worker, but the function is not returning it.",
        "error"
      );

      return;

    }


    /* =========================
       DISPLAY
    ========================= */

    workers.forEach(
      worker => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "worker-card";


        card.innerHTML = `

          <h3>
            Worker Account
          </h3>

          <div class="worker-id">
            ${escapeHTML(worker.id)}
          </div>

          <div class="info">

            <small>
              Account Type
            </small>

            <strong>
              ${escapeHTML(worker.role)}
            </strong>

          </div>


          <div class="info">

            <small>
              Balance
            </small>

            <strong>
              ${formatMoney(worker.balance)}
            </strong>

          </div>


          <div class="info">

            <small>
              Registered
            </small>

            <strong>
              ${escapeHTML(
                worker.created_at
              )}
            </strong>

          </div>

        `;


        workerList.appendChild(
          card
        );

      }
    );


    showMessage(
      "SUCCESS: Worker accounts loaded successfully.",
      "success"
    );


  } catch (error) {

    console.error(
      "WORKER PAGE ERROR:",
      error
    );


    showMessage(
      "EXACT ERROR:\n\n" +
      error.message,
      "error"
    );


  } finally {

    refreshButton.disabled = false;

  }

}


refreshButton.addEventListener(
  "click",
  loadWorkers
);


loadWorkers();

</script></body>
</html>

name: Apply TaskVexa Admin Theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared premium light theme to every admin page
        shell: bash
        run: |
          set -e
          files=(admin.html admin-worker-activations.html admin-data-history.html admin-data-plans.html admin-promo-flyers.html admin-promoter-wallet.html admin-submissions.html admin-tasks.html admin-withdrawals.html promoters.html worker.html settings.html)
          changed=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
import sys
p=sys.argv[1]
s=open(p,encoding='utf-8').read()
needle='</head>'
link='<link rel="stylesheet" href="/admin-theme.css?v=2">'
if 'admin-theme.css' not in s and needle in s:
    s=s.replace(needle,link+needle,1)
    open(p,'w',encoding='utf-8').write(s)
    print('updated',p)
    sys.exit(0)
print('ok',p)
PY
            if grep -q 'admin-theme.css' "$f"; then changed=1; fi
          done
          if [ "$changed" -eq 1 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add admin.html admin-worker-activations.html admin-data-history.html admin-data-plans.html admin-promo-flyers.html admin-promoter-wallet.html admin-submissions.html admin-tasks.html admin-withdrawals.html promoters.html worker.html settings.html
            git diff --cached --quiet || git commit -m 'Apply premium light theme across all admin pages'
            git push
          fi
      - name: Attach promoter task type selector
        shell: bash
        run: |
          set -e
          f=promoter-dashboard.html
          [ -f "$f" ] || exit 0
          python3 - "$f" <<'PY'
import sys
p=sys.argv[1]
s=open(p,encoding='utf-8').read()
needle='</body>'
link='<script src="/promoter-task-types.js?v=2"></script>'
if 'promoter-task-types.js' not in s and needle in s:
    s=s.replace(needle,link+needle,1)
    open(p,'w',encoding='utf-8').write(s)
    print('updated',p)
else:
    print('ok',p)
PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add promoter-dashboard.html
          git diff --cached --quiet || git commit -m 'Enable platform-specific promoter task types'
          git push

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Payment Verification</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script></head><body><main style="max-width:680px;margin:60px auto;padding:20px;text-align:center"><h1 id="title">Verifying payment…</h1><p id="msg">Please wait while we confirm your payment.</p><a id="back" href="dashboard.html" style="display:none">Return to Dashboard</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');(async()=>{try{const p=new URLSearchParams(location.search);const status=p.get('status');const tx=p.get('transaction_id');const txRef=p.get('tx_ref');const purpose=p.get('purpose')||'worker_activation';if(status!=='successful'||(!tx&&!txRef))throw new Error('Payment was not completed.');const r=await fetch('/api/flutterwave/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transaction_id:tx||undefined,tx_ref:txRef||undefined,purpose})});const j=await r.json();if(!r.ok||!j.verified)throw new Error(j.error||'Payment could not be verified.');if(j.purpose==='worker_activation'){const{data:{user}}=await sb.auth.getUser();if(!user||user.id!==j.user_id)throw new Error('Signed-in account does not match this payment.');const{error}=await sb.from('profiles').update({activation_status:'active',activation_level:1,updated_at:new Date().toISOString()}).eq('id',user.id);if(error)throw error;document.getElementById('title').textContent='Account Activated';document.getElementById('msg').textContent='Your worker activation has been confirmed successfully.';}else{document.getElementById('title').textContent='Payment Confirmed';document.getElementById('msg').textContent='Your TaskVexa payment has been verified successfully.';}document.getElementById('back').style.display='inline-block';}catch(e){console.error(e);document.getElementById('title').textContent='Verification Failed';document.getElementById('msg').textContent=e.message||'Please contact support.';document.getElementById('back').style.display='inline-block';}})();</script></body></html>

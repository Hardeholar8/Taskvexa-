const supabaseClient =

const message =

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   MONEY
========================= */

function formatMoney(value){

  return "₦" +
    Number(value || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits:0,
        maximumFractionDigits:2
      }
    );

}


/* =========================
   DATE
========================= */

function formatDate(value){

  if(!value){
    return "-";
  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return "-";
  }

  return date.toLocaleString(
    "en-NG",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.getUser();

    if(error){
      throw error;
    }

    const user =
      data?.user;

    if(!user){

      window.location.href =
        "login.html";

      return false;
    }

    currentUser =
      user;


    const {
      data: profile,
      error: profileError
    } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id",user.id)
      .maybeSingle();

    if(profileError){
      throw profileError;
    }

    if(
      !profile ||
      String(profile.role).toLowerCase() !==
      "admin"
    ){

      message.textContent =
        "Access denied. Admin account required.";

      message.className =
        "message error";

      return false;
    }

    message.textContent =
      "Admin access confirmed.";

    message.className =
      "message success";

    adminContent.style.display =
      "block";

    return true;

  }catch(error){

    console.error(
      "ADMIN CHECK ERROR:",
      error
    );

    message.textContent =
      "Admin check error: " +
      error.message;

    message.className =
      "message error";

    return false;
  }

}


/* =========================
   LOAD TASKS
========================= */

async function loadTasks(){

  taskList.innerHTML = `
    <div class="loading">
      Loading tasks...
    </div>
  `;

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("tasks")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );

    if(error){
      throw error;
    }

    allTasks =
      Array.isArray(data)
        ? data
        : [];

    renderTasks();

  }catch(error){

    console.error(
      "LOAD TASKS ERROR:",
      error
    );

    taskList.innerHTML = `
      <div class="empty error">
        Unable to load tasks.<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}


/* =========================
   RENDER TASKS
========================= */

function renderTasks(){

  if(!allTasks.length){

    taskList.innerHTML = `
      <div class="empty">
        No tasks found.
      </div>
    `;

    return;
  }

  taskList.innerHTML = "";

  allTasks.forEach(task => {

    const card =
      document.createElement("section");

    card.className =
      "task-card";

    const status =
      String(
        task.status || "active"
      ).toLowerCase();

    const levels =
      Array.isArray(task.target_levels)
        ? task.target_levels
        : [];

    let levelText =
      "Not specified";

    if(
      levels.includes("level_1") &&
      levels.includes("level_2")
    ){
      levelText =
        "Level 1 + Level 2";
    }else if(
      levels.includes("level_1")
    ){
      levelText =
        "Level 1";
    }else if(
      levels.includes("level_2")
    ){
      levelText =
        "Level 2";
    }

    let statusClass =
      "active";

    if(status === "paused"){
      statusClass = "paused";
    }

    if(status === "closed"){
      statusClass = "closed";
    }

    card.innerHTML = `

      <div class="task-head">

        <div>

          <div class="task-title">
            ${escapeHTML(task.title)}
          </div>

          <div class="task-id">
            ID: ${escapeHTML(task.id)}
          </div>

        </div>

        <span class="status ${statusClass}">
          ${escapeHTML(status)}
        </span>

      </div>

      <div class="task-description">
        ${escapeHTML(task.description)}
      </div>

      <div class="task-info">

        <div class="info">
          <small>Platform</small>
          <strong>
            ${escapeHTML(task.platform || "-")}
          </strong>
        </div>

        <div class="info">
          <small>Worker Reward</small>
          <strong>
            ${formatMoney(task.reward)}
          </strong>
        </div>

        <div class="info">
          <small>Workers Needed</small>
          <strong>
            ${escapeHTML(task.workers_needed ?? 1)}
          </strong>
        </div>

        <div class="info">
          <small>Target Level</small>
          <strong>
            ${escapeHTML(levelText)}
          </strong>
        </div>

      </div>

      <div class="task-buttons">

        <button
          class="primary edit-button"
          data-id="${escapeHTML(task.id)}"
        >
          Edit
        </button>

        ${
          status === "active"
          ?
          `
          <button
            class="warning status-button"
            data-id="${escapeHTML(task.id)}"
            data-status="paused"
          >
            Pause
          </button>
          `
          :
          status === "paused"
          ?
          `
          <button
            class="primary status-button"
            data-id="${escapeHTML(task.id)}"
            data-status="active"
          >
            Activate
          </button>
          `
          :
          ""
        }

        ${
          status !== "closed"
          ?
          `
          <button
            class="secondary close-button"
            data-id="${escapeHTML(task.id)}"
          >
            Close
          </button>
          `
          :
          ""
        }

        <button
          class="danger delete-button"
          data-id="${escapeHTML(task.id)}"
        >
          Delete
        </button>

      </div>

      <div style="
        margin-top:13px;
        color:#64748b;
        font-size:11px;
      ">
        Created: ${escapeHTML(formatDate(task.created_at))}
      </div>

    `;

    taskList.appendChild(card);

  });


  document
    .querySelectorAll(".edit-button")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => editTask(button.dataset.id)
      );

    });


  document
    .querySelectorAll(".delete-button")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => deleteTask(button.dataset.id)
      );

    });


  document
    .querySelectorAll(".status-button")
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          changeStatus(
            button.dataset.id,
            button.dataset.status
          )
      );

    });


  document
    .querySelectorAll(".close-button")
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          changeStatus(
            button.dataset.id,
            "closed"
          )
      );

    });

}


/* =========================
   CREATE / UPDATE
========================= */

taskForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    formMessage.textContent = "";
    formMessage.className = "";

    const title =
      document.getElementById("title")
        .value.trim();

    const description =
      document.getElementById("description")
        .value.trim();

    const platform =
      document.getElementById("platform")
        .value.trim();

    const taskUrl =
      document.getElementById("taskUrl")
        .value.trim();

    const reward =
      Number(
        document.getElementById("reward")
          .value
      );

    const workersNeeded =
      Number(
        document.getElementById("workersNeeded")
          .value
      );

    const targetLevel =
      document.getElementById("targetLevel")
        .value;


    if(
      !title ||
      !description ||
      !platform ||
      !taskUrl ||
      !Number.isFinite(reward) ||
      reward < 0 ||
      !Number.isInteger(workersNeeded) ||
      workersNeeded < 1
    ){

      formMessage.textContent =
        "Please complete all fields correctly.";

      formMessage.className =
        "error";

      return;
    }


    const targetLevels =
      targetLevel === "both"
        ? ["level_1","level_2"]
        : [targetLevel];


    const taskData = {

      title,
      description,
      platform,
      task_url:taskUrl,
      reward,
      workers_needed:workersNeeded,
      target_levels:targetLevels

    };


    try{

      saveButton.disabled = true;

      saveButton.textContent =
        editingTaskId
          ? "Saving..."
          : "Creating...";


      if(editingTaskId){

        const {
          error
        } =
        await supabaseClient
          .from("tasks")
          .update(taskData)
          .eq("id",editingTaskId);

        if(error){
          throw error;
        }

        formMessage.textContent =
          "Task updated successfully.";

      }else{

        const {
          error
        } =
        await supabaseClient
          .from("tasks")
          .insert({

            ...taskData,

            status:"active",

            created_by:currentUser.id,

            source:"admin"

          });

        if(error){
          throw error;
        }

        formMessage.textContent =
          "Task created successfully.";
      }


      formMessage.className =
        "success";

      resetForm();

      await loadTasks();

    }catch(error){

      console.error(
        "SAVE TASK ERROR:",
        error
      );

      formMessage.textContent =
        "Error: " +
        error.message;

      formMessage.className =
        "error";

    }finally{

      saveButton.disabled =
        false;

      saveButton.textContent =
        editingTaskId
          ? "Save Changes"
          : "Create Task";

    }

  }
);


/* =========================
   EDIT TASK
========================= */

function editTask(taskId){

  const task =
    allTasks.find(
      item =>
        String(item.id) ===
        String(taskId)
    );

  if(!task){
    return;
  }

  editingTaskId =
    task.id;


  document.getElementById("title")
    .value =
      task.title || "";

  document.getElementById("description")
    .value =
      task.description || "";

  document.getElementById("platform")
    .value =
      task.platform || "";

  document.getElementById("taskUrl")
    .value =
      task.task_url || "";

  document.getElementById("reward")
    .value =
      task.reward ?? 0;

  document.getElementById("workersNeeded")
    .value =
      task.workers_needed ?? 1;


  const levels =
    Array.isArray(task.target_levels)
      ? task.target_levels
      : [];


  if(
    levels.includes("level_1") &&
    levels.includes("level_2")
  ){

    document.getElementById("targetLevel")
      .value =
        "both";

  }else if(
    levels.includes("level_2")
  ){

    document.getElementById("targetLevel")
      .value =
        "level_2";

  }else{

    document.getElementById("targetLevel")
      .value =
        "level_1";

  }


  formTitle.textContent =
    "Edit Task";

  saveButton.textContent =
    "Save Changes";

  cancelButton.style.display =
    "inline-block";


  formMessage.textContent =
    "Editing selected task.";

  formMessage.className =
    "";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DELETE TASK
===================

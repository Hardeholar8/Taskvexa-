<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskVexa - Available Tasks</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#070a10;
  --card:#111722;
  --card2:#0d131e;
  --border:#202b3b;
  --text:#f8fafc;
  --muted:#7f8da3;
  --green:#4ade80;
  --red:#f87171;
  --yellow:#facc15;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

header{
  height:70px;
  background:#070a10;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.back-button,
.logout{
  padding:9px 13px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
}

.back-button{
  background:#151d2a;
  color:white;
  border:1px solid #293548;
  text-decoration:none;
}

.logout{
  background:#32191d;
  color:#f87171;
  border:1px solid #5b292f;
  cursor:pointer;
}

.content{
  max-width:1100px;
  margin:auto;
  padding:28px 18px 50px;
}

.heading{
  margin-bottom:22px;
}

.heading h1{
  margin:0 0 8px;
  font-size:28px;
}

.heading p{
  margin:0;
  color:var(--muted);
  font-size:14px;
}

.message{
  margin-bottom:18px;
  font-size:13px;
}

.success{color:var(--green)}
.error{color:var(--red)}
.pending{color:var(--yellow)}
.approved{color:var(--green)}
.rejected{color:var(--red)}

.loading,
.empty{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
}

.task-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
}

.task-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:9px;
}

.task-description{
  color:#a4b0c0;
  line-height:1.6;
  white-space:pre-wrap;
  margin-bottom:18px;
}

.task-info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:18px;
}

.info{
  background:var(--card2);
  border:1px solid #1d2838;
  border-radius:11px;
  padding:13px;
}

.info small{
  display:block;
  color:#64748b;
  font-size:10px;
  margin-bottom:6px;
}

.info strong{
  font-size:14px;
  word-break:break-word;
}

.reward{
  color:var(--green);
  font-size:17px !important;
}

.button{
  min-height:42px;
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  margin:4px 6px 4px 0;
}

.open-task{
  background:#f8fafc;
  color:#090d14;
  border:0;
}

.submit-proof{
  background:#151d2a;
  color:white;
  border:1px solid #293548;
}

.button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.submission-status{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  background:#0b111b;
  border:1px solid #1f2b3d;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:100;
  padding:20px;
  overflow-y:auto;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.modal-box h2{
  margin:0 0 8px;
}

.modal-description{
  color:var(--muted);
  font-size:13px;
  margin-bottom:18px;
  line-height:1.5;
}

.form-group{
  margin-bottom:16px;
}

label{
  display:block;
  color:#b9c4d3;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
}

input,
textarea{
  width:100%;
  padding:13px;
  background:#090e16;
  border:1px solid #293548;
  border-radius:10px;
  color:white;
  outline:none;
  font-size:14px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.file-note{
  color:#64748b;
  font-size:11px;
  margin-top:7px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.cancel{
  background:#151d2a;
  color:white;
  border:1px solid #293548;
}

.send{
  background:#f8fafc;
  color:#090d14;
  border:0;
}

#submitMessage{
  margin-top:12px;
  font-size:13px;
  font-weight:bold;
}

@media(max-width:700px){

  header{
    padding:0 13px;
  }

  .back-button,
  .logout{
    padding:8px 9px;
    font-size:11px;
  }

  .content{
    padding:22px 13px 40px;
  }

  .heading h1{
    font-size:24px;
  }

  .task-info{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    TaskVexa
  </div>

  <div class="header-right">

    <a href="worker.html" class="back-button">

        </label>

        <textarea
          id="proofText"

        ></textarea>

      </div>


      <div id="submitMessage"></div>


      <div class="modal-actions">

        <button
          type="button"
          id="cancelProof"
          class="button cancel"
        >
          Cancel
        </button>

        <button
          type="submit"
          id="submitProofButton"
          class="button send"
        >
          Submit Proof
        </button>

      </div>

    </form>

  </div>

</div>

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   MONEY
========================= */

function formatMoney(value){

  return "₦" +
    Number(value || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits:0,
        maximumFractionDigits:2
      }
    );

}


/* =========================
   CURRENT USER
========================= */

async function getCurrentUser(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();


  if(error){

    throw error;

  }


  if(
    !data ||
    !data.user
  ){

    window.location.href =
      "login.html";

    return null;

  }


  currentUser =
    data.user;


  const {
    data:profile,
    error:profileError
  } =
  await supabaseClient
    .from("profiles")
    .select("role")
    .eq(
      "id",
      currentUser.id
    )
    .maybeSingle();


  if(profileError){

    throw profileError;

  }


  if(
    !profile ||
    String(profile.role).toLowerCase() !==
    "worker"
  ){

    message.textContent =
      "This page is for worker accounts only.";

    message.className =
      "message error";

    return null;

  }


  return currentUser;

}


/* =========================
   LOAD SUBMISSIONS
========================= */

async function loadMySubmissions(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("task_submissions")
    .select(
      "id,task_id,status,reward_amount,created_at"
    )
    .eq(
      "worker_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    throw error;

  }


  submissions =
    Array.isArray(data)
      ? data
      : [];

}


/* =========================
   FIND SUBMISSION
========================= */

function getTaskSubmission(taskId){

  return submissions.find(
    item =>
      String(item.task_id) ===
      String(taskId)
  );

}

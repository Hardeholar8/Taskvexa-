</head><body><main class="page"><div class="top"><a class="back" href="wallet.html">‹</a><div class="brand"><strong id="title">Withdraw</strong><span id="subtitle">Select balance and withdraw to your verified account</span></div></div><section class="card center"><div class="label" id="balanceLabel">Task Balance</div><div class="balance" id="balance">₦0.00</div><div class="type" id="balanceMessage">Connecting...</div></section><section class="card"><div class="row"><h2>Withdrawal Account</h2><span class="pill" id="verify">CHECKING</span></div><div class="account"><strong id="bank">Connecting...</strong><span id="account">•••• ••••</span><span id="name">Checking account...</span></div><div class="amount-label">Withdrawal Amount</div><input class="input" id="amount" type="number" min="1" step="0.01" inputmode="decimal" placeholder="0.00"><div class="quick"><button data-v="25">₦25</button><button data-v="50">₦50</button><button data-v="100">₦100</button><button id="max">MAX</button></div><button class="btn" id="withdraw" disabled>Withdraw Automatically</button><div class="msg" id="msg"></div></section><section class="card"><div class="row"><h2>Withdrawal History</h2><span style="color:#69788e;font-size:10px">Latest</span></div><div id="history"><div class="empty">Connecting...</div></div></section></main><script id="supabase-loader" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){var loader=document.getElementById('supabase-loader');var started=Date.now();var ready=false;function fail(){if(ready)return;ready=true;var b=document.getElementById('balanceMessage'),h=document.getElementById('history'),m=document.getElementById('msg');if(b)b.textContent='Unable to connect';if(h)h.innerHTML='<div class="empty">Unable to load withdrawal data.</div>';if(m){m.className='msg show err';m.textContent='Connection problem. Please refresh and try again.'}}loader.onerror=function(){if(loader.dataset.fallback){fail();return}loader.dataset.fallback='1';loader.src='https://unpkg.com/@supabase/supabase-js@2'};setTimeout(function(){if(!window.supabase)fail()},8000);window.__taskvexaSupabaseReady=function(){if(window.supabase&&!ready){ready=true;window.dispatchEvent(new Event('taskvexa-supabase-ready'))}};window.addEventListener('load',function(){if(window.supabase)window.__taskvexaSupabaseReady()})})();</script><script>(function(){function start(){if(!window.supabase){return}const URL='https://dxtlnrthlpdaobnbazny.supabase.co',KEY='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY',sb=window.supabase.createClient(URL,KEY);const $=id=>document.getElementById(id),money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});let user,payout=null,balanceType=new URLSearchParams(location.search).get('type')==='affiliate'?'affiliate':'task',currentBalance=0;const isAffiliate=balanceType==='affiliate';$('balanceLabel').textContent=isAffiliate?'Affiliate Balance':'Task Balance';$('title').textContent='Withdraw '+(isAffiliate?'Affiliate':'Task')+' Balance';$('subtitle').textContent='Withdraw from your '+(isAffiliate?'affiliate':'task')+' balance';function message(t,ok=false){$('msg').className='msg show '+(ok?'ok':'err');$('msg').textContent=t}function setAmount(v){$('amount').value=Number(v||0)>0?Number(v).toFixed(2):''}function race(p,ms=3500){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('Connection timed out')),ms))])}async function init(){try{const s=await race(sb.auth.getSession());if(!s?.data?.session){$('balanceMessage').textContent='Please log in again';$('history').innerHTML='<div class="empty">Session expired. Please log in again.</div>';setTimeout(()=>location.href='login.html',700);return}user=s.data.session.user;loadBalance();loadAccount();loadHistory()}catch(e){$('balanceMessage').textContent='Unable to connect';$('history').innerHTML='<div class="empty">Unable to load withdrawal data.</div>';message('Unable to connect. Please refresh.')}}async ending').toUpperCase()+'</span></div><small>'+(w.balance_type==='affiliate'?'Affiliate Balance':'Task Balance')+' · '+new Date(w.created_at).toLocaleString('en-NG')+' · ••••'+String(w.account_number||'').slice(-4)+'</small></div>').join('')}catch(e){$('history').innerHTML='<div class="empty">Unable to load withdrawal history.</div>'}}document.querySelectorAll('.quick button[data-v]').forEach(b=>b.onclick=()=>setAmount(b.dataset.v));$('max').onclick=()=>setAmount(currentBalance);$('withdraw').onclick=async()=>{const amount=Number($('amount').value),btn=$('withdraw');$('msg').className='msg';if(!payout){message('Verify your payout account first.');return}if(!amount||amount<=0){message('Enter a valid withdrawal amount.');return}if(amount>currentBalance){message('Insufficient balance.');return}btn.disabled=true;btn.textContent='Processing...';try{const c=await race(sb.rpc('set_withdrawal_balance_type',{p_balance_type:balanceType}));if(c.error||!c.data?.success)throw Error(c.data?.message||c.error?.message||'Unable to select balance.');const s=await race(sb.auth.getSession());if(!s.data.session)throw Error('Session expired. Please log in again.');const res=await race(fetch(URL+'/functions/v1/process-withdrawal',{method:'POST',headers:{Authorization:'Bearer '+s.data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({amount,balance_type:balanceType})}),12000);const result=await res.json().catch(()=>({}));if(!res.ok||!result.success)throw Error(result.message||result.error||'Automatic withdrawal failed.');message(result.message||'Withdrawal is being processed.',true);$('amount').value='';loadBalance();loadHistory()}catch(e){message(e.message||'Automatic withdrawal failed.')}finally{btn.disabled=!payout;btn.textContent='Withdraw Automatically'}};init()}if(window.supabase){start()}else{window.addEventListener('taskvexa-supabase-ready',start);setTimeout(function(){if(window.supabase)start()},1000)}})();</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TaskVexa — Reset Password</title><style>:root{--bg:#07090f;--card:#101522;--field:#0b111c;--line:#263249;--text:#f7f9fc;--muted:#9aa6b8;--accent:#7c5cff;--accent2:#21d4a4;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#182044 0,#07090f 48%,#05060a 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:480px;margin:auto;padding:34px 16px}.brand{text-align:center;margin:8px 0 24px}.logo{width:54px;height:54px;border-radius:16px;margin:0 auto 10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#080b12;font-weight:900;font-size:25px}.brand h1{margin:0;font-size:26px}.brand p{margin:7px 0;color:var(--muted);font-size:14px}.card{background:rgba(16,21,34,.94);border:1px solid var(--line);border-radius:22px;padding:25px 21px;box-shadow:0 24px 70px #0008}h2{margin:0 0 8px;font-size:20px}.intro{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:20px}.field{margin-bottom:14px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.field input{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text);padding:0 14px;font-size:15px;outline:none}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c5cff18}button{width:100%;height:52px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#080b12;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}#message{min-height:22px;margin:14px 0;text-align:center;font-size:14px;line-height:1.5}.back{text-align:center;margin-top:18px}.back a{color:#a99aff;text-decoration:none;font-weight:700}.note{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px;line-height:1.5}</style></head><body><div class="wrap"><div class="brand"><div class="logo">T</div><h1>TaskVexa</h1><p>Choose a new password</p></div><main class="card"><h2>Reset your password</h2><p class="intro">Create a new password for your TaskVexa account.</p><form id="resetForm" style="display:none"><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Enter new password" required></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Confirm new password" required></div><button id="resetButton" type="submit">Update Password</button></form><div id="message" aria-live="polite">Checking reset link...</div><div class="note">For your security, reset links expire. Request a new link if this one is no longer valid.</div><div class="back"><a href="login.html">← Back to Login</a></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://dxtlnrthlpdaobnbazny.supabase.co",SUPABASE_KEY="sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY",client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const form=document.getElementById('resetForm'),button=document.getElementById('resetButton'),message=document.getElementById('message');
async function init(){try{const hash=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):'');const access=hash.get('access_token'),refresh=hash.get('refresh_token');if(access&&refresh){const {error}=await client.auth.setSession({access_token:access,refresh_token:refresh});if(error)throw error;}else if(new URLSearchParams(location.search).has('error'))throw new Error('Reset link is invalid or expired.');const {data,error}=await client.auth.getSession();if(error||!data.session)throw new Error('This reset link is invalid or has expired.');form.style.display='block';message.textContent='';}catch(e){message.style.color='#fb7185';message.textContent=e.message||'This reset link is invalid or has expired.';form.style.display='none';}}
init();form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirmPassword').value;if(p!==c){message.style.color='#fb7185';message.textContent='Passwords do not match.';return}if(p.length<6){message.style.color='#fb7185';message.textContent='Password must be at least 6 characters.';return}button.disabled=true;button.textContent='Updating...';message.textContent='';try{const {error}=await client.auth.updateUser({password:p});if(error)throw error;message.style.color='#21d4a4';message.textContent='Password updated successfully. Redirecting to login...';await client.auth.signOut();setTimeout(()=>location.href='login.html',1800);}catch(e){message.style.color='#fb7185';message.textContent=e.message||'Unable to update password.';button.disabled=false;button.textContent='Update Password';}});
</script></body></html>

name: Apply FILORA theme site-wide

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-filora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject shared FILORA theme into every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              changed=False
              css='<link rel="stylesheet" href="/filora-theme.css?v=1">'
              js='<script src="/theme.js?v=9"></script>'
              if css not in s and '</head>' in s:
                  s=s.replace('</head>',css+'\n</head>',1); changed=True
              if js not in s and '<script src="/theme.js' not in s and '</head>' in s:
                  s=s.replace('</head>',js+'\n</head>',1); changed=True
              if changed:
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit FILORA injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply FILORA theme across worker promoter and admin pages [skip ci]"
          git push

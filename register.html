<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskVexa - Register</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>
    <h1>Create TaskVexa Account</h1>

    <div id="message"></div>

    <form id="registerForm">

      <label>Full Name</label>
      <input type="text" id="fullName" autocomplete="name" required>

      <label>Email</label>
      <input type="email" id="email" autocomplete="email" required>

      <label>Password</label>
      <input
        type="password"
        id="password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label>Account Type</label>
      <select id="accountType" required>
        <option value="">Select account type</option>
        <option value="worker">Worker</option>
        <option value="promoter">Promoter</option>
      </select>

      <button type="submit" id="registerButton">
        Create Account
      </button>

    </form>

    <div id="successBox" style="display:none;">
      <h2>Account Created!</h2>
      <p>
        Your account has been created successfully.
        Please check your email and click the confirmation link
        before logging in.
      </p>

      <button onclick="window.location.href='login.html'">
        Go to Login
      </button>
    </div>

    <p>
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL = https://dxtlnrthlpdaobnbazny.supabase.co
    const SUPABASE_KEY = sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");
    const successBox = document.getElementById("successBox");


    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const name = document
        .getElementById("fullName")
        .value
        .trim();

      const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

      const password = document
        .getElementById("password")
        .value;

      const accountType = document
        .getElementById("accountType")
        .value;


      if (!name || !email || !password || !accountType) {
        message.textContent = "Please complete all fields.";
        return;
      }


      if (password.length < 6) {
        message.textContent =
          "Password must be at least 6 characters.";
        return;
      }


      button.disabled = true;
      button.textContent = "Creating Account...";
      message.textContent = "";


      try {

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
              emailRedirectTo:
                window.location.origin + "/login.html",

              data: {
                full_name: name,
                account_type: accountType
              }
            }

          });


        if (error) {
          message.textContent = error.message;
          button.disabled = false;
          button.textContent = "Create Account";
          return;
        }


        form.style.display = "none";

        successBox.style.display = "block";


      } catch (error) {

        message.textContent =
          "Something went wrong. Please try again.";

        button.disabled = false;
        button.textContent = "Create Account";

      }

    });

  </script>

</body>
</html>

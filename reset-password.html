<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskVexa - Forgot Password</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main>
  <h1>Forgot Password</h1>

  <div id="message"></div>

  <form id="forgotForm">

    <label>Email</label>

    <input
      type="email"
      id="email"
      autocomplete="email"
      required
    >

    <button type="submit" id="forgotButton">
      Send Reset Email
    </button>

  </form>

  <p>
    <a href="login.html">Back to Login</a>
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const form =
  document.getElementById("forgotForm");

const button =
  document.getElementById("forgotButton");

const message =
  document.getElementById("message");


form.addEventListener("submit", async (event) => {

  event.preventDefault();

  const email =
    document.getElementById("email")
      .value
      .trim()
      .toLowerCase();

  button.disabled = true;
  button.textContent = "Sending...";
  message.textContent = "";

  try {

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin +
            "/reset-password.html"
        }
      );

    if (error) {
      message.textContent = error.message;
      button.disabled = false;
      button.textContent = "Send Reset Email";
      return;
    }

    message.textContent =
      "Reset email sent. Please check your inbox and spam folder.";

    button.disabled = false;
    button.textContent = "Send Reset Email";

  } catch (error) {

    message.textContent =
      "Error: " + error.message;

    button.disabled = false;
    button.textContent = "Send Reset Email";

  }

});

</script>

</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TaskVexa - Available Tasks</title><style>*{box-sizing:border-box}:root{--bg:#070b14;--panel:#0d1422;--panel2:#111a2b;--border:#1d293d;--text:#f8fafc;--muted:#94a3b8;--accent:#7c3aed;--accent2:#a78bfa}body{margin:0;background:radial-gradient(circle at top right,rgba(124,58,237,.16),transparent 34%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}.top{height:68px;position:sticky;top:0;z-index:20;background:rgba(7,11,20,.94);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-size:23px;font-weight:800}.brand span{color:var(--accent2)}.back{border:1px solid var(--border);background:var(--panel2);color:#fff;border-radius:10px;padding:9px 12px;text-decoration:none;font-size:13px}.logout{border:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.08);color:#fca5a5;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.wrap{max-width:1000px;margin:auto;padding:26px 15px 90px}.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0 0 18px;color:var(--muted);font-size:14px}.message{font-size:13px;margin-bottom:16px}.error{color:#fca5a5}.success{color:#86efac}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.task{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:19px}.task h2{margin:0 0 8px;font-size:17px}.desc{color:#a4b0c0;font-size:12px;line-height:1.6;white-space:pre-wrap;min-height:38px;margin-bottom:14px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.meta div{background:var(--panel2);border:1px solid #263247;border-radius:10px;padding:10px}.meta small{display:block;color:#64748b;font-size:9px;margin-bottom:5px}.meta strong{font-size:12px}.reward{color:#86efac;font-size:16px}.button{border:0;border-radius:10px;padding:11px 14px;font-size:12px;font-weight:800;cursor:pointer}.open{background:#fff;color:#090d14}.submit{background:#7c3aed;color:#fff}.empty{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:38px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;padding:18px;align-items:center;justify-content:center}.modal.show{display:flex}.box{width:100%;max-width:500px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:21px}.box p{color:var(--muted);font-size:12px;line-height:1.5}.field{margin:15px 0}.field label{display:block;color:#cbd5e1;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;padding:12px;background:#090e18;border:1px solid #293548;border-radius:10px;color:#fff}.field textarea{min-height:80px}.actions{display:flex;gap:8px;margin-top:15px}.cancel{background:#182131;color:#fff}.send{background:#fff;color:#090d14}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:rgba(9,15,28,.97);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:30}.bottom a{color:#94a3b8;text-decoration:none;font-size:10px;text-align:center}.bottom a.active{color:#c4b5fd}.bottom b{display:block;font-size:19px;margin-bottom:3px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:24px}}</style></head><body><header class="top"><a class="back" href="dashboard.html">← Dashboard</a><div class="brand">Task<span>Vexa</span></div><button id="logout" class="logout">Logout</button></header><main class="wrap"><section class="hero"><h1>Available Tasks</h1><p>Complete available tasks and submit your screenshot proof for review.</p></section><div id="message" class="message">Loading tasks...</div><section id="taskList" class="grid"><div class="empty">Loading tasks...</div></section></main><div id="modal" class="modal"><div class="box"><h2>Submit Task Proof</h2><p>Upload a screenshot showing that you completed this task.</p><div class="field"><label>Screenshot Proof</label><input id="file" type="file" accept="image/*"></div><div class="field"><label>Additional Note (Optional)</label><textarea id="note"></textarea></div><div id="modalMessage"></div><div class="actions"><button id="cancel" class="button cancel">Cancel</button><button id="send" class="button send">Submit Proof</button></div></div></div><nav class="bottom"><a href="dashboard.html"><b>⌂</b>Home</a><a class="active" href="tasks.html"><b>✓</b>Tasks</a><a href="airtime.html"><b>₦</b>Airtime</a><a href="withdraw.html"><b>◉</b>Wallet</a><a href="profile.html"><b>☻</b>Profile</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const $=id=>document.getElementById(id);let user=null,selected=null,submitted=new Set();const fail=t=>{$('message').textContent=t;$('message').className='message error';$('taskList').innerHTML='<div class="empty">'+t+'</div>'};async function init(){let timer=setTimeout(()=>fail('Unable to check your account. Please refresh and try again.'),8000);try{const session=(await sb.auth.getSession()).data.session;if(!session){clearTimeout(timer);location.href='login.html';return}user=session.user;const r=await Promise.race([sb.from('profiles').select('role,activation_status,activation_level').eq('id',user.id).maybeSingle(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Profile check timed out.')),5000))]);if(r.error)throw r.error;const p=r.data;if(String(p?.role||'').toLowerCase()!=='worker')throw new Error('This page is for worker accounts only.');const active=['active','activated','approved','true'].includes(String(p?.activation_status||'').toLowerCase())||Number(p?.activation_level||0)>0;if(!active){clearTimeout(timer);$('message').textContent='Your account must be activated before you can access tasks.';$('taskList').innerHTML='<div class="empty"><h3 style="color:#fff">Account not activated</h3>Please activate your worker account to access tasks.</div>';return}const s=await sb.from('task_submissions').select('task_id').eq('worker_id',user.id);if(s.error)throw s.error;(s.data||[]).forEach(x=>submitted.add(String(x.task_id)));const t=await sb.from('tasks').select('id,title,description,platform,task_url,reward,status,created_at').eq('status','active').order('created_at',{ascending:false});if(t.error)throw t.error;clearTimeout(timer);const tasks=(t.data||[]).filter(x=>!submitted.has(String(x.id)));if(!tasks.length){$('message').textContent='No new tasks are available right now.';$('taskList').innerHTML='<div class="empty">No new tasks are available right now.</div>';return}$('message').textContent=tasks.length+' task'+(tasks.length===1?'':'s')+' available.';$('taskList').innerHTML=tasks.map(t=>'<article class="task"><h2>'+esc(t.title)+'</h2><div class="desc">'+esc(t.description||'No instructions provided.')+'</div><div class="meta"><div><small>PLATFORM</small><strong>'+esc(t.platform||'Task')+'</strong></div><div><small>REWARD</small><strong class="reward">₦'+Number(t.reward||0).toLocaleString('en-NG')+'</strong></div></div><button class="button open" data-open="'+t.id+'">Open Task</button> <button class="button submit" data-submit="'+t.id+'">Submit Proof</button></article>').join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const x=tasks.find(y=>String(y.id)===String(b.dataset.open));if(x?.task_url)location.href=x.task_url;else alert('This task has no link.')});document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>{selected=tasks.find(x=>String(x.id)===String(b.dataset.submit));$('file').value='';$('note').value='';$('modal').classList.add('show')})}catch(e){clearTimeout(timer);console.error(e);fail(e.message||'Unable to load tasks.')}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('cancel').onclick=()=>$('modal').classList.remove('show');$('send').onclick=async()=>{const f=$('file').files[0];if(!f||!selected)return;if(f.size>5*1024*1024){alert('Screenshot must be 5MB or smaller.');return}$('send').disabled=true;try{const path=user.id+'/'+selected.id+'-'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const u=await sb.storage.from('task-proofs').upload(path,f,{upsert:false,contentType:f.type});if(u.error)throw u.error;const url=sb.storage.from('task-proofs').getPublicUrl(path).data.publicUrl;const ins=await sb.from('task_submissions').insert({task_id:selected.id,worker_id:user.id,proof_url:url,proof_text:$('note').value.trim(),status:'pending',reward_amount:Number(selected.reward||0)});if(ins.error)throw ins.error;$('modal').classList.remove('show');init()}catch(e){alert(e.message||'Submission failed.')}finally{$('send').disabled=false}};$('logout').onclick=async()=>{await sb.auth.signOut();location.href='login.html'};init();</script></body></html>

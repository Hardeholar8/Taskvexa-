<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>TaskVexa - Affiliate Withdrawal</title><link rel="stylesheet" href="/filora-theme.css?v=1"><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px 14px 40px}.top{display:flex;align-items:center;gap:12px;margin-bottom:15px}.back{width:42px;height:42px;border-radius:14px;background:#101722;border:1px solid #202c3e;color:#fff;text-decoration:none;display:grid;place-items:center;font-size:24px}.brand strong{display:block;font-size:17px}.muted{color:#94a3b8;font-size:11px}.card{background:#0d1422;border:1px solid #1d293d;border-radius:17px;padding:17px;margin-bottom:12px}.center{text-align:center}.label{color:#94a3b8;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:800}.balance{font-size:34px;font-weight:900;margin:8px 0}.input{width:100%;padding:15px;border-radius:13px;border:1px solid #29374b;background:#080e17;color:#fff;font-size:20px;font-weight:800}.quick{display:flex;gap:7px;margin-top:9px}.quick button{flex:1;border:1px solid #263449;background:#111a28;color:#cbd5e1;border-radius:10px;padding:9px 3px;font-size:10px;font-weight:800}.btn{width:100%;border:0;border-radius:13px;margin-top:12px;padding:15px;background:#f4f7fb;color:#080c12;font-weight:900}.btn:disabled{opacity:.5}.account{font-size:12px;color:#94a3b8;line-height:1.6}.msg{margin-top:10px;padding:11px;border-radius:11px;font-size:11px;display:none}.msg.show{display:block}.err{background:#251017;color:#fb7185}.ok{background:#0c2116;color:#65e68e}.history{padding:11px;border:1px solid #202c3e;border-radius:12px;margin-top:8px}.history small{display:block;color:#94a3b8;margin-top:5px;font-size:10px}</style><script src="/theme.js?v=10"></script></head><body><main class="wrap"><div class="top"><a class="back" href="affiliate.html">‹</a><div class="brand"><strong>Withdraw Affiliate Balance</strong><span class="muted">Affiliate wallet withdrawal</span></div></div><section class="card center"><div class="label">Affiliate Balance</div><div id="balance" class="balance">₦0.00</div><div id="state" class="muted">Loading balance...</div></section><section class="card"><div class="account" id="account">Checking verified payout account...</div><div style="font-size:12px;font-weight:800;margin:14px 0 7px">Withdrawal Amount</div><input id="amount" class="input" type="number" min="1" step="0.01" inputmode="decimal" placeholder="0.00"><div class="quick"><button data-v="25">₦25</button><button data-v="50">₦50</button><button data-v="100">₦100</button><button id="max">MAX</button></div><button id="withdraw" class="btn" disabled>Withdraw Affiliate Balance</button><div id="msg" class="msg"></div></section><section class="card"><div style="font-size:13px;font-weight:800">Affiliate Withdrawal History</div><div id="history"><div class="muted" style="text-align:center;padding:14px">Loading...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://dxtlnrthlpdaobnbazny.supabase.co',KEY='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY',sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),money=v=>'₦'+Number(v||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});let user,balance=0,payout=null;function timeout(p,ms=8000){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Error('Request timed out. Please refresh and try again.')),ms))])}function msg(t,ok=false){$('msg').textContent=t;$('msg').className='msg show '+(ok?'ok':'err')}async function load(){try{const a=await timeout(sb.auth.getUser());if(a.error||!a.data.user){location.href='login.html';return}user=a.data.user;const w=await timeout(sb.from('wallets').select('affiliate_balance').eq('user_id',user.id).maybeSingle());if(w.error)throw w.error;balance=Number(w.data?.affiliate_balance||0);const c=await timeout(sb.from('referral_commissions').select('commission_amount').eq('referrer_id',user.id));if(!c.error)balance=Math.max(balance,(c.data||[]).reduce((s,x)=>s+Number(x.commission_amount||0),0));$('balance').textContent=money(balance);$('state').textContent='Available for affiliate withdrawal';const p=await timeout(sb.from('payout_accounts').select('bank_name,account_number,account_name,verification_status').eq('user_id',user.id).eq('verification_status','verified').maybeSingle());if(p.error||!p.data){$('account').textContent='No verified payout account. Add and verify your account first.'}else{payout=p.data;$('account').textContent=(p.data.bank_name||'Verified bank')+' · ••••'+String(p.data.account_number||'').slice(-4)+' · '+(p.data.account_name||'Verified account');$('withdraw').disabled=false}loadHistory()}catch(e){$('state').textContent='Unable to load balance';$('account').textContent='Unable to load payout account';msg(e.message||'Unable to load affiliate wallet.')}}async function loadHistory(){try{const r=await timeout(sb.from('withdrawals').select('amount,status,created_at,balance_type').eq('worker_id',user.id).eq('balance_type','affiliate').order('created_at',{ascending:false}).limit(20));if(r.error)throw r.error;if(!r.data?.length){$('history').innerHTML='<div class="muted" style="text-align:center;padding:14px">No affiliate withdrawals yet.</div>';return}$('history').innerHTML=r.data.map(x=>'<div class="history"><b>'+money(x.amount)+'</b><small>'+String(x.status||'pending').toUpperCase()+' · '+new Date(x.created_at).toLocaleString('en-NG')+'</small></div>').join('')}catch(e){$('history').innerHTML='<div class="muted" style="padding:14px">Unable to load history.</div>'}}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{$('amount').value=b.dataset.v});$('max').onclick=()=>$('amount').value=balance>0?balance.toFixed(2):'';$('withdraw').onclick=async()=>{const amount=Number($('amount').value);if(!payout)return msg('Verify your payout account first.');if(!amount||amount<=0)return msg('Enter a valid withdrawal amount.');if(amount>balance)return msg('Insufficient affiliate balance.');const b=$('withdraw');b.disabled=true;b.textContent='Processing...';try{const c=await timeout(sb.rpc('set_withdrawal_balance_type',{p_balance_type:'affiliate'}));if(c.error||!c.data?.success)throw Error(c.data?.message||c.error?.message||'Unable to select affiliate balance.');const s=await timeout(sb.auth.getSession());if(!s.data.session)throw Error('Session expired. Please log in again.');const r=await timeout(fetch(URL+'/functions/v1/process-withdrawal',{method:'POST',headers:{Authorization:'Bearer '+s.data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({amount,balance_type:'affiliate'})}),12000);const out=await r.json().catch(()=>({}));if(!r.ok||!out.success)throw Error(out.message||out.error||'Automatic withdrawal failed.');msg(out.message||'Withdrawal is being processed.',true);$('amount').value='';await load()}catch(e){msg(e.message||'Automatic withdrawal failed.')}finally{b.disabled=!payout;b.textContent='Withdraw Affiliate Balance'}};load();</script></body></html>

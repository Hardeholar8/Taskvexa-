<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskVexa - Admin Submissions</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>TaskVexa Admin</h1>

  <a href="dashboard.html">
    Dashboard
  </a>
</header>


<main>

  <h2>Task Submissions</h2>

  <div id="message">
    Loading submissions...
  </div>

  <div id="submissionList"></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const message =
  document.getElementById(
    "message"
  );


const submissionList =
  document.getElementById(
    "submissionList"
  );


/* =========================
   LOAD PENDING SUBMISSIONS
========================= */

async function loadSubmissions() {

  try {

    const {
      data: { user },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError || !user) {

      window.location.href =
        "login.html";

      return;

    }


    /*
      Secure RPC gets pending
      submissions + worker email.
    */

    const {
      data: submissions,
      error
    } =
      await supabaseClient.rpc(
        "get_admin_pending_submissions"
      );


    if (error) {

      throw error;

    }


    submissionList.innerHTML =
      "";


    if (
      !submissions ||
      submissions.length === 0
    ) {

      message.textContent =
        "No pending submissions.";

      return;

    }


    message.textContent =
      "";


    submissions.forEach(
      submission => {

        const card =
          document.createElement(
            "section"
          );


        card.className =
          "task-card";


        card.innerHTML = `

          <h3>
            ${escapeHTML(
              submission.task_title ||
              "Task"
            )}
          </h3>


          <p>
            <strong>Platform:</strong>
            ${escapeHTML(
              submission.task_platform ||
              "Not specified"
            )}
          </p>


          <p>
            <strong>Reward:</strong>
            ₦${Number(
              submission.reward_amount ||
              submission.task_reward ||
              0
            ).toLocaleString()}
          </p>


          <p>
            <strong>Worker Email:</strong>
            ${escapeHTML(
              submission.worker_email ||
              "Email unavailable"
            )}
          </p>


          <p>
            <strong>Worker ID:</strong>
            ${escapeHTML(
              submission.worker_id
            )}
          </p>


          <p>
            <strong>Status:</strong>
            Pending
          </p>


          ${
            submission.proof_url
              ?
              `
              <p>

                <a
                  href="${escapeHTML(
                    submission.proof_url
                  )}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="task-button"
                >
                  View Screenshot
                </a>

              </p>
              `
              :
              ""
          }


          <button
            onclick="reviewSubmission(
              '${submission.id}',
              'approved'
            )"
          >
            Approve
          </button>


          <button
            onclick="reviewSubmission(
              '${submission.id}',
              'rejected'
            )"
          >
            Reject
          </button>

        `;


        submissionList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    message.textContent =
      "ERROR: " +
      error.message;

  }

}


/* =========================
   SAFE REVIEW
========================= */

async function reviewSubmission(
  submissionId,
  newStatus
) {

  const action =
    newStatus === "approved"
      ? "approve"
      : "reject";


  if (
    !confirm(
      `Are you sure you want to ${action} this submission?`
    )
  ) {

    return;

  }


  try {

    const {
      data: { user },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (
      userError ||
      !user
    ) {

      window.location.href =
        "login.html";

      return;

    }


    /*
      Use the safe database function.
    */

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "review_task_submission",
        {
          p_submission_id:
            submissionId,

          p_action:
            action
        }
      );


    if (error) {

      throw error;

    }


    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        "The submission could not be reviewed."
      );

    }


    if (
      action === "approve"
    ) {

      alert(
        "Submission approved and reward credited successfully."
      );

    } else {

      alert(
        "Submission rejected successfully."
      );

    }


    loadSubmissions();


  } catch (error) {

    console.error(
      error
    );


    alert(
      "Error: " +
      error.message
    );

  }

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   START
========================= */

loadSubmissions();

</script>


</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>TaskVexa — Post Photo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/promoter-auth.js?v=20260919f"></script><link rel="stylesheet" href="/filora-theme.css?v=1"><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:20px 16px 110px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{width:42px;height:42px;border:1px solid #26344d;background:#111827;color:#fff;border-radius:13px;font-size:18px}.title{font-size:22px;font-weight:900}.sub{color:#94a3b8;font-size:12px;margin-top:3px}.card{background:linear-gradient(180deg,#121b2d,#0f1728);border:1px solid #26344d;border-radius:19px;padding:17px;margin-bottom:13px}label{display:block;font-size:12px;color:#b8c1d1;margin:0 0 7px}.field{margin-bottom:15px}.field:last-child{margin-bottom:0}input,textarea{width:100%;box-sizing:border-box;background:#0b1220;border:1px solid #2d3a52;color:#fff;border-radius:12px;padding:13px;font-size:14px;outline:none}textarea{min-height:82px}.step{color:#9a73ff;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:9px}.preview{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;border:1px solid #26344d;background:#0b1220;display:none}.grid{display:grid;grid-template-columns:1fr;gap:10px}.total{display:flex;justify-content:space-between;padding:14px;border:1px solid #3b3470;background:#211941;border-radius:14px;margin-top:10px}.total span{color:#b9b2d2;font-size:11px}.total strong{font-size:20px}.btn{width:100%;border:0;border-radius:13px;padding:15px;background:linear-gradient(135deg,#6947ff,#9b61ff);color:#fff;font-weight:850;font-size:14px}.btn:disabled{opacity:.5}.notice{font-size:11px;color:#94a3b8;line-height:1.5}.err{color:#ff8795;font-size:12px;margin-top:9px}.ok{color:#4ade80;font-size:12px;margin-top:9px}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="location.href='promoter-dashboard.html'">←</button><div><div class="title">Post Photo</div><div class="sub">Create a View Photo & Earn campaign for Workers.</div></div></div><section class="card"><div class="step">01 · Photo</div><div class="field"><label>Photo</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview"></div><div class="field"><label>Photo title</label><input id="title" placeholder="e.g. Check out our new service"></div><div class="field"><label>Description</label><textarea id="description" placeholder="Tell Workers what this photo is about..."></textarea></div></section><section class="card"><div class="step">02 · Campaign</div><div class="field"><label>Promoter price per worker</label><input id="price" type="text" value="Loading..." readonly><div class="notice">Set by Admin</div></div><div class="field"><label>Number of workers</label><input id="views" type="number" min="1" step="1" value="10"></div><div class="total"><span>TOTAL CAMPAIGN COST</span><strong id="total">₦0.00</strong></div></section><section class="card"><div class="step">03 · Verification</div><div class="field"><label>Verification question</label><input id="question" value="What main visual is shown in this photo?"></div><div class="field"><label>Correct answer</label><input id="answer" placeholder="e.g. A phone"></div><div class="notice">Your campaign is charged using the Admin-set Promoter price per worker. Worker rewards are managed separately by Admin.</div><div id="message"></div></section><button id="create" class="btn">Post & Go Live</button></main><script>const sb=window.promoterSupabase,$=id=>document.getElementById(id),money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});let ctx;function total(){const r=Number($('price').dataset.amount||0),v=Math.max(0,parseInt($('views').value||0,10));$('total').textContent=money(r*v)}$('views').addEventListener('input',total);$('image').addEventListener('change',()=>{const f=$('image').files[0],p=$('preview');if(!f){p.style.display='none';return}p.src=URL.createObjectURL(f);p.style.display='block'});async function init(){ctx=await requirePromoter();if(!ctx)return;const {data:settings,error:se}=await sb.rpc('get_photo_reward_settings');if(se||!settings?.enabled||!settings?.promoter_price_enabled||Number(settings.promoter_price)<=0){$('message').innerHTML='<div class="err">Photo campaign pricing is not currently configured by Admin.</div>';return}$('price').value=money(settings.promoter_price);$('price').dataset.amount=Number(settings.promoter_price);total()}async function go(){const f=$('image').files[0],title=$('title').value.trim(),price=Number($('price').dataset.amount||0),views=parseInt($('views').value,10),answer=$('answer').value.trim();$('message').innerHTML='';if(!f||!title||!price||!Number.isInteger(views)||views<1||!answer){$('message').innerHTML='<div class="err">Complete all required fields.</div>';return}if(f.size>5*1024*1024){$('message').innerHTML='<div class="err">Photo must be 5 MB or smaller.</div>';return}$('create').disabled=true;$('create').textContent='Uploading & posting...';try{const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=ctx.user.id+'/'+crypto.randomUUID()+'.'+ext;const up=await sb.storage.from('photo-campaigns').upload(path,f,{contentType:f.type||'image/jpeg',upsert:false});if(up.error)throw up.error;const image_url=sb.storage.from('photo-campaigns').getPublicUrl(path).data.publicUrl;const {data:id,error}=await sb.rpc('create_photo_campaign',{p_title:title,p_description:$('description').value.trim(),p_image_url:image_url,p_target_views:views,p_ends_at:null,p_verification_question:$('question').value.trim(),p_verification_answer:answer});if(error)throw error;$('message').innerHTML='<div class="ok">Photo campaign is LIVE. Workers can now see it.</div>';setTimeout(()=>location.href='promoter-my-photos.html?v=2',900)}catch(e){$('message').innerHTML='<div class="err">'+String(e?.message||e).replace(/[<>]/g,'')+'</div>';$('create').disabled=false;$('create').textContent='Post & Go Live'}}$('create').addEventListener('click',go);init();</script></body></html>

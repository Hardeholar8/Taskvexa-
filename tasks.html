<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskVexa - Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>TaskVexa</h1>
  <a href="dashboard.html">Dashboard</a>
</header>

<main>

  <!-- TASK LIST -->
  <section id="taskListSection">

    <h2>Available Tasks</h2>
    <p>Choose a task you want to complete.</p>

    <div id="message">Loading tasks...</div>

    <div id="taskList"></div>

  </section>


  <!-- TASK DETAILS -->
  <section id="taskDetailsSection" style="display:none;">

    <button id="backButton">
      ← Back to Tasks
    </button>

    <h2 id="detailTitle"></h2>

    <p>
      <strong>Platform:</strong>
      <span id="detailPlatform"></span>
    </p>

    <p>
      <strong>Task Reward:</strong>
      ₦<span id="detailReward"></span>
    </p>

    <p>
      <strong>Workers Needed:</strong>
      <span id="detailWorkers"></span>
    </p>

    <hr>

    <h3>Instructions</h3>

    <p id="detailDescription"></p>

    <br>

    <a
      id="openTaskButton"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      class="task-button"
    >
      Open Task
    </a>

    <hr>

    <h3>Submit Proof</h3>

    <p>
      Upload a screenshot showing that you completed the task.
    </p>

    <input
      type="file"
      id="proofFile"
      accept="image/*"
    >

    <br><br>

    <button id="submitProofButton">
      Submit Proof
    </button>

    <p id="proofMessage"></p>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const taskList =
  document.getElementById("taskList");

const message =
  document.getElementById("message");

const taskListSection =
  document.getElementById("taskListSection");

const taskDetailsSection =
  document.getElementById("taskDetailsSection");

const backButton =
  document.getElementById("backButton");

const submitProofButton =
  document.getElementById("submitProofButton");

const proofMessage =
  document.getElementById("proofMessage");

let selectedTask = null;


/* =========================
   LOAD TASKS
========================= */

async function loadTasks() {

  try {

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {

      window.location.href = "login.html";
      return;
    }


    const { data: tasks, error } =
      await supabaseClient
        .from("tasks")
        .select("*")
        .eq("status", "active")
        .order("created_at", {
          ascending: false
        });


    if (error) {
      throw error;
    }


    taskList.innerHTML = "";


    if (!tasks || tasks.length === 0) {

      message.textContent =
        "No tasks are currently available.";

      return;
    }


    message.textContent = "";


    tasks.forEach(task => {

      const card =
        document.createElement("section");

      card.className = "task-card";


      card.innerHTML = `

        <h3>${escapeHTML(task.title)}</h3>

        <p>
          ${escapeHTML(task.description)}
        </p>

        <p>
          <strong>Platform:</strong>
          ${escapeHTML(task.platform || "Not specified")}
        </p>

        <p>
          <strong>Task Reward:</strong>
          ₦${Number(task.reward).toLocaleString()}
        </p>

        <p>
          <strong>Workers Needed:</strong>
          ${task.workers_needed}
        </p>

        <button class="task-button">
          View Task
        </button>

      `;


      const viewButton =
        card.querySelector("button");


      viewButton.addEventListener(
        "click",
        () => showTaskDetails(task)
      );


      taskList.appendChild(card);

    });


  } catch (error) {

    console.error(error);

    message.textContent =
      "ERROR: " + error.message;

  }

}


/* =========================
   SHOW TASK DETAILS
========================= */

function showTaskDetails(task) {

  selectedTask = task;


  document.getElementById("detailTitle")
    .textContent = task.title;


  document.getElementById("detailPlatform")
    .textContent =
      task.platform || "Not specified";


  document.getElementById("detailReward")
    .textContent =
      Number(task.reward).toLocaleString();


  document.getElementById("detailWorkers")
    .textContent =
      task.workers_needed;


  document.getElementById("detailDescription")
    .textContent =
      task.description;


  document.getElementById("openTaskButton")
    .href =
      task.task_url;


  proofMessage.textContent = "";

  document.getElementById("proofFile").value = "";


  taskListSection.style.display = "none";

  taskDetailsSection.style.display = "block";


  window.scrollTo(0, 0);

}


/* =========================
   BACK TO TASKS
========================= */

backButton.addEventListener(
  "click",
  () => {

    selectedTask = null;

    taskDetailsSection.style.display = "none";

    taskListSection.style.display = "block";

    proofMessage.textContent = "";

  }
);


/* =========================
   SUBMIT PROOF
========================= */

submitProofButton.addEventListener(
  "click",
  async () => {

    if (!selectedTask) {

      proofMessage.textContent =
        "Please select a task.";

      return;
    }


    const file =
      document.getElementById("proofFile")
        .files[0];


    if (!file) {

      proofMessage.textContent =
        "Please upload a screenshot first.";

      return;
    }


    try {

      submitProofButton.disabled = true;

      submitProofButton.textContent =
        "Submitting...";


      const {
        data: { user },
        error: userError
      } =
        await supabaseClient.auth.getUser();


      if (userError || !user) {

        window.location.href =
          "login.html";

        return;
      }


      /*
        Check if this worker already
        submitted this task.
      */

      const { data: existingSubmission } =
        await supabaseClient
          .from("task_submissions")
          .select("id")
          .eq("task_id", selectedTask.id)
          .eq("worker_id", user.id)
          .maybeSingle();


      if (existingSubmission) {

        proofMessage.textContent =
          "You have already submitted this task.";

        submitProofButton.disabled = true;

        submitProofButton.textContent =
          "Already Submitted";

        return;
      }


      /*
        Upload screenshot.
      */

      const fileName =
        `${user.id}/${selectedTask.id}-${Date.now()}-${file.name}`;


      const { error: uploadError } =
        await supabaseClient.storage
          .from("task-proofs")
          .upload(fileName, file);


      if (uploadError) {
        throw uploadError;
      }


      const {
        data: publicUrlData
      } =
        supabaseClient.storage
          .from("task-proofs")
          .getPublicUrl(fileName);


      const proofUrl =
        publicUrlData.publicUrl;


      /*
        Save submission.
      */

      const { error: submissionError } =
        await supabaseClient
          .from("task_submissions")
          .insert({

            task_id:
              selectedTask.id,

            worker_id:
              user.id,

            proof_url:
              proofUrl,

            reward_amount:
              selectedTask.reward

          });


      if (submissionError) {
        throw submissionError;
      }


      proofMessage.textContent =
        "Proof submitted successfully. Waiting for admin review.";


      submitProofButton.disabled = true;

      submitProofButton.textContent =
        "Proof Submitted";


    } catch (error) {

      console.error(error);

      proofMessage.textContent =
        "Error: " + error.message;


      submitProofButton.disabled = false;

      submitProofButton.textContent =
        "Submit Proof";

    }

  }
);


/* =========================
   SECURITY
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* START */

loadTasks();

</script>

</body>
  </html>

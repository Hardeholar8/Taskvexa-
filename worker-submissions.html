<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - My Submissions</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f8fafc;font-family:Arial,sans-serif}header{height:70px;background:#070a10;border-bottom:1px solid #202b3b;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #202b3b}.logo{font-size:21px;font-weight:800}.nav{display:flex;gap:8px}.nav a{padding:9px 12px;border-radius:9px;background:#151d2a;border:1px solid #293548;color:#fff;text-decoration:none;font-size:12px;font-weight:700}.content{max-width:1000px;margin:auto;padding:28px 16px 60px}.heading h1{margin:0 0 8px;font-size:28px}.heading p{margin:0 0 20px;color:#7f8da3;font-size:14px}.tabs{display:flex;gap:8px;margin-bottom:18px;overflow:auto}.tabs button{border:1px solid #293548;background:#151d2a;color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.tabs button.active{background:#f8fafc;color:#090d14}.card{background:#111722;border:1px solid #202b3b;border-radius:17px;padding:20px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:18px;font-weight:800}.muted{color:#7f8da3;font-size:12px;margin-top:6px}.status{padding:6px 11px;border-radius:20px;font-size:11px;font-weight:800;text-transform:capitalize}.pending{background:#332b16;color:#facc15}.approved{background:#102d20;color:#4ade80}.rejected{background:#32191d;color:#f87171}.reward{color:#4ade80;font-weight:800;margin-top:15px}.empty,.loading{background:#111722;border:1px solid #202b3b;border-radius:17px;padding:35px 20px;text-align:center;color:#7f8da3}@media(max-width:600px){header{padding:0 12px}.content{padding:22px 14px 50px}.heading h1{font-size:24px}.top{flex-direction:column}.nav a{font-size:11px;padding:8px 9px}}</style></head><body><header><div class="logo">TaskVexa</div><div class="nav"><a href="worker-tasks.html">Available Tasks</a><a href="worker.html">Dashboard</a></div></header><main class="content"><div class="heading"><h1>My Submissions</h1><p>Track every task you have submitted and its review status.</p></div><div class="tabs"><button class="active" data-filter="pending">Pending</button><button data-filter="approved">Approved</button><button data-filter="rejected">Rejected</button><button data-filter="all">All</button></div><div id="list"><div class="loading">Loading submissions...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const U='https://dxtlnrthlpdaobnbazny.supabase.co',K='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY',sb=window.supabase.createClient(U,K),list=document.getElementById('list');let rows=[],filter='pending';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=v=>'₦'+Number(v||0).toLocaleString('en-NG',{minimumFractionDigits:0,maximumFractionDigits:2});const date=v=>v?new Date(v).toLocaleString('en-NG',{dateStyle:'medium',timeStyle:'short'}):'-';async function init(){try{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}const {data:p,error:pe}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(pe)throw pe;if(String(p?.role||'').toLowerCase()!=='worker'){location.href='login.html';return}const {data:s,error:se}=await sb.from('task_submissions').select('id,task_id,status,reward_amount,proof_text,created_at,reviewed_at').eq('worker_id',session.user.id).order('created_at',{ascending:false});if(se)throw se;rows=s||[];const ids=[...new Set(rows.map(x=>x.task_id).filter(Boolean))];let tm={};if(ids.length){const {data:t,error:te}=await sb.from('tasks').select('id,title,platform,reward').in('id',ids);if(te)throw te;(t||[]).forEach(x=>tm[x.id]=x)}rows=rows.map(x=>({...x,task:tm[x.task_id]||{}}));render()}catch(e){list.innerHTML='<div class="empty">Unable to load submissions.<br><br>'+esc(e.message||'Unknown error')+'</div>'}}function render(){const shown=filter==='all'?rows:rows.filter(x=>String(x.status||'pending').toLowerCase()===filter);list.innerHTML=shown.length?shown.map(x=>{const s=String(x.status||'pending').toLowerCase();return '<article class="card"><div class="top"><div><div class="title">'+esc(x.task.title||'Task')+'</div><div class="muted">'+esc(x.task.platform||'')+' · Submitted '+esc(date(x.created_at))+'</div></div><span class="status '+esc(s)+'">'+esc(s)+'</span></div><div class="reward">Reward: '+money(x.reward_amount??x.task.reward)+'</div>'+(x.reviewed_at?'<div class="muted">Reviewed: '+esc(date(x.reviewed_at))+'</div>':'')+(x.proof_text?'<div class="muted" style="margin-top:10px">Note: '+esc(x.proof_text)+'</div>':'')+'</article>'}).join(''):'<div class="empty">No '+(filter==='all'?'submissions':filter+' submissions')+' found.</div>'}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});init();</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TaskVexa - Profile</title><style>*{box-sizing:border-box}:root{--bg:#070b14;--panel:#0d1422;--panel2:#111a2b;--border:#1d293d;--text:#f8fafc;--muted:#94a3b8;--accent:#7c3aed;--accent2:#a78bfa;--green:#22c55e;--red:#ef4444}body{margin:0;background:radial-gradient(circle at top right,rgba(124,58,237,.16),transparent 34%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}.top{height:68px;position:sticky;top:0;z-index:20;background:rgba(7,11,20,.94);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-size:23px;font-weight:800}.brand span{color:var(--accent2)}.back{border:1px solid var(--border);background:var(--panel2);color:#fff;border-radius:10px;padding:9px 12px;text-decoration:none;font-size:13px}.wrap{max-width:820px;margin:auto;padding:26px 15px 90px}.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0 0 20px;color:var(--muted);font-size:14px}.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:16px}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#60a5fa);font-size:28px;font-weight:900;margin-bottom:12px}.label{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.value{font-size:15px;font-weight:700;word-break:break-word}label{display:block;color:#cbd5e1;font-size:12px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;background:#090e18;border:1px solid #263247;border-radius:11px;color:#fff;outline:none;font-size:14px}input:focus{border-color:#8b5cf6}.button{border:0;border-radius:11px;padding:12px 16px;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;margin-top:16px}.button:disabled{opacity:.55}.message{font-size:13px;margin-top:12px}.success{color:#86efac}.error{color:#fca5a5}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:rgba(9,15,28,.97);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:30}.bottom a{color:#94a3b8;text-decoration:none;font-size:10px;text-align:center}.bottom a.active{color:#c4b5fd}.bottom b{display:block;font-size:19px;margin-bottom:3px}</style></head><body><header class="top"><a class="back" href="dashboard.html">← Dashboard</a><div class="brand">Task<span>Vexa</span></div><div style="width:80px"></div></header><main class="wrap"><section class="hero"><h1>My Profile</h1><p>Manage your TaskVexa account information.</p></section><section class="card"><div id="avatar" class="avatar">T</div><span class="label">FULL NAME</span><div id="displayName" class="value">Loading...</div><br><span class="label">EMAIL</span><div id="email" class="value">Loading...</div><br><span class="label">ACCOUNT TYPE</span><div id="role" class="value">Loading...</div></section><section class="card"><h2 style="margin:0 0 5px;font-size:18px">Edit profile</h2><p style="margin:0;color:var(--muted);font-size:12px">Only your display name can be changed here.</p><label for="fullName">Full Name</label><input id="fullName" maxlength="100"><button id="save" class="button">Save Changes</button><div id="message" class="message"></div></section></main><nav class="bottom"><a href="dashboard.html"><b>⌂</b>Home</a><a href="tasks.html"><b>✓</b>Tasks</a><a href="airtime.html"><b>₦</b>Airtime</a><a href="withdraw.html"><b>◉</b>Wallet</a><a class="active" href="profile.html"><b>☻</b>Profile</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const S='https://dxtlnrthlpdaobnbazny.supabase.co',K='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY',sb=window.supabase.createClient(S,K),$=id=>document.getElementById(id);async function init(){try{const {data,error}=await sb.auth.getUser();if(error||!data.user){location.href='login.html';return}const u=data.user,m=u.user_metadata||{},name=m.full_name||m.name||m.username||u.email?.split('@')[0]||'User';const {data:p}=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle();$('displayName').textContent=name;$('fullName').value=name;$('email').textContent=u.email||'-';$('role').textContent=p?.role||m.account_type||'User';$('avatar').textContent=name.trim().charAt(0).toUpperCase()||'T'}catch(e){$('message').textContent=e.message||'Unable to load profile.';$('message').className='message error'}}$('save').addEventListener('click',async()=>{const name=$('fullName').value.trim();if(!name){$('message').textContent='Enter your full name.';$('message').className='message error';return}$('save').disabled=true;$('save').textContent='Saving...';try{const {error}=await sb.auth.updateUser({data:{full_name:name}});if(error)throw error;$('displayName').textContent=name;$('avatar').textContent=name.charAt(0).toUpperCase();$('message').textContent='Profile updated successfully.';$('message').className='message success'}catch(e){$('message').textContent=e.message||'Unable to save profile.';$('message').className='message error'}finally{$('save').disabled=false;$('save').textContent='Save Changes'}});init();</script></body></html>

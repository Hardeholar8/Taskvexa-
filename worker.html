<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TaskVexa - Workers</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #070a10;
  color: #f8fafc;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  height: 70px;
  background: #0b0f17;
  border-bottom: 1px solid #202b3b;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

header h1 {
  margin: 0;
  font-size: 21px;
}

header a {
  color: #cbd5e1;
  text-decoration: none;
  font-size: 14px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 16px 50px;
}

.page-title h2 {
  margin: 0 0 7px;
  font-size: 27px;
}

.page-title p {
  color: #7f8da3;
  margin: 0 0 25px;
  font-size: 14px;
}

.message {
  color: #7f8da3;
  font-size: 14px;
  margin-bottom: 18px;
}

.success {
  color: #4ade80;
}

.error {
  color: #f87171;
}

.worker-card {
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 17px;
  padding: 20px;
  margin-bottom: 15px;
}

.worker-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 18px;
}

.worker-name {
  font-size: 17px;
  font-weight: 800;
}

.worker-id {
  color: #7f8da3;
  font-size: 11px;
  margin-top: 6px;
  word-break: break-all;
}

.status {
  padding: 7px 12px;
  border-radius: 20px;

}

.worker-info {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.info {
  background: #0d131e;
  border: 1px solid #1d2838;
  border-radius: 11px;
  padding: 13px;
}

.info small {
  display: block;
  color: #64748b;
  font-size: 10px;
  margin-bottom: 6px;
}

.info strong {
  font-size: 13px;
  word-break: break-word;
}

.refresh-button {
  margin-bottom: 20px;
  padding: 11px 17px;
  border: 1px solid #293548;
  border-radius: 10px;
  background: #151d2a;
  color: #fff;
  cursor: pointer;
  font-weight: 700;
}

.refresh-button:disabled {
  opacity: .6;
  cursor: wait;
}

.empty {
  background: #111722;
  border: 1px solid #202b3b;

}

  .worker-info {
    grid-template-columns: 1fr 1fr;
  }

</style></head><body><header>
  <h1>TaskVexa</h1>  <a href="admin.html">
    ← Admin Dashboard
  </a>
</header><main>  <div class="page-title"><h2>Workers</h2>

<p>
  View registered worker accounts and their account information.
</p>

  </div><button
id="refreshButton"
class="refresh-button"

«»

↻ Refresh Workers

  </button>  <div
    id="message"
    class="message"
  >
    Loading workers...
  </div>  <div id="workerList"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const message =
  document.getElementById("message");

const workerList =
  document.getElementById("workerList");

const refreshButton =
  document.getElementById("refreshButton");


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   MONEY
========================= */

function formatMoney(amount) {

  return "₦" +
    Number(amount || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

}


/* =========================
   LOAD WORKERS
========================= */

async function loadWorkers() {

  refreshButton.disabled = true;
  refreshButton.textContent = "Loading...";

  message.textContent = "Loading workers...";
  message.className = "message";

  workerList.innerHTML = "";

  try {

    /* =========================
       CHECK LOGIN
    ========================= */

    const {
      data: { user },
      error: authError
    } =
      await supabaseClient.auth.getUser();


    if (authError) {
      throw authError;
    }


    if (!user) {

      window.location.href = "login.html";

      return;

    }


    /* =========================
       CHECK ADMIN
    ========================= */

    const {
      data: adminProfile,
      error: adminError
    } =
      await supabaseClient
        .from("profiles")
        .select("id, role")
        .eq("id", user.id)
        .eq("role", "admin")
        .maybeSingle();


    if (adminError) {
      throw adminError;
    }


    if (!adminProfile) {

      message.textContent =
        "Access denied. Admin account required.";

      message.className =
        "message error";

      return;

    }


    /* =========================
       LOAD WORKERS DIRECTLY
       FROM PROFILES
    ========================= */

    const {
      data: workers,
      error: workerError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id, role, created_at, updated_at"
        )
        .eq("role", "worker")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (workerError) {
      throw workerError;
    }


    workerList.innerHTML = "";


    /* =========================
       NO WORKERS
    ========================= */

    if (!workers || workers.length === 0) {

      message.textContent =
        "No worker accounts found.";

      workerList.innerHTML = `
        <div class="empty">
          No worker accounts have been registered yet.
        </div>
      `;

      return;

    }


    message.textContent =
      `${workers.length} worker account(s) found.`;

    message.className =
      "message success";


    /* =========================
       LOAD WALLET BALANCES
    ========================= */

    const workerIds =
      workers.map(
        worker => worker.id
      );


    let walletMap = {};


    if (workerIds.length > 0) {

      const {
        data: wallets,
        error: walletError
      } =
        await supabaseClient
          .from("wallets")
          .select(
            "user_id, balance"
          )
          .in(
            "user_id",
            workerIds
          );


      /*
        Wallet is optional.

        If wallet loading fails,
        workers should still appear.
      */

      if (!walletError) {

        (wallets || []).forEach(
          wallet => {

            walletMap[
              wallet.user_id
            ] =
              wallet.balance || 0;

          }
        );

      } else {

        console.warn(
          "Wallet loading warning:",
          walletError
        );

      }

    }


    /* =========================
       DISPLAY WORKERS
    ========================= */

    workers.forEach(
      worker => {

        const card =
          document.createElement(
            "section"
          );

        card.className =
          "worker-card";


        const workerId =
          worker.id ||
          "Unavailable";


        const created =
          worker.created_at
            ? new Date(
                worker.created_at
              ).toLocaleString(
                "en-NG"
              )
            : "-";


        const updated =
          worker.updated_at
            ? new Date(
                worker.updated_at
              ).toLocaleString(
                "en-NG"
              )
            : "-";


        const balance =
          walletMap[
            worker.id
          ] || 0;


        card.innerHTML = `

          <div class="worker-top">

            <div>

              <div class="worker-name">
                Worker Account
              </div>

              <div class="worker-id">
                ID: ${escapeHTML(workerId)}
              </div>

            </div>

            <span class="status">
              Worker
            </span>

          </div>


          <div class="worker-info">

            <div class="info">

              <small>
                Balance
              </small>

              <strong>
                ${formatMoney(balance)}
              </strong>

            </div>


            <div class="info">

              <small>
                Account Type
              </small>

              <strong>
                ${escapeHTML(
                  worker.role || "worker"
                )}
              </strong>

            </div>


            <div class="info">

              <small>
                Registered
              </small>

              <strong>
                ${escapeHTML(created)}
              </strong>

            </div>


            <div class="info">

              <small>
                Last Updated
              </small>

              <strong>
                ${escapeHTML(updated)}
              </strong>

            </div>


            <div class="info">

              <small>
                Worker ID
              </small>

              <strong>
                ${escapeHTML(workerId)}
              </strong>

            </div>

          </div>

        `;


        workerList.appendChild(card);

      }
    );


  } catch (error) {

    console.error(
      "WORKERS PAGE ERROR:",
      error
    );


    message.textContent =
      "Unable to load workers: " +
      (
        error.message ||
        "Unknown error"
      );

    message.className =
      "message error";


  } finally {

    refreshButton.disabled = false;

    refreshButton.textContent =
      "↻ Refresh Workers";

  }

}


/* =========================
   REFRESH
========================= */

refreshButton.addEventListener(
  "click",
  loadWorkers
);


/* =========================
   START
========================= */

loadWorkers();

</script></body>
  </html>

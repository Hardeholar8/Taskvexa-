<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskVexa - Withdraw</title>

<link rel="stylesheet" href="style.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: #f8fafc;
  font-family: Arial, sans-serif;
}

header {
  background: #0d111b;
  border-bottom: 1px solid #1f2937;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header a {
  color: #cbd5e1;
  text-decoration: none;
  font-size: 14px;
}

main {
  max-width: 600px;
  margin: auto;
  padding: 22px 16px 50px;
}

.page-title {
  margin-bottom: 20px;
}

.page-title h2 {
  margin: 0 0 6px;
  font-size: 28px;
}

.page-title p {
  margin: 0;
  color: #94a3b8;
}

/* BALANCE */

.balance-card {
  background: linear-gradient(145deg, #151b29, #0d111b);
  border: 1px solid #263244;
  border-radius: 22px;
  padding: 28px 20px;
  text-align: center;
  margin-bottom: 18px;
  box-shadow: 0 15px 35px rgba(0,0,0,.3);
}

.balance-label {
  color: #94a3b8;
  font-size: 14px;
}

.balance {
  font-size: 38px;
  font-weight: 800;
  margin: 10px 0;
}

.balance-status {
  color: #64748b;
  font-size: 13px;
}

/* CARDS */

.card {
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 10px 25px rgba(0,0,0,.2);
}

.card h3 {
  margin-top: 0;
  margin-bottom: 18px;
  font-size: 18px;
}

/* FORM */

label {
  display: block;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 600;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #2a3648;
  background: #0b1019;
  color: white;
  outline: none;
  font-size: 15px;
}

input:focus {
  border-color: #64748b;
}

input::placeholder {
  color: #64748b;
}

.withdraw-button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: none;
  border-radius: 13px;
  background: #f8fafc;
  color: #0b1019;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

.withdraw-button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

#withdrawMessage {
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.5;
}

/* HISTORY */

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.history-header h3 {
  margin: 0;
}

.history-subtitle {
  color: #64748b;
  font-size: 12px;
}

.history-card {
  background: #0d131e;
  border: 1px solid #202b3b;
  border-radius: 16px;
  padding: 16px;
  margin-top: 12px;
}

.history-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.history-amount {
  font-size: 20px;
  font-weight: 800;
}

.status {
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
}

.status.pending {
  background: #332b16;
  color: #facc15;
}

.status.approved {
  background: #102d20;
  color: #4ade80;
}

.status.rejected {
  background: #32191d;
  color: #f87171;
}

.history-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 8px 0;
  border-top: 1px solid #1b2533;
  font-size: 13px;
}

.history-row span:first-child {
  color: #64748b;
}

.history-row span:last-child {
  color: #e2e8f0;
  text-align: right;
  word-break: break-word;
}

.empty {
  text-align: center;
  padding: 25px 10px;
  color: #64748b;
  font-size: 14px;
}

.error {
  color: #f87171;
}

.success {
  color: #4ade80;
}
</style>
</head>

<body>

<header>
  <h1>TaskVexa</h1>
  <a href="dashboard.html">Dashboard</a>
</header>

<main>

  <div class="page-title">
    <h2>Withdraw</h2>
    <p>Request a withdrawal from your available balance.</p>
  </div>

  <!-- BALANCE -->

  <section class="balance-card">

    <div class="balance-label">
      Available Balance
    </div>

    <div class="balance" id="balance">
      ₦0.00
    </div>

    <div class="balance-status" id="balanceMessage">
      Loading balance...
    </div>

  </section>


  <!-- WITHDRAW -->

  <section class="card">

    <h3>Withdrawal Details</h3>

    <label for="amount">
      Withdrawal Amount
    </label>

    <input
      type="number"
      id="amount"
      min="1"
      step="0.01"
      placeholder="Enter amount"
    >

    <label for="bankName">
      Bank Name
    </label>

    <input
      type="text"
      id="bankName"
      placeholder="Enter bank name"
    >

    <label for="accountName">
      Account Name
    </label>

    <input
      type="text"
      id="accountName"
      placeholder="Enter account name"
    >

    <label for="accountNumber">
      Account Number
    </label>

    <input
      type="text"
      id="accountNumber"
      inputmode="numeric"
      maxlength="20"
      placeholder="Enter account number"
    >

    <button
      id="withdrawButton"
      class="withdraw-button"
    >
      Request Withdrawal
    </button>

    <div id="withdrawMessage"></div>

  </section>


  <!-- HISTORY -->

  <section class="card">

    <div class="history-header">

      <h3>Withdrawal History</h3>

      <span class="history-subtitle">
        Recent requests
      </span>

    </div>

    <div id="historyMessage" class="empty">
      Loading withdrawal history...
    </div>

    <div id="withdrawalHistory"></div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
"sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;


/* =========================
   ELEMENTS
========================= */

const balanceElement =
document.getElementById("balance");

const balanceMessage =
document.getElementById("balanceMessage");

const withdrawButton =
document.getElementById("withdrawButton");

const withdrawMessage =
document.getElementById("withdrawMessage");

const historyMessage =
document.getElementById("historyMessage");

const withdrawalHistory =
document.getElementById("withdrawalHistory");


/* =========================
   FORMAT MONEY
========================= */

function formatMoney(amount) {

  return "₦" +
    Number(amount || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   LOAD USER
========================= */

async function loadUser() {

  try {

    const {
      data,
      error
    } =
    await supabaseClient.auth.getUser();

    if (error) {
      throw error;
    }

    if (!data || !data.user) {

      window.location.href =
      "login.html";

      return false;
    }

    currentUser =
    data.user;

    return true;

  } catch (error) {

    console.error(
      "USER ERROR:",
      error
    );

    window.location.href =
    "login.html";

    return false;
  }
}


/* =========================
   LOAD BALANCE
========================= */

async function loadBalance() {

  balanceMessage.textContent =
  "Loading balance...";

  try {

    const {
      data: wallet,
      error
    } =
    await supabaseClient
      .from("wallets")
      .select("balance")
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();

    if (error) {
      throw error;
    }

    const amount =
    wallet?.balance || 0;

    balanceElement.textContent =
    formatMoney(amount);

    balanceMessage.textContent =
    "Balance available";

    balanceMessage.className =
    "balance-status";

  } catch (error) {

    console.error(
      "BALANCE ERROR:",
      error
    );

    balanceElement.textContent =
    "₦0.00";

    balanceMessage.textContent =
    "Unable to load balance: " +
    error.message;

    balanceMessage.className =
    "balance-status error";
  }
}


/* =========================
   LOAD HISTORY
========================= */

async function loadHistory() {

  historyMessage.textContent =
  "Loading withdrawal history...";

  withdrawalHistory.innerHTML =
  "";

  try {

    const {
      data: withdrawals,
      error
    } =
    await supabaseClient
      .from("withdrawals")
      .select(
        "id, amount, bank_name, account_name, account_number, status, created_at"
      )
      .eq(
        "worker_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );

    if (error) {
      throw error;
    }

    if (
      !withdrawals ||
      withdrawals.length === 0
    ) {

      historyMessage.textContent =
      "No withdrawal requests yet.";

      historyMessage.className =
      "empty";

      return;
    }

    historyMessage.textContent =
    "";

    withdrawals.forEach(
      withdrawal => {

        const card =
        document.createElement("div");

        card.className =
        "history-card";

        const status =
        String(
          withdrawal.status || "pending"
        ).toLowerCase();

        let statusText =
        "Pending";

        if (status === "approved") {
          statusText = "Approved";
        }

        if (status === "rejected") {
          statusText = "Rejected";
        }

        const date =
        withdrawal.created_at
        ? new Date(
            withdrawal.created_at
          ).toLocaleString("en-NG")
        : "-";

        card.innerHTML = `

          <div class="history-top">

            <div class="history-amount">
              ${formatMoney(withdrawal.amount)}
            </div>

            <span class="status ${escapeHTML(status)}">
              ${statusText}
            </span>

          </div>

          <div class="history-row">
            <span>Bank</span>
            <span>
              ${escapeHTML(withdrawal.bank_name)}
            </span>
          </div>

          <div class="history-row">
            <span>Account Name</span>
            <span>
              ${escapeHTML(withdrawal.account_name)}
            </span>
          </div>

          <div class="history-row">
            <span>Account Number</span>
            <span>
              ${escapeHTML(withdrawal.account_number)}
            </span>
          </div>

          <div class="history-row">
            <span>Date</span>
            <span>
              ${escapeHTML(date)}
            </span>
          </div>

        `;

        withdrawalHistory.appendChild(card);

      }
    );

  } catch (error) {

    console.error(
      "HISTORY ERROR:",
      error
    );

    historyMessage.textContent =
    "Unable to load withdrawal history: " +
    error.message;

    historyMessage.className =
    "empty error";
  }
}


/* =========================
   REQUEST WITHDRAWAL
========================= */

withdrawButton.addEventListener(
"click",
async function() {

  withdrawMessage.textContent =
  "";

  const amount =
  Number(
    document.getElementById(
      "amount"
    ).value
  );

  const bankName =
  document.getElementById(
    "bankName"
  ).value.trim();

  const accountName =
  document.getElementById(
    "accountName"
  ).value.trim();

  const accountNumber =
  document.getElementById(
    "accountNumber"
  ).value.trim();


  if (!amount || amount <= 0) {

    withdrawMessage.textContent =
    "Enter a valid withdrawal amount.";

    withdrawMessage.className =
    "error";

    return;
  }


  if (!bankName) {

    withdrawMessage.textContent =
    "Enter your bank name.";

    withdrawMessage.className =
    "error";

    return;
  }


  if (!accountName) {

    withdrawMessage.textContent =
    "Enter your account name.";

    withdrawMessage.className =
    "error";

    return;
  }


  if (!accountNumber) {

    withdrawMessage.textContent =
    "Enter your account number.";

    withdrawMessage.className =
    "error";

    return;
  }


  try {

    withdrawButton.disabled =
    true;

    withdrawButton.textContent =
    "Submitting...";


    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "request_withdrawal",
      {
        p_amount: amount,
        p_bank_name: bankName,
        p_account_name: accountName,
        p_account_number: accountNumber
      }
    );


    if (error) {
      throw error;
    }


    if (
      !data ||
      data.success !== true
    ) {

      throw new Error(
        data?.message ||
        "Withdrawal request failed."
      );
    }


    withdrawMessage.textContent =
    "Withdrawal request submitted successfully.";

    withdrawMessage.className =
    "success";


    document.getElementById(
      "amount"
    ).value = "";


    await loadBalance();

    await loadHistory();


  } catch (error) {

    console.error(
      "WITHDRAWAL ERROR:",
      error
    );

    withdrawMessage.textContent =
    "Error: " +
    error.message;

    withdrawMessage.className =
    "error";

  } finally {

    withdrawButton.disabled =
    false;

    withdrawButton.textContent =
    "Request Withdrawal";
  }

});


/* =========================
   START
========================= */

async function initialize() {

  const loggedIn =
  await loadUser();

  if (!loggedIn) {
    return;
  }

  await loadBalance();

  await loadHistory();

}

initialize();

</script>

</body>
</html>

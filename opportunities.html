<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa • Opportunities</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=12"></script><style>body{margin:0;background:#070b14;color:#fff;font-family:Arial}.wrap{max-width:760px;margin:auto;padding:16px 14px 80px}.top{display:flex;justify-content:space-between}.back{color:#a78bfa;text-decoration:none;font-size:11px;font-weight:800}.intro{color:#94a3b8;font-size:11px}.grid{display:grid;gap:12px;margin-top:16px}.card{background:#101a2c;border:1px solid #273650;border-radius:19px;padding:16px}.title{font-size:17px;font-weight:900}.cat{display:inline-block;margin-top:7px;color:#c4b5fd;font-size:9px}.desc{color:#94a3b8;font-size:10px;line-height:1.55}.meta{display:flex;justify-content:space-between;margin:12px 0;color:#dbeafe;font-size:10px}.btn{width:100%;padding:11px;border:0;border-radius:11px;background:#7048ff;color:#fff;font-size:11px;font-weight:900}.btn:disabled{opacity:.55}.msg{font-size:10px;color:#86efac;margin-top:12px}</style></head><body><main class="wrap"><div class="top"><h1 style="margin:0;font-size:23px">Opportunities</h1><a class="back" href="dashboard.html">← Dashboard</a></div><p class="intro">Apply for legitimate work opportunities posted by promoters. Applications are reviewed before work is assigned.</p><section id="grid" class="grid"><div class="intro">Loading…</div></section><div id="msg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth.js?v=20260919"></script><script>
const sb=window.supabaseClient||window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY'),grid=document.getElementById('grid'),msg=document.getElementById('msg'),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function getSession(){for(let i=0;i<40;i++){const r=await sb.auth.getSession();if(r.error)throw r.error;if(r.data?.session)return r.data.session;await sleep(150)}return null}
function money(v){return Number(v||0).toLocaleString('en-NG',{maximumFractionDigits:2})}
function statusLabel(s){return s==='selected'?'Selected':s==='completed'?'Completed':s==='rejected'?'Not selected':s==='withdrawn'?'Withdrawn':'Application pending'}
async function load(){
 const session=await getSession(); if(!session?.user){location.href='login.html';return}
 const now=new Date().toISOString();
 const r=await sb.from('opportunities').select('id,title,description,category,reward,slots,application_deadline,created_at').eq('status','active').or('application_deadline.is.null,application_deadline.gt.'+now).order('created_at',{ascending:false});
 if(r.error)throw r.error;
 const rows=r.data||[];
 if(!rows.length){grid.innerHTML='<div class="intro">No open opportunities right now. New opportunities will appear here when they become available.</div>';return}
 const ids=rows.map(x=>x.id);
 const ar=await sb.from('opportunity_applications').select('opportunity_id,status,worker_id').in('opportunity_id',ids);
 if(ar.error)throw ar.error;
 const apps=ar.data||[],mine=new Map(),counts=new Map();
 apps.forEach(a=>{
   if(a.worker_id===session.user.id) mine.set(a.opportunity_id,a.status);
   if(['pending','selected','completed'].includes(a.status)) counts.set(a.opportunity_id,(counts.get(a.opportunity_id)||0)+1);
 });
 const open=rows.filter(x=>(counts.get(x.id)||0)<Number(x.slots||0));
 if(!open.length){grid.innerHTML='<div class="intro">All current opportunities have reached their available slots.</div>';return}
 grid.innerHTML=open.map(x=>{
   const st=mine.get(x.id),filled=counts.get(x.id)||0,deadline=x.application_deadline?new Date(x.application_deadline).toLocaleString('en-NG',{dateStyle:'medium',timeStyle:'short'}):'No deadline';
   return '<article class="card"><div class="title">'+esc(x.title)+'</div><div class="cat">'+esc(x.category||'General')+'</div><p class="desc">'+esc(x.description||'No description provided.')+'</p><div class="meta"><span>Reward: '+money(x.reward)+' credits</span><span>'+Math.max(Number(x.slots)-filled,0)+' slot(s) left</span></div><div class="meta"><span>Deadline</span><span>'+esc(deadline)+'</span></div><button class="btn" data-id="'+x.id+'" '+(st?'disabled':'')+'>'+ (st?esc(statusLabel(st)):'Apply now')+'</button></article>'
 }).join('');
 document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>apply(b,session.user.id));
}
async function apply(b,user){
 const message=prompt('Tell the promoter briefly why you are suitable for this opportunity:');
 if(message===null)return;
 if(!message.trim()){msg.textContent='Please enter a short message before applying.';msg.style.color='#fda4af';return}
 b.disabled=true;b.textContent='Submitting…';
 const r=await sb.from('opportunity_applications').insert({opportunity_id:b.dataset.id,worker_id:user,message:message.trim()});
 if(r.error){
   msg.textContent=r.error.code==='23505'?'You already applied for this opportunity.':r.error.message;
   msg.style.color='#fda4af';b.disabled=false;b.textContent='Apply now';return;
 }
 msg.textContent='Application submitted successfully ✓';msg.style.color='#86efac';await load();
}
load().catch(e=>{console.error('Opportunities load error:',e);grid.innerHTML='<div class="intro">Unable to load opportunities. Please refresh.</div>'});
</script></body></html>

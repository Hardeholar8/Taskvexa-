<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>TaskVexa — Worker Submissions</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/promoter-auth.js"></script><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 16px 105px}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.title{font-size:24px;font-weight:900}.sub{color:#94a3b8;font-size:12px;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.stat,.card{background:linear-gradient(180deg,#121b2d,#0f1728);border:1px solid #26344d;border-radius:18px;box-shadow:0 14px 38px rgba(0,0,0,.22)}.stat{padding:13px}.label{font-size:9px;color:#94a3b8}.num{font-size:21px;font-weight:900;margin-top:5px}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 13px}.filter{flex:0 0 auto;border:1px solid #26344d;background:#101827;color:#94a3b8;border-radius:999px;padding:9px 13px;font-size:11px}.filter.active{background:#211941;color:#fff;border-color:#7048ff}.card{padding:16px;margin-bottom:11px}.top{display:flex;justify-content:space-between;gap:12px}.name{font-size:15px;font-weight:850}.worker{font-size:11px;color:#94a3b8;margin-top:4px}.pill{padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800}.submitted{background:#352b12;color:#fbbf24}.approved{background:#123323;color:#4ade80}.rejected{background:#35191d;color:#f87171}.proof{margin-top:13px;padding:12px;border-radius:13px;background:#0b1220;border:1px solid #26344d}.proof-title{font-size:10px;color:#94a3b8;margin-bottom:6px}.proof-text{font-size:12px;line-height:1.5;word-break:break-word}.proof-link{display:inline-block;margin-top:9px;color:#a98cff;font-size:12px;text-decoration:none}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;color:#94a3b8;font-size:10px}.meta span{padding:6px 8px;border-radius:9px;background:#0b1220;border:1px solid #26344d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.btn{border:0;border-radius:12px;padding:12px;font-weight:800;font-size:12px}.approve{background:linear-gradient(135deg,#20b66e,#39d98a);color:#04150c}.reject{background:#35191d;color:#ff8b96;border:1px solid #6b2933}.empty{text-align:center;padding:38px 18px;color:#94a3b8}.empty strong{display:block;color:#fff;font-size:15px;margin-bottom:5px}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;padding:0 10px 4px;background:rgba(10,16,30,.97);border-top:1px solid #26344d;display:flex;align-items:center;justify-content:space-around;z-index:1000}.nav a{flex:1;text-align:center;color:#7f8da5;text-decoration:none;font-size:10px;padding:10px 2px}.nav .plus{flex:0 0 56px;height:56px;margin-top:-20px;border-radius:50%;background:linear-gradient(145deg,#5d35ed,#8c45ff);color:#fff;font-size:27px;padding:0;display:grid;place-items:center;border:4px solid #080d18}@media(max-width:380px){.stats{gap:6px}.stat{padding:10px 8px}.num{font-size:18px}} </style></head><body><main class="wrap"><header class="head"><div><div class="title">Worker Submissions</div><div class="sub">Review proof and approve completed campaign work.</div></div></header><section class="stats"><div class="stat"><div class="label">WAITING</div><div id="waiting" class="num">0</div></div><div class="stat"><div class="label">APPROVED</div><div id="approvedCount" class="num">0</div></div><div class="stat"><div class="label">REJECTED</div><div id="rejectedCount" class="num">0</div></div></section><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="submitted">Waiting</button><button class="filter" data-filter="approved">Approved</button><button class="filter" data-filter="rejected">Rejected</button></div><section id="list"></section></main><nav class="nav"><a href="promoter-dashboard.html">⌂<br>Home</a><a href="promoter-campaigns.html">▣<br>Campaigns</a><a class="plus" href="promoter-create.html">+</a><a href="promoter-wallet.html">◉<br>Wallet</a><a href="promoter-settings.html">☰<br>More</a></nav><script>let slots=[];const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])}function safeUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}function render(filter='all'){const rows=slots.filter(x=>filter==='all'||x.status===filter);$('list').innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="top"><div><div class="name">${esc(x.campaign_title)}</div><div class="worker">Worker ID: ${esc(x.worker_id)}</div></div><span class="pill ${esc(x.status)}">${esc(x.status==='submitted'?'Awaiting review':x.status)}</span></div><div class="proof"><div class="proof-title">SUBMITTED PROOF</div><div class="proof-text">${esc(x.proof_text||'No proof text provided.')}</div>${x.proof_url?`<a class="proof-link" href="${safeUrl(x.proof_url)}" target="_blank" rel="noopener">Open proof ↗</a>`:''}</div><div class="meta"><span>Submitted ${x.submitted_at?new Date(x.submitted_at).toLocaleDateString('en-NG',{day:'numeric',month:'short'}):'—'}</span>${x.rejection_count?`<span>${x.rejection_count} rejection${x.rejection_count==1?'':'s'}</span>`:''}</div>${x.status==='submitted'?`<div class="actions"><button class="btn approve" onclick="review('${x.id}','approve')">Approve</button><button class="btn reject" onclick="review('${x.id}','reject')">Reject</button></div>`:''}</article>`).join(''):`<div class="card empty"><strong>No submissions</strong>No ${filter==='all'?'worker submissions':filter+' submissions'} to display.</div>`}async function load(){const ctx=await requirePromoter();if(!ctx)return;const db=promoterSupabase;const {data:c,error:e}=await db.from('promoter_campaigns').select('id,title').eq('promoter_id',ctx.user.id);if(e){$('list').innerHTML='<div class="card empty"><strong>Unable to load</strong>Please try again.</div>';return}const ids=(c||[]).map(x=>x.id);if(!ids.length){slots=[];update();return}const map=Object.fromEntries(c.map(x=>[x.id,x.title]));const {data:s,error:se}=await db.from('promoter_campaign_worker_slots').select('id,campaign_id,worker_id,status,rejection_count,proof_url,proof_text,submitted_at,reviewed_at').in('campaign_id',ids).order('submitted_at',{ascending:false});if(se){$('list').innerHTML='<div class="card empty"><strong>Unable to load submissions</strong>Please try again.</div>';return}slots=(s||[]).map(x=>({...x,campaign_title:map[x.campaign_id]||'Campaign'}));update()}function update(){waiting.textContent=slots.filter(x=>x.status==='submitted').length;approvedCount.textContent=slots.filter(x=>x.status==='approved').length;rejectedCount.textContent=slots.filter(x=>x.status==='rejected').length;render()}async function review(id,decision){const msg=decision==='approve'?'Approve this Worker submission? The Worker reward will be credited once.':'Reject this submission? The campaign slot will remain unavailable.';if(!confirm(msg))return;const {error}=await promoterSupabase.rpc('review_promoter_campaign_slot',{p_slot_id:id,p_decision:decision,p_note:null});if(error){alert(error.message);return}await load()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});load();</script></body></html>

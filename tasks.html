* {

}

body {

header {

}

  max-width: 650px;

.page-header {
  margin-bottom: 22px;
}

.back-link {
  display: inline-block;
  color: #94a3b8;
  text-decoration: none;
  font-size: 14px;
  margin-bottom: 16px;
}

.page-header h2 {
  margin: 0 0 7px;
  font-size: 29px;
}

.page-header p {
  margin: 0;
  color: #94a3b8;
  font-size: 14px;
  line-height: 1.5;
}

/* LOADING */

.loading-card {
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 20px;
  padding: 35px 20px;
  text-align: center;
}

.loader {
  width: 32px;
  height: 32px;
  margin: 0 auto 15px;
  border: 3px solid #273244;
  border-top-color: #f8fafc;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* TASK CARD */

.task-card {
  background: linear-gradient(145deg, #121925, #0d131e);
  border: 1px solid #202b3b;
  border-radius: 20px;
  padding: 19px;
  margin-bottom: 15px;
  box-shadow: 0 10px 28px rgba(0,0,0,.22);
}

.task-card h3 {
  margin: 0 0 8px;
  font-size: 19px;
}

.task-description {
  color: #94a3b8;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 16px;
}

.task-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.info-box {
  background: #0a0f18;
  border: 1px solid #1d2736;
  border-radius: 13px;
  padding: 11px;
}

.info-label {
  display: block;
  color: #64748b;
  font-size: 11px;
  margin-bottom: 5px;
}

.info-value {
  color: #e2e8f0;
  font-size: 14px;
  font-weight: 700;
}

.reward {
  color: #4ade80;
  font-size: 17px;
}

.view-button,
.open-button,
.submit-button,
.back-button {
  border: none;
  border-radius: 12px;
  padding: 13px 15px;
  font-weight: 800;
  cursor: pointer;
  font-size: 14px;
}

.view-button {
  width: 100%;
  background: #f8fafc;
  color: #080b12;
}

.view-button:hover {
  opacity: .9;
}

/* STATUS */

.status {
  display: inline-block;
  padding: 7px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 13px;
}

.pending {
  background: #332b16;
  color: #facc15;
}

.rejected {
  background: #32191d;
  color: #f87171;
}

/* DETAILS */

.details-card {
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 28px rgba(0,0,0,.25);
}

.details-card h2 {
  margin: 8px 0 18px;
  font-size: 23px;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 0;
  border-bottom: 1px solid #1d2736;
  font-size: 13px;
}

.detail-row span:first-child {
  color: #64748b;
}

.detail-row span:last-child {
  color: #e2e8f0;
  text-align: right;
  word-break: break-word;
}

.instructions {
  margin: 20px 0;
}

.instructions h3,
.proof-section h3 {
  margin-bottom: 8px;
}

.instructions p {
  color: #94a3b8;
  font-size: 14px;
  line-height: 1.6;
}

.open-button {
  display: block;
  width: 100%;
  text-align: center;
  text-decoration: none;
  background: #f8fafc;
  color: #080b12;
  margin: 18px 0;
}

.proof-section {
  border-top: 1px solid #202b3b;
  padding-top: 20px;
}

.proof-section p {
  color: #94a3b8;
  font-size: 13px;
}

.file-input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #2a3648;
  background: #0b1019;
  color: #cbd5e1;
  margin: 10px 0 15px;
}

.submit-button {
  width: 100%;
  background: #f8fafc;
  color: #080b12;
}

.submit-button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.back-button {
  background: #1a2331;
  color: #cbd5e1;
  margin-bottom: 5px;
}

.message {
  margin-top: 13px;
  font-size: 13px;
  line-height: 1.5;
}

.success {
  color: #4ade80;
}

.error {
  color: #f87171;
}

.empty {
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 20px;
  padding: 35px 20px;
  text-align: center;
  color: #64748b;
  font-size: 14px;
}

/* MOBILE */

@media (max-width: 480px) {
  main {
    padding: 20px 13px 50px;
  }

  .page-header h2 {
    font-size: 26px;
  }

  .task-info {
    grid-template-columns: 1fr;
  }
}

const SUPABASE_KEY =

const supabaseClient =
  window.supabase.createClient(

let currentUser = null;
let selectedTask = null;
let selectedSubmissionStatus = null;


/* =========================
   ELEMENTS
========================= */

const taskList =

const message =
  document.getElementById("message");

/* =========================
   FORMAT MONEY
========================= */

function formatMoney(amount) {

  return "₦" +
    Number(
      amount || 0
    ).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   LOAD TASKS
========================= */

async function loadTasks() {

  message.innerHTML = `
    <div class="loader"></div>
    Loading tasks...
  `;

  taskList.innerHTML = "";

  try {

    /* GET CURRENT USER */

    const {
      data: userData,
      error: userError
    } =
      await supabaseClient.auth.getUser();

    if (userError) {
      throw userError;
    }

    if (!userData || !userData.user) {

      window.location.href =
        "login.html";

      return;
    }

    currentUser =
      userData.user;


    /* LOAD ACTIVE TASKS */

    const {
      data: tasks,
      error: taskError
    } =
      await supabaseClient
        .from("tasks")
        .select("*")
        .eq("status", "active")
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (taskError) {
      throw taskError;
    }


    /* LOAD USER SUBMISSIONS */

    const {
      data: submissions,
      error: submissionError
    } =
      await supabaseClient
        .from("task_submissions")
        .select(
          "id, task_id, status, created_at"
        )
        .eq(
          "worker_id",
          currentUser.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (submissionError) {
      throw submissionError;
    }


    /* MAP LATEST SUBMISSION */

    const submissionMap = {};

    (submissions || []).forEach(
      submission => {

        if (
          !submissionMap[
            submission.task_id
          ]
        ) {

          submissionMap[
            submission.task_id
          ] =
            String(
              submission.status || ""
            ).toLowerCase();

        }

      }
    );


    /* REMOVE APPROVED TASKS */

    const visibleTasks =
      (tasks || []).filter(
        task => {

          const status =
            submissionMap[task.id];

          return status !== "approved";

        }
      );


    /* NO TASKS */

    if (
      visibleTasks.length === 0
    ) {

      message.className =
        "empty";

      message.innerHTML = `
        <strong>No tasks available</strong>
        <br><br>
        Check back later for new tasks.
      `;

      return;
    }


    /* HIDE LOADING */

    message.innerHTML = "";

    message.className = "";

    /* CREATE CARDS */

    visibleTasks.forEach(
      task => {

        const status =
          submissionMap[task.id];

        const card =
          document.createElement(
            "section"
          );

        card.className =
          "task-card";


        let statusHTML = "";

        if (
          status === "pending"
        ) {

          statusHTML = `
            <div class="status pending">
              Pending Review
            </div>
          `;

        }

        if (
          status === "rejected"
        ) {

          statusHTML = `
            <div class="status rejected">
              Previous proof rejected
            </div>
          `;

        }


        card.innerHTML = `

          ${statusHTML}

          <h3>
            ${escapeHTML(task.title)}
          </h3>

          <div class="task-description">
            ${escapeHTML(
              task.description ||
              "Complete this task and submit proof."
            )}
          </div>

          <div class="task-info">

            <div class="info-box">
              <span class="info-label">
                Platform
              </span>

              <span class="info-value">
                ${escapeHTML(
                  task.platform ||
                  "Not specified"
                )}
              </span>
            </div>

            <div class="info-box">
              <span class="info-label">
                Reward
              </span>

              <span class="info-value reward">
                ${formatMoney(task.reward)}
              </span>
            </div>

            <div class="info-box">
              <span class="info-label">
                Workers Needed
              </span>

              <span class="info-value">
                ${Number(
                  task.workers_needed || 0
                ).toLocaleString()}
              </span>
            </div>

          </div>

          <button
            class="view-button"
          >
            View Task
          </button>

        `;


        card
          .querySelector(".view-button")
          .addEventListener(
            "click",
            () => {

              showTaskDetails(
                task,
                status
              );

            }
          );


        taskList.appendChild(card);

      }
    );


  } catch (error) {

    console.error(
      "TASK LOADING ERROR:",
      error
    );

    message.className =
      "empty error";

    message.innerHTML = `
      <strong>Unable to load tasks.</strong>
      <br><br>
      ${escapeHTML(
        error.message ||
        "Unknown error"
      )}
      <br><br>
      <button
        onclick="loadTasks()"
        class="view-button"
        style="max-width:220px;"
      >
        Try Again
      </button>
    `;

  }

}


/* =========================
   SHOW TASK DETAILS
========================= */

function showTaskDetails(
  task,
  submissionStatus
) {

  selectedTask =
    task;

  selectedSubmissionStatus =
    submissionStatus || null;


  document.getElementById(
    "detailTitle"
  ).textContent =
    task.title ||
    "Task";


  document.getElementById(
    "detailPlatform"
  ).textContent =
    task.platform ||
    "Not specified";


  document.getElementById(
    "detailReward"
  ).textContent =
    formatMoney(
      task.reward
    );


  document.getElementById(
    "detailWorkers"
  ).textContent =
    Number(
      task.workers_needed || 0
    ).toLocaleString();


  document.getElementById(
    "detailDescription"
  ).textContent =
    task.description ||
    "Complete this task as instructed.";


  const taskButton =
    document.getElementById(
      "openTaskButton"
    );


  taskButton.href =
    task.task_url ||
    "#";


  document.getElementById(
    "proofFile"
  ).value =
    "";


  proofMessage.textContent =
    "";

  proofMessage.className =
    "message";


  /* PENDING */

  if (
    submissionStatus ===
    "pending"
  ) {

    proofMessage.textContent =
      "Your proof is currently pending admin review.";

    submitProofButton.disabled =
      true;

    submitProofButton.textContent =
      "Pending Review";

  }

  /* REJECTED */

  else if (
    submissionStatus ===
    "rejected"
  ) {

    proofMessage.textContent =
      "Your previous proof was rejected. You can submit a new proof.";

    submitProofButton.disabled =
      false;

    submitProofButton.textContent =
      "Submit New Proof";

  }

  /* NEW */

  else {

    submitProofButton.disabled =
      false;

    submitProofButton.textContent =
      "Submit Proof";

  }


  taskListSection.style.display =
    "none";

  taskDetailsSection.style.display =
    "block";

  window.scrollTo(
    0,
    0
  );

}


/* =========================

backButton.addEventListener(

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Deposit</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=12"></script><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:560px;margin:auto;padding:20px 14px 70px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900}.brand span{color:#a78bfa}.back{color:#c4b5fd;text-decoration:none;font-size:12px}.card{background:#0d1422;border:1px solid #26344d;border-radius:20px;padding:20px;margin-top:18px}.muted{color:#94a3b8;font-size:11px;line-height:1.6}.amount{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;background:#080e18;border:1px solid #293850;color:#fff;font-size:18px;font-weight:800;margin:12px 0}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;font-weight:900}.msg{margin-top:12px;font-size:11px;color:#94a3b8}.error{color:#fb7185}</style></head><body><main class="wrap"><header class="top"><div class="brand">Task<span>Vexa</span></div><a class="back" href="dashboard.html">Dashboard</a></header><section class="card"><h1 style="margin:0 0 8px;font-size:22px">Deposit</h1><p class="muted">Add funds to your TaskVexa wallet for platform services and other supported account activities.</p><input id="amount" class="amount" type="number" min="100" step="50" placeholder="Enter amount (₦)"><button id="pay" class="btn">Continue to Payment</button><div id="msg" class="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY'),$=id=>document.getElementById(id);let user;async function init(){const {data:{user:u},error}=await sb.auth.getUser();if(error||!u){location.replace('login.html');return}user=u}$('pay').onclick=async()=>{const amount=Math.round(Number($('amount').value));if(!Number.isFinite(amount)||amount<100){$('msg').textContent='Enter a valid deposit amount of at least ₦100.';$('msg').className='msg error';return}try{$('pay').disabled=true;$('msg').textContent='Starting secure payment...';const r=await fetch('/api/flutterwave/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:user.email,user_id:user.id,amount,purpose:'worker_wallet_funding',title:'TaskVexa Wallet Deposit',description:'TaskVexa worker wallet deposit'})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.checkout_url)throw new Error(j.error||'Unable to start payment.');location.href=j.checkout_url}catch(e){$('msg').textContent=e.message||'Payment could not be started.';$('msg').className='msg error';$('pay').disabled=false}};init();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Payment Verification</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script></head><body><main style="max-width:680px;margin:60px auto;padding:20px;text-align:center"><h1 id="title">Verifying payment…</h1><p id="msg">Please wait while we confirm your payment.</p><a id="back" href="dashboard.html" style="display:none">Return to Dashboard</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{try{
  const p=new URLSearchParams(location.search);
  const status=p.get('status');
  const tx=p.get('transaction_id');
  const txRef=p.get('tx_ref');
  const purpose=p.get('purpose')||'worker_activation';
  if(!tx&&!txRef) throw new Error('Payment reference was not returned.');

  let j=null, lastError='Payment verification failed.';
  // Bank-transfer settlement can be asynchronous, so retry verification briefly.
  for(let attempt=0;attempt<4;attempt++){
    const r=await fetch('/api/flutterwave/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transaction_id:tx||undefined,tx_ref:txRef||undefined,purpose})});
    j=await r.json().catch(()=>({}));
    if(r.ok&&j.verified) break;
    lastError=j.error||lastError;
    if(attempt<3) await sleep(2500);
  }
  if(!j||!j.verified) throw new Error(lastError);

  if(j.purpose==='worker_activation'){
    const {data:{user}}=await sb.auth.getUser();
    if(!user||user.id!==j.user_id) throw new Error('Signed-in account does not match this payment.');
    const {data:result,error}=await sb.rpc('complete_worker_activation',{p_user_id:user.id,p_amount:j.amount,p_reference:j.tx_ref||txRef,p_transaction_id:String(j.transaction_id||tx||'')});
    if(error) throw error;
    if(!result?.success) throw new Error(result?.message||'Activation could not be completed.');
    document.getElementById('title').textContent='Account Activated';
    document.getElementById('msg').textContent='Your worker activation has been confirmed successfully.';
  }else{
    document.getElementById('title').textContent='Payment Confirmed';
    document.getElementById('msg').textContent='Your TaskVexa payment has been verified successfully.';
  }
  document.getElementById('back').style.display='inline-block';
}catch(e){
  console.error(e);
  document.getElementById('title').textContent='Verification Failed';
  document.getElementById('msg').textContent=e.message||'Please contact support.';
  document.getElementById('back').style.display='inline-block';
}})();</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskVexa - Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #070a10;
  --sidebar: #0b0f17;
  --card: #111722;
  --card2: #0d131e;
  --border: #202b3b;
  --text: #f8fafc;
  --muted: #7f8da3;
  --soft: #cbd5e1;
  --accent: #8b5cf6;
  --accent2: #6d28d9;
  --green: #4ade80;
  --yellow: #facc15;
  --red: #f87171;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 250px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  padding: 22px 14px;
  z-index: 1000;
  overflow-y: auto;
}

.logo {
  padding: 8px 14px 25px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
}

.logo h1 {
  margin: 0;
  font-size: 23px;
  letter-spacing: -0.5px;
}

.logo span {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
}

.nav-title {
  color: #4f5d73;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.4px;
  padding: 10px 14px 8px;
  text-transform: uppercase;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 14px;
  margin: 4px 0;
  border-radius: 11px;
  color: #aeb9c9;
  text-decoration: none;
  font-size: 14px;
  transition: .2s;
}

.nav-link:hover,
.nav-link.active {
  background: #171d2a;
  color: white;
}

.nav-icon {
  width: 24px;
  text-align: center;
  font-size: 16px;
}

.logout-nav {
  margin-top: 25px;
  border-top: 1px solid var(--border);
  padding-top: 18px;
}

#logoutButton {
  border: 0;
  background: transparent;
  cursor: pointer;
}

/* =========================
   MAIN
========================= */

.main {
  margin-left: 250px;
  min-height: 100vh;
}

/* =========================
   TOPBAR
========================= */

.topbar {
  height: 72px;
  border-bottom: 1px solid var(--border);
  background: rgba(7,10,16,.92);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  position: sticky;
  top: 0;
  z-index: 900;
  backdrop-filter: blur(12px);
}

.topbar-title {
  font-size: 18px;
  font-weight: 700;
}

.admin-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #aeb9c9;
  font-size: 13px;
}

.online-dot {
  width: 8px;
  height: 8px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(74,222,128,.6);
}

/* =========================
   CONTENT
========================= */

.content {
  padding: 30px;
  max-width: 1400px;
  margin: auto;
}

.page-heading {
  margin-bottom: 25px;
}

.page-heading h2 {
  margin: 0 0 8px;
  font-size: 29px;
}

.page-heading p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

#message {
  margin-bottom: 20px;
  font-size: 13px;
}

.success {
  color: var(--green);
}

.error {
  color: var(--red);
}

/* =========================
   OVERVIEW CARDS
========================= */

.overview-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 25px;
}

.stat-card {
  background: linear-gradient(145deg, #131a27, #0d121b);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 20px;
  min-height: 125px;
  box-shadow: 0 12px 30px rgba(0,0,0,.2);
}

.stat-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.stat-label {
  color: var(--muted);
  font-size: 12px;
}

.stat-icon {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1a2030;
  border-radius: 10px;
  font-size: 17px;
}

.stat-value {
  margin-top: 18px;
  font-size: 24px;
  font-weight: 800;
}

/* =========================
   SECTION
========================= */

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 28px 0 14px;
}

.section-title h3 {
  margin: 0;
  font-size: 17px;
}

.section-title span {
  color: var(--muted);
  font-size: 12px;
}

/* =========================
   MANAGEMENT GRID
========================= */

.management-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.admin-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,.18);
}

.admin-card:hover {
  border-color: #303d52;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 13px;
}

.card-icon {
  width: 42px;
  height: 42px;
  background: #191f2c;
  border: 1px solid #293448;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
}

.admin-card h3 {
  margin: 0;
  font-size: 16px;
}

.admin-card p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  margin: 0 0 17px;
}

/* =========================
   BUTTON
========================= */

.admin-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 10px 16px;
  border-radius: 11px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  background: #f8fafc;
  color: #090d14;
  border: none;
  cursor: pointer;
  transition: .2s;
}

.admin-button:hover {
  transform: translateY(-1px);
  opacity: .9;
}

.secondary-button {
  background: #1a2130;
  color: #dbe4f0;
  border: 1px solid #2b374a;
}

/* =========================
   PAYMENT DETAILS
========================= */

.payment-card {
  background: linear-gradient(145deg, #121a29, #0d131e);
  border: 1px solid #29354a;
  border-radius: 20px;
  padding: 23px;
  margin-top: 16px;
}

.payment-card .card-head {
  margin-bottom: 20px;
}

.info-box {
  background: #0b111b;
  border: 1px solid #1f2b3d;
  color: #8997aa;
  padding: 13px;
  border-radius: 11px;
  margin-bottom: 20px;
  font-size: 12px;
  line-height: 1.5;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.form-group {
  margin-bottom: 5px;
}

.form-group.full {
  grid-column: 1 / -1;
}

.form-group label {
  display: block;
  color: #b9c4d3;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 7px;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 13px;
  background: #090e16;
  border: 1px solid #293548;
  border-radius: 10px;
  color: white;
  outline: none;
  font-size: 14px;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: #59677e;
}

.form-group textarea {
  min-height: 90px;
  resize: vertical;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
  color: #4f5c70;
}

#paymentDetailsMessage {
  margin-top: 13px;
  font-size: 13px;
  font-weight: 600;
}

/* =========================
   QUICK LINKS
========================= */

.quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.quick-link {
  display: block;
  background: #0d131e;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 17px;
  text-decoration: none;
  color: white;
  transition: .2s;
}

.quick-link:hover {
  background: #151c29;
  transform: translateY(-2px);
}

.quick-link-icon {
  font-size: 21px;
  margin-bottom: 10px;
}

.quick-link strong {
  display: block;
  font-size: 13px;
}

.quick-link small {
  display: block;
  color: var(--muted);
  margin-top: 5px;
  font-size: 11px;
}

/* =========================
   MOBILE
========================= */

.mobile-menu {
  display: none;
  background: #151b28;
  border: 1px solid var(--border);
  color: white;
  border-radius: 9px;
  padding: 9px 11px;
  cursor: pointer;
  font-size: 18px;
}

@media (max-width: 1050px) {
  .overview-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .quick-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 800px) {
  .sidebar {
    transform: translateX(-100%);
    transition: .25s;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .main {
    margin-left: 0;
  }

  .mobile-menu {
    display: block;
  }

  .topbar {
    padding: 0 16px;
  }

  .content {
    padding: 22px 15px 40px;

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#080d18"><title>TaskVexa — Promoter Login</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="filora-theme.css?v=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/promoter-auth.js?v=20260917b"></script><link rel="stylesheet" href="/filora-theme.css?v=1">
<script src="/theme.js?v=9"></script>
</head><body><main class="auth-page"><section class="auth-card"><div class="auth-brand">TaskVexa</div><h1>Promoter Login</h1><p class="muted">Sign in to manage your campaigns and promoter activity.</p><form id="promoterLoginForm"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit" id="loginBtn">Login</button><p id="error" class="error" hidden></p></form><div class="auth-links"><p>New Promoter? <a href="promoter-register.html">Create Promoter Account</a></p><p><a href="login.html">Worker Login</a></p></div></section></main><script>document.getElementById('promoterLoginForm').addEventListener('submit',async(e)=>{e.preventDefault();const btn=document.getElementById('loginBtn'),err=document.getElementById('error');err.hidden=true;btn.disabled=true;btn.textContent='Logging in...';try{const {error}=await window.promoterSupabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const ctx=await window.getPromoterContextForLogin();if(ctx.error)throw ctx.error;window.location.href='promoter-dashboard.html?v=20260917b';}catch(e){err.textContent=e.message||'Login failed';err.hidden=false;btn.disabled=false;btn.textContent='Login';}});</script></body></html>

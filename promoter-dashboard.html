<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a10"><title>TaskVexa — Promoter</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script><style>:root{--bg:#070a10;--card:#101622;--line:#202a3d;--text:#f4f7fb;--muted:#98a4b8;--accent:#7c5cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 95px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:21px}.sub{color:var(--muted);font-size:12px;margin-top:3px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#151d2c;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px}.label{color:var(--muted);font-size:11px}.value{font-size:20px;font-weight:800;margin-top:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.btn{display:block;text-align:center;text-decoration:none;border-radius:13px;padding:14px;background:var(--accent);color:#fff;font-weight:800}.btn.secondary{background:var(--card);border:1px solid var(--line)}.section{margin-top:16px}.section h3{font-size:15px;margin:0 0 10px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.small{color:var(--muted);font-size:12px}.empty{color:var(--muted);font-size:13px;padding:15px 0}.nav{position:fixed;left:0;right:0;bottom:0;background:#0b101aee;border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:10px}.nav a{color:#aeb8ca;text-decoration:none;font-size:11px;padding:8px 10px}.nav a.active{color:#fff}</style></head><body><main class="wrap"><header class="head"><div><div class="brand">Promoter Dashboard</div><div class="sub">Create and manage campaigns for Workers.</div></div><div class="avatar">P</div></header><section class="grid"><div class="card"><div class="label">Available Balance</div><div class="value" id="balance">₦0.00</div></div><div class="card"><div class="label">Total Funded</div><div class="value" id="funded">₦0.00</div></div><div class="card"><div class="label">Total Spent</div><div class="value" id="spent">₦0.00</div></div></section><section class="actions"><a class="btn" href="promoter-create.html">＋ Create Campaign</a><a class="btn secondary" href="promoter-wallet.html">Fund Wallet</a></section><section class="card section"><h3>Campaign Overview</h3><div class="row"><span>Active campaigns</span><strong id="active">0</strong></div><div class="row"><span>Pending campaigns</span><strong id="pending">0</strong></div><div class="row"><span>Completed campaigns</span><strong id="completed">0</strong></div></section><section class="card section"><h3>Recent Campaigns</h3><div id="campaigns" class="empty">Loading...</div></section></main><nav class="nav"><a class="active" href="promoter-dashboard.html">Home</a><a href="promoter-campaigns.html">Campaigns</a><a href="promoter-create.html">Create</a><a href="promoter-wallet.html">Wallet</a><a href="promoter-settings.html">More</a></nav><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const {data:w}=await sb.rpc('get_my_promoter_wallet');if(w&&w[0]){balance.textContent=money(w[0].balance);funded.textContent=money(w[0].total_funded);spent.textContent=money(w[0].total_spent)}const {data:c}=await sb.from('promoter_campaigns').select('id,title,status,created_at').eq('promoter_id',user.id).order('created_at',{ascending:false});const list=c||[];active.textContent=list.filter(x=>x.status==='active').length;pending.textContent=list.filter(x=>['draft','pending','pending_review'].includes(x.status)).length;completed.textContent=list.filter(x=>x.status==='completed').length;campaigns.innerHTML=list.length?list.slice(0,6).map(x=>`<div class="row"><div><strong>${String(x.title||'Campaign').replace(/[<>]/g,'')}</strong><div class="small">${x.status||'draft'}</div></div><span>›</span></div>`).join(''):'No campaigns yet.'}load();</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TaskVexa - Referrals</title><style>*{box-sizing:border-box}:root{--bg:#070b14;--panel:#0d1422;--panel2:#111a2b;--border:#1d293d;--text:#f8fafc;--muted:#94a3b8;--accent:#7c3aed;--accent2:#a78bfa;--green:#22c55e;--red:#ef4444}body{margin:0;background:radial-gradient(circle at top right,rgba(124,58,237,.16),transparent 34%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}.top{height:68px;position:sticky;top:0;z-index:20;background:rgba(7,11,20,.94);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-size:23px;font-weight:800}.brand span{color:var(--accent2)}.back{border:1px solid var(--border);background:var(--panel2);color:#fff;border-radius:10px;padding:9px 12px;text-decoration:none;font-size:13px}.wrap{max-width:820px;margin:auto;padding:26px 15px 90px}.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0 0 20px;color:var(--muted);font-size:14px}.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:16px}.code{font-size:28px;font-weight:900;letter-spacing:2px;color:#c4b5fd;margin:8px 0 14px}.link{width:100%;padding:12px;background:#090e18;border:1px solid #263247;border-radius:11px;color:#cbd5e1;word-break:break-all;font-size:12px}.button{border:0;border-radius:11px;padding:12px 16px;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:13px;padding:15px}.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{display:block;font-size:22px;margin-top:7px}.message{font-size:13px;margin-top:12px}.success{color:#86efac}.error{color:#fca5a5}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:rgba(9,15,28,.97);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:30}.bottom a{color:#94a3b8;text-decoration:none;font-size:10px;text-align:center}.bottom a.active{color:#c4b5fd}.bottom b{display:block;font-size:19px;margin-bottom:3px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.hero h1{font-size:24px}}</style></head><body><header class="top"><a class="back" href="dashboard.html">← Dashboard</a><div class="brand">Task<span>Vexa</span></div><div style="width:80px"></div></header><main class="wrap"><section class="hero"><h1>Refer & Earn</h1><p>Share your unique TaskVexa referral link with people you invite.</p></section><section class="card"><div style="color:var(--muted);font-size:12px">YOUR UNIQUE REFERRAL CODE</div><div id="code" class="code">Loading...</div><div id="link" class="link">Loading referral link...</div><button id="copy" class="button">Copy Referral Link</button><button id="share" class="button" style="background:#182131;border:1px solid #293548">Share Link</button><div id="message" class="message"></div></section><section class="card"><h2 style="margin:0 0 14px;font-size:18px">Referral Overview</h2><div class="stats"><div class="stat"><small>Total Referrals</small><strong id="total">0</strong></div><div class="stat"><small>Workers</small><strong id="workers">0</strong></div><div class="stat"><small>Promoters</small><strong id="promoters">0</strong></div></div></section></main><nav class="bottom"><a href="dashboard.html"><b>⌂</b>Home</a><a href="tasks.html"><b>✓</b>Tasks</a><a href="airtime.html"><b>₦</b>Airtime</a><a href="withdraw.html"><b>◉</b>Wallet</a><a class="active" href="referrals.html"><b>👥</b>Referrals</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const S='https://dxtlnrthlpdaobnbazny.supabase.co',K='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY',sb=window.supabase.createClient(S,K),$=id=>document.getElementById(id);let referralLink='';async function init(){try{const {data,error}=await sb.auth.getUser();if(error||!data.user){location.href='login.html';return}const u=data.user;const {data:p,error:pe}=await sb.from('profiles').select('referral_code').eq('id',u.id).maybeSingle();if(pe)throw pe;const {data:r,error:re}=await sb.from('profiles').select('id,role').eq('referred_by',u.id);if(re)throw re;const code=p?.referral_code||'TVX'+u.id.replaceAll('-','').slice(0,8).toUpperCase();const base=location.origin;referralLink=base+'/r/'+encodeURIComponent(code);$('code').textContent=code;$('link').textContent=referralLink;$('total').textContent=r?.length||0;$('workers').textContent=(r||[]).filter(x=>x.role==='worker').length;$('promoters').textContent=(r||[]).filter(x=>x.role==='promoter').length}catch(e){$('message').textContent='Unable to load referral information: '+(e.message||'Please refresh.');$('message').className='message error'}}$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(referralLink);$('message').textContent='Referral link copied.';$('message').className='message success'}catch(e){$('message').textContent='Copy failed. Long-press the link to copy it.';$('message').className='message error'}});$('share').addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({title:'Join TaskVexa',text:'Join TaskVexa using my referral link.',url:referralLink})}catch(e){}}else{$('message').textContent='Sharing is not supported here. Use Copy Referral Link.';$('message').className='message'}});init();</script></body></html>

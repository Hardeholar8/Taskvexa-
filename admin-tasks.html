const supabaseClient =

const message =

/* =========================
ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
MONEY
========================= */

function money(value){

return "₦" +
Number(value || 0).toLocaleString("en-NG",{
minimumFractionDigits:0,
maximumFractionDigits:2
});

}


/* =========================
STATUS
========================= */

function getStatusClass(status){

status =
String(status || "draft").toLowerCase();

if(status === "active")
return "status-active";

if(status === "paused")
return "status-paused";

if(status === "closed")
return "status-closed";

return "status-draft";

}


/* =========================
LEVELS
========================= */

function getLevels(levels){

if(!Array.isArray(levels))
return "Not specified";

const level1 =
levels.includes("level_1");

const level2 =
levels.includes("level_2");

if(level1 && level2)
return "Level 1 + Level 2";

if(level1)
return "Level 1";

if(level2)
return "Level 2";

return "Not specified";

}


/* =========================
ADMIN CHECK
IMPORTANT:
USES getSession()
LIKE THE WORKING ADMIN PAGE
========================= */

async function checkAdmin(){

message.textContent =
"Checking admin access...";

message.className = "";

try{

const {
data,
error
} =
await supabaseClient.auth.getSession();


if(error){

throw error;

}


const session =
data?.session;


if(!session){

window.location.href =
"login.html";

return false;

}


currentUser =
session.user;


/* Check profile */

const {
data:profile,
error:profileError
} =
await supabaseClient
.from("profiles")
.select("role")
.eq(
"id",
session.user.id
)
.maybeSingle();


if(profileError){

throw profileError;

}


if(
!profile ||
String(profile.role || "").toLowerCase()
!=="admin"
){

message.textContent =
"Access denied. Admin account required.";

message.className =
"error";

return false;

}


/* SUCCESS */

adminContent.style.display =
"block";

message.textContent =
"Admin access confirmed.";

message.className =
"success";

return true;


}catch(error){

console.error(
"ADMIN CHECK ERROR:",
error
);

message.textContent =
"Admin access error: " +
(error.message || "Unable to verify admin access.");

message.className =
"error";

return false;

}

}


/* =========================
LOAD TASKS
========================= */

async function loadTasks(){

taskList.innerHTML =
`
<div class="loading">
Loading tasks...
</div>
`;


const {
data,
error
} =
await supabaseClient
.from("tasks")
.select(`
id,
title,
description,
platform,
task_url,
reward,
workers_needed,
target_levels,
status,
source,
created_at,
updated_at
`)
.order(
"created_at",
{
ascending:false
}
);


if(error){

throw error;

}


loadedTasks =
data || [];


if(loadedTasks.length === 0){

taskList.innerHTML =
`
<div class="empty">
No tasks found.
</div>
`;

return;

}


taskList.innerHTML = "";


loadedTasks.forEach(function(task){

const card =
document.createElement("section");

card.className =
"task-card";

const status =
String(
task.status || "draft"
).toLowerCase();

const source =
String(
task.source || "admin"
);

card.innerHTML = `

<h3>
${escapeHTML(task.title)}
</h3>

<div class="task-description">
${escapeHTML(task.description)}
</div>

<div class="info-row">
<span>Platform</span>
<span>
${escapeHTML(task.platform || "Not specified")}
</span>
</div>

<div class="info-row">
<span>Task Link</span>
<span>
<a
href="${escapeHTML(task.task_url || "#")}"
target="_blank"
rel="noopener noreferrer"
style="color:#4ade80;"
>
Open Link
</a>
</span>
</div>

<div class="info-row">
<span>Worker Reward</span>
<span class="reward">
${money(task.reward)}
</span>
</div>

<div class="info-row">
<span>Workers Needed</span>
<span>
${Number(task.workers_needed || 0)}
</span>
</div>

<div class="info-row">
<span>Target Level</span>
<span>
${escapeHTML(getLevels(task.target_levels))}
</span>
</div>

<div class="info-row">
<span>Source</span>
<span>
${escapeHTML(source)}
</span>
</div>

<div class="info-row">
<span>Status</span>
<span>
<span class="status ${getStatusClass(status)}">
${escapeHTML(status.toUpperCase())}
</span>
</span>
</div>

<div class="task-actions">

<button
class="button secondary"
data-action="edit"
data-id="${escapeHTML(task.id)}"
>
Edit
</button>

${
status === "active"
?
`
<button
class="button warning"
data-action="pause"
data-id="${escapeHTML(task.id)}"
>
Pause
</button>
`
:
status !== "closed"
?
`
<button
class="button activate"
data-action="activate"
data-id="${escapeHTML(task.id)}"
>
Activate
</button>
`
:
""
}

${
status !== "closed"
?
`
<button
class="button danger"
data-action="close"
data-id="${escapeHTML(task.id)}"
>
Close
</button>
`
:
""
}

<button
class="button danger"
data-action="delete"
data-id="${escapeHTML(task.id)}"
>
Delete
</button>

</div>
`;

taskList.appendChild(card);

});


taskList
.querySelectorAll("[data-action]")
.forEach(function(button){

button.addEventListener("click",async function(){

const action =
button.dataset.action;

const taskId =
button.dataset.id;


if(action === "edit"){

editTask(taskId);

return;

}

if(action === "pause"){

await changeStatus(taskId,"paused");

return;

}

if(action === "activate"){

await changeStatus(taskId,"active");

return;

}

if(action === "close"){

await changeStatus(taskId,"closed");

return;

}

if(action === "delete"){

await deleteTask(taskId);

}

});

});

}


/* =========================
EDIT
========================= */

function editTask(taskId){

const task =
loadedTasks.find(
item =>
String(item.id) ===
String(taskId)
);

if(!task){

alert("Task not found.");

return;

}

editingTaskId =
task.id;

document.getElementById("title").value =
task.title || "";

document.getElementById("description").value =
task.description || "";

document.getElementById("platform").value =
task.platform || "";

document.getElementById("taskUrl").value =
task.task_url || "";

document.getElementById("reward").value =
task.reward ?? 0;

document.getElementById("workersNeeded").value =
task.workers_needed || 1;

const levels =
Array.isArray(task.target_levels)
?
task.target_levels
:
[];

if(
levels.includes("level_1") &&
levels.includes("level_2")
){

document.getElementById("targetLevel").value =
"both";

}else if(
levels.includes("level_2")
){

document.getElementById("targetLevel").value =
"level_2";

}else{

document.getElementById("targetLevel").value =
"level_1";

}

document.getElementById("taskStatus").value =
task.status || "active";

formTitle.textContent =
"Edit Task";

saveButton.textContent =
"Save Changes";

cancelButton.style.display =
"inline-flex";

formMessage.textContent = "";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
RESET
========================= */

function resetForm(){

editingTaskId = null;

taskForm.reset();

document.getElementById("reward").value =
100;

document.getElementById("workersNeeded").value =
1;

document.getElementById("targetLevel").value =
"level_1";

document.getElementById("taskStatus").value =
"active";

formTitle.textContent =
"Create New Task";

saveButton.textContent =
"Create Task";

cancelButton.style.display =
"none";

}


/* =========================
CREATE / UPDATE
========================= */

taskForm.addEventListener("submit",async function(event){

event.preventDefault();

formMessage.textContent = "";
formMessage.className = "";

const title =
document.getElementById("title").value.trim();

const description =
document.getElementById("description").value.trim();

const platform =
document.getElementById("platform").value.trim();

const taskUrl =
document.getElementById("taskUrl").value.trim();

const reward =
Number(
document.getElementById("reward").value
);

const workersNeeded =
Number(
document.getElementById("workersNeeded").value
);

const targetLevel =
document.getElementById("targetLevel").value;

const taskStatus =
document.getElementById("taskStatus").value;


if(!title ||
!description ||
!platform ||
!taskUrl){

formMessage.textContent =
"Please complete all required fields.";

formMessage.className =
"error";

return;

}

if(
!Number.isFinite(reward) ||
reward < 0
){

formMessage.textContent =
"Enter a valid worker reward.";

formMessage.className =
"error";

return;

}

if(
!Number.isInteger(workersNeeded) ||
workersNeeded < 1
){

formMessage.textContent =
"Workers Needed must be at least 1.";

formMessage.className =
"error";

return;

}


const targetLevels =
targetLevel === "both"
?
["level_1","level_2"]
:
[targetLevel];


const taskData = {

title:title,
description:description,
platform:platform,
task_url:taskUrl,
reward:reward,
workers_needed:workersNeeded,
target_levels:targetLevels,
status:taskStatus

};


try{

saveButton.disabled = true;


if(editingTaskId){

saveButton.textContent =
"Saving...";

const {
error
} =
await supabaseClient
.from("tasks")
.update(taskData)
.eq(
"id",
editingTaskId
);

if(error)
throw error;

formMessage.textContent =
"Task updated successfully.";

formMessage.className =
"success";

}else{

saveButton.textContent =
"Creating...";

const {
error
} =
await supabaseClient
.from("tasks")
.insert({

...taskData,

created_by:
currentUser.id,

source:"admin"

});

if(error)
throw error;

formMessage.textContent =
"Task created successfully.";

formMessage.className =
"success";

}

resetForm();

await loadTasks();


}catch(error){

console.error(
"TASK SAVE ERROR:",
error
);

formMessage.textContent =
"Error: " +
(error.message || "Unable to save task.");

formMessage.className =
"error";


}finally{

saveButton.disabled = false;

saveButton.textContent =
editingTaskId
?
"Save Changes"
:
"Create Task";

}

});


/* =========================
CANCEL
========================= */

cancelButton.addEventListener(
"click",
function(){

resetForm();

formMessage.textContent = "";

}
);


/* =========================
CHANGE STATUS
========================= */

async function changeStatus(
taskId,
newStatus
){

try{

const {
error
} =
await supabaseClient
.from("tasks")
.update({
status:newStatus
})
.eq(
"id",
taskId
);

if(error)
throw error;

await loadTasks();


}catch(error){

console.error(
"STATUS ERROR:",
error
);

alert(
"Unable to change task status.\n\n" +
(error.message || "Unknown error")
);

}

}


/* =========================
DELETE
========================= */

async function deleteTask(taskId){

const task =
loadedTasks.find(
item =>
String(item.id) ===
String(taskId)
);

if(!task)
return;

if(
!confirm(
'Delete task "' +
(task.title || "this task") +
'"?\n\nThis cannot be undone.'
)
){

return;

}

try{

const {
error
} =
await supabaseClient
.from("tasks")
.delete()
.eq(
"id",
taskId
);

if(error)
throw error;

await loadTasks();


}catch(error){

console.error(
"DELETE ERROR:",
error
);

alert(
"Unable to delete task.\n\n" +
(error.message || "Unknown error")
);

}

}

  </script>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>TaskVexa — Campaign Details</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/promoter-auth.js"></script><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 16px 105px}.top{display:flex;gap:11px;align-items:center;margin-bottom:15px}.back{width:42px;height:42px;border:1px solid #26344d;background:#111827;color:#fff;border-radius:13px;font-size:18px}.title{font-size:21px;font-weight:900}.sub{font-size:11px;color:#94a3b8;margin-top:3px}.hero,.card{background:linear-gradient(180deg,#121b2d,#0f1728);border:1px solid #26344d;border-radius:19px;padding:17px;margin-bottom:12px;box-shadow:0 14px 38px rgba(0,0,0,.2)}.hero{border-color:#3b3470;background:linear-gradient(135deg,#211941,#121d31)}.name{font-size:20px;font-weight:900;line-height:1.2}.pill{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:800;text-transform:capitalize}.active{background:#123323;color:#4ade80}.pending{background:#352b12;color:#fbbf24}.completed{background:#172235;color:#aab8ce}.rejected{background:#35191d;color:#f87171}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{background:#0b1220;border:1px solid #26344d;border-radius:13px;padding:12px}.item span{display:block;color:#94a3b8;font-size:10px}.item strong{display:block;font-size:14px;margin-top:5px}.heading{font-size:13px;font-weight:850;margin-bottom:10px}.desc{font-size:12px;line-height:1.6;color:#c0cad9;white-space:pre-wrap}.progressrow{display:flex;justify-content:space-between;color:#94a3b8;font-size:11px;margin-bottom:6px}.progress{height:8px;background:#0b1220;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#7048ff,#42d8ff);border-radius:99px}.link{display:block;color:#a98cff;word-break:break-all;font-size:12px;text-decoration:none}.empty{text-align:center;color:#94a3b8;padding:30px}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;padding:0 10px 4px;background:rgba(10,16,30,.97);border-top:1px solid #26344d;display:flex;align-items:center;justify-content:space-around;z-index:1000}.nav a{flex:1;text-align:center;color:#7f8da5;text-decoration:none;font-size:10px;padding:10px 2px}.nav .plus{flex:0 0 56px;height:56px;margin-top:-20px;border-radius:50%;background:linear-gradient(145deg,#5d35ed,#8c45ff);color:#fff;font-size:27px;padding:0;display:grid;place-items:center;border:4px solid #080d18}@media(max-width:380px){.grid{grid-template-columns:1fr 1fr}.name{font-size:18px}}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="history.length>1?history.back():location.href='promoter-campaigns.html'">←</button><div><div class="title">Campaign Details</div><div class="sub">Campaign performance and configuration</div></div></div><div id="content"><div class="empty">Loading campaign...</div></div></main><nav class="nav"><a href="promoter-dashboard.html">⌂<br>Home</a><a class="active" href="promoter-campaigns.html">▣<br>Campaigns</a><a class="plus" href="promoter-create.html">+</a><a href="promoter-wallet.html">◉<br>Wallet</a><a href="promoter-settings.html">☰<br>More</a></nav><script>const $=id=>document.getElementById(id);const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])}function group(s){if(s==='active')return'active';if(['completed','closed'].includes(s))return'completed';if(['rejected','cancelled'].includes(s))return'rejected';return'pending'}async function load(){const ctx=await requirePromoter();if(!ctx)return;const id=new URLSearchParams(location.search).get('id');if(!id){$('content').innerHTML='<div class="card empty">No campaign was selected.</div>';return}const {data:x,error}=await promoterSupabase.from('promoter_campaigns').select('id,title,description,status,platform,task_type,task_url,workers_needed,price_per_worker,calculated_cost,proof_required,created_at,live_at,completed_at,admin_note,approved_worker_count,paid_worker_slots,submitted_worker_count').eq('id',id).eq('promoter_id',ctx.user.id).maybeSingle();if(error||!x){$('content').innerHTML='<div class="card empty">Campaign not found or unavailable.</div>';return}const needed=Number(x.workers_needed||0),done=Number(x.approved_worker_count||x.paid_worker_slots||0),submitted=Number(x.submitted_worker_count||0),pct=needed?Math.min(100,Math.round(done/needed*100)):0;$('content').innerHTML=`<section class="hero"><div class="name">${esc(x.title||'Untitled campaign')}</div><span class="pill ${group(x.status)}">${esc(x.status||'pending')}</span></section><section class="card"><div class="heading">Campaign performance</div><div class="progressrow"><span>${done} approved · ${submitted} submitted</span><strong>${pct}%</strong></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="grid" style="margin-top:12px"><div class="item"><span>WORKERS BOOKED</span><strong>${needed}</strong></div><div class="item"><span>REMAINING</span><strong>${Math.max(0,needed-done)}</strong></div></div></section><section class="card"><div class="heading">Campaign setup</div><div class="grid"><div class="item"><span>PLATFORM</span><strong>${esc(x.platform||'—')}</strong></div><div class="item"><span>TASK TYPE</span><strong>${esc(x.task_type||'—')}</strong></div><div class="item"><span>PRICE / WORKER</span><strong>${money(x.price_per_worker)}</strong></div><div class="item"><span>TOTAL COST</span><strong>${money(x.calculated_cost)}</strong></div><div class="item"><span>PROOF</span><strong>${x.proof_required?'Required':'Not required'}</strong></div><div class="item"><span>CREATED</span><strong>${new Date(x.created_at).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'})}</strong></div></div></section><section class="card"><div class="heading">Instructions</div><div class="desc">${esc(x.description||'No campaign description provided.')}</div>${x.task_url?`<div style="margin-top:14px"><div class="heading">Campaign link</div><a class="link" href="${esc(x.task_url)}" target="_blank" rel="noopener">${esc(x.task_url)}</a></div>`:''}</section>${x.admin_note?`<section class="card"><div class="heading">Admin note</div><div class="desc">${esc(x.admin_note)}</div></section>`:''}<section class="card"><div class="heading">Timeline</div><div class="grid"><div class="item"><span>LIVE</span><strong>${x.live_at?new Date(x.live_at).toLocaleDateString('en-NG',{day:'numeric',month:'short'}):'—'}</strong></div><div class="item"><span>COMPLETED</span><strong>${x.completed_at?new Date(x.completed_at).toLocaleDateString('en-NG',{day:'numeric',month:'short'}):'—'}</strong></div></div></section>`}load();</script></body></html>

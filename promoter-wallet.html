<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>TaskVexa — Promoter Wallet</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/promoter-auth.js"></script><link rel="stylesheet" href="/filora-theme.css?v=1"><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 105px}.head{margin-bottom:18px}.title{font-size:25px;font-weight:900}.sub{color:#94a3b8;font-size:12px;margin-top:4px}.hero{background:linear-gradient(135deg,#25194d,#171f3a 55%,#102b40);border:1px solid #3b3470;border-radius:22px;padding:21px;box-shadow:0 18px 42px rgba(0,0,0,.3);margin-bottom:13px}.label{font-size:11px;color:#b8b6d0}.balance{font-size:34px;font-weight:950;margin:7px 0 18px}.hero-actions{display:flex;gap:9px}.btn{flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:12px;font-size:12px;font-weight:850;background:linear-gradient(135deg,#6947ff,#9b61ff);color:#fff}.btn.alt{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}.card{background:linear-gradient(180deg,#121b2d,#0f1728);border:1px solid #26344d;border-radius:18px;padding:16px;box-shadow:0 14px 38px rgba(0,0,0,.2)}.statlabel{color:#94a3b8;font-size:10px}.statvalue{font-size:19px;font-weight:900;margin-top:7px}.section-title{font-size:14px;font-weight:850;margin-bottom:10px}.tx{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #26344d}.tx:last-child{border-bottom:0}.icon{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:#211941;color:#b49cff}.txmain{flex:1;min-width:0}.txname{font-size:12px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txmeta{font-size:10px;color:#94a3b8;margin-top:3px}.txamount{font-size:12px;font-weight:850}.empty{text-align:center;color:#94a3b8;padding:22px}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;padding:0 10px 4px;background:rgba(10,16,30,.97);border-top:1px solid #26344d;display:flex;align-items:center;justify-content:space-around;z-index:1000}.nav a{flex:1;text-align:center;color:#7f8da5;text-decoration:none;font-size:10px;padding:10px 2px}.nav a.active{color:#9a73ff}.nav .plus{flex:0 0 56px;height:56px;margin-top:-20px;border-radius:50%;background:linear-gradient(145deg,#5d35ed,#8c45ff);color:#fff;font-size:27px;padding:0;display:grid;place-items:center;border:4px solid #080d18}@media(max-width:380px){.balance{font-size:29px}.stats{gap:8px}.card{padding:13px}}</style></head><body><main class="wrap"><header class="head"><div class="title">Promoter Wallet</div><div class="sub">Your campaign funding and spending center.</div></header><section class="hero"><div class="label">AVAILABLE BALANCE</div><div id="balance" class="balance">₦0.00</div><div class="hero-actions"><a class="btn" href="promoter-fund.html">＋ Fund Wallet</a><a class="btn alt" href="promoter-history.html">History</a></div></section><section class="stats"><div class="card"><div class="statlabel">TOTAL FUNDED</div><div id="funded" class="statvalue">₦0.00</div></div><div class="card"><div class="statlabel">TOTAL SPENT</div><div id="spent" class="statvalue">₦0.00</div></div></section><section class="card"><div class="section-title">Recent Transactions</div><div id="tx"><div class="empty">Loading transactions...</div></div></section></main><nav class="nav"><a href="promoter-dashboard.html">⌂<br>Home</a><a href="promoter-campaigns.html">▣<br>Campaigns</a><a class="plus" href="promoter-create.html">+</a><a class="active" href="promoter-wallet.html">◉<br>Wallet</a><a href="promoter-settings.html">☰<br>More</a></nav><script>const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const ctx=await requirePromoter();if(!ctx)return;const {data:w}=await promoterSupabase.rpc('get_my_promoter_wallet');if(w?.[0]){balance.textContent=money(w[0].balance);funded.textContent=money(w[0].total_funded);spent.textContent=money(w[0].total_spent)}const {data:t,error}=await promoterSupabase.rpc('get_my_promoter_wallet_transactions');if(error){tx.innerHTML='<div class="empty">Unable to load transactions.</div>';return}tx.innerHTML=t?.length?t.slice(0,10).map(x=>`<div class="tx"><div class="icon">↕</div><div class="txmain"><div class="txname">${esc(x.description||x.transaction_type||'Transaction')}</div><div class="txmeta">${x.created_at?new Date(x.created_at).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}):'Recent'} · ${esc(x.status||'completed')}</div></div><div class="txamount">${money(x.amount)}</div></div>`).join(''):'<div class="empty">No transactions yet.</div>'}load();</script></body></html>

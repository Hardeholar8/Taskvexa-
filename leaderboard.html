<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Referral Leaderboard</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:22px 15px 85px}.top{display:flex;justify-content:space-between}.brand{font-size:22px;font-weight:900}.brand span{color:#a78bfa}a{color:#c4b5fd;text-decoration:none}.card{background:#0d1422;border:1px solid #1d293d;border-radius:17px;padding:17px;margin-top:18px}.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #1d293d}.row:last-child{border:0}.rank{width:25px;color:#c4b5fd;font-weight:900}.avatar{width:32px;height:32px;border-radius:50%;background:#241641;display:grid;place-items:center;font-size:11px;font-weight:800}.name{flex:1;font-size:12px}.score{font-size:11px;color:#94a3b8}.muted{color:#94a3b8;font-size:11px}.empty{text-align:center;padding:20px;color:#94a3b8;font-size:12px}</style></head><body><main class="wrap"><div class="top"><a href="dashboard.html">← Dashboard</a><div class="brand">Task<span>Vexa</span></div></div><h1>Referral Leaderboard</h1><p class="muted">Top users ranked by successful referrals only. Task completions and task earnings do not affect this leaderboard.</p><section class="card" id="leaderboard"><div class="empty">Loading referral rankings...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>(async()=>{const box=document.getElementById('leaderboard');try{const {data,error}=await window.supabaseClient.rpc('get_referral_leaderboard');if(error)throw error;if(!Array.isArray(data)||!data.length){box.innerHTML='<div class="empty">No referrals yet.</div>';return}box.innerHTML=data.map((u,i)=>{const name=(u.display_name||u.username||'User').toString();const initial=name.trim().charAt(0).toUpperCase()||'U';const count=Number(u.referral_count||0);return '<div class="row"><span class="rank">'+(i+1)+'</span><span class="avatar">'+initial+'</span><span class="name">'+name.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))+'</span><span class="score">'+count+' referral'+(count===1?'':'s')+'</span></div>'}).join('')}catch(e){console.error(e);box.innerHTML='<div class="empty">Unable to load referral leaderboard.</div>'}})();</script></body></html>

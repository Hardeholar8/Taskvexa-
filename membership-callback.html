<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>TaskVexa — Membership Verification</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=12"></script><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:70px 16px}.card{background:#101a2c;border:1px solid #293a57;border-radius:22px;padding:26px;text-align:center}.icon{width:58px;height:58px;border-radius:18px;background:#7048ff;margin:0 auto 16px;display:grid;place-items:center;font-size:25px}.muted{color:#94a3b8;font-size:12px;line-height:1.6}.ok{color:#86efac}.err{color:#fda4af}.btn{display:none;margin-top:18px;padding:11px 16px;border-radius:11px;background:#7048ff;color:#fff;text-decoration:none;font-size:11px;font-weight:900}.btn.show{display:inline-block}</style></head><body><main class="wrap"><section class="card"><div id="icon" class="icon">⌛</div><h1 id="title">Verifying membership payment…</h1><p id="msg" class="muted">Please wait while TaskVexa confirms your payment.</p><a id="back" class="btn" href="membership.html">Return to Membership</a></section></main><script>const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{try{const p=new URLSearchParams(location.search),tx=p.get('transaction_id'),ref=p.get('tx_ref');if(!tx&&!ref)throw new Error('Payment reference was not returned.');let j=null,last='Payment verification failed.';for(let i=0;i<4;i++){const r=await fetch('/api/flutterwave/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transaction_id:tx||undefined,tx_ref:ref||undefined,purpose:'membership'})});j=await r.json().catch(()=>({}));if(r.ok&&j.verified&&j.membership_activated)break;last=j.error||last;if(i<3)await sleep(2500)}if(!j?.verified||!j?.membership_activated)throw new Error(last);document.getElementById('icon').textContent='✓';document.getElementById('title').textContent='Membership Activated';document.getElementById('msg').textContent='Your membership is now active. Your plan period has been recorded successfully.';document.getElementById('msg').className='muted ok'}catch(e){console.error(e);document.getElementById('icon').textContent='!';document.getElementById('title').textContent='Verification Failed';document.getElementById('msg').textContent=e.message||'Please contact TaskVexa support.';document.getElementById('msg').className='muted err'}document.getElementById('back').classList.add('show')})();</script></body></html>

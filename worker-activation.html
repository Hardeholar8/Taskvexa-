<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TaskVexa - Activate Worker Account</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 15px 70px}.back{color:#c4b5fd;text-decoration:none}.card{background:#0d1422;border:1px solid #1d293d;border-radius:18px;padding:20px;margin:16px 0}button{padding:12px 16px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.muted{color:#94a3b8;font-size:13px;line-height:1.6}.amount{font-size:25px;font-weight:800;color:#c4b5fd}.error{color:#fca5a5}.success{color:#86efac}</style><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script></head><body><main class="wrap"><a class="back" href="dashboard.html">← Dashboard</a><h1>Activate Worker Account</h1><p class="muted">Complete the secure online activation payment below. Your account will be activated automatically after successful payment verification.</p><section class="card"><h2>Account Activation</h2><div id="activation">Loading activation amount...</div></section><section class="card"><h2>Payment</h2><p class="muted">You will be redirected to Flutterwave's secure checkout.</p><button id="pay" disabled>Continue to Payment</button><div id="msg" class="muted"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY'),$=id=>document.getElementById(id);let user,activationAmount=0;async function init(){try{const {data:{user:currentUser},error}=await sb.auth.getUser();if(error)throw error;if(!currentUser){location.href='login.html';return}user=currentUser;const {data:p,error:pe}=await sb.from('profiles').select('role,activation_status').eq('id',user.id).maybeSingle();if(pe)throw pe;if(String(p?.role||'').toLowerCase()!=='worker')throw new Error('Worker account required.');if(['active','activated','approved','true'].includes(String(p?.activation_status||'').toLowerCase())){$('activation').innerHTML='<p class="muted success">Your account is already activated.</p>';$('pay').disabled=true;$('msg').textContent='Your account is already activated.';$('msg').className='muted success';return}const {data:s,error:se}=await sb.from('worker_activation_settings').select('activation_amount').limit(1).maybeSingle();if(se)throw se;activationAmount=Number(s?.activation_amount||0);if(activationAmount<=0)throw new Error('Activation amount has not been configured by admin.');$('activation').innerHTML='<p class="muted">Worker account activation</p><div class="amount">₦'+activationAmount.toLocaleString('en-NG')+'</div>';$('pay').disabled=false}catch(e){console.error(e);$('activation').innerHTML='<div class="error">'+String(e.message||'Unable to load activation settings.')+'</div>'}}$('pay').onclick=async()=>{try{$('pay').disabled=true;$('msg').textContent='Starting secure checkout...';const r=await fetch('/api/flutterwave/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:user.email,user_id:user.id,amount:activationAmount,purpose:'worker_activation',callback_url:location.origin+'/activation-callback.html'})});const j=await r.json();if(!r.ok||!j.checkout_url)throw new Error(j.error||'Unable to start payment.');location.href=j.checkout_url}catch(e){$('msg').textContent=e.message||'Payment could not be started.';$('msg').className='muted error';$('pay').disabled=false}};init();</script></body></html>

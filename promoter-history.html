<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>TaskVexa — Promoter History</title><link rel="stylesheet" href="/filora-theme.css?v=1"><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 105px}.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{width:40px;height:40px;border:1px solid #26344d;border-radius:12px;background:#111827;color:#fff;font-size:18px}.title{font-size:24px;font-weight:900}.sub{color:#94a3b8;font-size:12px;margin-top:4px}.card{background:linear-gradient(180deg,#121b2d,#0f1728);border:1px solid #26344d;border-radius:18px;padding:8px 16px}.tx{display:flex;align-items:center;gap:11px;padding:15px 0;border-bottom:1px solid #26344d}.tx:last-child{border-bottom:0}.icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#211941;color:#b49cff}.main{flex:1;min-width:0}.name{font-size:13px;font-weight:800}.meta{font-size:10px;color:#94a3b8;margin-top:4px}.amount{font-size:13px;font-weight:900}.empty{text-align:center;color:#94a3b8;padding:30px 10px}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;padding:0 10px 4px;background:rgba(10,16,30,.97);border-top:1px solid #26344d;display:flex;align-items:center;justify-content:space-around}.nav a{color:#7f8da5;text-decoration:none;font-size:10px;text-align:center}.nav a.active{color:#9a73ff}</style>

</head><body><main class="wrap"><header class="head"><button class="back" onclick="location.href='promoter-wallet.html'">‹</button><div><div class="title">Transaction History</div><div class="sub">Your complete promoter wallet activity.</div></div></header><section class="card" id="history"><div class="empty">Loading history...</div></section></main><nav class="nav"><a href="promoter-dashboard.html">⌂<br>Home</a><a href="promoter-campaigns.html">▣<br>Campaigns</a><a href="promoter-wallet.html" class="active">◉<br>Wallet</a><a href="promoter-settings.html">☰<br>More</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/promoter-auth.js?v=20260919f"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});async function load(){const {data:{session},error:se}=await promoterSupabase.auth.getSession();if(se||!session?.user){document.getElementById('history').innerHTML='<div class="empty">Promoter session not found. Please sign in again.</div>';return}const{data,error}=await promoterSupabase.rpc('get_my_promoter_wallet_transactions');if(error){document.getElementById('history').innerHTML='<div class="empty">Unable to load transaction history: '+esc(error.message||'Please try again.')+'</div>';console.error(error);return}document.getElementById('history').innerHTML=data?.length?data.map(x=>'<div class="tx"><div class="icon">↕</div><div class="main"><div class="name">'+esc((x.transaction_type==='deposit'||x.transaction_type==='funding'||x.transaction_type==='wallet_funding')?'Deposit':(x.description||x.transaction_type||'Transaction'))+'</div><div class="meta">'+(x.created_at?new Date(x.created_at).toLocaleString('en-NG',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}):'Recent')+' · '+esc(x.status||'completed')+(x.reference?' · '+esc(x.reference):'')+'</div></div><div class="amount">'+money(x.amount)+'</div></div>').join(''):'<div class="empty">No transactions yet.</div>'}load();</script></body></html>

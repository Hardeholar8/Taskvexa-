<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskVexa - Task Details Test</title>
  <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="/filora-theme.css?v=1">
<script src="/theme.js?v=9"></script>
</head>

<body>

<header>
  <h1>TaskVexa</h1>
  <a href="tasks.html">Back to Tasks</a>
</header>

<main>

  <div id="message">Loading task...</div>

  <section id="taskDetails" style="display:none;">

    <h2 id="taskTitle"></h2>

    <p>
      <strong>Platform:</strong>
      <span id="taskPlatform"></span>
    </p>

    <p>
      <strong>Task Reward:</strong>
      ₦<span id="taskReward"></span>
    </p>

    <p>
      <strong>Instructions:</strong>
    </p>

    <div id="taskDescription"></div>

    <p>
      <a
        id="taskLink"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        class="task-button"
      >
        Open Task
      </a>
    </p>

    <hr>

    <h3>Submit Proof</h3>

    <p>
      Upload a screenshot showing that you completed the task.
    </p>

    <input
      type="file"
      id="proofFile"
      accept="image/jpeg,image/png,image/webp"
      required
    >

    <p id="proofInfo" style="font-size:13px;opacity:.75;">
      Screenshot will be automatically compressed before upload.
    </p>

    <br>

    <button id="submitButton">
      Submit Proof
    </button>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const message =
  document.getElementById("message");

const taskDetails =
  document.getElementById("taskDetails");

const submitButton =
  document.getElementById("submitButton");

const proofInfo =
  document.getElementById("proofInfo");

const MAX_PROOF_SIZE = 500 * 1024;
const MAX_IMAGE_DIMENSION = 1800;


const params =
  new URLSearchParams(window.location.search);

const taskId =
  params.get("id");


async function loadTask() {

  if (!taskId) {

    message.textContent =
      "Task not found.";

    return;
  }

  try {

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {

      window.location.href = "login.html";
      return;
    }

    const { data: task, error } =
      await supabaseClient
        .from("tasks")
        .select("*")
        .eq("id", taskId)
        .eq("status", "active")
        .single();

    if (error) {
      throw error;
    }

    document.getElementById("taskTitle")
      .textContent = task.title;

    document.getElementById("taskPlatform")
      .textContent = task.platform || "Not specified";

    document.getElementById("taskReward")
      .textContent =
        Number(task.reward).toLocaleString();

    document.getElementById("taskDescription")
      .textContent = task.description;

    document.getElementById("taskLink")
      .href = task.task_url;

    message.textContent = "";
    taskDetails.style.display = "block";

  } catch (error) {

    console.error(error);

    message.textContent =
      "Unable to load task: " + error.message;
  }

}


function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const image = new Image();

    image.onload = () => {
      URL.revokeObjectURL(url);
      resolve(image);
    };

    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("Unable to read the screenshot."));
    };

    image.src = url;
  });
}


function canvasBlob(canvas, type, quality) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error("Unable to compress the screenshot."));
    }, type, quality);
  });
}


async function compressProof(file) {

  if (!file.type.startsWith("image/")) {
    throw new Error("Please upload an image screenshot.");
  }

  const image = await loadImage(file);

  let width = image.naturalWidth || image.width;
  let height = image.naturalHeight || image.height;

  const scale = Math.min(
    1,
    MAX_IMAGE_DIMENSION / Math.max(width, height)
  );

  width = Math.max(1, Math.round(width * scale));
  height = Math.max(1, Math.round(height * scale));

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(image, 0, 0, width, height);

  const types = ["image/webp", "image/jpeg"];
  const qualities = [0.82, 0.72, 0.62, 0.52, 0.42, 0.32];

  for (const type of types) {
    for (const quality of qualities) {
      const blob = await canvasBlob(canvas, type, quality);

      if (blob.size <= MAX_PROOF_SIZE) {
        const extension = type === "image/webp" ? "webp" : "jpg";
        return new File(
          [blob],
          `proof-${Date.now()}.${extension}`,
          { type }
        );
      }
    }
  }

  throw new Error("This screenshot is too large. Please use a smaller screenshot.");
}


submitButton.addEventListener("click", async () => {

  const file =
    document.getElementById("proofFile").files[0];

  if (!file) {

    message.textContent =
      "Please upload a screenshot first.";

    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "Preparing proof...";

  try {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

      window.location.href = "login.html";
      return;
    }

    const compressedFile = await compressProof(file);

    proofInfo.textContent =
      `Proof compressed to ${Math.round(compressedFile.size / 1024)} KB.`;

    submitButton.textContent = "Submitting...";

    const fileName =
      `${user.id}/${taskId}-${Date.now()}-${compressedFile.name}`;

    const { error: uploadError } =
      await supabaseClient.storage
        .from("task-proofs")
        .upload(fileName, compressedFile, {
          contentType: compressedFile.type,
          upsert: false
        });

    if (uploadError) {
      throw uploadError;
    }

    const {
      data: publicUrlData
    } =
      supabaseClient.storage
        .from("task-proofs")
        .getPublicUrl(fileName);

    const proofUrl =
      publicUrlData.publicUrl;

    const { error: submissionError } =
      await supabaseClient
        .from("task_submissions")
        .insert({
          task_id: taskId,
          worker_id: user.id,
          proof_url: proofUrl
        });

    if (submissionError) {
      throw submissionError;
    }

    message.textContent =
      "Proof submitted successfully. Waiting for review.";

    submitButton.disabled = true;
    submitButton.textContent = "Proof Submitted";

  } catch (error) {

    console.error(error);

    message.textContent =
      error.message || "Unable to submit proof.";

    submitButton.disabled = false;
    submitButton.textContent = "Submit Proof";
  }

});

loadTask();

</script>

</body>
</html>

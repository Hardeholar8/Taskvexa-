<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a10"><title>TaskVexa — Promoter Login</title><link rel="stylesheet" href="/filora-theme.css?v=1"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#18264a 0,#0b1020 38%,#05070d 78%,#030409 100%);color:#f8fafc;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}.page{width:100%;max-width:470px}.brand{text-align:center;margin-bottom:22px}.logo{width:68px;height:68px;margin:0 auto 13px;border-radius:21px;background:linear-gradient(135deg,#7c5cff,#39d9c5);display:grid;place-items:center;font-size:34px;font-weight:900;color:#071019;box-shadow:0 16px 45px #0008}.brand h1{margin:0;font-size:29px}.brand p{margin:7px 0 0;color:#9ca9bf}.card{background:linear-gradient(180deg,#111927,#0b111c);border:1px solid #26344a;border-radius:24px;padding:28px 24px;box-shadow:0 28px 80px #0009}.badge{text-align:center;color:#a99aff;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px}.card h2{margin:0 0 7px;font-size:25px;text-align:center}.intro{text-align:center;color:#9ca9bf;font-size:14px;line-height:1.5;margin:0 0 23px}.field{margin-bottom:16px}.field label{display:block;margin-bottom:8px;font-size:14px;font-weight:700}.field input{width:100%;height:53px;border:1px solid #2b3a51;border-radius:13px;background:#080e18;color:#fff;padding:0 14px;font-size:16px;outline:none}.field input:focus{border-color:#7c6cff;box-shadow:0 0 0 3px #7c6cff20}.password{position:relative}.password button{position:absolute;right:11px;top:50%;transform:translateY(-50%);border:0;background:none;color:#8e9ab0;font-weight:700}.message{min-height:22px;text-align:center;color:#f87171;font-size:14px;margin-bottom:8px}.btn{width:100%;height:53px;border:0;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#27d5bf);color:#061018;font-weight:900;font-size:16px}.btn:disabled{opacity:.6}.links{text-align:center;margin-top:19px;color:#8996aa;font-size:14px}.links a{color:#b0a3ff;text-decoration:none;font-weight:800}.legal{text-align:center;border-top:1px solid #1d2939;margin-top:21px;padding-top:17px;color:#66748a;font-size:12px}.legal a{color:#8f9bb0;text-decoration:none;margin:0 6px}</style>
</head><body><main class="page"><header class="brand"><div class="logo">P</div><h1>TaskVexa</h1><p>Promoter workspace</p></header><section class="card"><div class="badge">Promoter Account</div><h2>Sign in</h2><p class="intro">Manage campaigns, fund your wallet, and review Worker submissions.</p><div id="message" class="message"></div><form id="loginForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="Enter your email"></div><div class="field"><label for="password">Password</label><div class="password"><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button type="button" id="toggle">Show</button></div></div><button class="btn" id="submit" type="submit">Login as Promoter</button></form><div class="links">New Promoter? <a href="promoter-register.html">Create Promoter Account</a><br><br><a href="login.html">Worker Login</a></div><footer class="legal"><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="support.html">Support</a></footer></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/promoter-auth.js?v=20260919f"></script><script>const form=document.getElementById('loginForm'),msg=document.getElementById('message'),btn=document.getElementById('submit'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password'),toggle=document.getElementById('toggle');const params=new URLSearchParams(location.search);const priorError=params.get('error');if(priorError)msg.textContent=priorError;form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Signing in...';msg.textContent='Checking Promoter account...';try{const email=emailInput.value.trim().toLowerCase();const password=passwordInput.value;const {data,error}=await promoterSupabase.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.user)throw new Error('Login could not be completed.');const {data:sessionData,error:sessionError}=await promoterSupabase.auth.getSession();if(sessionError)throw sessionError;if(!sessionData?.session)throw new Error('Login session was not created.');const ctx=await window.getPromoterContextForLogin();if(ctx.error)throw ctx.error;msg.textContent='Login successful. Opening dashboard...';window.location.href='promoter-dashboard.html?v=20260919f';}catch(err){console.error('Promoter login error:',err);msg.textContent=err?.message||'Login failed. Please try again.';try{await promoterSupabase.auth.signOut()}catch(e){}btn.disabled=false;btn.textContent='Login as Promoter'}});toggle.addEventListener('click',()=>{const show=passwordInput.type==='password';passwordInput.type=show?'text':'password';toggle.textContent=show?'Hide':'Show'});</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa — Promoter Pricing</title><link rel="stylesheet" href="/admin-theme.css?v=2"><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script><style>body{margin:0;background:#070a10;color:#f4f7fb;font-family:Arial}.wrap{max-width:900px;margin:auto;padding:24px 15px 60px}.card{background:#101622;border:1px solid #202a3d;border-radius:16px;padding:16px;margin:12px 0}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:center}.muted{color:#98a4b8;font-size:12px}.input{width:100%;box-sizing:border-box;background:#0b111c;color:#fff;border:1px solid #26344a;border-radius:10px;padding:11px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#7c5cff;color:#fff;font-weight:800}.toggle{font-size:11px}.msg{min-height:20px;margin:10px 0;color:#20d6a1}.err{color:#ff8795}@media(max-width:650px){.row{grid-template-columns:1fr 1fr}.row .name{grid-column:1/-1}.row button{grid-column:1/-1}}</style></head><body><main class="wrap"><a href="admin.html" style="color:#b8adff;text-decoration:none">← Admin Dashboard</a><h1>Promoter Pricing & Controls</h1><p class="muted">Admin controls the Promoter price per Worker and the Worker reward. Promoters cannot change these values.</p><div id="message" class="msg"></div><section id="list"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const $=id=>document.getElementById(id),money=v=>'₦'+Number(v||0).toLocaleString('en-NG');async function init(){const{data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const{data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(String(p?.role||'').toLowerCase()!=='admin'){location.href='login.html';return}const{data,error}=await sb.from('promoter_task_types').select('id,name,description,promoter_price_per_worker,worker_reward,active,promoter_platforms(name)').order('name');if(error){$('message').textContent=error.message;$('message').className='msg err';return}$('list').innerHTML=(data||[]).map(t=>`<div class="card"><div class="row"><div class="name"><strong>${t.promoter_platforms?.name||'Platform'}</strong><div class="muted">${t.name}</div></div><input class="input price" data-id="${t.id}" value="${t.promoter_price_per_worker}" type="number" min="0" step="1" placeholder="Promoter price"><input class="input reward" data-id="${t.id}" value="${t.worker_reward}" type="number" min="0" step="1" placeholder="Worker reward"><button class="btn" data-save="${t.id}">Save</button></div><div class="muted toggle">${t.description||''} · ${t.active?'Active':'Disabled'}</div></div>`).join('')||'<div class="card">No Promoter task types configured.</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));}async function save(id){const price=Number(document.querySelector(`.price[data-id="${id}"]`).value),reward=Number(document.querySelector(`.reward[data-id="${id}"]`).value);$('message').textContent='Saving...';$('message').className='msg';const{error}=await sb.rpc('admin_update_promoter_task_type',{p_task_type_id:id,p_promoter_price:price,p_worker_reward:reward,p_active:true});if(error){$('message').textContent=error.message;$('message').className='msg err';return}$('message').textContent='Pricing updated successfully.';init()}init();</script></body></html>

name: Apply rebuilt promoter hub
on:
  push:
    paths:
      - 'promoter-hub-v2.html'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace promoter dashboard
        run: |
          cp promoter-hub-v2.html promoter-dashboard.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add promoter-dashboard.html
          git diff --cached --quiet || git commit -m 'Apply complete promoter hub rebuild'
          git push

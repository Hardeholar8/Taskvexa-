<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TaskVexa - Airtime</title></head><body><main style="max-width:820px;margin:auto;padding:20px;font-family:Arial"><h1>Buy Airtime</h1><label>Network</label><select id="network"><option value="mtn">MTN</option><option value="airtel">Airtel</option><option value="glo">Glo</option><option value="9mobile">9mobile</option></select><label>Phone number</label><input id="phone" inputmode="numeric" maxlength="11" autocomplete="tel"><label>Amount</label><input id="amount" type="number" min="50" max="50000"><button id="buy">Buy Airtime</button><div id="message"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://dxtlnrthlpdaobnbazny.supabase.co';const SUPABASE_KEY='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const phone=document.getElementById('phone'),amount=document.getElementById('amount'),network=document.getElementById('network'),message=document.getElementById('message'),buy=document.getElementById('buy');
buy.onclick=async()=>{const phoneValue=String(phone.value||'').replace(/\D/g,'');const amountValue=Number(amount.value);if(!/^0\d{10}$/.test(phoneValue)){message.textContent='Enter a valid 11-digit Nigerian phone number.';return}if(!Number.isFinite(amountValue)||amountValue<50||amountValue>50000){message.textContent='Enter an amount between ₦50 and ₦50,000.';return}buy.disabled=true;buy.textContent='Processing...';message.textContent='';try{const {data,error}=await sb.auth.getSession();if(error||!data.session)throw new Error('Your session has expired. Please log in again.');const payload={action:'purchase',network:network.value,phone:phoneValue,phone_number:phoneValue,amount:amountValue};const r=await fetch(SUPABASE_URL+'/functions/v1/airtime-service',{method:'POST',headers:{Authorization:'Bearer '+data.session.access_token,apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(payload)});const text=await r.text();let result;try{result=JSON.parse(text)}catch{result={message:text}}if(!r.ok||!result.success)throw new Error(result.message||'Airtime purchase failed.');message.textContent=result.message||'Airtime purchased successfully.'}catch(e){message.textContent=e.message||'Airtime purchase failed.'}finally{buy.disabled=false;buy.textContent='Buy Airtime'}};
</script></body></html>

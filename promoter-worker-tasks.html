<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Available Tasks</title><link rel="stylesheet" href="/filora-theme.css?v=9"><script src="/theme.js?v=12"></script><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 15px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:22px;font-weight:900}.btn{background:#151d2a;color:#fff;border:1px solid #293548;border-radius:10px;padding:9px 12px;text-decoration:none;font-size:12px;font-weight:800}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs a{flex:1;text-align:center;padding:12px;border-radius:12px;background:#111722;border:1px solid #202b3b;color:#94a3b8;text-decoration:none;font-size:12px;font-weight:800}.tabs a.active{color:#fff;border-color:#7048ff;background:#18142d}.message{font-size:13px;margin:10px 0 16px}.ok{color:#4ade80}.err{color:#f87171}.card{background:#111722;border:1px solid #202b3b;border-radius:18px;padding:18px;margin-bottom:13px}.title{font-size:18px;font-weight:900;margin-bottom:7px}.desc{color:#a4b0c0;line-height:1.55;font-size:13px;white-space:pre-wrap;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.box{background:#0d131e;border:1px solid #1d2838;border-radius:11px;padding:11px}.box small{display:block;color:#64748b;font-size:9px;text-transform:uppercase;margin-bottom:5px}.slots{color:#4ade80;font-weight:900}.open{display:inline-block;background:#f8fafc;color:#090d14;border:0;border-radius:10px;padding:11px 14px;font-weight:800;text-decoration:none}.submit{background:#7048ff;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:800}.empty{background:#111722;border:1px solid #202b3b;border-radius:17px;padding:35px 20px;text-align:center;color:#7f8da3}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;padding:18px;z-index:30}.modal.show{display:flex}.modalbox{width:100%;max-width:470px;background:#111722;border:1px solid #293548;border-radius:18px;padding:20px}.modalbox input,.modalbox textarea{width:100%;padding:12px;background:#090e16;border:1px solid #293548;border-radius:10px;color:#fff;margin:7px 0 14px}.modalbox textarea{min-height:80px}.row{display:flex;gap:8px}.row>*{flex:1}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div class="logo">TaskVexa</div><a class="btn" href="dashboard.html">← Dashboard</a></header><nav class="tabs"><a class="active" href="promoter-worker-tasks.html">Promoter Tasks</a><a href="worker-tasks.html">Platform Tasks</a></nav><div id="message" class="message">Loading promoter tasks...</div><section id="list"></section></main><div id="modal" class="modal"><div class="modalbox"><h2>Submit Proof</h2><p style="color:#94a3b8;font-size:12px">Upload your screenshot. Submission slots are consumed when proof is successfully submitted.</p><form id="form"><input id="file" type="file" accept="image/*" required><textarea id="note" placeholder="Optional note"></textarea><div id="modalmsg" class="message"></div><div class="row"><button class="submit" type="submit">Submit Proof</button><button class="btn" type="button" id="cancel">Cancel</button></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let user,selected;async function init(){const {data:{user:u},error}=await sb.auth.getUser();if(error||!u){location.href='login.html';return}user=u;const {data:p,error:pe}=await sb.from('profiles').select('role,activation_status').eq('id',u.id).maybeSingle();if(pe)throw pe;if(String(p?.role||'').toLowerCase()!=='worker')throw new Error('Worker account required.');if(!['active','activated','approved','true'].includes(String(p?.activation_status||'').toLowerCase()))throw new Error('Your account must be activated before you can access tasks.');load()}async function load(){const {data,error}=await sb.rpc('get_available_promoter_campaigns');if(error)throw error;const rows=data||[];$('message').textContent=rows.length?'Promoter campaigns available now.':'No promoter campaigns are available right now.';$('message').className='message '+(rows.length?'ok':'');$('list').innerHTML=rows.length?rows.map(c=>'<article class="card"><div class="title">'+esc(c.title)+'</div><div class="desc">'+esc(c.description||'No instructions provided.')+'</div><div class="grid"><div class="box"><small>Platform</small><b>'+esc(c.platform||'-')+'</b></div><div class="box"><small>Task</small><b>'+esc(c.task_type||'-')+'</b></div><div class="box"><small>Slots Left</small><b class="slots">'+Number(c.slots_remaining||0)+' / '+Number(c.slots_total||0)+'</b></div><div class="box"><small>Proof</small><b>Screenshot</b></div></div><a class="open" href="'+esc(c.task_url||'#')+'" target="_blank" rel="noopener">Open Task</a> <button class="submit" data-id="'+esc(c.id)+'">Submit Proof</button></article>').join(''):'<div class="empty">No promoter tasks available. Check again later.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=rows.find(x=>String(x.id)===String(b.dataset.id));$('modalmsg').textContent='';$('form').reset();$('modal').classList.add('show')})}async function submit(e){e.preventDefault();if(!selected||!$('file').files[0])return;const b=e.submitter;b.disabled=true;b.textContent='Submitting...';try{const f=$('file').files[0];const path='promoter/'+user.id+'/'+selected.id+'-'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error:ue}=await sb.storage.from('task-proofs').upload(path,f,{upsert:false,contentType:f.type});if(ue)throw ue;const {data,error}=await sb.rpc('submit_promoter_campaign_proof',{p_campaign_id:selected.id,p_proof_url:path,p_proof_text:$('note').value.trim()});if(error)throw error;$('modal').classList.remove('show');await load()}catch(err){$('modalmsg').textContent=err.message||'Submission failed.';$('modalmsg').className='message err'}finally{b.disabled=false;b.textContent='Submit Proof'}}$('form').onsubmit=submit;$('cancel').onclick=()=>$('modal').classList.remove('show');init().catch(e=>{$('message').textContent=e.message||'Unable to load promoter tasks.';$('message').className='message err'});</script></body></html>

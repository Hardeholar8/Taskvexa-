<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa — Fund Wallet</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070a10;color:#f4f7fb;font-family:Arial}.wrap{max-width:520px;margin:auto;padding:25px 16px}.card{background:#101622;border:1px solid #202a3d;border-radius:17px;padding:18px}label{display:block;color:#98a4b8;font-size:12px;margin-bottom:8px}input{width:100%;box-sizing:border-box;background:#0b111c;border:1px solid #202a3d;color:#fff;border-radius:12px;padding:14px;font-size:16px}.btn{width:100%;margin-top:14px;border:0;background:#7c5cff;color:#fff;padding:14px;border-radius:13px;font-weight:800}.msg{font-size:13px;margin-top:12px;color:#ff8795}.muted{color:#98a4b8;font-size:12px;line-height:1.5}</style></head><body><main class="wrap"><div class="card"><h2>Fund Promoter Wallet</h2><p class="muted">Enter the amount you want to add. You will be taken to the secure payment page.</p><label>Amount (₦)</label><input id="amount" type="number" min="100" step="100" placeholder="e.g. 5000"><button id="pay" class="btn">Continue to Payment</button><div id="msg" class="msg"></div></div></main><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');pay.onclick=async()=>{msg.textContent='';const amount=Math.round(Number(document.getElementById('amount').value));if(!Number.isFinite(amount)||amount<100){msg.textContent='Enter a valid amount of at least ₦100.';return}const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}pay.disabled=true;pay.textContent='Starting payment...';try{const r=await fetch('/api/flutterwave/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:user.email,user_id:user.id,amount,purpose:'promoter_wallet_funding',title:'TaskVexa Promoter Wallet',description:'Promoter wallet funding'})});const d=await r.json();if(!r.ok||!d.payment_url)throw new Error(d.error||'Unable to start payment');location.href=d.payment_url}catch(e){msg.textContent=e.message||'Unable to start payment.';pay.disabled=false;pay.textContent='Continue to Payment'}}</script></body></html>

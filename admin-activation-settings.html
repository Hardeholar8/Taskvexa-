<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa • Activation Settings</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script><style>*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#111827;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:auto;padding:24px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.back{display:inline-block;text-decoration:none;color:#4f46c8;font-weight:800}.card{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(16,24,40,.06)}h1{font-size:24px;margin:0 0 7px}.muted{color:#667085;font-size:13px;line-height:1.5}.label{display:block;font-weight:800;font-size:13px;margin:22px 0 8px}.field{width:100%;padding:14px;border:1px solid #d0d5dd;border-radius:11px;font-size:18px;outline:none}.field:focus{border-color:#6366f1}.btn{margin-top:14px;width:100%;border:0;border-radius:11px;padding:14px;background:#4f46c8;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.status{margin-top:14px;padding:12px;border-radius:10px;font-size:13px;display:none}.ok{display:block;background:#ecfdf3;color:#027a48}.err{display:block;background:#fef3f2;color:#b42318}.current{margin-top:18px;padding:14px;border-radius:12px;background:#f5f7ff}.current b{font-size:20px}@media(max-width:480px){.wrap{padding:18px 13px}.card{padding:18px}h1{font-size:22px}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="admin.html">← Admin Dashboard</a><strong>TaskVexa</strong></div><section class="card"><h1>⚡ Worker Activation</h1><p class="muted">Change the single activation amount used by workers. The new amount will be used for new activation payments.</p><div class="current">Current activation amount: <b id="current">Loading…</b></div><label class="label" for="amount">Activation amount</label><input id="amount" class="field" type="number" min="0" step="1" inputmode="numeric" placeholder="Enter amount"><button id="save" class="btn">Save Activation Amount</button><div id="status" class="status"></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const amount=document.getElementById('amount'),current=document.getElementById('current'),status=document.getElementById('status');async function checkAdmin(){const{data:{user},error}=await sb.auth.getUser();if(error||!user){location.href='login.html';return null}const{data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(String(p?.role||'').toLowerCase()!=='admin'){location.href='dashboard.html';return null}return user}async function load(){if(!await checkAdmin())return;const{data,error}=await sb.from('worker_activation_settings').select('id,activation_amount').limit(1).maybeSingle();if(error){current.textContent='Unable to load';show(error.message,false);return}if(!data?.id){current.textContent='Not configured';show('No activation settings row exists.',false);return}const v=Number(data.activation_amount??0);current.textContent='₦'+v.toLocaleString('en-NG');amount.value=v;amount.dataset.id=data.id}function show(msg,ok){status.textContent=msg;status.className='status '+(ok?'ok':'err')}document.getElementById('save').onclick=async()=>{const value=Number(amount.value),id=amount.dataset.id;if(!Number.isFinite(value)||value<0){show('Enter a valid activation amount.',false);return}if(!id){show('Activation settings record not found. Refresh the page.',false);return}const user=await checkAdmin();if(!user)return;const{error}=await sb.from('worker_activation_settings').update({activation_amount:value,updated_at:new Date().toISOString()}).eq('id',id);if(error){show(error.message,false);return}current.textContent='₦'+value.toLocaleString('en-NG');show('Activation amount saved successfully ✓',true)};load();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Worker Activations</title><style>body{margin:0;background:#f7f9fc;color:#101828;font-family:Inter,Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:28px 16px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:17px;padding:18px;margin:12px 0;box-shadow:0 8px 28px rgba(16,24,40,.06)}.muted{color:#667085;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:10px;border:0;font-weight:700;cursor:pointer}.approve{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}.reject{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.pending{color:#b45309}.approved{color:#15803d}.rejected{color:#dc2626}.error{color:#dc2626}.back{color:#5146c8;text-decoration:none;font-weight:700}h1{color:#101828;letter-spacing:-.5px}.proof{color:#5146c8;word-break:break-all}</style></head><body><main class="wrap"><a class="back" href="admin.html">← Admin Dashboard</a><h1>Worker Activations</h1><p class="muted">Review worker activation payment submissions.</p><div id="msg" class="muted">Loading...</div><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){try{const {data:u,error:ue}=await sb.auth.getUser();if(ue||!u.user){location.href='login.html';return}const {data:p,error:pe}=await sb.from('profiles').select('role').eq('id',u.user.id).maybeSingle();if(pe)throw pe;if(String(p?.role||'').toLowerCase()!=='admin')throw new Error('Admin access required.');const {data,error}=await sb.rpc('admin_get_worker_activation_requests');if(error)throw error;const rows=data||[];$('msg').textContent=rows.length?'':'No activation requests.';$('list').innerHTML=rows.map(r=>`<div class="card"><strong>${esc(r.worker_email||r.worker_id)}</strong><p class="muted">₦${Number(r.amount||0).toLocaleString('en-NG')} · ${new Date(r.created_at).toLocaleString('en-NG')}</p><p>Reference: ${esc(r.payment_reference||'-')}</p><p>Proof: ${r.proof_url?`<a class="proof" href="${esc(r.proof_url)}" target="_blank" rel="noopener">View proof</a>`:'-'}</p><p>Status: <span class="${esc(r.status)}">${esc(r.status)}</span></p>${r.status==='pending'?`<div class="row"><button class="btn approve" onclick="review('${r.id}','approved')">Approve</button><button class="btn reject" onclick="review('${r.id}','rejected')">Reject</button></div>`:''}</div>`).join('')}catch(e){$('msg').textContent=e.message;$('msg').className='error'}}async function review(id,status){try{const note=status==='rejected'?prompt('Reason for rejection (optional):')||null:null;const {error}=await sb.rpc('admin_review_worker_activation',{p_request_id:id,p_status:status,p_note:note});if(error)throw error;await load()}catch(e){alert(e.message||'Review failed')}}load();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa • Platform Settings</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script><style>body{padding-bottom:50px}.wrap{max-width:760px;margin:auto;padding:24px 16px}.card{background:#0d1422;border:1px solid #1d293d;border-radius:18px;padding:20px;margin:0 0 16px}.field{margin:14px 0}.field label{display:block;color:#cbd5e1;font-size:12px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:13px;background:#090e18;border:1px solid #293548;border-radius:11px;color:#fff;outline:none;font-size:14px}.btn{border:0;border-radius:11px;padding:13px 18px;background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;font-weight:900;cursor:pointer}.muted{color:#94a3b8;font-size:12px;line-height:1.5}.msg{font-size:12px;margin-top:10px}.ok{color:#4ade80}.err{color:#f87171}</style></head><body><main class="wrap"><h1>Platform Settings</h1><p class="muted">Admin-only controls for TaskVexa platform settings.</p><section class="card"><h2>⚡ Worker Activation</h2><p class="muted">Set the worker activation amount.</p><div class="field"><label>Activation Amount</label><input id="activationAmount" type="number" min="0" step="0.01"></div><button id="saveActivation" class="btn">Save Activation</button><div id="am" class="msg"></div></section><section class="card"><h2>💳 Withdrawal Settings</h2><p class="muted">Set the minimum amount a worker can request for withdrawal. This value is used by the withdrawal system.</p><div class="field"><label>Minimum Withdrawal</label><input id="minimumWithdrawal" type="number" min="0" step="0.01" placeholder="e.g. 50"></div><button id="saveWithdrawal" class="btn">Save Withdrawal Settings</button><div id="wm" class="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const activationInput=document.getElementById('activationAmount'),withdrawalInput=document.getElementById('minimumWithdrawal'),am=document.getElementById('am'),wm=document.getElementById('wm');let activationId=null;function setMsg(el,text,ok){el.textContent=text;el.className='msg '+(ok?'ok':'err')}async function init(){const u=await sb.auth.getUser();if(u.error||!u.data.user)return location.href='login.html';const p=await sb.from('profiles').select('role').eq('id',u.data.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()!=='admin')return location.href='dashboard.html';const [a,w]=await Promise.all([sb.from('worker_activation_settings').select('id,activation_amount').limit(1).maybeSingle(),sb.from('platform_settings').select('value').eq('key','withdrawal').maybeSingle()]);if(a.error){setMsg(am,a.error.message,false)}else if(!a.data){setMsg(am,'Activation settings row not found.',false)}else{activationId=a.data.id;activationInput.value=a.data.activation_amount??''}if(w.error){setMsg(wm,w.error.message,false)}else{const v=w.data?.value||{};withdrawalInput.value=v.minimum??''}}async function saveActivation(){const value=Number(activationInput.value);if(!Number.isFinite(value)||value<0)return setMsg(am,'Enter a valid activation amount.',false);if(!activationId)return setMsg(am,'Settings row not loaded. Refresh and try again.',false);const r=await sb.from('worker_activation_settings').update({activation_amount:value,updated_at:new Date().toISOString()}).eq('id',activationId).select('id,activation_amount').maybeSingle();if(r.error)return setMsg(am,r.error.message,false);setMsg(am,'Activation amount saved ✓',true)}async function saveWithdrawal(){const value=Number(withdrawalInput.value);if(!Number.isFinite(value)||value<0)return setMsg(wm,'Enter a valid minimum withdrawal amount.',false);const current=await sb.from('platform_settings').select('value').eq('key','withdrawal').maybeSingle();if(current.error)return setMsg(wm,current.error.message,false);const oldValue=current.data?.value||{};const next={...oldValue,minimum:value};const r=await sb.from('platform_settings').update({value:next,updated_at:new Date().toISOString()}).eq('key','withdrawal').select('key,value').maybeSingle();if(r.error)return setMsg(wm,r.error.message,false);withdrawalInput.value=r.data?.value?.minimum??value;setMsg(wm,'Minimum withdrawal saved ✓',true)}document.getElementById('saveActivation').onclick=saveActivation;document.getElementById('saveWithdrawal').onclick=saveWithdrawal;init()</script></body></html>

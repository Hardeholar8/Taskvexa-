<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Data History</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.top{height:66px;border-bottom:1px solid #1d293d;display:flex;align-items:center;gap:16px;padding:0 18px}.back{color:#c4b5fd;text-decoration:none}.brand{font-size:21px;font-weight:900}.brand span{color:#a78bfa}.wrap{max-width:950px;margin:auto;padding:24px 15px 60px}.card,.item{background:#0d1422;border:1px solid #1d293d;border-radius:15px}.card{padding:18px;margin-bottom:14px}.h{margin:0 0 5px;font-size:21px}.muted{color:#94a3b8;font-size:12px}.item{padding:14px;margin:9px 0;display:flex;justify-content:space-between;gap:15px}.item strong{font-size:13px}.item small{display:block;color:#94a3b8;margin-top:5px;line-height:1.5}.right{text-align:right;white-space:nowrap}.amount{font-weight:800}.status{display:inline-block;margin-top:6px;padding:5px 8px;border-radius:8px;background:#192234;font-size:10px;text-transform:capitalize}.delivered{color:#86efac}.failed,.reversed{color:#fca5a5}.pending{color:#fcd34d}@media(max-width:520px){.item{display:block}.right{text-align:left;margin-top:9px}}</style></head><body><header class="top"><a class="back" href="dashboard.html">← Dashboard</a><div class="brand">Task<span>Vexa</span></div></header><main class="wrap"><section class="card"><h1 class="h">Data History</h1><p class="muted">Your recent Data purchases and their current status.</p></section><section id="list"><div class="muted">Loading...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const s=await sb.auth.getSession();if(!s.data?.session){location.href='login.html';return}const r=await sb.from('data_orders').select('id,network,phone,data_amount,amount,status,request_id,provider_transaction_id,created_at').eq('user_id',s.data.session.user.id).order('created_at',{ascending:false}).limit(50);if(r.error){$('list').innerHTML='<div class="muted">Unable to load Data history.</div>';return}const rows=r.data||[];$('list').innerHTML=rows.length?rows.map(x=>`<article class="item"><div><strong>${esc(x.network.toUpperCase())} · ${esc(x.data_amount)}</strong><small>${esc(x.phone)}<br>${new Date(x.created_at).toLocaleString('en-NG')}<br>Reference: ${esc(x.request_id)}</small></div><div class="right"><div class="amount">₦${Number(x.amount).toLocaleString('en-NG',{minimumFractionDigits:2})}</div><span class="status ${esc(x.status)}">${esc(x.status)}</span></div></article>`).join(''):'<div class="muted">No Data purchases yet.</div>'}load();</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskVexa - Forgot Password</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main>
  <h1>Forgot Password</h1>

  <div id="message"></div>

  <form id="forgotForm">

    <label for="email">Email</label>

    <input
      type="email"
      id="email"
      autocomplete="email"
      required
    >

    <button type="submit" id="forgotButton">
      Send Reset Email
    </button>

  </form>

  <p>
    <a href="login.html">Back to Login</a>
  </p>
</main>

<script>
const FUNCTION_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co/functions/v1/hyper-service";

const form = document.getElementById("forgotForm");
const button = document.getElementById("forgotButton");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  const email = document
    .getElementById("email")
    .value
    .trim()
    .toLowerCase();

  button.disabled = true;
  button.textContent = "Sending...";
  message.textContent = "";

  try {

    const response = await fetch(FUNCTION_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        email: email
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || "Unable to send reset email."
      );
    }

    message.textContent =
      "Reset email sent. Please check your Gmail inbox and spam folder.";

  } catch (error) {

    message.textContent =
      "Error: " + error.message;

  } finally {

    button.disabled = false;
    button.textContent = "Send Reset Email";

  }

});
</script>

</body>
</html>

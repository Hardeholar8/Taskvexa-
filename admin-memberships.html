<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>TaskVexa • Membership Settings</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=12"></script><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px 15px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.back{color:#a98cff;text-decoration:none;font-size:11px;font-weight:900}.intro{color:#94a3b8;font-size:11px;line-height:1.5}.grid{display:grid;gap:12px;margin-top:16px}.card{background:#101a2c;border:1px solid #26344d;border-radius:19px;padding:17px}.name{font-size:19px;font-weight:900}.label{display:block;color:#94a3b8;font-size:9px;font-weight:800;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.8px}.field{width:100%;padding:11px;border-radius:10px;border:1px solid #2b3b56;background:#0a1120;color:#fff;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:7px;margin-top:12px;color:#cbd5e1;font-size:10px}.btn{width:100%;margin-top:14px;padding:11px;border:0;border-radius:11px;background:#7048ff;color:#fff;font-size:11px;font-weight:900}.msg{margin-top:12px;color:#86efac;font-size:10px}.err{color:#fda4af}</style></head><body><main class="wrap"><div class="top"><a class="back" href="admin.html">← Admin Dashboard</a><strong>Membership Settings</strong></div><h1 style="margin:0 0 5px">Paid Membership Plans</h1><p class="intro">Manage the three TaskVexa subscription plans. Changes apply to new membership purchases; existing memberships keep their recorded plan period.</p><section id="plans" class="grid"><div class="intro">Loading…</div></section><div id="msg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function admin(){const a=await sb.auth.getUser();if(a.error||!a.data?.user){location.href='login.html';return null}const p=await sb.from('profiles').select('role').eq('id',a.data.user.id).maybeSingle();if(String(p.data?.role||'').toLowerCase()!=='admin'){location.href='dashboard.html';return null}return a.data.user}async function load(){if(!await admin())return;const r=await sb.from('membership_plans').select('*').order('price');if(r.error)throw r.error;$('plans').innerHTML=(r.data||[]).map(p=>'<article class="card"><div class="name">'+esc(p.name)+'</div><div class="row"><div><label class="label">Price (₦)</label><input class="field price" data-id="'+p.id+'" value="'+Number(p.price)+'" type="number" min="1"></div><div><label class="label">Duration (days)</label><input class="field days" data-id="'+p.id+'" value="'+Number(p.duration_days||30)+'" type="number" min="1"></div></div><label class="label">Features (one per line)</label><textarea class="field features" data-id="'+p.id+'" rows="5">'+esc((p.features||[]).join('\n'))+'</textarea><label class="check"><input class="active" data-id="'+p.id+'" type="checkbox" '+(p.is_active?'checked':'')+'> Plan available for new purchases</label><button class="btn" data-id="'+p.id+'">Save '+esc(p.name)+'</button></article>').join('');document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>save(b.dataset.id))}async function save(id){const price=Number(document.querySelector('.price[data-id="'+id+'"]').value),days=Number(document.querySelector('.days[data-id="'+id+'"]').value),features=document.querySelector('.features[data-id="'+id+'"]').value.split('\n').map(x=>x.trim()).filter(Boolean),is_active=document.querySelector('.active[data-id="'+id+'"]').checked;if(!Number.isFinite(price)||price<=0||!Number.isInteger(days)||days<=0){$('msg').textContent='Enter a valid price and duration.';$('msg').className='msg err';return}const r=await sb.from('membership_plans').update({price,duration_days:days,features,is_active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){$('msg').textContent=r.error.message;$('msg').className='msg err';return}$('msg').textContent='Membership plan saved successfully ✓';$('msg').className='msg';}load().catch(e=>{$('msg').textContent=e.message||'Unable to load membership settings.';$('msg').className='msg err'});</script></body></html>

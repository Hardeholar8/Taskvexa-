<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Wallet Funding</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script></head><body><main style="max-width:680px;margin:60px auto;padding:20px;text-align:center"><h1 id="title">Verifying wallet funding…</h1><p id="msg">Please wait while we confirm your payment.</p><a id="back" href="promoter-dashboard.html" style="display:none">Return to Promoter Dashboard</a></main><script>const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{try{const p=new URLSearchParams(location.search),tx=p.get('transaction_id'),txRef=p.get('tx_ref');if(!tx&&!txRef)throw new Error('Payment reference was not returned.');let j=null,last='Payment verification failed.';for(let attempt=0;attempt<4;attempt++){const r=await fetch('/api/flutterwave/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transaction_id:tx||undefined,tx_ref:txRef||undefined,purpose:'promoter_wallet_funding'})});j=await r.json().catch(()=>({}));if(r.ok&&j.verified&&j.wallet_funded)break;last=j.error||last;if(attempt<3)await sleep(2500)}if(!j||!j.verified||!j.wallet_funded)throw new Error(last);document.getElementById('title').textContent='Wallet Funded';document.getElementById('msg').textContent='Your Promoter wallet has been updated successfully.';document.getElementById('back').style.display='inline-block';}catch(e){console.error(e);document.getElementById('title').textContent='Funding Verification Failed';document.getElementById('msg').textContent=e.message||'Please contact TaskVexa support.';document.getElementById('back').style.display='inline-block'}})();</script></body></html>

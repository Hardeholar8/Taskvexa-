<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a10"><title>Promoter Submissions</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=9"></script><style>body{margin:0;background:#090b10;color:#f5f7fb;font-family:Arial,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 40px}.back{color:#9fb5ff;text-decoration:none}.muted{color:#8d98aa;font-size:13px}.card{background:#121722;border:1px solid #252d3b;border-radius:18px;padding:16px;margin:14px 0}.proof{margin-top:12px;padding:12px;background:#0b0f17;border-radius:12px;word-break:break-word}.actions{display:flex;gap:10px;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700}.approve{background:#21c77a;color:#06140d}.reject{background:#ef5260;color:#fff}.empty{text-align:center;padding:40px;color:#8d98aa}.status{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:9px;background:#1a2230;font-size:12px}</style></head><body><main><a class="back" href="/promoter-dashboard.html">← Dashboard</a><h2>Worker Submissions</h2><div class="muted">Review proofs submitted for your campaigns. Worker reward amounts are not shown here.</div><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const list=document.getElementById('list');async function load(){list.innerHTML='<div class="empty">Loading…</div>';const {data:{user}}=await db.auth.getUser();if(!user){location.href='/login.html';return}const {data:campaigns,error:e}=await db.from('promoter_campaigns').select('id,title,paid_worker_slots,submitted_worker_count,approved_worker_count,status').eq('promoter_id',user.id).order('created_at',{ascending:false});if(e){list.innerHTML='<div class="empty">Unable to load campaigns.</div>';return}const ids=(campaigns||[]).map(x=>x.id);if(!ids.length){list.innerHTML='<div class="empty">No campaigns yet.</div>';return}const {data:slots,error:s}=await db.from('promoter_campaign_worker_slots').select('id,campaign_id,worker_id,status,rejection_count,proof_url,proof_text,submitted_at,reviewed_at').in('campaign_id',ids).order('submitted_at',{ascending:false});if(s){list.innerHTML='<div class="empty">Unable to load submissions.</div>';return}const map=Object.fromEntries(campaigns.map(c=>[c.id,c]));if(!slots?.length){list.innerHTML='<div class="empty">No worker submissions yet.</div>';return}list.innerHTML=slots.map(x=>{const c=map[x.campaign_id]||{};const canReview=x.status==='submitted';let state=x.status==='approved'?'Approved':x.status==='rejected'?'Rejected':x.status==='submitted'?'Awaiting review':x.status;return `<section class="card"><b>${escapeHtml(c.title||'Campaign')}</b><div class="muted">Submitted ${c.submitted_worker_count||0}/${c.paid_worker_slots||0} · Approved ${c.approved_worker_count||0}</div><div class="status">${escapeHtml(state)}</div><div class="proof"><b>Proof</b><br>${x.proof_url?`<a href="${safeUrl(x.proof_url)}" target="_blank" rel="noopener">Open proof</a><br>`:''}${escapeHtml(x.proof_text||'No proof text')}</div><div class="muted" style="margin-top:8px">Worker ID: ${escapeHtml(x.worker_id||'')}</div>${canReview?`<div class="actions"><button class="btn approve" onclick="review('${x.id}','approve')">Approve</button><button class="btn reject" onclick="review('${x.id}','reject')">Reject</button></div>`:''}</section>`}).join('')}async function review(id,decision){if(!confirm(decision==='approve'?'Approve this submission? The Worker reward will be credited once.':'Reject this submission? This will not return a campaign slot.'))return;const {error}=await db.rpc('review_promoter_campaign_slot',{p_slot_id:id,p_decision:decision,p_note:null});if(error){alert(error.message);return}await load()}function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function safeUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}load();</script></body></html>

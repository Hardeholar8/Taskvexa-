<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><script src="/theme.js?v=6"></script><link rel="stylesheet" href="/theme-pages.css?v=1"><title>TaskVexa - Data Plans</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.top{height:68px;border-bottom:1px solid #1d293d;display:flex;align-items:center;gap:14px;padding:0 18px}.back{color:#c4b5fd;text-decoration:none;font-size:14px}.brand{font-size:22px;font-weight:800}.brand span{color:#a78bfa}.wrap{max-width:760px;margin:0 auto;padding:24px 16px 70px}.card{background:#0d1422;border:1px solid #1d293d;border-radius:18px;padding:20px}.title{font-size:23px;margin:0 0 6px}.muted{color:#94a3b8;font-size:12px}.networks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.net{border:1px solid #29364b;background:#111a2b;color:#dbe4f0;border-radius:11px;padding:11px 6px;font-weight:800;cursor:pointer}.net.active{background:#241641;border-color:#7c3aed;color:#fff}.plan-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}.plan{border:1px solid #29364b;background:#111a2b;color:#fff;border-radius:12px;padding:15px;text-align:left;cursor:pointer}.plan:hover{border-color:#7c3aed}.plan b{display:block;font-size:14px}.plan small{display:block;color:#94a3b8;margin-top:6px;font-size:11px}.price{display:block;color:#c4b5fd;font-size:15px;font-weight:900;margin-top:12px}.buy{margin-top:12px;width:100%;border:0;border-radius:10px;padding:11px;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer}.empty{color:#64748b;text-align:center;padding:22px;grid-column:1/-1;border:1px dashed #29364b;border-radius:12px;white-space:pre-wrap}.diag{margin-top:10px;text-align:left;color:#fca5a5;font-size:11px;background:#1b1014;border:1px solid #4c1d24;border-radius:10px;padding:10px;overflow-wrap:anywhere}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{width:min(420px,100%);background:#0d1422;border:1px solid #29364b;border-radius:18px;padding:20px}.modalbox h2{margin:0 0 8px}.modalbox label{display:block;font-size:12px;color:#94a3b8;margin:16px 0 6px}.modalbox input{width:100%;padding:13px;border-radius:10px;border:1px solid #29364b;background:#111a2b;color:#fff;font-size:15px;outline:none}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1;padding:12px;border-radius:10px;border:0;font-weight:800;cursor:pointer}.cancel{background:#1e293b;color:#fff}.confirm{background:#7c3aed;color:#fff}.msg{margin-top:12px;font-size:12px;min-height:18px}.success{color:#4ade80}.error{color:#f87171}.pending{color:#facc15}@media(max-width:520px){.networks{grid-template-columns:repeat(2,1fr)}.plan-grid{grid-template-columns:1fr}.wrap{padding-top:18px}}</style><link rel="stylesheet" href="/filora-theme.css?v=1"></head><body><header class="top"><a class="back" href="dashboard.html">← Dashboard</a><div class="brand">Task<span>Vexa</span></div></header><main class="wrap"><section class="card"><h1 class="title">Buy Data</h1><p class="muted">Choose a network, select a data bundle and enter the phone number that should receive it.</p><div class="networks"><button class="net active" data-net="MTN">MTN</button><button class="net" data-net="AIRTEL">Airtel</button><button class="net" data-net="GLO">Glo</button><button class="net" data-net="9MOBILE">9mobile</button></div><div id="plans" class="plan-grid"><div class="empty">Loading available plans...</div></div></section></main><div id="modal" class="modal"><div class="modalbox"><h2 id="modalTitle">Buy Data</h2><div id="modalPrice" class="muted"></div><label for="phone">Phone number</label><input id="phone" inputmode="numeric" maxlength="11" placeholder="08012345678"><div id="msg" class="msg"></div><div class="actions"><button class="cancel" id="cancel">Cancel</button><button class="confirm" id="confirm">Buy Data</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const box=document.getElementById('plans'),modal=document.getElementById('modal'),phone=document.getElementById('phone'),msg=document.getElementById('msg');let network='MTN',selected=null;const money=v=>'₦'+Number(v||0).toLocaleString('en-NG');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function setMsg(t,c=''){msg.textContent=t;msg.className='msg '+c}async function invoke(fn,body){const r=await sb.functions.invoke(fn,{body});if(r.error){let extra='';try{if(r.error.context&&typeof r.error.context.clone==='function'){const c=r.error.context.clone();extra=await c.text()}}catch{}return {data:r.data,error:r.error,extra}}return r}function diagText(d,e,extra){let parts=[];if(e?.message)parts.push('Function: '+e.message);if(extra)parts.push('Response: '+extra.slice(0,4000));if(d?.message)parts.push('Service: '+d.message);if(d?.detail)parts.push('Detail: '+d.detail);if(d?.database_error)parts.push('Database: '+d.database_error);if(d?.provider?.message)parts.push('Provider: '+d.provider.message);if(d?.provider?.code!==undefined)parts.push('Code: '+d.provider.code);if(d?.provider?.status!==undefined)parts.push('Provider status: '+d.provider.status);if(d?.provider?.error)parts.push('Provider error: '+(typeof d.provider.error==='string'?d.provider.error:JSON.stringify(d.provider.error)));return parts.join('\n')}document.querySelectorAll('.net').forEach(b=>b.onclick=()=>{document.querySelectorAll('.net').forEach(x=>x.classList.remove('active'));b.classList.add('active');network=b.dataset.net;loadPlans()});async function loadPlans(){box.innerHTML='<div class="empty">Loading available plans...</div>';try{const {data,error,extra}=await invoke('data-service',{action:'plans',network});if(error||!data?.success){const detail=diagText(data,error,extra)||'No diagnostic information was returned.';box.innerHTML='<div class="empty">Unable to load live data plans.<div class="diag">'+esc(detail)+'</div></div>';return}const rows=Array.isArray(data.data)?data.data:[];if(!rows.length){box.innerHTML='<div class="empty">No '+network+' data plans are currently available.</div>';return}box.innerHTML=rows.map(x=>{const id=x.id??x.plan_id??x.service_id??x.serviceId??'';const name=x.plan_name??x.name??x.plan??x.data_amount??'Data Plan';const size=x.data_amount??x.dataAmount??x.volume??'';const price=x.price??x.amount??x.selling_price??x.cost??0;return `<div class="plan" data-id="${esc(id)}" data-name="${esc(name)}" data-size="${esc(size)}" data-price="${esc(price)}"><b>${esc(name)}</b><small>${esc(size)}${x.validity?' · '+esc(x.validity):''}</small><span class="price">${money(price)}</span><button class="buy">Buy Data</button></div>`}).join('');box.querySelectorAll('.plan').forEach(el=>el.onclick=()=>openBuy(el))}catch(e){box.innerHTML='<div class="empty">Unable to load live data plans.<div class="diag">'+esc(e?.message||String(e))+'</div></div>'}}function openBuy(el){selected={id:el.dataset.id,name:el.dataset.name,size:el.dataset.size,price:Number(el.dataset.price)};document.getElementById('modalTitle').textContent=selected.name;document.getElementById('modalPrice').textContent=(selected.size?selected.size+' · ':'')+money(selected.price);phone.value='';setMsg('');modal.classList.add('show');phone.focus()}document.getElementById('cancel').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};document.getElementById('confirm').onclick=async()=>{if(!selected)return;const p=phone.value.replace(/\D/g,'');if(!/^0\d{10}$/.test(p)){setMsg('Enter a valid 11-digit Nigerian phone number.','error');return}setMsg('Processing data purchase...');document.getElementById('confirm').disabled=true;try{const {data,error,extra}=await invoke('data-service',{action:'purchase',plan_id:selected.id,network,phone:p});if(error||!data?.success){setMsg(data?.message||extra||error?.message||'Data purchase could not be completed.','error');return}if(data.status==='pending'){setMsg('Purchase is processing. Reference: '+(data.transaction_id||data.reference_id||'pending'),'pending');setTimeout(()=>modal.classList.remove('show'),2200);return}setMsg(data.message||'Data purchased successfully.','success');setTimeout(()=>modal.classList.remove('show'),1800)}catch(e){setMsg(e?.message||'Unexpected error. Please try again.','error')}finally{document.getElementById('confirm').disabled=false}};loadPlans();</script></body></html>

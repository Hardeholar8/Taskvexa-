<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Activate Account</title><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:560px;margin:auto;padding:28px 16px 60px}.card{background:#0d1422;border:1px solid #1d293d;border-radius:18px;padding:22px}.muted{color:#94a3b8;font-size:13px;line-height:1.6}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:12px;background:#090e18;border:1px solid #293548;border-radius:10px;color:#fff;box-sizing:border-box}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#fff;color:#090d14;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.msg{margin:12px 0;font-size:13px}.error{color:#f87171}.success{color:#4ade80}.back{display:inline-block;color:#c4b5fd;text-decoration:none;margin-bottom:18px}.amount{font-size:25px;font-weight:800;color:#c4b5fd}</style></head><body><main class="wrap"><a class="back" href="worker.html">← Dashboard</a><div class="card"><h1>Activate Your Worker Account</h1><p class="muted">Make the activation payment using the account details shown, then submit your payment reference and receipt proof for admin review.</p><div id="details" class="muted">Loading payment details...</div><h3>Account Activation</h3><div id="amount" class="amount">Loading...</div><form id="form"><div class="field"><label>Payment Reference</label><input id="ref" required placeholder="Enter payment reference"></div><div class="field"><label>Receipt / Screenshot URL</label><input id="proof" required placeholder="Paste receipt image URL"></div><div id="msg" class="msg"></div><button class="btn" id="submit">Submit Activation</button></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');let amount=0;const $=id=>document.getElementById(id),money=v=>'₦'+Number(v).toLocaleString('en-NG');async function init(){try{const {data,error}=await sb.auth.getUser();if(error||!data.user){location.href='login.html';return}const {data:p,error:pe}=await sb.from('profiles').select('role,activation_status').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(String(p?.role||'').toLowerCase()!=='worker')throw new Error('Worker account required.');if(String(p.activation_status||'').toLowerCase()==='active'){$('msg').textContent='Your account is already activated.';$('msg').className='msg success';$('submit').disabled=true;return}const {data:s,error:se}=await sb.from('worker_activation_settings').select('activation_amount').eq('id',true).single();if(se)throw se;amount=Number(s.activation_amount||0);if(amount<=0)throw new Error('Activation amount has not been configured by admin.');$('amount').textContent=money(amount);const {data:d}=await sb.from('promoter_payment_details').select('bank_name,account_name,account_number,instructions').limit(1).maybeSingle();if(d)$('details').innerHTML='<strong>Payment details</strong><br>Bank: '+d.bank_name+'<br>Account Name: '+d.account_name+'<br>Account Number: '+d.account_number+'<br>'+(d.instructions||'')}catch(e){$('msg').textContent=e.message||'Unable to load activation.';$('msg').className='msg error'}}$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('submit').textContent='Submitting...';try{const {error}=await sb.rpc('submit_worker_activation',{p_level:1,p_payment_reference:$('ref').value.trim(),p_proof_url:$('proof').value.trim(),p_amount:amount});if(error)throw error;$('msg').textContent='Activation request submitted. Please wait for admin approval.';$('msg').className='msg success';$('form').reset()}catch(e){$('msg').textContent=e.message||'Submission failed.';$('msg').className='msg error'}finally{$('submit').disabled=false;$('submit').textContent='Submit Activation'}};init();</script></body></html>

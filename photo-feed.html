<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>TaskVexa</title><link rel="stylesheet" href="/filora-theme.css?v=1"><style>body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px 14px 90px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{color:#a98cff;text-decoration:none;font-weight:800;font-size:12px}.brand{font-size:22px;font-weight:900}.card{background:linear-gradient(180deg,#121b2d,#0f1728);border:1px solid #26344d;border-radius:20px;padding:16px;margin-bottom:12px}.muted{color:#94a3b8;font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{display:inline-flex;padding:10px 14px;border-radius:12px;background:#7048ff;color:#fff;text-decoration:none;font-weight:800;font-size:11px;border:0}.empty{text-align:center;padding:35px 15px;color:#94a3b8}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div class="brand">Photo Feed</div><a class="back" href="dashboard.html">← Dashboard</a></div><p class="muted">View active photo campaigns and complete their verification requirements.</p><div id="list"><div class="empty">Loading photo campaigns...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');async function load(){const{data,error}=await sb.from('photo_campaigns').select('id,title,description,image_url,reward_per_view,target_views,verification_seconds').eq('status','active').order('created_at',{ascending:false});if(error)throw error;document.getElementById('list').innerHTML=(data||[]).map(x=>'<article class="card"><img src="'+x.image_url+'" alt="" style="width:100%;max-height:330px;object-fit:cover;border-radius:14px"><h3>'+x.title+'</h3><p class="muted">'+x.description+'</p><p class="muted">Reward: ₦'+Number(x.reward_per_view).toLocaleString()+' · Verification: '+x.verification_seconds+'s</p><button class="btn" onclick="alert(\'Photo verification flow is ready for connection to reward release.\')">View & Verify</button></article>').join('')||'<div class="empty">No active photo campaigns yet.</div>'}load().catch(()=>document.getElementById('list').innerHTML='<div class="empty">Unable to load photo campaigns.</div>');</script></body></html>

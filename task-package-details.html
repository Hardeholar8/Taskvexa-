<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa • Package</title><link rel="stylesheet" href="/filora-theme.css?v=1"><script src="/theme.js?v=12"></script><style>body{margin:0;background:#070b14;color:#fff;font-family:Arial}.wrap{max-width:720px;margin:auto;padding:16px 14px 80px}.back{color:#a78bfa;text-decoration:none;font-size:11px;font-weight:800}.card{background:#101a2c;border:1px solid #273650;border-radius:20px;padding:17px;margin-top:14px}.step{border:1px solid #26344d;border-radius:15px;padding:13px;margin-top:10px}.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:#7048ff;font-size:10px;font-weight:900}.muted{color:#94a3b8;font-size:10px;line-height:1.55}.btn{display:inline-block;padding:10px 13px;border-radius:10px;background:#7048ff;color:#fff;text-decoration:none;font-size:10px;font-weight:900;margin-top:8px}</style></head><body><main class="wrap"><a class="back" href="task-packages.html">← Packages</a><div id="app" class="card"><div class="muted">Loading package…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY'),app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id'),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}));async function load(){const a=await sb.auth.getUser();if(!a.data?.user){location.href='login.html';return}if(!id)throw Error('Package not found.');const [p,s,pr]=await Promise.all([sb.from('task_packages').select('id,title,description,reward,workers_needed').eq('id',id).eq('status','active').single(),sb.from('task_package_steps').select('id,step_number,title,description,task_url,proof_required').eq('package_id',id).order('step_number'),sb.from('task_package_progress').select('current_step,status').eq('package_id',id).eq('worker_id',a.data.user.id).maybeSingle()]);if(p.error)throw p.error;if(s.error)throw s.error;const current=pr.data?.current_step||0;app.innerHTML='<h1 style="margin:0;font-size:22px">'+esc(p.data.title)+'</h1><p class="muted">'+esc(p.data.description||'')+'</p><p class="muted">Package reward: '+Number(p.data.reward).toLocaleString('en-NG')+' credits · '+p.data.workers_needed+' slot(s)</p><div>'+s.data.map(x=>'<div class="step"><span class="num">'+x.step_number+'</span> <b>'+esc(x.title)+'</b><p class="muted">'+esc(x.description||'')+'</p>'+ (x.task_url?'<a class="btn" href="'+esc(x.task_url)+'" target="_blank" rel="noopener">Open task</a>':'')+(x.proof_required?'<div class="muted" style="margin-top:6px">Proof required for this step.</div>':'')+'</div>').join('')+'</div><button id="start" class="btn" style="border:0;cursor:pointer">'+(current?'Continue package':'Start package')+'</button>';document.getElementById('start').onclick=async()=>{const r=await sb.from('task_package_progress').upsert({package_id:id,worker_id:a.data.user.id,current_step:Math.max(current,1),status:'in_progress',updated_at:new Date().toISOString()},{onConflict:'package_id,worker_id'});alert(r.error?r.error.message:'Package progress saved. Complete each step and submit proof where required.')}}load().catch(e=>app.innerHTML='<div class="muted">'+esc(e.message||'Unable to load package.')+'</div>');</script></body></html>

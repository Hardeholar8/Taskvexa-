<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa • Photo Feed</title><link rel="stylesheet" href="/admin-theme.css?v=4"><link rel="stylesheet" href="/filora-theme.css?v=2"><style>body{margin:0;background:#070a10;color:#f8fafc;font-family:Inter,Arial,sans-serif}.main{margin-left:245px;min-height:100vh}.topbar{height:70px;border-bottom:1px solid #202b3b;display:flex;align-items:center;padding:0 30px}.content{max-width:900px;margin:auto;padding:30px}.card{background:#0e141e;border:1px solid #202b3b;border-radius:18px;padding:18px;margin-bottom:14px}.field{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #2b3b56;background:#0a1018;color:#fff;font-size:12px;margin-top:6px}.label{display:block;color:#94a3b8;font-size:9px;font-weight:800;margin-top:12px;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{margin-top:14px;padding:11px 15px;border:0;border-radius:11px;background:#7048ff;color:#fff;font-size:11px;font-weight:900}.msg{margin-top:12px;font-size:10px}.ok{color:#86efac}.err{color:#fda4af}.item{border-top:1px solid #202b3b;padding:15px 0}.item img{max-width:100%;max-height:180px;border-radius:12px;margin-top:8px}@media(max-width:800px){.main{margin-left:0}.content{padding:20px 14px}.grid{grid-template-columns:1fr}}</style></head><body><aside class="sidebar"><div class="logo"><h1>TaskVexa</h1><p>Admin Control Panel</p></div><div class="nav-title">Overview</div><a href="admin.html" class="nav-link">Dashboard</a><div class="nav-title">Management</div><a href="worker.html" class="nav-link">Workers</a><a href="admin-withdrawals.html" class="nav-link">Withdrawals</a><a href="admin-memberships.html" class="nav-link">Membership</a><a href="admin-photo-feed.html" class="nav-link active">Photo Feed</a><div class="nav-title">Settings</div><a href="settings.html" class="nav-link">Platform Settings</a></aside><div class="main"><div class="topbar">Photo Feed Management</div><main class="content"><section class="card"><h2 style="margin:0 0 6px">Post Photo Feed</h2><p style="color:#8290a5;font-size:11px">Create a photo feed and choose which membership can access it.</p><label class="label">Title</label><input id="title" class="field"><label class="label">Description</label><textarea id="description" class="field" rows="3"></textarea><label class="label">Image URL</label><input id="image_url" class="field" placeholder="https://..."><label class="label">Membership</label><select id="plan" class="field"></select><div class="grid"><div><label class="label">Reward per View (₦)</label><input id="reward" class="field" type="number" min="0" step="0.01"></div><div><label class="label">Target Views</label><input id="target" class="field" type="number" min="1" value="1"></div><div><label class="label">Verification Seconds</label><input id="seconds" class="field" type="number" min="1" value="10"></div></div><label class="label">Verification Question</label><input id="question" class="field"><label class="label">Verification Answer</label><input id="answer" class="field"><button class="btn" onclick="postFeed()">Post Photo Feed</button><div id="msg" class="msg"></div></section><section class="card"><h2 style="margin:0 0 10px">Posted Feeds</h2><div id="list">Loading…</div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function init(){const a=await sb.auth.getUser();if(a.error||!a.data?.user){location.href='login.html';return}const p=await sb.from('profiles').select('role').eq('id',a.data.user.id).maybeSingle();if(p.data?.role!=='admin'){location.href='login.html';return}const plans=await sb.from('membership_plans').select('id,name,photo_feed_enabled').eq('is_active',true).order('price');if(plans.error)throw plans.error;$('plan').innerHTML='<option value="">All photo-feed-enabled memberships</option>'+(plans.data||[]).filter(x=>x.photo_feed_enabled).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');await load()}async function load(){const r=await sb.from('photo_campaigns').select('*,membership_plans(name)').is('promoter_id',null).order('created_at',{ascending:false});if(r.error)throw r.error;$('list').innerHTML=(r.data||[]).map(x=>'<div class="item"><b>'+esc(x.title)+'</b><div style="color:#8290a5;font-size:10px">'+esc(x.membership_plans?.name||'All enabled memberships')+' · '+esc(x.status)+'</div>'+(x.image_url?'<img src="'+esc(x.image_url)+'">':'')+'</div>').join('')||'<div style="color:#8290a5;font-size:11px">No admin photo feeds yet.</div>'}async function postFeed(){const title=$('title').value.trim(),description=$('description').value.trim(),image_url=$('image_url').value.trim(),membership_plan_id=$('plan').value||null,reward=Number($('reward').value),target=Number($('target').value),seconds=Number($('seconds').value),question=$('question').value.trim(),answer=$('answer').value.trim();if(!title||!image_url||!Number.isFinite(reward)||reward<0||!Number.isInteger(target)||target<1||!Number.isInteger(seconds)||seconds<1)return msg('Fill the required fields correctly.',false);const r=await sb.rpc('admin_create_photo_campaign',{p_title:title,p_description:description,p_image_url:image_url,p_membership_plan_id:membership_plan_id,p_reward_per_view:reward,p_target_views:target,p_verification_seconds:seconds,p_verification_question:question,p_verification_answer:answer});if(r.error)return msg(r.error.message,false);msg('Photo feed posted ✓',true);['title','description','image_url','reward','question','answer'].forEach(id=>$(id).value='');await load()}function msg(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}init().catch(e=>msg(e.message||'Unable to load photo feed.',false));</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskVexa - Workers</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #070a10;
  color: #f8fafc;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
}

header {
  height: 70px;
  background: #0b0f17;
  border-bottom: 1px solid #202b3b;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

header h1 {
  margin: 0;
  font-size: 21px;
}

header a {
  color: #cbd5e1;
  text-decoration: none;
  font-size: 14px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 16px 50px;
}

.page-title h2 {
  margin: 0 0 7px;
  font-size: 27px;
}

.page-title p {
  color: #7f8da3;
  margin: 0 0 22px;
  font-size: 14px;
}

.refresh-button {
  margin-bottom: 20px;
  padding: 11px 17px;
  border: 1px solid #293548;
  border-radius: 10px;
  background: #151d2a;
  color: #fff;
  cursor: pointer;
  font-weight: 700;
}

.refresh-button:disabled {
  opacity: .6;
  cursor: wait;
}

.message {
  color: #7f8da3;
  font-size: 14px;
  margin-bottom: 18px;
}

.success {
  color: #4ade80;
}

.error {
  color: #f87171;
}

.worker-card {
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 17px;
  padding: 19px;
  margin-bottom: 14px;
}

.worker-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 15px;
}

.worker-name {
  font-size: 17px;
  font-weight: 800;
}

.worker-email {
  color: #7f8da3;
  font-size: 12px;
  margin-top: 5px;
  word-break: break-word;
}

.status {
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.status.active {
  background: #102d20;
  color: #4ade80;
}

.status.inactive {
  background: #32191d;
  color: #f87171;
}

.worker-info {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.info {
  background: #0d131e;
  border: 1px solid #1d2838;
  border-radius: 11px;
  padding: 12px;
}

.info small {
  display: block;
  color: #64748b;
  font-size: 10px;
  margin-bottom: 5px;
}

.info strong {
  font-size: 13px;
  word-break: break-word;
}

.empty {
  background: #111722;
  border: 1px solid #202b3b;
  border-radius: 16px;
  padding: 25px;
  text-align: center;
  color: #7f8da3;
}

@media (max-width: 650px) {

  .worker-info {
    grid-template-columns: 1fr 1fr;
  }

  .worker-top {
    align-items: flex-start;
  }

}

@media (max-width: 430px) {

  .worker-info {
    grid-template-columns: 1fr;
  }

  header {
    padding: 0 14px;
  }

  header h1 {
    font-size: 18px;
  }

  header a {
    font-size: 12px;
  }

}
</style>
</head>

<body>

<header>

  <h1>TaskVexa</h1>

  <a href="admin.html">
    ← Admin Dashboard
  </a>

</header>


<main>

  <div class="page-title">

    <h2>Workers</h2>

    <p>
      View registered worker accounts and their account information.
    </p>

  </div>


  <button
    id="refreshButton"
    class="refresh-button"
  >
    ↻ Refresh Workers
  </button>


  <div
    id="message"
    class="message"
  >
    Checking admin access...
  </div>


  <div id="workerList"></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================
   ELEMENTS
========================================== */

const message =
  document.getElementById("message");

const workerList =
  document.getElementById("workerList");

const refreshButton =
  document.getElementById("refreshButton");


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ==========================================
   MONEY
========================================== */

function formatMoney(amount) {

  const number =
    Number(amount || 0);

  return "₦" +
    number.toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

}


/* ==========================================
   DATE
========================================== */

function formatDate(value) {

  if (!value) {
    return "-";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "-";
  }

  return date.toLocaleString(
    "en-NG"
  );

}


/* ==========================================
   LOAD WORKERS
========================================== */

async function loadWorkers() {

  refreshButton.disabled = true;

  refreshButton.textContent =
    "Loading...";

  message.textContent =
    "Checking admin access...";

  message.className =
    "message";

  workerList.innerHTML = "";


  try {

    /* ======================================
       GET CURRENT USER
    ====================================== */

    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getUser();


    if (
      sessionError
    ) {

      throw sessionError;

    }


    const user =
      sessionData.user;


    if (!user) {

      window.location.href =
        "login.html";

      return;

    }


    /* ======================================
       CHECK ADMIN ROLE
    ====================================== */

    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "id",
          user.id
        )
        .maybeSingle();


    if (profileError) {

      throw profileError;

    }


    if (
      !profile ||
      String(profile.role)
        .toLowerCase() !==
      "admin"
    ) {

      message.textContent =
        "Access denied. Admin account required.";

      message.className =
        "message error";

      return;

    }


    /* ======================================
       LOAD WORKER PROFILES
    ====================================== */

    message.textContent =
      "Loading workers...";


    const {
      data: workers,
      error: workersError
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "role",
          "worker"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (workersError) {

      throw workersError;

    }


    /* ======================================
       LOAD WALLETS
    ====================================== */

    let wallets = [];


    if (
      workers &&
      workers.length > 0
    ) {

      const workerIds =
        workers.map(
          worker =>
            worker.id
        );


      const {
        data: walletData,
        error: walletError
      } =
        await supabaseClient
          .from("wallets")
          .select(
            "*"
          )
          .in(
            "user_id",
            workerIds
          );


      if (walletError) {

        /*
          Wallet permission problems should
          NOT stop the worker page.
        */

        console.warn(
          "Wallet loading warning:",
          walletError
        );

      } else {

        wallets =
          walletData || [];

      }

    }


    /* ======================================
       CREATE WALLET MAP
    ====================================== */

    const walletMap = {};


    wallets.forEach(
      wallet => {

        walletMap[
          wallet.user_id
        ] =
          Number(
            wallet.balance || 0
          );

      }
    );


    /* ======================================
       NO WORKERS
    ====================================== */

    if (
      !workers ||
      workers.length === 0
    ) {

      message.textContent =
        "No worker accounts found.";

      message.className =
        "message";

      workerList.innerHTML = `

        <div class="empty">

          No worker accounts have been registered yet.

        </div>

      `;

      return;

    }


    /* ======================================
       SUCCESS
    ====================================== */

    message.textContent =
      `${workers.length} worker account(s) found.`;

    message.className =
      "message success";


    /* ======================================
       DISPLAY WORKERS
    ====================================== */

    workers.forEach(
      worker => {

        const card =
          document.createElement(
            "section"
          );


        card.className =
          "worker-card";


        const workerId =
          worker.id ||
          "Unavailable";


        /*
          Try several possible profile
          field names so the page works
          with the existing database.
        */

        const name =
          worker.full_name ||
          worker.name ||
          worker.username ||
          "Worker Account";


        const email =
          worker.email ||
          "Email unavailable";


        const level =
          worker.activation_level ||
          worker.activationLevel ||
          worker.level ||
          "Not activated";


        const status =
          worker.status ||
          "active";


        const balance =
          walletMap[
            worker.id
          ] || 0;


        const isActive =
          String(status)
            .toLowerCase() ===
          "active";


        card.innerHTML = `

          <div class="worker-top">

            <div>

              <div class="worker-name">

                ${escapeHTML(name)}

              </div>


              <div class="worker-email">

                ${escapeHTML(email)}

              </div>

            </div>


            <span class="status ${
              isActive
                ? "active"
                : "inactive"
            }">

              ${
                isActive
                  ? "Active"
                  : "Inactive"
              }

            </span>

          </div>


          <div class="worker-info">


            <div class="info">

              <small>
                Balance
              </small>

              <strong>
                ${formatMoney(balance)}
              </strong>

            </div>


            <div class="info">

              <small>
                Activation Level
              </small>

              <strong>
                ${escapeHTML(level)}
              </strong>

            </div>


            <div class="info">

              <small>
                Registered
              </small>

              <strong>
                ${escapeHTML(
                  formatDate(
                    worker.created_at
                  )
                )}
              </strong>

            </div>


            <div class="info">

              <small>
                Account Type
              </small>

              <strong>
                Worker
              </strong>

            </div>


            <div class="info">

              <small>
                Worker ID
              </small>

              <strong>
                ${escapeHTML(workerId)}
              </strong>

            </div>


            <div class="info">

              <small>
                Last Updated
              </small>

              <strong>
                ${escapeHTML(
                  formatDate(
                    worker.updated_at
                  )
                )}
              </strong>

            </div>


          </div>

        `;


        workerList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      "WORKERS PAGE ERROR:",
      error
    );


    message.textContent =
      "Unable to load workers: " +
      (
        error.message ||
        "Unknown error"
      );

    message.className =
      "message error";


    workerList.innerHTML = `

      <div class="empty">

        There was a problem loading the worker accounts.

        <br><br>

        Check the error message above and press
        <strong>Refresh Workers</strong>.

      </div>

    `;


  } finally {

    refreshButton.disabled =
      false;

    refreshButton.textContent =
      "↻ Refresh Workers";

  }

}


/* ==========================================
   REFRESH
========================================== */

refreshButton.addEventListener(
  "click",
  loadWorkers
);


/* ==========================================
   START
========================================== */

loadWorkers();

</script>

</body>
</html>

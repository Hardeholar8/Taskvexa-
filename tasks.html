<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TaskVexa - Tasks</title><link rel="stylesheet" href="style.css"><style>
* {

body {

header {

#taskDetailsSection {

}

.instructions {

  border: 1px solid #202b3b;
  border-radius: 14px;
  padding: 15px;
  margin: 18px 0;
}

.instructions h3 {
  margin-top: 0;
  font-size: 15px;
}

.instructions p {
  color: #cbd5e1;

  font-size: 13px;
  white-space: pre-wrap;
}

/* PROOF */

.proof-section {
  margin-top: 22px;
  padding-top: 20px;
  border-top: 1px solid #202b3b;
}

.proof-section h3 {
  margin-top: 0;
}

.proof-section p {
  color: #94a3b8;
  font-size: 13px;
  line-height: 1.5;
}

.file-box {
  background: #0b1019;
  border: 1px dashed #334155;
  border-radius: 14px;
  padding: 16px;
  margin: 14px 0;
}

input[type="file"] {
  width: 100%;
  color: #cbd5e1;
  font-size: 13px;
}

.proof-preview {
  width: 100%;
  max-height: 280px;
  object-fit: contain;
  border-radius: 12px;
  margin-top: 12px;

}

#submitProofButton {

#submitProofButton:disabled {

#proofMessage {

@media (max-width: 480px) {

    flex-direction: column;
  }

    font-size: 17px;
  }

  </section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
  "https://dxtlnrthlpdaobnbazny.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const taskList =
  document.getElementById("taskList");

const message =
  document.getElementById("message");

const taskListSection =
  document.getElementById(
    "taskListSection"
  );

const taskDetailsSection =
  document.getElementById(
    "taskDetailsSection"
  );

const backButton =
  document.getElementById(
    "backButton"
  );

const submitProofButton =
  document.getElementById(
    "submitProofButton"
  );

const proofMessage =
  document.getElementById(
    "proofMessage"
  );

const proofFile =
  document.getElementById(
    "proofFile"
  );

const proofPreview =
  document.getElementById(
    "proofPreview"
  );


let selectedTask = null;

let selectedSubmissionStatus = null;

let currentUser = null;


/* =========================
   LOAD TASKS
========================= */

async function loadTasks() {

  message.textContent =
    "Loading tasks...";

  try {

    const {
      data: { user },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (
      userError ||
      !user
    ) {

      window.location.href =
        "login.html";

      return;

    }


    currentUser =
      user;


    /*
      Load active tasks.
    */

    const {
      data: tasks,
      error: taskError
    } =
      await supabaseClient
        .from("tasks")
        .select("*")
        .eq(
          "status",
          "active"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (taskError) {

      throw taskError;

    }


    /*
      Load worker submissions.
    */

    const {
      data: submissions,
      error: submissionError
    } =
      await supabaseClient
        .from("task_submissions")
        .select(
          "id, task_id, status, created_at"
        )
        .eq(
          "worker_id",
          user.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (submissionError) {

      throw submissionError;

    }


    /*
      Latest submission per task.
    */

    const submissionMap = {};


    (submissions || []).forEach(
      submission => {

        if (
          !submissionMap[
            submission.task_id
          ]
        ) {

          submissionMap[
            submission.task_id
          ] =
            submission.status;

        }

      }
    );


    taskList.innerHTML =
      "";


    /*
      Approved tasks disappear.
    */

    const visibleTasks =
      (tasks || []).filter(
        task => {

          return (
            submissionMap[task.id] !==
            "approved"
          );

        }
      );


    if (
      visibleTasks.length === 0
    ) {

      message.textContent =
        "No tasks are currently available.";

      message.className =
        "message-box";

      return;

    }


    message.textContent =
      "";

    message.className =
      "message-box";

    visibleTasks.forEach(
      task => {

        const submissionStatus =
          submissionMap[
            task.id
          ];


        const card =
          document.createElement(
            "section"
          );


        card.className =
          "task-card";


        let statusHTML =
          "";


        if (
          submissionStatus ===
          "pending"
        ) {

          statusHTML = `

            <div class="submission-status pending-status">

              ⏳ <strong>Pending Review</strong>

              <br>

              Your proof is being reviewed by the admin.

            </div>

          `;

        }


        if (
          submissionStatus ===
          "rejected"
        ) {

          statusHTML = `

            <div class="submission-status rejected-status">

              ❌ <strong>Proof Rejected</strong>

              <br>

              You can submit a new proof.

            </div>

          `;

        }


        card.innerHTML = `

          <div class="task-card-top">

            <h3>
              ${escapeHTML(task.title)}
            </h3>

            <div class="reward">
              ₦${Number(
                task.reward || 0
              ).toLocaleString("en-NG")}
            </div>

          </div>


          <p class="task-description">
            ${escapeHTML(
              task.description ||
              "Complete the task according to the instructions."
            )}
          </p>


          <div class="task-meta">

            <span class="meta">
              Platform:
              ${escapeHTML(
                task.platform ||
                "Not specified"
              )}
            </span>

            <span class="meta">
              Workers:
              ${Number(
                task.workers_needed || 0
              )}
            </span>

          </div>


          ${statusHTML}


          <button
            type="button"
            class="task-button view-task-button"
          >
            View Task
          </button>

        `;


        const viewButton =
          card.querySelector(
            ".view-task-button"
          );


        viewButton.addEventListener(
          "click",
          () => {

            showTaskDetails(
              task,
              submissionStatus
            );

          }
        );


        taskList.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(
      "TASK LOAD ERROR:",
      error
    );


    message.textContent =
      "Unable to load tasks: " +
      error.message;

    message.className =
      "message-box error";

  }

}


/* =========================
   SHOW DETAILS
========================= */

function showTaskDetails(
  task,
  submissionStatus
) {

  selectedTask =
    task;

  selectedSubmissionStatus =
    submissionStatus || null;


  document.getElementById(
    "detailTitle"
  ).textContent =
    task.title || "Task";


  document.getElementById(
    "detailPlatform"
  ).textContent =
    task.platform ||
    "Not specified";


  document.getElementById(
    "detailReward"
  ).textContent =
    Number(
      task.reward || 0
    ).toLocaleString("en-NG");


  document.getElementById(
    "detailWorkers"
  ).textContent =
    Number(
      task.workers_needed || 0
    );


  document.getElementById(
    "detailDescription"
  ).textContent =
    task.description ||
    "Follow the task instructions carefully.";


  const openTaskButton =
    document.getElementById(
      "openTaskButton"
    );


  openTaskButton.href =
    task.task_url || "#";


  proofFile.value =
    "";

  proofPreview.src =
    "";

  proofPreview.style.display =
    "none";

  proofMessage.textContent =
    "";


  if (
    !task.task_url
  ) {

    openTaskButton.textContent =
      "Task Link Unavailable";

    openTaskButton.style.opacity =
      ".5";

  } else {

    openTaskButton.textContent =
      "Open Task";

    openTaskButton.style.opacity =
      "1";

  }


  if (
    submissionStatus ===
    "pending"
  ) {

    proofMessage.textContent =
      "Your proof is pending admin review.";

    proofMessage.className =
      "pending-text";

    submitProofButton.disabled =
      true;

    submitProofButton.textContent =
      "Pending Review";

  }

  else if (
    submissionStatus ===
    "rejected"
  ) {

    proofMessage.textContent =
      "Your previous proof was rejected. You can submit a new proof.";

    proofMessage.className =
      "error";

    submitProofButton.disabled =
      false;

    submitProofButton.textContent =
      "Submit New Proof";

  }

  else {

    submitProofButton.disabled =
      false;

    submitProofButton.textContent =
      "Submit Proof";

  }


  taskListSection.style.display =
    "none";

  taskDetailsSection.style.display =
    "block";


  window.scrollTo(
    0,
    0
  );

}


/* =========================
   BACK
========================= */

backButton.addEventListener(
  "click",
  () => {

    selectedTask =
      null;

    selectedSubmissionStatus =
      null;


    taskDetailsSection.style.display =
      "none";

    taskListSection.style.display =
      "block";


    loadTasks();

  }
);


/* =========================
   PROOF PREVIEW
========================= */

proofFile.addEventListener(
  "change",
  function() {

    const file =
      this.files[0];


    if (!file) {

      proofPreview.style.display =
        "none";

      return;

    }


    if (
      ![
        "image/jpeg",
        "image/png",
        "image/webp"
      ].includes(
        file.type
      )
    ) {

      proofMessage.textContent =
        "Only JPG, PNG or WEBP screenshots are allowed.";

      proofMessage.className =
        "error";

      this.value =
        "";

      proofPreview.style.display =
        "none";

      return;

    }


    if (
      file.size >
      6 * 1024 * 1024
    ) {

      proofMessage.textContent =
        "Screenshot must be 6MB or smaller.";

      proofMessage.className =
        "error";

      this.value =
        "";

      proofPreview.style.display =
        "none";

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        proofPreview.src =
          event.target.result;

        proofPreview.style.display =
          "block";

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* =========================
   SUBMIT PROOF
========================= */

submitProofButton.addEventListener(
  "click",
  async () => {

    if (!selectedTask) {

      proofMessage.textContent =
        "Please select a task.";

      proofMessage.className =
        "error";

      return;

    }


    const file =
      proofFile.files[0];


    if (!file) {

      proofMessage.textContent =
        "Please upload a screenshot first.";

      proofMessage.className =
        "error";

      return;

    }


    try {

      submitProofButton.disabled =
        true;

      submitProofButton.textContent =
        "Checking...";


      const {
        data: { user },
        error: userError
      } =
        await supabaseClient.auth.getUser();


      if (
        userError ||
        !user
      ) {

        window.location.href =
          "login.html";

        return;

      }


      /*
        Check latest submission.
      */

      const {
        data: existingSubmissions,
        error: existingError
      } =
        await supabaseClient
          .from("task_submissions")
          .select(
            "id, status, created_at"
          )
          .eq(
            "task_id",
            selectedTask.id
          )
          .eq(
            "worker_id",
            user.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (existingError) {

        throw existingError;

      }


      const latestSubmission =
        existingSubmissions &&
        existingSubmissions.length > 0
          ? existingSubmissions[0]
          : null;


      if (
        latestSubmission &&
        latestSubmission.status ===
        "pending"
      ) {

        proofMessage.textContent =
          "Your previous submission is still pending review.";

        proofMessage.className =
          "pending-text";

        submitProofButton.disabled =
          true;

        submitProofButton.textContent =
          "Pending Review";

        return;

      }


      if (
        latestSubmission &&
        latestSubmission.status ===
        "approved"
      ) {

        proofMessage.textContent =
          "You have already completed this task.";

        proofMessage.className =
          "success";

        submitProofButton.disabled =
          true;

        submitProofButton.textContent =
          "Already Completed";

        return;

      }


      submitProofButton.textContent =
        "Uploading proof...";


      /*
        Upload screenshot.
      */

      const safeFileName =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const fileName =
        `${user.id}/${selectedTask.id}-${Date.now()}-${safeFileName}`;


      const {
        error: uploadError
      } =
      await supabaseClient.storage
        .from("task-proofs")
        .upload(
          fileName,
          file,
          {
            contentType:
              file.type,
            upsert:
              false
          }
        );

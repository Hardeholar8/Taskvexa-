<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Available Tasks</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f8fafc;font-family:Arial,sans-serif}header{height:70px;background:#070a10;border-bottom:1px solid #202b3b;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.logo{font-size:21px;font-weight:800}.actions{display:flex;gap:8px}.back,.btn{padding:9px 13px;border-radius:9px;font-size:13px;font-weight:700}.back{background:#151d2a;color:#fff;border:1px solid #293548;text-decoration:none}.btn{background:#32191d;color:#f87171;border:1px solid #5b292f;cursor:pointer}.content{max-width:1100px;margin:auto;padding:28px 16px 60px}.heading h1{margin:0 0 8px;font-size:28px}.heading p{margin:0 0 18px;color:#7f8da3;font-size:14px}.message{font-size:13px;margin-bottom:18px}.success{color:#4ade80}.error{color:#f87171}.loading,.empty{background:#111722;border:1px solid #202b3b;border-radius:17px;padding:35px 20px;text-align:center;color:#7f8da3}.task{background:#111722;border:1px solid #202b3b;border-radius:18px;padding:20px;margin-bottom:15px}.title{font-size:19px;font-weight:800;margin-bottom:8px}.desc{color:#a4b0c0;line-height:1.6;white-space:pre-wrap;margin-bottom:15px}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.box{background:#0d131e;border:1px solid #1d2838;border-radius:11px;padding:12px}.box small{display:block;color:#64748b;font-size:10px;margin-bottom:5px}.reward{color:#4ade80;font-weight:800}.task button{border:0;border-radius:10px;padding:11px 15px;margin:3px 6px 3px 0;font-weight:700;cursor:pointer}.open{background:#f8fafc;color:#090d14}.submit{background:#151d2a;color:#fff;border:1px solid #293548!important}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{width:100%;max-width:500px;background:#111722;border:1px solid #202b3b;border-radius:18px;padding:20px}.modalbox input,.modalbox textarea{width:100%;padding:12px;background:#090e16;border:1px solid #293548;border-radius:10px;color:#fff;margin:7px 0 14px}.modalbox textarea{min-height:80px}.send{background:#fff;color:#090d14}.cancel{background:#151d2a;color:#fff;border:1px solid #293548}@media(max-width:650px){.info{grid-template-columns:1fr}.heading h1{font-size:24px}}</style></head><body><header><div class="logo">TaskVexa</div><div class="actions"><a class="back" href="dashboard.html">← Dashboard</a><button id="logout" class="btn">Logout</button></div></header><main class="content"><div class="heading"><h1>Available Tasks</h1><p>Complete available tasks and submit your screenshot proof for review.</p></div><div id="message" class="message">Starting...</div><div id="list"><div class="loading">Checking your account...</div></div></main><div id="modal" class="modal"><div class="modalbox"><h2>Submit Task Proof</h2><form id="form"><label>Screenshot Proof</label><input id="file" type="file" accept="image/*" required><label>Additional Note (Optional)</label><textarea id="note"></textarea><div id="modalmsg" class="message"></div><button class="task submit" type="submit">Submit Proof</button><button class="task cancel" type="button" id="cancel">Cancel</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://dxtlnrthlpdaobnbazny.supabase.co',SUPABASE_KEY='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const money=v=>'₦'+Number(v||0).toLocaleString('en-NG');let sb,user,selected;function fail(msg){$('message').textContent=msg;$('message').className='message error';$('list').innerHTML='<div class="empty">'+esc(msg)+'</div>}async function start(){try{$('message').textContent='Connecting...';if(!window.supabase)throw new Error('Task service did not load. Please refresh the page.');sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const result=await Promise.race([sb.auth.getSession(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Login session could not be read. Please log in again.')),5000))]);user=result.data&&result.data.session&&result.data.session.user;if(!user){location.href='login.html';return}$('message').textContent='Checking activation...';const p=await Promise.race([sb.from('profiles').select('role,activation_status,activation_level').eq('id',user.id).maybeSingle(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Worker profile check timed out.')),5000))]);if(p.error)throw p.error;if(!p.data)throw new Error('Worker profile not found.');if(String(p.data.role||'').toLowerCase()!=='worker')throw new Error('Worker account required.');const active=['active','activated','approved','true'].includes(String(p.data.activation_status||'').toLowerCase())||Number(p.data.activation_level||0)>0;if(!active){$('message').textContent='Your account must be activated before you can access tasks.';$('message').className='message error';$('list').innerHTML='<div class="empty"><h3 style="color:#fff">Account not activated</h3><p>Activate your worker account before accessing available tasks.</p><a class="back" href="worker-activation.html">Activate Account</a></div>';return}await loadTasks()}catch(e){console.error(e);fail(e.message||'Unable to load tasks.')}}async function loadTasks(){const s=await sb.from('task_submissions').select('task_id').eq('worker_id',user.id);if(s.error)throw s.error;const done=new Set((s.data||[]).map(x=>String(x.task_id)));const t=await sb.from('tasks').select('id,title,description,platform,task_url,reward,status,created_at').eq('status','active').order('created_at',{ascending:false});if(t.error)throw t.error;const tasks=(t.data||[]).filter(x=>!done.has(String(x.id)));if(!tasks.length){$('message').textContent='No new tasks are available right now.';$('list').innerHTML='<div class="empty"><h3 style="color:#fff">No active tasks</h3><p>There are currently no tasks available.</p></div>';return}$('message').textContent=tasks.length+' task'+(tasks.length===1?'':'s')+' available.';$('message').className='message success';$('list').innerHTML=tasks.map(t=>'<article class="task"><div class="title">'+esc(t.title)+'</div><div class="desc">'+esc(t.description||'No instructions provided.')+'</div><div class="info"><div class="box"><small>Platform</small><strong>'+esc(t.platform||'-')+'</strong></div><div class="box"><small>Task Reward</small><strong class="reward">'+money(t.reward)+'</strong></div></div><button class="open" data-open="'+esc(t.id)+'">Open Task</button><button class="submit" data-submit="'+esc(t.id)+'">Submit Proof</button></article>').join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const t=tasks.find(x=>String(x.id)===String(b.dataset.open));if(t&&t.task_url)window.open(t.task_url,'_blank','noopener,noreferrer');else alert('This task does not have a valid link.')});document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>{selected=tasks.find(x=>String(x.id)===String(b.dataset.submit));$('modal').classList.add('show')})}$('cancel').onclick=()=>$('modal').classList.remove('show');$('form').onsubmit=async e=>{e.preventDefault();const f=$('file').files[0];if(!selected||!f)return;if(f.size>5*1024*1024){$('modalmsg').textContent='Screenshot must be 5MB or smaller.';return}$('modalmsg').textContent='Submitting...';try{const path=user.id+'/'+selected.id+'-'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const u=await sb.storage.from('task-proofs').upload(path,f,{upsert:false,contentType:f.type});if(u.error)throw u.error;const pub=sb.storage.from('task-proofs').getPublicUrl(path);const ins=await sb.from('task_submissions').insert({task_id:selected.id,worker_id:user.id,proof_url:pub.data.publicUrl,proof_text:$('note').value.trim(),status:'pending',reward_amount:Number(selected.reward||0)});if(ins.error)throw ins.error;location.reload()}catch(e){$('modalmsg').textContent=e.message||'Submission failed.';$('modalmsg').className='message error'}};$('logout').onclick=async()=>{if(sb)await sb.auth.signOut();location.href='login.html'};start();</script></body></html>

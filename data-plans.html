<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>TaskVexa - Data Plans</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px 14px 30px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{color:#fff;text-decoration:none;font-size:20px}.brand{font-size:21px;font-weight:900}.brand span{color:#a78bfa}.title{font-size:22px;margin:0 0 5px}.muted{color:#94a3b8;font-size:11px}.networks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0 12px}.network{border:1px solid #1d293d;background:#0d1422;color:#fff;border-radius:11px;padding:11px 4px;font-size:10px;font-weight:800}.network.active{background:#241641;border-color:#7c3aed}.plans{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.plan{background:#0d1422;border:1px solid #1d293d;border-radius:14px;padding:13px;text-decoration:none;color:#fff}.plan strong{display:block;font-size:13px}.plan small{display:block;color:#94a3b8;font-size:10px;margin-top:5px}.price{display:block;font-size:14px;font-weight:900;color:#c4b5fd;margin-top:10px}.empty{background:#0d1422;border:1px solid #1d293d;border-radius:14px;padding:20px;text-align:center;color:#64748b;font-size:11px;grid-column:1/-1}@media(max-width:390px){.plans{grid-template-columns:1fr}} </style></head><body><main class="wrap"><header class="top"><a class="back" href="dashboard.html">←</a><div class="brand">Task<span>Vexa</span></div></header><h1 class="title">Available Data Plans</h1><div class="muted">Choose from the data bundles currently available.</div><div class="networks"><button class="network active" data-network="MTN">MTN</button><button class="network" data-network="Airtel">Airtel</button><button class="network" data-network="Glo">Glo</button><button class="network" data-network="9mobile">9mobile</button></div><section class="plans" id="plans"><div class="empty">Loading available plans...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');const plans=document.getElementById('plans');const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));async function load(network){plans.innerHTML='<div class="empty">Loading available plans...</div>';const {data,error}=await sb.from('data_plans').select('id,network,service_id,plan_name,data_amount,price').eq('network',network).eq('is_active',true).order('sort_order',{ascending:true});if(error||!data?.length){plans.innerHTML='<div class="empty">No '+esc(network)+' data plans are currently available.</div>';return}plans.innerHTML=data.map(p=>`<a class="plan" href="data.html?network=${encodeURIComponent(p.network)}&plan=${encodeURIComponent(p.id)}"><strong>${esc(p.plan_name||p.data_amount||'Data Plan')}</strong><small>${esc(p.data_amount||'')} ${p.service_id?'· '+esc(p.service_id):''}</small><span class="price">₦${Number(p.price||0).toLocaleString('en-NG')}</span></a>`).join('')}document.querySelectorAll('.network').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.network').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.network)}));load('MTN');</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskVexa - Withdraw</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="/filora-theme.css?v=7"><script src="/theme.js?v=12"></script></head><body><header><h1>TaskVexa</h1><a href="dashboard.html">Dashboard</a></header><main><div class="page-title"><h2>Withdraw</h2><p>Withdraw from your available balance.</p></div><section class="balance-card"><div class="balance-label">Available Balance</div><div class="balance" id="balance">₦0.00</div><div class="balance-status" id="balanceMessage">Loading balance...</div></section><section class="card"><h3>Automatic Withdrawal</h3><p style="color:#94a3b8;font-size:13px">Your verified payout account is used automatically.</p><label for="amount">Withdrawal Amount</label><input type="number" id="amount" min="1" step="0.01" placeholder="Enter amount"><button id="withdrawButton" class="withdraw-button">Withdraw Automatically</button><div id="withdrawMessage"></div></section><section class="card"><div class="history-header"><h3>Withdrawal History</h3><span class="history-subtitle">Recent requests</span></div><div id="historyMessage" class="empty">Loading withdrawal history...</div><div id="withdrawalHistory"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://dxtlnrthlpdaobnbazny.supabase.co',SUPABASE_KEY='sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY',sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,payout=null;const $=id=>document.getElementById(id),money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function init(){const{data,error}=await sb.auth.getUser();if(error||!data.user){location.href='login.html';return}user=data.user;await Promise.all([balance(),account(),history()])}async function balance(){const{data,error}=await sb.from('wallets').select('balance').eq('user_id',user.id).maybeSingle();if(error){$('balanceMessage').textContent='Unable to load balance';return}$('balance').textContent=money(data?.balance);$('balanceMessage').textContent='Balance available'}async function account(){const{data,error}=await sb.from('payout_accounts').select('bank_code,bank_name,account_number,account_name,verification_status').eq('user_id',user.id).eq('verification_status','verified').maybeSingle();if(error||!data){payout=null;$('withdrawButton').disabled=true;$('withdrawMessage').textContent='Verify your payout account before withdrawing.';return}payout=data}async function history(){const{data,error}=await sb.from('withdrawals').select('id,amount,bank_name,account_name,account_number,status,created_at,failure_reason').eq('worker_id',user.id).order('created_at',{ascending:false}).limit(30);if(error){$('historyMessage').textContent='Unable to load withdrawal history.';return}if(!data?.length){$('historyMessage').textContent='No withdrawal requests yet.';return}$('historyMessage').textContent='';$('withdrawalHistory').innerHTML=data.map(w=>{const s=String(w.status||'pending').toLowerCase();return '<div class="history-card"><div class="history-top"><div class="history-amount">'+money(w.amount)+'</div><span class="status '+esc(s)+'">'+esc(s.toUpperCase())+'</span></div><div class="history-row"><span>Bank</span><span>'+esc(w.bank_name)+'</span></div><div class="history-row"><span>Account</span><span>••••'+esc(String(w.account_number||'').slice(-4))+'</span></div><div class="history-row"><span>Date</span><span>'+esc(new Date(w.created_at).toLocaleString('en-NG'))+'</span></div>'+(w.failure_reason?'<div class="history-row"><span>Reason</span><span>'+esc(w.failure_reason)+'</span></div>':'')+'</div>'}).join('')}$('withdrawButton').onclick=async()=>{const amount=Number($('amount').value),msg=$('withdrawMessage'),btn=$('withdrawButton');msg.className='';msg.textContent='';if(!payout){msg.textContent='Verify your payout account first.';return}if(!amount||amount<=0){msg.textContent='Enter a valid withdrawal amount.';return}btn.disabled=true;btn.textContent='Processing...';try{const{data:{session}}=await sb.auth.getSession();if(!session)throw Error('Session expired. Please log in again.');const res=await fetch(SUPABASE_URL+'/functions/v1/process-withdrawal',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({amount})});const result=await res.json().catch(()=>({}));if(!res.ok||!result.success)throw Error(result.message||result.error||'Automatic withdrawal failed.');msg.className='success';msg.textContent=result.message||'Withdrawal processed successfully.';$('amount').value='';await Promise.all([balance(),history()])}catch(e){msg.className='error';msg.textContent=e.message||'Automatic withdrawal failed.'}finally{btn.disabled=!payout;btn.textContent='Withdraw Automatically'}};init();</script></body></html>

name: Fix More page balance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix More page balance') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix worker balance query
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('more.html')
          s = p.read_text()
          old = "const w=await sb.from('wallets').select('balance').eq('user_id',u.id).maybeSingle();$('earnings').textContent=money(w.data?.balance)"
          new = "const w=await sb.from('wallets').select('balance').eq('user_id',u.id).maybeSingle();if(!w.error&&w.data){$('earnings').textContent=money(w.data.balance)}else{const fallback=await sb.from('wallets').select('balance').eq('user_id',u.id).limit(1);$('earnings').textContent=money(fallback.data?.[0]?.balance)}"
          if old not in s:
              raise SystemExit('Expected worker balance code was not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add more.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix More page balance display"
          git push
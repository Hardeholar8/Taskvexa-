<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>TaskVexa - Data Plans</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.top{height:68px;border-bottom:1px solid #1d293d;display:flex;align-items:center;gap:14px;padding:0 18px}.back{color:#c4b5fd;text-decoration:none;font-size:14px}.brand{font-size:22px;font-weight:800}.brand span{color:#a78bfa}.wrap{max-width:760px;margin:0 auto;padding:24px 16px 70px}.card{background:#0d1422;border:1px solid #1d293d;border-radius:18px;padding:20px}.title{font-size:23px;margin:0 0 6px}.muted{color:#94a3b8;font-size:12px}.networks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.net{border:1px solid #29364b;background:#111a2b;color:#dbe4f0;border-radius:11px;padding:11px 6px;font-weight:800;cursor:pointer}.net.active{background:#241641;border-color:#7c3aed;color:#fff}.plan-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}.plan{border:1px solid #29364b;background:#111a2b;color:#fff;border-radius:12px;padding:15px;text-align:left}.plan b{display:block;font-size:14px}.plan small{display:block;color:#94a3b8;margin-top:6px;font-size:11px}.price{display:block;color:#c4b5fd;font-size:15px;font-weight:900;margin-top:12px}.empty{color:#64748b;text-align:center;padding:22px;grid-column:1/-1;border:1px dashed #29364b;border-radius:12px}@media(max-width:520px){.networks{grid-template-columns:repeat(2,1fr)}.plan-grid{grid-template-columns:1fr}.wrap{padding-top:18px}}</style></head><body><header class="top"><a class="back" href="dashboard.html">← Dashboard</a><div class="brand">Task<span>Vexa</span></div></header><main class="wrap"><section class="card"><h1 class="title">Available Data Plans</h1><p class="muted">Choose a network to see the data bundles currently available on TaskVexa.</p><div class="networks"><button class="net active" data-net="mtn">MTN</button><button class="net" data-net="airtel">Airtel</button><button class="net" data-net="glo">Glo</button><button class="net" data-net="9mobile">9mobile</button></div><div id="plans" class="plan-grid"><div class="empty">Loading available plans...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const sb=window.supabase.createClient('https://dxtlnrthlpdaobnbazny.supabase.co','sb_publishable_UUFlTjQiT3osVMRNFYiNuA_UukQ-9kY');let network='mtn';const box=document.getElementById('plans');const money=v=>'₦'+Number(v||0).toLocaleString('en-NG');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));document.querySelectorAll('.net').forEach(b=>b.onclick=()=>{document.querySelectorAll('.net').forEach(x=>x.classList.remove('active'));b.classList.add('active');network=b.dataset.net;loadPlans()});async function loadPlans(){box.innerHTML='<div class="empty">Loading available plans...</div>';const r=await sb.from('data_plans').select('id,network,service_id,plan_name,data_amount,price').eq('network',network).eq('is_active',true).order('sort_order',{ascending:true});if(r.error){box.innerHTML='<div class="empty">Unable to load available plans right now.</div>';return}const rows=r.data||[];if(!rows.length){box.innerHTML='<div class="empty">No '+network.toUpperCase()+' data plans are currently available.</div>';return}box.innerHTML=rows.map(x=>`<div class="plan"><b>${esc(x.plan_name||x.data_amount||'Data Plan')}</b><small>${esc(x.data_amount||'')}${x.service_id?' · '+esc(x.service_id):''}</small><span class="price">${money(x.price)}</span></div>`).join('')}loadPlans();</script></body></html>
